<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蜜橙</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="hb-header">
    <div class="hb-wrap hb-header-row">
      <a class="hb-brand" href="./"><img src="assets/mark.svg" alt="" width="30" height="30"><span data-bind="brand_name">蜜橙</span></a>
      <nav class="hb-nav" aria-label="主导航">
        <a href="#features">产品</a>
        <a href="#pricing">价格</a>
        <a href="#faq">帮助</a>
      </nav>
      <a class="hb-link" href="/dashboard/login" target="_top">登录</a>
      <a class="hb-button" href="/dashboard/register" target="_top">注册</a>
    </div>
  </header>

  <main>
    <section class="hb-hero">
      <div class="hb-wrap">
        <h1 data-bind="hero_title">小站点，也值得被认真加速</h1>
        <p class="hb-lead" data-bind="hero_subtitle">三分钟接入，按量计费，不用懂运维。</p>
        <a class="hb-button hb-button-lg" href="/dashboard/register" target="_top" data-bind="hero_cta">免费开始</a>
        <img class="hb-hero-art" src="assets/hero.svg" alt="" width="640" height="220">
      </div>
    </section>

    <section id="features" class="hb-section">
      <div class="hb-wrap">
        <h2 class="hb-title" data-bind="features_title">为什么选我们</h2>
        <ul class="hb-cards" data-list="features"></ul>
      </div>
    </section>

    <section id="pricing" class="hb-section hb-section-soft">
      <div class="hb-wrap">
        <h2 class="hb-title">价格</h2>
        <ul class="hb-plans" data-list="plans"></ul>
      </div>
    </section>

    <section id="faq" class="hb-section">
      <div class="hb-wrap hb-narrow">
        <h2 class="hb-title">常见问题</h2>
        <div data-list="faq"></div>
      </div>
    </section>
  </main>

  <footer class="hb-footer"><div class="hb-wrap" data-bind="footer_text">© 示例公司</div></footer>
  <script type="module" src="assets/site.js"></script>
</body>
</html>
