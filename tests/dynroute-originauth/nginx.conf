# Dynamic routing D5b origin auth acceptance: the skeleton's location shape
# with signing in access (cdnca_originauth.sign) and verified TLS to the
# bucket (cdnca_origintls). Site selection / endpoint choice are a stand-in:
# fixtures.lua is the site object, ?pool= picks the pool.
# __LUA__ / __STATE__ / __ANCHOR__ are filled by cdnca-originauth-dynroute-check.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;
events { worker_connections 1024; }
http {
  access_log off;
  lua_package_path "__LUA__/dynroute/?.lua;__LUA__/?.lua;/t/?.lua;;";
  uninitialized_variable_warn off;
  lua_shared_dict cdnca_site_index 1m;
  lua_shared_dict cdnca_site_state 1m;
  lua_shared_dict cdnca_site_lock 1m;
  init_by_lua_block {
    require("cdnca_site").configure({ objects_root = "__STATE__/objects", index_root = "__STATE__/index", system_max_body = 1048576 })
    require("cdnca_originauth").configure({ secrets_root = "__STATE__/secrets" })
    require("cdnca_origin").configure({})
    ANCHOR = "__ANCHOR__"
    require("fixtures")
  }
  init_worker_by_lua_block { require("cdnca_site").init_worker() }
  upstream cdnca_dynamic {
    server 0.0.0.1;
    balancer_by_lua_block { require("fixtures").balancer() }
    keepalive 0;
  }
  # The full entry (D5a): site selection by Host from the D3 index, origin
  # selection and signing in cdnca_origin.access, the attempt in
  # cdnca_origin.balancer (cdnca_origintls.peer).
  upstream cdnca_entry {
    server 0.0.0.1;
    balancer_by_lua_block { require("cdnca_origin").balancer() }
    keepalive 0;
  }
  server {
    listen 127.0.0.1:8081;
    server_name _;
    server_rewrite_by_lua_block {
      local site = require("cdnca_site").route()
      if not site then return require("cdnca_site").reject_unknown() end
    }
    access_by_lua_block { require("cdnca_origin").access() }
    header_filter_by_lua_block { require("cdnca_origin").header_filter() }
    log_by_lua_block { require("cdnca_origin").log() }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $cdnca_origin_host;
      proxy_set_header X-Forwarded-For $cdnca_origin_xff;
      proxy_set_header X-Real-IP $cdnca_origin_real_ip;
      proxy_set_header X-Forwarded-Proto $cdnca_origin_proto;
      proxy_set_header Upgrade $cdnca_origin_upgrade;
      proxy_set_header Connection $cdnca_origin_connection;
      proxy_set_header X-Cdnca-L2-Hop $cdnca_origin_l2_hop;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 0;
      proxy_next_upstream_timeout 0;
      proxy_ssl_server_name on;
      proxy_ssl_name $cdnca_origin_sni;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      lua_upstream_skip_openssl_default_verify on;
      proxy_ssl_verify_by_lua_block { require("cdnca_origintls").verify() }
      proxy_pass $cdnca_origin_scheme://cdnca_entry;
    }
  }
  server {
    listen unix:__STATE__/run/cdnca-site-admin.sock;
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    location / { content_by_lua_block { require("cdnca_site_admin").handle() } }
    location = /__vars {
      internal;
      set $cdnca_site_id "";
      set $cdnca_site_revision "";
      set $cdnca_site_digest "";
      set $cdnca_site_tenant "";
      set $cdnca_site_scope "";
      set $cdnca_site_host "";
      set $cdnca_site_port "";
      set $cdnca_site_generation "";
      set $cdnca_site_state "";
      set $cdnca_site_max_body "1";
      set $cdnca_origin_pool "";
      set $cdnca_origin_xff "";
      set $cdnca_origin_real_ip "";
      set $cdnca_origin_proto "";
      set $cdnca_origin_upgrade "";
      set $cdnca_origin_connection "";
      set $cdnca_origin_l2_hop "";
    }
  }
  server {
    listen 127.0.0.1:8080;
    server_name _;
    location @cdnca_variables {
      set $cdnca_origin_scheme "";
      set $cdnca_origin_host "";
      set $cdnca_origin_sni "";
      set $cdnca_origin_trust "";
      set $cdnca_site_id "";
      set $t_pool "";
      return 500;
    }
    location / {
      rewrite_by_lua_block { require("fixtures").rewrite() }
      access_by_lua_block { require("fixtures").access() }
      proxy_http_version 1.1;
      proxy_set_header Host $cdnca_origin_host;
      proxy_set_header Connection "";
      proxy_next_upstream off;
      proxy_ssl_server_name on;
      proxy_ssl_name $cdnca_origin_sni;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      lua_upstream_skip_openssl_default_verify on;
      proxy_ssl_verify_by_lua_block { require("cdnca_origintls").verify() }
      proxy_pass $cdnca_origin_scheme://cdnca_dynamic;
    }
  }
}
