# Server-Timing micro benchmark: one worker, no master, an
# origin and an edge on loopback. The edge renders $cdnca_cache_status with
# the same map edgecache.HTTP renders (empty zone suffix); /bypass sets no
# zone (an Authorization bypass), /hit is cached by a real proxy_cache zone.
# header_filter_by_lua runs bench.lua's cases in a loop on one request of
# each kind; the driver timer then exits the process.
daemon off;
master_process off;
worker_processes 1;
pid /tmp/st.pid;
error_log /dev/stderr notice;
__PCRE_JIT__
events { worker_connections 64; }
http {
  access_log off;
  lua_package_path "/st/dynroute/?.lua;/st/bench/?.lua;;";
  proxy_cache_path /tmp/st-cache levels=1:2 keys_zone=cdnca_cache_0:4m max_size=16m inactive=1h use_temp_path=off;
  map $upstream_http_set_cookie $cdnca_cache_response_cookie { default 1; '' 0; }
  map $upstream_http_cache_control $cdnca_cache_response_control { default 0; ~*(^|[,[:space:]])(private|no-store|no-cache)([=,[:space:]]|$) 1; }
  map "$cdnca_cache_enabled|$cdnca_cache_zone|$cdnca_cache_response_cookie$cdnca_cache_response_control$cdnca_cache_size_bypass$cdnca_cache_rule_bypass|$upstream_cache_status" $cdnca_cache_status {
    volatile;
    "~^\|" "";
    "~^1\|cdnca_cache_[0-9]+\|0000\|HIT$" HIT;
    "~^1\|cdnca_cache_[0-9]+\|0000\|STALE$" STALE;
    "~^1\|cdnca_cache_[0-9]+\|0000\|UPDATING$" UPDATING;
    "~^1\|cdnca_cache_[0-9]+\|0000\|REVALIDATED$" REVALIDATED;
    "~^1\|cdnca_cache_[0-9]+\|0000\|MISS$" MISS;
    "~^1\|cdnca_cache_[0-9]+\|0000\|EXPIRED$" EXPIRED;
    "~^1\|cdnca_cache_[0-9]+\|0000\|BYPASS$" MISS;
    default BYPASS;
  }
  init_worker_by_lua_block { require("bench").driver() }
  server {
    listen 127.0.0.1:18301;
    location / { return 200 "origin body\n"; }
  }
  server {
    listen 127.0.0.1:18300;
    keepalive_requests 1000000;
    set $cdnca_cache_enabled "1";
    set $cdnca_cache_size_bypass "0";
    set $cdnca_cache_rule_bypass "0";
    set $cdnca_l2_trusted "";
    set $cdnca_origin_l2_hop "";
    location /bypass {
      set $cdnca_cache_zone "";
      proxy_pass http://127.0.0.1:18301;
      header_filter_by_lua_block { require("bench").run("bypass") }
    }
    location ~ ^/e2e/(?<st_mode>[a-z]+)$ {
      set $cdnca_cache_zone "";
      proxy_pass http://127.0.0.1:18301;
      header_filter_by_lua_block { require("bench").e2e(ngx.var.st_mode) }
    }
    location /hit {
      set $cdnca_cache_zone "cdnca_cache_0";
      proxy_cache cdnca_cache_0;
      proxy_cache_valid 200 1h;
      proxy_pass http://127.0.0.1:18301;
      header_filter_by_lua_block { require("bench").run("hit") }
    }
  }
}
