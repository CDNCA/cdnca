# Dynamic routing D9/D10 acceptance skeleton: the D3 shared-server shape
# (docs/edge/dynroute-contract.md §6) with the response filter and limit
# entries wired as docs/edge/dynroute-filters.md §1 prescribes, a v7-shaped
# comparison server (error_page + proxy_intercept_errors + the v7
# errorpage/handler.lua), and stand-ins for the steps other D tasks own
# (security exits, HTTP policy headers, cache status): the test drives them
# by request header so every header_filter slot is exercised.
# __VAR__ placeholders are filled by cdnca-dynfilters-check.
worker_processes __WORKERS__;
pid logs/nginx.pid;
error_log logs/error.log notice;
events { worker_connections 4096; }
http {
  access_log off;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/html application/json;
  gzip_min_length 0;
  lua_package_path "__LUA_ROOT__/dynroute/?.lua;__LUA_ROOT__/?.lua;;";
  uninitialized_variable_warn off;
  lua_shared_dict cdnca_site_index 4m;
  lua_shared_dict cdnca_site_state 8m;
  lua_shared_dict cdnca_site_lock 1m;
  lua_shared_dict cdnca_limits_conn 1m;
  lua_shared_dict cdnca_package_bandwidth 1m;
  lua_shared_dict cdnca_limits_market 16m;
  init_by_lua_block {
    require("cdnca_site").configure({
      objects_root = "__STATE__/site-objects",
      index_root = "__STATE__/site-index",
      system_max_body = __SYSTEM_MAX_BODY__,
    })
    require("cdnca_tls").configure({ pool_root = "__STATE__/tls-pool" })
    local filters = require("cdnca_filters")
    -- Stand-ins for the HTTP policy (D11) and cache (D8) slots: they write
    -- what the request asks for, so the ordering is observable.
    filters.register("http_policy", function(site, state)
      local set = ngx.req.get_headers()["x-test-policy-header"]
      if set then ngx.header["X-Policy"] = set end
    end)
    filters.register("cache_status", function(site, state)
      local status = ngx.req.get_headers()["x-test-cache-status"]
      if status then ngx.header["X-CDN-Cache"] = status end
    end)
  }
  init_worker_by_lua_block { require("cdnca_site").init_worker() require("cdnca_limits").init_worker() }

  # response rules: a cache for the cached-response
  # checks, the security variables cdnca_filters writes, their log line
  proxy_cache_path __STATE__/cache levels=1 keys_zone=resp_cache:1m;
  log_format resp_rules '$host $uri $status emit=$cdnca_security_emit type=$cdnca_security_type action=$cdnca_security_action rule=$cdnca_security_rule_id page=$cdnca_security_block_page';

  upstream cdnca_test_origin { server 127.0.0.1:__ORIGIN_PORT__; keepalive 0; }

  # ------------------------------------------------------------ dynamic routing
  server {
    listen 127.0.0.1:18090;
    listen 127.0.0.1:18443 ssl;
    listen 127.0.0.1:18443 quic reuseport;
    http2 on;
    http3 on;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate __STATE__/placeholder.crt;
    ssl_certificate_key __STATE__/placeholder.key;
    ssl_client_hello_by_lua_block { require("cdnca_tls").client_hello() }
    ssl_certificate_by_lua_block { require("cdnca_tls").certificate() }
    server_rewrite_by_lua_block {
      local site = require("cdnca_site").route()
      if not site then return require("cdnca_site").reject_unknown() end
      require("cdnca_tls").request(site)
      require("cdnca_limits").traffic(site)
      -- (CC would run here; a CC exit is decided before routed() and is
      -- never replaced, as in v7.)
      if ngx.req.get_headers()["x-test-server-exit"] then return ngx.exit(429) end
      -- a CC block (ccv2 reject429): block page variable, Retry-After, exit
      if ngx.req.get_headers()["x-test-server-block"] then
        ngx.var.cdnca_security_block_page = "1"
        ngx.header["Retry-After"] = "7"
        return ngx.exit(429)
      end
      require("cdnca_limits").refuse(site)
      require("cdnca_limits").rate(site)
      require("cdnca_filters").routed()
    }
    client_max_body_size $cdnca_site_max_body;
    set $cdnca_security_emit 0;
    set $cdnca_security_type "";
    set $cdnca_security_action "";
    set $cdnca_security_severity "";
    set $cdnca_security_rule_id "";
    set $cdnca_security_block_page 0;
    set $cdnca_cache_rule_bypass 0;
    access_log logs/resp-rules.log resp_rules;
    header_filter_by_lua_block { require("cdnca_filters").header_filter() }
    body_filter_by_lua_block { require("cdnca_filters").body_filter() }
    log_by_lua_block { require("cdnca_limits").leave() }
    location / {
      include __STATE__/edge.conf;
      access_by_lua_block {
        local site = require("cdnca_site").current()
        require("cdnca_limits").enter(site)
        local hold = tonumber(ngx.req.get_headers()["x-test-hold-ms"])
        if hold then ngx.sleep(hold / 1000) end
      }
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_pass http://cdnca_test_origin;
    }
    location = /__exec {
      access_by_lua_block {
        require("cdnca_limits").enter(require("cdnca_site").current())
        return ngx.exec("@after_exec")
      }
    }
    location @after_exec {
      access_by_lua_block { require("cdnca_limits").enter(require("cdnca_site").current()) }
      content_by_lua_block { ngx.say("in-flight ", require("cdnca_limits").in_flight(ngx.var.arg_sub or "")) }
    }
    location = /__inflight_bw {
      content_by_lua_block { ngx.say(ngx.shared.cdnca_package_bandwidth:get(ngx.var.arg_sub or "") or 0) }
    }
    location = /__inflight {
      content_by_lua_block { ngx.say(require("cdnca_limits").in_flight(ngx.var.arg_sub or "")) }
    }
    location = /__tcp {
      content_by_lua_block { ngx.say(require("cdnca_limits").tcp_connections(ngx.var.arg_sub or "")) }
    }
    location /dead { include __STATE__/edge.conf; proxy_pass http://127.0.0.1:9; }
    location /cached/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_cache resp_cache;
      proxy_cache_key $host$request_uri;
      proxy_cache_valid 200 1m;
      proxy_no_cache $cdnca_cache_rule_bypass;
      add_header X-Test-Cache $upstream_cache_status always;
      proxy_pass http://cdnca_test_origin;
    }
  }

  # ------------------------------------------------------------ v7 reference
  # compiler.go:700-727 shape: location-level intercept + error_page to the
  # named location running the v7 handler with the same policy.
  server {
    listen 127.0.0.1:17090;
    server_name _;
    recursive_error_pages on;
    location @cdnca_error_page {
      internal;
      set $cdnca_error_status $status;
      set $cdnca_error_category "";
      set $cdnca_error_site $http_x_test_site;
      set $cdnca_error_policy __STATE__/v7-policy.lua;
      content_by_lua_file __LUA_ROOT__/errorpage/handler.lua;
    }
    location / {
      client_max_body_size __V7_MAX_BODY__;
      include __STATE__/edge.conf;
      proxy_intercept_errors on;
      error_page __V7_STATUSES__ @cdnca_error_page;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_pass http://cdnca_test_origin;
    }
    location /dead {
      include __STATE__/edge.conf;
      proxy_intercept_errors on;
      error_page __V7_STATUSES__ @cdnca_error_page;
      proxy_pass http://127.0.0.1:9;
    }
  }

  server {
    listen unix:__STATE__/run/cdnca-site-admin.sock;
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    location / { content_by_lua_block { require("cdnca_site_admin").handle() } }
    location = /subscription-minutes { content_by_lua_block { require("cdnca_limits").admin() } }
    location = /__cdnca_site_vars {
      internal;
      set $cdnca_site_id "";
      set $cdnca_site_revision "";
      set $cdnca_site_digest "";
      set $cdnca_site_tenant "";
      set $cdnca_site_scope "";
      set $cdnca_site_host "";
      set $cdnca_site_port "";
      set $cdnca_site_generation "";
      set $cdnca_site_max_body "1";
      set $cdnca_site_state "";
      set $cdnca_filters_routed "";
      set $cdnca_limits_conn_key "";
      set $cdnca_limits_rate_key "";
      set $cdnca_limits_sub_key "";
    }
  }
}
