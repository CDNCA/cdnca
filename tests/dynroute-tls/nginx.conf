# Dynamic routing D4 acceptance skeleton: the shared-server shape of
# docs/edge/dynroute-contract.md §6 with the TLS entry of
# docs/edge/dynroute-tls.md. The rest of the pipeline is a stand-in: a routed
# request is proxied to one plain mock origin (the D5 balancer is not part of
# D4). __VAR__ placeholders are filled by cdnca-dyntls-check.
#   18443  TLS, HTTP/2, QUIC (h3), IPv4 + IPv6
#   18444  TLS, HTTP/1.1 only, IPv4
#   18080  plain
worker_processes __WORKERS__;
pid logs/nginx.pid;
error_log logs/error.log notice;
events { worker_connections 8192; }
http {
  access_log off;
  lua_package_path "__LUA_ROOT__/dynroute/?.lua;;";
  uninitialized_variable_warn off;
  lua_shared_dict cdnca_site_index __INDEX_SIZE__;
  lua_shared_dict cdnca_site_state 8m;
  lua_shared_dict cdnca_site_lock 1m;
  init_by_lua_block {
    require("cdnca_site").configure({
      objects_root = "__STATE__/site-objects",
      index_root = "__STATE__/site-index",
      system_max_body = 1048576,
      lru_items = __LRU_ITEMS__,
    })
    require("cdnca_tls").configure({ pool_root = "__STATE__/tls-pool", lru_items = __CERT_LRU__, ocsp_refresh = 1 })
  }
  init_worker_by_lua_block { require("cdnca_site").init_worker() }

  upstream cdnca_test_origin {
    server 127.0.0.1:__ORIGIN_PORT__;
    keepalive 0;
  }

  server {
    listen 0.0.0.0:18443 ssl default_server;
    listen 0.0.0.0:18443 quic reuseport default_server;
    listen [::]:18443 ssl default_server;
    listen [::]:18443 quic reuseport default_server;
    server_name _;
    http2 on;
    http3 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate __STATE__/placeholder.crt;
    ssl_certificate_key __STATE__/placeholder.key;
    ssl_client_hello_by_lua_block { require("cdnca_tls").client_hello() }
    ssl_certificate_by_lua_block { require("cdnca_tls").certificate() }
    server_rewrite_by_lua_block {
      local site = require("cdnca_site").route()
      if not site then return require("cdnca_site").reject_unknown() end
      require("cdnca_tls").request(site)
    }
    header_filter_by_lua_block { require("cdnca_tls").header_filter() }
    client_max_body_size $cdnca_site_max_body;
    location / { include __STATE__/proxy.conf; }
  }

  server {
    listen 0.0.0.0:18444 ssl default_server;
    server_name _;
    http2 off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate __STATE__/placeholder.crt;
    ssl_certificate_key __STATE__/placeholder.key;
    ssl_client_hello_by_lua_block { require("cdnca_tls").client_hello() }
    ssl_certificate_by_lua_block { require("cdnca_tls").certificate() }
    server_rewrite_by_lua_block {
      local site = require("cdnca_site").route()
      if not site then return require("cdnca_site").reject_unknown() end
      require("cdnca_tls").request(site)
    }
    header_filter_by_lua_block { require("cdnca_tls").header_filter() }
    client_max_body_size $cdnca_site_max_body;
    location / { include __STATE__/proxy.conf; }
  }

  server {
    listen 0.0.0.0:18080 default_server;
    server_name _;
    server_rewrite_by_lua_block {
      local site = require("cdnca_site").route()
      if not site then return require("cdnca_site").reject_unknown() end
      require("cdnca_tls").request(site)
    }
    header_filter_by_lua_block { require("cdnca_tls").header_filter() }
    client_max_body_size $cdnca_site_max_body;
    location / { include __STATE__/proxy.conf; }
  }

  server {
    listen unix:__STATE__/run/cdnca-site-admin.sock;
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    location / { content_by_lua_block { require("cdnca_site_admin").handle() } }
    location = /__tls_stats { content_by_lua_block {
      if ngx.var.arg_reset then require("cdnca_tls").reset_stats() end
      ngx.say(require("cjson").encode(require("cdnca_tls").stats()))
    } }
    location = /__cdnca_site_vars {
      internal;
      set $cdnca_site_id "";
      set $cdnca_site_revision "";
      set $cdnca_site_digest "";
      set $cdnca_site_tenant "";
      set $cdnca_site_scope "";
      set $cdnca_site_host "";
      set $cdnca_site_port "";
      set $cdnca_site_generation "";
      set $cdnca_site_max_body "1";
      set $cdnca_site_state "";
    }
  }
}
