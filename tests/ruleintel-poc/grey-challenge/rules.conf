# Grey-zone challenge hook, after CRS (phase 2, after 949110 summed the
# score). Stand-in for the two-tier score: threshold 10, one CRITICAL hit
# (5) is grey. Grey + no challenge cookie + browser-class -> challenge code
# __CODE__, which nginx's error_page sends to @cdnca_waf_challenge.
SecRule UNIQUE_ID "@rx ^g=([01]);b=([01]);\|[0-9a-f]{32}$" "id:51300,phase:1,pass,nolog,t:none,capture,setvar:tx.cdnca_g=%{TX.1},setvar:tx.cdnca_b=%{TX.2}"
SecRule &TX:cdnca_g "@eq 0" "id:51301,phase:1,deny,status:500,log,t:none,msg:'cdnca waf: missing context'"
SecRule TX:blocking_inbound_anomaly_score "@gt 0" "id:51310,phase:2,deny,status:__CODE__,log,auditlog,t:none,msg:'cdnca waf grey challenge score %{tx.blocking_inbound_anomaly_score}',chain"
  SecRule TX:blocking_inbound_anomaly_score "@lt %{tx.inbound_anomaly_score_threshold}" "t:none,chain"
  SecRule TX:cdnca_g "@streq 0" "t:none,chain"
  SecRule TX:cdnca_b "@streq 1" "t:none"
SecRule TX:blocking_inbound_anomaly_score "@gt 0" "id:51311,phase:2,pass,log,auditlog,t:none,msg:'cdnca waf grey pass g=%{tx.cdnca_g} b=%{tx.cdnca_b}',chain"
  SecRule TX:blocking_inbound_anomaly_score "@lt %{tx.inbound_anomaly_score_threshold}" "t:none"
