load_module /usr/local/openresty/modsecurity/modules/ngx_http_modsecurity_module.so;
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;
events { worker_connections 256; }
http {
  access_log off;
  lua_package_path "/poc/?.lua;;";
  server { listen 127.0.0.1:9000; location / { content_by_lua_block { require("poc").origin() } } }
  server {
    listen 127.0.0.1:8081;
    modsecurity on;
    modsecurity_rules_file /poc/gen/challenge-418.conf;
    modsecurity_transaction_id $cdnca_waf_txid;
    server_rewrite_by_lua_block { require("poc").server_rewrite() }
    error_page 418 = @cdnca_waf_challenge;
    location / { proxy_pass http://127.0.0.1:9000; }
    location @cdnca_waf_challenge { content_by_lua_block { require("poc").challenge() } }
    location = /.poc-declare { set $cdnca_waf_txid ""; return 404; }
  }
  server {
    listen 127.0.0.1:8082;
    modsecurity on;
    modsecurity_rules_file /poc/gen/challenge-599.conf;
    modsecurity_transaction_id $cdnca_waf_txid;
    server_rewrite_by_lua_block { require("poc").server_rewrite() }
    error_page 599 = @cdnca_waf_challenge;
    location / { proxy_pass http://127.0.0.1:9000; }
    location @cdnca_waf_challenge { content_by_lua_block { require("poc").challenge() } }
    location = /.poc-declare { set $cdnca_waf_txid ""; return 404; }
  }
  server {
    listen 127.0.0.1:8083;
    modsecurity on;
    modsecurity_rules_file /poc/gen/nochallenge.conf;
    modsecurity_transaction_id $cdnca_waf_txid;
    server_rewrite_by_lua_block { require("poc").server_rewrite() }
    error_page 418 = @cdnca_waf_challenge;
    location / { proxy_pass http://127.0.0.1:9000; }
    location @cdnca_waf_challenge { content_by_lua_block { require("poc").challenge() } }
    location = /.poc-declare { set $cdnca_waf_txid ""; return 404; }
  }
}
