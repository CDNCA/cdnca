load_module /usr/local/openresty/modsecurity/modules/ngx_http_modsecurity_module.so;
worker_processes 1;
pid logs/macro.pid;
error_log logs/error.log info;
events { worker_connections 256; }
http {
  access_log off;
  lua_package_path "/poc/?.lua;;";
  server { listen 127.0.0.1:9001; location / { return 200 "origin ok\n"; } }
  server {
    listen 127.0.0.1:8082;
    modsecurity on;
    modsecurity_rules_file /poc/gen/macro.conf;
    modsecurity_transaction_id $cdnca_waf_txid;
    server_rewrite_by_lua_block { require("poc").server_rewrite() }
    location / { proxy_pass http://127.0.0.1:9000; }
    location = /.poc-declare { set $cdnca_waf_txid ""; return 404; }
  }
}
