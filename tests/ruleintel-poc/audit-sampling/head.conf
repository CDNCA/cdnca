# Node engine settings (RenderDynamicWAFRules, libs/edgeconfig/waf_dynamic.go)
# with the audit engine line and log file per variant (__ENGINE__, __LOG__).
# Grey zone stand-in: inbound threshold 10, so one CRITICAL (5) hit passes
# with a score and a strong payload (>= 10) is blocked.
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile /usr/local/openresty/modsecurity/unicode.mapping 20127
SecStatusEngine Off
SecAuditEngine __ENGINE__
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /poc/logs/audit-__LOG__.log
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecAction "id:900990,phase:1,pass,t:none,nolog,setvar:tx.crs_setup_version=4300"
SecAction "id:900110,phase:1,pass,t:none,nolog,setvar:tx.inbound_anomaly_score_threshold=10"
