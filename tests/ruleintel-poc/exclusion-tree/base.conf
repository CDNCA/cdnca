# Engine settings of the PoC rule sets (as RenderDynamicWAFRules,
# libs/edgeconfig/waf_dynamic.go, minus the audit log), then the context
# parser: Lua writes "s=<site id>|<random>" into the transaction ID
# (modsecurity_transaction_id). Exclusions: node-wide hook rules (hooks.conf).
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile /usr/local/openresty/modsecurity/unicode.mapping 20127
SecStatusEngine Off
SecAuditEngine Off
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecAction "id:900990,phase:1,pass,t:none,nolog,setvar:tx.crs_setup_version=4300"
SecRule UNIQUE_ID "@rx ^s=([0-9a-f-]{0,36})\|" "id:51000,phase:1,pass,nolog,t:none,capture,setvar:tx.cdnca_site=%{TX.1}"
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:[a-z0-9.+-]+\+)?json" "id:51001,phase:1,pass,nolog,t:none,t:lowercase,ctl:requestBodyProcessor=JSON"
