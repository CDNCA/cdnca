load_module /usr/local/openresty/modsecurity/modules/ngx_http_modsecurity_module.so;
worker_processes 1;
pid logs/__NAME__.pid;
error_log logs/__NAME__.error.log info;
events { worker_connections 256; }
http {
  access_log off;
  lua_package_path "/poc/?.lua;;";
  init_by_lua_block { require("poc").load("__BUCKETS__") }
  server { listen 127.0.0.1:__ORIGIN__; location / { return 200 "origin ok\n"; } }
  server {
    listen 127.0.0.1:__PORT__;
    # node rules: engine settings, context parser, the node-wide exclusion
    # hooks (gen/__NAME__/hooks.conf), CRS
    modsecurity_rules_file /poc/gen/__NAME__/node.conf;
    modsecurity_transaction_id $cdnca_waf_txid;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    location / {
      set $cdnca_waf_txid "";
      rewrite_by_lua_block { require("poc").rewrite() }
      proxy_pass http://127.0.0.1:__ORIGIN__;
    }
    # B: Lua drops the excluded query argument before ModSecurity
    location /b {
      set $cdnca_waf_txid "";
      rewrite_by_lua_block { require("poc").rewrite_drop("q") }
      proxy_pass http://127.0.0.1:__ORIGIN__;
    }
    # one tier location for every site (no per-site location)
    location @cdnca_waf_tier { modsecurity on; modsecurity_rules_file /poc/gen/tier.conf; proxy_pass http://127.0.0.1:__ORIGIN__; }
    # plan C: bucket locations (empty file in plan A)
    include __LOCATIONS__;
  }
}
