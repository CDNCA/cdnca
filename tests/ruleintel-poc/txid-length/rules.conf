# What ModSecurity received as UNIQUE_ID: its length (t:length), whether the
# end of it is intact (request id tail), whether a c3-style context rule
# with linear character classes parses it under the tier's PCRE match limit.
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecStatusEngine Off
SecAuditEngine On
SecAuditLogParts AHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /poc/logs/audit.log
SecPcreMatchLimit 1000
SecPcreMatchLimitRecursion 1000
SecDefaultAction "phase:1,log,auditlog,pass"
SecRule UNIQUE_ID "@gt 0" "id:51400,phase:1,pass,log,t:none,t:length,msg:'UIDLEN %{MATCHED_VAR}'"
SecRule UNIQUE_ID "@rx ." "id:51405,phase:1,pass,log,t:none,msg:'UIDRAW %{UNIQUE_ID}'"
SecRule UNIQUE_ID "!@rx ;\|[0-9a-f]{32}$" "id:51401,phase:1,deny,status:500,log,t:none,msg:'UIDTAIL broken'"
SecRule UNIQUE_ID "@rx ^c3;s=([0-9a-f-]{36});t=(,[0-9A-Za-z_.:,-]{0,__MAX__});\|[0-9a-f]{32}$" "id:51402,phase:1,pass,nolog,t:none,capture,setvar:tx.cdnca_t=%{TX.2}"
SecRule &TX:cdnca_t "@eq 0" "id:51403,phase:1,deny,status:501,log,t:none,msg:'UIDPARSE failed'"
SecRule TX:cdnca_t "@gt 0" "id:51404,phase:1,pass,log,t:none,t:length,msg:'TLEN %{MATCHED_VAR}'"
