load_module /usr/local/openresty/modsecurity/modules/ngx_http_modsecurity_module.so;
worker_processes 1;
pid logs/__NAME__.pid;
error_log logs/__NAME__.error.log info;
events { worker_connections 256; }
http {
  access_log off;
  lua_package_path "/poc/?.lua;;";
  init_by_lua_block { require("poc").load("/poc/gen/__NAME__/sites.txt") }
  server { listen 127.0.0.1:__ORIGIN__; location / { return 200 "origin ok\n"; } }
  server {
    listen 127.0.0.1:__PORT__;
    modsecurity_rules_file /poc/gen/node.conf;
    modsecurity_transaction_id $cdnca_waf_txid;
    # the production tier/site location body proxies as location / does
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    location / {
      set $cdnca_waf_txid "";
      rewrite_by_lua_block { require("poc").rewrite() }
      proxy_pass http://127.0.0.1:__ORIGIN__;
    }
    location @cdnca_waf_tier { modsecurity on; modsecurity_rules_file /poc/gen/tier.conf; proxy_pass http://127.0.0.1:__ORIGIN__; }
    include /poc/gen/__NAME__/locations.conf;
  }
}
