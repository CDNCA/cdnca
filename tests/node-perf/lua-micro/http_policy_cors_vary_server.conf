location = /np-cors {
      internal;
      content_by_lua_block { ngx.say("ok") }
      header_filter_by_lua_block {
        local mode = ngx.var.arg_mode
        if mode == "none" then
          local header = ngx.header
          for _ = 1, 50 do header["Vary"] = nil; header["Access-Control-Allow-Origin"] = nil; header["X-CDNCA-HTTP-Policy-Version"] = nil end
          return
        end
        local cors = { allowed_origins = { "https://app.example.test" }, allowed_methods = { "GET" },
          allowed_headers = {}, exposed_headers = {}, allow_credentials = false, max_age_seconds = 600 }
        local site = { response_headers = {} }
        if mode ~= "no_cors" then site.cors = cors end
        ngx.ctx.cdnca_http_policy_site = site
        ngx.ctx.cdnca_http_policy_version = 3
        ngx.ctx.cdnca_http_cors_origin = mode == "cors_allowed_origin" and "https://app.example.test" or nil
        local engine, header = require("httppolicy.engine"), ngx.header
        for _ = 1, 50 do
          header["Vary"] = nil; header["Access-Control-Allow-Origin"] = nil; header["X-CDNCA-HTTP-Policy-Version"] = nil
          engine.header_filter()
        end
      }
    }
