# Dynamic routing D12 acceptance skeleton: the shared-server shape of
# docs/edge/dynroute-contract.md §6 with the telemetry of
# docs/edge/dynroute-telemetry.md (edgeconfig.RenderDynamicRoutingTelemetryHTTP
# and ...Server are rendered by cdnca-dyntelemetry-check into __TELEMETRY_*__).
# Origin and rules stand in for D5/D7: the site object's first endpoint is the
# origin, its rule plan runs through the D6 interpreter.
worker_processes __WORKERS__;
pid logs/nginx.pid;
error_log logs/error.log notice;
events { worker_connections 4096; }
http {
  access_log off;
  # the skeleton's http level (edgeconfig.SiteRuntimeSystemHTTP, nil system)
  server_tokens off;
  lua_package_path "__LUA_ROOT__/dynroute/?.lua;__LUA_ROOT__/security/?.lua;__LUA_ROOT__/?.lua;;";
  uninitialized_variable_warn off;
  lua_shared_dict cdnca_site_index __INDEX_SIZE__;
  lua_shared_dict cdnca_site_state 8m;
  lua_shared_dict cdnca_site_lock 1m;
  init_by_lua_block {
    require("cdnca_site").configure({
      objects_root = "__STATE__/site-objects",
      index_root = "__STATE__/site-index",
      system_max_body = 1048576,
      lru_items = __LRU_ITEMS__,
    })
    require("cdnca_origin").configure({})
    require("cdnca_telemetry")
    cdnca_d12_plans = {}
  }
  init_worker_by_lua_block { require("cdnca_site").init_worker() }
__TELEMETRY_HTTP__
  map $uri $cdnca_node_location {
    default "";
    /.well-known/cdnca-market-probe 1;
  }
  upstream cdnca_d12_origin {
    server 0.0.0.1;
    balancer_by_lua_block {
      local site = require("cdnca_site").current()
      local endpoint = site.origin.pools[1].endpoints[1]
      assert(require("ngx.balancer").set_current_peer(endpoint.host, endpoint.port))
    }
  }

  server {
__LISTEN__
    server_name _;
    server_rewrite_by_lua_block {
      local site = require("cdnca_site").route()
      if not site and ngx.var.cdnca_node_location == "" then
        return require("cdnca_site").reject_unknown()
      end
    }
    rewrite_by_lua_block {
      -- D7 stand-in: the site's rule plan (edgeconfig.CompileSecurityRulePlan
      -- of the site's policies, written by the check as __STATE__/plans/<site>.json)
      -- through the D6 interpreter.
      local site = require("cdnca_site").current()
      if not site then return end
      local program = cdnca_d12_plans[site.site_id]
      if program == nil then
        local file = io.open("__STATE__/plans/" .. site.site_id .. ".json", "rb")
        local raw = file and file:read("*a")
        if file then file:close() end
        program = raw and assert(require("cdnca_rule_interp").compile_json(raw)) or false
        cdnca_d12_plans[site.site_id] = program
      end
      if program then require("cdnca_rule_interp").enforce(program) end
    }
    body_filter_by_lua_block { require("cdnca_telemetry").body_filter() }
    log_by_lua_block { require("cdnca_telemetry").log() }
__TELEMETRY_SERVER__
    client_max_body_size $cdnca_site_max_body;
    location = /.well-known/cdnca-market-probe {
      return 204;
    }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_pass http://cdnca_d12_origin;
    }
  }

  server {
    listen unix:__STATE__/run/cdnca-site-admin.sock;
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    location / { content_by_lua_block { require("cdnca_site_admin").handle() } }
    location = /__cdnca_site_vars {
      internal;
      set $cdnca_site_id "";
      set $cdnca_site_revision "";
      set $cdnca_site_digest "";
      set $cdnca_site_tenant "";
      set $cdnca_site_scope "";
      set $cdnca_site_host "";
      set $cdnca_site_port "";
      set $cdnca_site_generation "";
      set $cdnca_site_max_body "1";
      set $cdnca_site_state "";
__TELEMETRY_VARS__
    }
  }
}
