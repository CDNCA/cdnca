# Dynamic routing D5b acceptance: cdnca_origintls on the skeleton's location
# shape (libs/edgeconfig/edgeskeleton: keepalive 0 dynamic upstream,
# proxy_ssl_verify on + placeholder trust + skip default verify +
# proxy_ssl_verify_by_lua, proxy_ssl_name $cdnca_origin_sni). Site selection
# and endpoint choice (D3/D5a) are replaced by a stand-in: the test site
# object is fixtures.lua, the pool and endpoint come from the query.
# One worker: the reuse cases need one connection cache.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;
events { worker_connections 1024; }
http {
  access_log off;
  lua_package_path "/t/lua/dynroute/?.lua;/t/?.lua;;";
  uninitialized_variable_warn off;
  lua_shared_dict cdnca_site_index 1m;
  lua_shared_dict cdnca_site_state 1m;
  lua_shared_dict t_stats 1m;
  init_by_lua_block {
    require("cdnca_site").configure({ objects_root = "/t/objects", index_root = "/t/index", system_max_body = 1048576 })
    require("cdnca_origintls").configure({ system_ca_file = "/t/certs/system.crt" })
    require("fixtures")
  }
  upstream cdnca_dynamic {
    server 0.0.0.1;
    balancer_by_lua_block { require("fixtures").balancer() }
    keepalive 0;
  }
  server {
    listen 127.0.0.1:8080;
    server_name _;
    location @cdnca_variables {
      set $cdnca_origin_scheme "";
      set $cdnca_origin_host "";
      set $cdnca_origin_sni "";
      set $cdnca_origin_trust "";
      set $cdnca_site_id "";
      set $t_pool "";
      set $t_rid "";
      return 500;
    }
    location / {
      rewrite_by_lua_block { require("fixtures").rewrite() }
      header_filter_by_lua_block { require("fixtures").header_filter() }
      proxy_http_version 1.1;
      proxy_set_header Host $cdnca_origin_host;
      proxy_set_header Connection "";
      proxy_next_upstream off;
      proxy_ssl_server_name on;
      proxy_ssl_name $cdnca_origin_sni;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /t/certs/placeholder.crt;
      lua_upstream_skip_openssl_default_verify on;
      proxy_ssl_verify_by_lua_block { require("fixtures").verify() }
      proxy_pass $cdnca_origin_scheme://cdnca_dynamic;
    }
  }
}
