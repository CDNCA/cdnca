# Dynamic routing D3 acceptance skeleton: the shared-server shape of
# docs/edge/dynroute-contract.md §6 (what D2 renders), with a stand-in for
# the rest of the pipeline: a routed request answers with the selected site.
# __VAR__ placeholders are filled by cdnca-site-index-check.
worker_processes __WORKERS__;
pid logs/nginx.pid;
error_log logs/error.log notice;
events { worker_connections 4096; }
http {
  access_log off;
  lua_package_path "__LUA_ROOT__/dynroute/?.lua;;";
  uninitialized_variable_warn off;
  lua_shared_dict cdnca_site_index __INDEX_SIZE__;
  lua_shared_dict cdnca_site_state 8m;
  lua_shared_dict cdnca_site_lock 1m;
  init_by_lua_block {
    require("cdnca_site").configure({
      objects_root = "__STATE__/site-objects",
      index_root = "__STATE__/site-index",
      system_max_body = 1048576,
      lru_items = __LRU_ITEMS__,
    })
  }
  init_worker_by_lua_block { require("cdnca_site").init_worker() }

  map $uri $cdnca_node_location {
    default "";
    /.well-known/cdnca-market-probe 1;
  }

  server {
    listen 127.0.0.1:18080;
    listen 127.0.0.1:18081;
    server_name _;
    server_rewrite_by_lua_block {
      local site = require("cdnca_site").route()
      if not site and ngx.var.cdnca_node_location == "" then
        return require("cdnca_site").reject_unknown()
      end
    }
    client_max_body_size $cdnca_site_max_body;
    location = /.well-known/cdnca-market-probe {
      if ($cdnca_site_state = "ok") { rewrite ^ /__site last; }
      return 204;
    }
    location / {
      content_by_lua_block {
        local site = require("cdnca_site").current()
        ngx.header["X-Cdnca-Site"] = ngx.var.cdnca_site_id
        ngx.header["X-Cdnca-Digest"] = ngx.var.cdnca_site_digest
        ngx.header["X-Cdnca-Matched"] = ngx.var.cdnca_site_host
        ngx.header["X-Cdnca-Generation"] = ngx.var.cdnca_site_generation
        ngx.header["X-Cdnca-Max-Body"] = ngx.var.cdnca_site_max_body
        ngx.header["X-Cdnca-Same"] = tostring(site ~= nil and site.site_id == ngx.var.cdnca_site_id)
        ngx.header["X-Cdnca-Tenant"] = ngx.var.cdnca_site_tenant
        ngx.say(site and site.hosts.primary or "")
      }
    }
    location = /__exec {
      # internal redirect keeps the selection (contract §1 item 2)
      rewrite_by_lua_block { return ngx.exec("/__after_exec") }
    }
    location = /__after_exec {
      content_by_lua_block {
        local site = require("cdnca_site").current()
        ngx.header["X-Cdnca-Site"] = ngx.var.cdnca_site_id
        ngx.say(site and site.hosts.primary or "")
      }
    }
    location = /__site {
      internal;
      content_by_lua_block { ngx.say("site:", ngx.var.cdnca_site_id) }
    }
    location = /__upload {
      client_body_buffer_size 16k;
      content_by_lua_block {
        ngx.req.read_body()
        ngx.say("ok")
      }
    }
  }

  server {
    listen unix:__STATE__/run/cdnca-site-admin.sock;
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    location / { content_by_lua_block { require("cdnca_site_admin").handle() } }
    location = /__bench {
      content_by_lua_block {
        -- per-lookup cost of the request path's lookup (exact host hits and
        -- misses that probe the wildcard levels), CLOCK_MONOTONIC
        local ffi = require "ffi"
        pcall(ffi.cdef, [[typedef struct { long tv_sec; long tv_nsec; } cdnca_d3_ts; int clock_gettime(int, cdnca_d3_ts *);]])
        local ts = ffi.new("cdnca_d3_ts")
        local function now_us() ffi.C.clock_gettime(1, ts); return tonumber(ts.tv_sec) * 1e6 + tonumber(ts.tv_nsec) / 1e3 end
        local site = require "cdnca_site"
        local args = ngx.req.get_uri_args()
        local n, count, port = tonumber(args.n), tonumber(args.count), tonumber(args.port)
        local prefix, miss = args.prefix, args.miss == "1"
        local samples = {}
        local found = 0
        for i = 1, n do
          local id = (i * 7919) % count
          local host = miss and ("nope" .. id .. ".absent.test") or string.format(prefix, id)
          local t0 = now_us()
          local s, state = site.lookup(port, host)
          samples[i] = now_us() - t0
          if s then found = found + 1 end
        end
        table.sort(samples)
        local sum = 0
        for i = 1, n do sum = sum + samples[i] end
        ngx.say(require("cjson").encode({ n = n, found = found, p50_us = samples[math.ceil(n * 0.5)],
          p99_us = samples[math.ceil(n * 0.99)], max_us = samples[n], mean_us = sum / n }))
      }
    }
    location = /__cdnca_site_vars {
      internal;
      set $cdnca_site_id "";
      set $cdnca_site_revision "";
      set $cdnca_site_digest "";
      set $cdnca_site_tenant "";
      set $cdnca_site_scope "";
      set $cdnca_site_host "";
      set $cdnca_site_port "";
      set $cdnca_site_generation "";
      set $cdnca_site_max_body "1";
      set $cdnca_site_state "";
    }
  }
}
