# CDN-like L7 edge for the ADR 0013 PoC: terminates TLS with its own edge
# certificate (cdn.poc.test), re-encrypts to the Gateway origin, adds
# X-Forwarded-For, and enforces read/idle timeouts like a public CDN.
worker_processes 1;
error_log /dev/stderr info;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # 18443: gRPC over HTTP/2, origin gRPC over TLS (CDN "gRPC on" mode).
    server {
        listen 18443 ssl;
        http2 on;
        ssl_certificate     /pki/edge.pem;
        ssl_certificate_key /pki/edge-key.pem;
        client_body_timeout 3600s;
        location / {
            grpc_pass grpcs://host.docker.internal:19445;
            grpc_ssl_server_name on;
            grpc_ssl_name gateway.poc.test;
            grpc_ssl_verify on;
            grpc_ssl_trusted_certificate /pki/root-ca.pem;
            grpc_set_header X-Forwarded-For $remote_addr;
            grpc_read_timeout 60s;
            grpc_send_timeout 60s;
        }
    }

    # 18444: WebSocket upgrade, origin HTTPS (CDN WebSocket mode).
    server {
        listen 18444 ssl;
        ssl_certificate     /pki/edge.pem;
        ssl_certificate_key /pki/edge-key.pem;
        location /agent/v1/tunnel {
            proxy_pass https://host.docker.internal:19446;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name gateway.poc.test;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /pki/root-ca.pem;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # 8443: a CDN in front of the gateway's own port (default shape, ADR 0013
    # §4.2). Same name as the gateway (gateway.poc.test) with the CDN's own
    # edge certificate, same port at the edge and at the origin, WebSocket
    # pulled from the gateway shared port 8443; appends the node address to
    # X-Forwarded-For like public CDNs do. No master nginx in the path.
    server {
        listen 8443 ssl;
        server_name gateway.poc.test;
        ssl_certificate     /pki/gwedge.pem;
        ssl_certificate_key /pki/gwedge-key.pem;
        location /agent/v1/tunnel {
            proxy_pass https://host.docker.internal:8443;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name gateway.poc.test;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /pki/root-ca.pem;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # 18445: same as 18443 with an 8s idle limit, to show that the heartbeat
    # interval must stay below the CDN idle/read timeout.
    server {
        listen 18445 ssl;
        http2 on;
        ssl_certificate     /pki/edge.pem;
        ssl_certificate_key /pki/edge-key.pem;
        location / {
            grpc_pass grpcs://host.docker.internal:19445;
            grpc_ssl_server_name on;
            grpc_ssl_name gateway.poc.test;
            grpc_ssl_verify on;
            grpc_ssl_trusted_certificate /pki/root-ca.pem;
            grpc_read_timeout 8s;
            grpc_send_timeout 8s;
        }
    }
}
