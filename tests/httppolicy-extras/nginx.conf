# HTTP policy header variables / allow_duplicate and rule
# conditions on a real OpenResty (run.sh). The policy entry is the site
# object's http_policy object (engine.access_object); the origin echoes the
# request headers it got as X-Echo-<name>.
worker_processes 1;
error_log /tmp/hp/error.log notice;
pid /tmp/hp/nginx.pid;
events { worker_connections 64; }
http {
  access_log off;
  lua_package_path "/hp/lua/?.lua;/usr/local/openresty/lualib/?.lua;;";
  lua_regex_match_limit 100000;
  init_by_lua_block {
    engine = require("httppolicy.engine")
    local f = assert(io.open("/hp/policy.json", "rb")); POLICY = f:read("*a"); f:close()
    local sha = require("resty.sha256"):new(); sha:update(POLICY)
    DIGEST = require("resty.string").to_hex(sha:final())
  }
  server {
    listen 127.0.0.1:18301;
    location / {
      set $cdnca_ja4 "t13d1516h2_8daaf6152771_b186095e22b6";
      access_by_lua_block {
        return engine.access_object({ sha256 = DIGEST, revision = 7 }, function(d) return d == DIGEST and POLICY or nil end, "site-a")
      }
      header_filter_by_lua_block { engine.header_filter() }
      proxy_set_header Host $host;
      proxy_pass http://127.0.0.1:18302;
    }
  }
  server {
    listen 127.0.0.1:18302;
    location / {
      content_by_lua_block {
        local h = ngx.req.get_headers(100)
        for _, name in ipairs({ "x-client", "x-ua", "x-fp", "x-geo", "x-multi", "x-once", "x-lit", "x-set" }) do
          local v = h[name]
          if type(v) == "table" then v = table.concat(v, "|") end
          if v then ngx.header["X-Echo-" .. name] = v end
        end
        ngx.header["X-Origin-Uri"] = ngx.var.request_uri
        ngx.header["X-Resp-Once"] = "origin"
        ngx.header["X-Resp-Multi"] = "origin"
        ngx.say("ok")
      }
    }
  }
}
