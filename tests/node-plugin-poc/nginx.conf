# ADR 0017 PoC nginx.conf (not product config).
worker_processes 2;
error_log /tmp/poc/error.log warn;
pid /tmp/poc/nginx.pid;
events { worker_connections 4096; }
http {
  access_log off;
  lua_package_path "/poc/lua/?.lua;;";
  init_by_lua_block {
    -- option ②b sample plugins (untrusted source strings)
    LUA_PLUGIN_OK = [[
      return function(req)
        if string.find(req, "evil", 1, true) then return "deny 403" end
        return "header x-plugin-seen 1"
      end
    ]]
    LUA_PLUGIN_LOOP = [[ return function(req) while true do end end ]]
    LUA_PLUGIN_ESCAPE = [[ return function(req) return tostring(io) .. tostring(os) .. tostring(require) .. tostring(ffi) end ]]
    -- string.rep is a C function: the instruction hook cannot interrupt it.
    LUA_PLUGIN_CBOMB = [[ return function(req) local s = string.rep("x", 400 * 1024 * 1024) return "header x-len " .. #s end ]]
  }
  server {
    listen 8080 reuseport;
    location = /base { content_by_lua_block { ngx.say("ok") } }
    location /p/ {
      access_by_lua_block { require("plugin_call").access() }
      content_by_lua_block { ngx.say("ok") }
    }
    location = /stats {
      content_by_lua_block { ngx.say(require("plugin_call").call("STATS") or "host down") }
    }
    location /lua/ {
      content_by_lua_block {
        local sandbox = require "sandbox"
        local which = ngx.var.uri:match("^/lua/(%w+)$")
        local source = ({ ok = LUA_PLUGIN_OK, loop = LUA_PLUGIN_LOOP, escape = LUA_PLUGIN_ESCAPE, cbomb = LUA_PLUGIN_CBOMB })[which]
        local result, err, ms = sandbox.run(source, ngx.var.request_uri)
        ngx.say(tostring(result or err), " ms=", string.format("%.2f", ms or -1), " pid=", ngx.worker.pid())
      }
    }
    location = /pid { content_by_lua_block { ngx.say(ngx.worker.pid()) } }
  }
}
