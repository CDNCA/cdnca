# Shared server: per-site WAF context arrives in the transaction id
# (modsecurity_transaction_id $cdnca_waf_txid, written by
# server_rewrite_by_lua before ModSecurity's rewrite-phase handler):
#   s=<site>;pl=<1-4>;thr=<n>;mode=<block|detect>;sets=,<set>,...;ex=,<id>,<id>,...;|<random>
# Nothing here changes when a site's policy changes: no reload.
SecRule UNIQUE_ID "@rx ^s=([a-z0-9.-]+);pl=([1-4]);thr=([0-9]{1,4});mode=(block|detect);sets=(,[a-z0-9,]*);ex=(,[0-9,]*);\|" \
  "id:51000,phase:1,pass,nolog,t:none,capture,setvar:tx.cdnca_site=%{TX.1},setvar:tx.blocking_paranoia_level=%{TX.2},setvar:tx.detection_paranoia_level=%{TX.2},setvar:tx.inbound_anomaly_score_threshold=%{TX.3},setvar:tx.cdnca_mode=%{TX.4},setvar:tx.cdnca_sets=%{TX.5},setvar:tx.cdnca_exclude=%{TX.6}"
# fail closed: no (or a malformed) site context
SecRule &TX:cdnca_site "@eq 0" "id:51001,phase:1,deny,status:500,log,t:none,msg:'cdnca waf: missing site context'"
SecRule TX:cdnca_mode "@streq detect" "id:51002,phase:1,pass,nolog,t:none,ctl:ruleEngine=DetectionOnly"
# rule-set selection: one rule per catalog set, membership is node-level
# catalog data (static); which sets a site enables is per request data
SecRule TX:cdnca_sets "!@contains ,sqli," "id:51010,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=942000-942999"
SecRule TX:cdnca_sets "!@contains ,xss," "id:51011,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=941000-941999"
