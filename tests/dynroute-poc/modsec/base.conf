# Engine settings shared by every rule set of the PoC (same as the
# edgeconfig renderer's node file, libs/edgeconfig/waf_managed.go:297-306,
# minus the audit log).
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile /usr/local/openresty/modsecurity/unicode.mapping 20127
SecStatusEngine Off
SecAuditEngine Off
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecAction "id:900990,phase:1,pass,t:none,nolog,setvar:tx.crs_setup_version=4300"
# trace of what ModSecurity sees, only for /trace (Lua headers, transaction id)
SecRule REQUEST_FILENAME "@streq /trace" "id:50900,phase:1,pass,log,t:none,msg:'TRACE1 uid=%{UNIQUE_ID} srvrw=%{REQUEST_HEADERS.x-poc-server-rewrite} rw=%{REQUEST_HEADERS.x-poc-rewrite}'"
SecRule REQUEST_FILENAME "@streq /trace" "id:50901,phase:2,pass,log,t:none,msg:'TRACE2 uid=%{UNIQUE_ID}'"
SecRule REQUEST_FILENAME "@beginsWith /exec" "id:50902,phase:1,pass,log,t:none,msg:'EXECTRACE uid=%{UNIQUE_ID}'"
