load_module /usr/local/openresty/modsecurity/modules/ngx_http_modsecurity_module.so;
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;
events { worker_connections 256; }
http {
  access_log off;
  lua_package_path "/poc/modsec/?.lua;;";
  lua_shared_dict poc_waf 1m;

  # origin (no WAF): echoes whether the Lua-set request header reached it
  server {
    listen 127.0.0.1:9000;
    location / { return 200 "origin ok uri=$uri leaked_ctx=$http_x_poc_server_rewrite\n"; }
  }
  # admin (no WAF)
  server {
    listen 127.0.0.1:8090;
    location /set { content_by_lua_block { require("poc_modsec").admin() } }
  }

  # dynamic shape: one shared server, one rule set for every site
  server {
    listen 127.0.0.1:8080;
    modsecurity on;
    modsecurity_rules_file /poc/modsec/gen/dynamic.conf;
    modsecurity_transaction_id $cdnca_waf_txid;
    server_rewrite_by_lua_block { require("poc_modsec").server_rewrite() }
    rewrite_by_lua_block { require("poc_modsec").rewrite() }
    access_by_lua_block { require("poc_modsec").access() }
    location / {
      proxy_set_header X-Poc-Server-Rewrite "";
      proxy_set_header X-Poc-Rewrite "";
      proxy_pass http://127.0.0.1:9000;
    }
    location @variant { proxy_pass http://127.0.0.1:9000; }
    # never matched: declares the variables (indexed, changeable) without a
    # server-level "set" that would run after server_rewrite_by_lua
    location = /.poc-declare { set $cdnca_waf_txid ""; set $cdnca_site ""; return 404; }
  }
  # same, without the per-rule exclusion rules (cost baseline)
  server {
    listen 127.0.0.1:8084;
    modsecurity on;
    modsecurity_rules_file /poc/modsec/gen/dynamic-noex.conf;
    modsecurity_transaction_id $cdnca_waf_txid;
    server_rewrite_by_lua_block { require("poc_modsec").server_rewrite() }
    location / { proxy_pass http://127.0.0.1:9000; }
  }
  # same, exclusion rules grouped by rule family (skipAfter when the family is not excluded)
  server {
    listen 127.0.0.1:8085;
    modsecurity on;
    modsecurity_rules_file /poc/modsec/gen/dynamic-grouped.conf;
    modsecurity_transaction_id $cdnca_waf_txid;
    server_rewrite_by_lua_block { require("poc_modsec").server_rewrite() }
    location / { proxy_pass http://127.0.0.1:9000; }
  }
}
