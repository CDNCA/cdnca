worker_processes 1; # one worker: the keepalive cases need one connection cache
pid logs/nginx.pid;
error_log logs/error.log info;
events { worker_connections 1024; }
http {
  access_log off;
  lua_package_path "/poc/origintls/?.lua;;";
  lua_shared_dict poc_verify 4m;

  # recommended: one dynamic upstream, nginx's keepalive module off (nginx
  # 1.29.7+ enables it by default and caches by sockaddr only), ngx_lua's
  # keepalive cache keyed by (host, sockaddr, local) instead
  upstream cdnca_dynamic {
    server 0.0.0.1;
    balancer_by_lua_block { require("poc_origintls").balance(true) }
    keepalive 0;
  }
  # no keepalive directive at all: nginx 1.31.1's default (keepalive 32 local)
  upstream cdnca_dynamic_default {
    server 0.0.0.1;
    balancer_by_lua_block { require("poc_origintls").balance(false) }
  }
  # explicit nginx keepalive
  upstream cdnca_dynamic_nginx_ka {
    server 0.0.0.1;
    balancer_by_lua_block { require("poc_origintls").balance(false) }
    keepalive 16;
  }

  server {
    listen 127.0.0.1:8080;
    set $cdnca_pool "";
    set $cdnca_key_mode "";
    set $cdnca_origin_sni "";
    set $poc_rid "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_next_upstream off;
    access_by_lua_block { require("poc_origintls").access() }
    header_filter_by_lua_block { require("poc_origintls").header_filter() }

    # recommended: verify on, Lua checks leaf + peer chain against the pool's
    # root; keepalive key = "SNI#trust=<anchor>", real SNI via proxy_ssl_name
    location /chain/ {
      set $cdnca_pool $arg_pool;
      set $cdnca_key_mode trust;
      proxy_pass https://cdnca_dynamic/;
      proxy_ssl_name $cdnca_origin_sni;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /poc/certs/edge/ca.crt; # required by nginx, unused (default verify skipped)
      lua_upstream_skip_openssl_default_verify on;
      proxy_ssl_verify_by_lua_block { require("poc_origintls").verify("chain") }
    }
    # same verification, keepalive key = SNI only (ngx_lua's default key)
    location /snikey/ {
      set $cdnca_pool $arg_pool;
      proxy_pass https://cdnca_dynamic/;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /poc/certs/edge/ca.crt;
      lua_upstream_skip_openssl_default_verify on;
      proxy_ssl_verify_by_lua_block { require("poc_origintls").verify("chain") }
    }
    # same verification on the upstream with nginx's default keepalive
    location /default/ {
      set $cdnca_pool $arg_pool;
      proxy_pass https://cdnca_dynamic_default/;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /poc/certs/edge/ca.crt;
      lua_upstream_skip_openssl_default_verify on;
      proxy_ssl_verify_by_lua_block { require("poc_origintls").verify("chain") }
    }
    # same verification on the upstream with explicit nginx keepalive
    location /nginxka/ {
      set $cdnca_pool $arg_pool;
      proxy_pass https://cdnca_dynamic_nginx_ka/;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /poc/certs/edge/ca.crt;
      lua_upstream_skip_openssl_default_verify on;
      proxy_ssl_verify_by_lua_block { require("poc_origintls").verify("chain") }
    }
    # Lua sees only the leaf (no peer chain): intermediate-issued origins fail
    location /leaf/ {
      set $cdnca_pool $arg_pool;
      set $cdnca_key_mode trust;
      proxy_pass https://cdnca_dynamic/;
      proxy_ssl_name $cdnca_origin_sni;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /poc/certs/edge/ca.crt;
      lua_upstream_skip_openssl_default_verify on;
      proxy_ssl_verify_by_lua_block { require("poc_origintls").verify("leaf") }
    }
    # anti-pattern: every tenant's root in one node-level trust store (no Lua)
    location /merged/ {
      set $cdnca_pool $arg_pool;
      set $cdnca_key_mode trust;
      proxy_pass https://cdnca_dynamic/;
      proxy_ssl_name $cdnca_origin_sni;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /poc/certs/origin/trustAB.crt;
      proxy_ssl_verify_depth 3;
    }
    # hazard: Lua rejects but proxy_ssl_verify is off, nothing enforces the result
    location /verifyoff/ {
      set $cdnca_pool $arg_pool;
      set $cdnca_key_mode trust;
      proxy_pass https://cdnca_dynamic/;
      proxy_ssl_name $cdnca_origin_sni;
      proxy_ssl_verify off;
      lua_upstream_skip_openssl_default_verify on;
      proxy_ssl_verify_by_lua_block { require("poc_origintls").verify("chain") }
    }
  }
}
