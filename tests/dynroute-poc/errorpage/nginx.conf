worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;
events { worker_connections 256; }
http {
  access_log off;
  lua_package_path "/poc/errorpage/?.lua;;";
  gzip on;
  gzip_types text/plain;
  gzip_min_length 0;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_buffering on;

  # v7: error_page + proxy_intercept_errors + content handler (compiler.go writeErrorPages)
  server {
    listen 127.0.0.1:8081;
    listen 127.0.0.1:8441 ssl; # h2 copy of the same server
    http2 on;
    ssl_certificate /poc/certs/edge/a.test.crt;
    ssl_certificate_key /poc/certs/edge/a.test.key;
    location / {
      proxy_pass http://127.0.0.1:9000;
      proxy_intercept_errors on;
      error_page 403 404 500 502 @cdnca_error_page;
    }
    location = /edge403 { error_page 403 404 500 502 @cdnca_error_page; return 403; }
    location = /dead { proxy_pass http://127.0.0.1:9999; error_page 403 404 500 502 @cdnca_error_page; }
    location @cdnca_error_page { internal; content_by_lua_block { require("poc_errorpage").v7_content() } }
  }
  # dynamic runtime: header/body filter, no intercept
  server {
    listen 127.0.0.1:8082;
    listen 127.0.0.1:8442 ssl;
    http2 on;
    ssl_certificate /poc/certs/edge/a.test.crt;
    ssl_certificate_key /poc/certs/edge/a.test.key;
    header_filter_by_lua_block { require("poc_errorpage").header_filter(false) }
    body_filter_by_lua_block { require("poc_errorpage").body_filter() }
    location / { proxy_pass http://127.0.0.1:9000; }
    location = /edge403 { return 403; }
    location = /dead { proxy_pass http://127.0.0.1:9999; }
  }
  # same, naive header handling (only Content-Length dropped)
  server {
    listen 127.0.0.1:8083;
    header_filter_by_lua_block { require("poc_errorpage").header_filter(true) }
    body_filter_by_lua_block { require("poc_errorpage").body_filter() }
    location / { proxy_pass http://127.0.0.1:9000; }
    location = /edge403 { return 403; }
    location = /dead { proxy_pass http://127.0.0.1:9999; }
  }
}
