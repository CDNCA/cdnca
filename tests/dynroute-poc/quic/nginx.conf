worker_processes 2;
pid logs/nginx.pid;
error_log logs/error.log info;
events { worker_connections 1024; }
http {
  access_log off;
  lua_package_path "/poc/quic/?.lua;;";
  lua_shared_dict poc_hits 1m;
  lua_shared_dict poc_state 1m;
  server {
    # one shared server: TCP TLS (h1/h2) and QUIC (h3) on the same port
    listen 127.0.0.1:8443 ssl;
    listen 127.0.0.1:8443 quic reuseport;
    http2 on;
    http3 on;
    # placeholder only: the Lua certificate phase always clears it; a served
    # "fallback.invalid" would mean the dynamic path failed open
    ssl_certificate /poc/certs/edge/fallback.invalid.crt;
    ssl_certificate_key /poc/certs/edge/fallback.invalid.key;
    ssl_client_hello_by_lua_block { require("poc_quic").client_hello() }
    ssl_certificate_by_lua_block { require("poc_quic").certificate() }
    header_filter_by_lua_block { require("poc_quic").header_filter() }
    location / { content_by_lua_block { require("poc_quic").content() } }
    location = /hits { content_by_lua_block { require("poc_quic").hits() } }
    location = /rotate { content_by_lua_block { ngx.shared.poc_state:set("rot", ngx.var.arg_v); ngx.say("rot=", ngx.var.arg_v) } }
    location = /reset { content_by_lua_block { ngx.shared.poc_hits:flush_all(); ngx.say("ok") } }
  }
}
