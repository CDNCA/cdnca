worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 1024; }
http {
  access_log off;
  lua_package_path "/poc/shdict/?.lua;;";
  lua_shared_dict cdnca_site_index __INDEX_SIZE__;
  lua_shared_dict cdnca_site_generation 1m;
  lua_shared_dict cdnca_index_lock 1m;
  lua_shared_dict cdnca_small 1m;
  server {
    listen 127.0.0.1:8080;
    default_type application/json;
    location = /fill    { content_by_lua_block { require("poc_shdict").fill() } }
    location = /stats   { content_by_lua_block { require("poc_shdict").stats() } }
    location = /bench   { content_by_lua_block { require("poc_shdict").bench() } }
    location = /dump    { content_by_lua_block { require("poc_shdict").dump() } }
    location = /rebuild { content_by_lua_block { require("poc_shdict").rebuild() } }
    location = /status  { content_by_lua_block { require("poc_shdict").status() } }
    location = /lookup  { content_by_lua_block { require("poc_shdict").lookup() } }
    location = /evict   { content_by_lua_block { require("poc_shdict").evict() } }
    location = /marker  { content_by_lua_block {
      local d = ngx.shared.cdnca_site_index
      if ngx.var.arg_set then d:safe_set("marker", ngx.var.arg_set) end
      ngx.say(d:get("marker") or "absent")
    } }
  }
}
