
    # 宝塔环境节点升级下载直连端口（fix-btenv2）：证书由本机私有根 CA 签发，节点已信任。
    server {
        listen 19445 ssl;
        server_name _;
        ssl_certificate /etc/cdnca-control/keys/pki/public-server.pem;
        ssl_certificate_key /etc/cdnca-control/keys/pki/public-server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options "nosniff" always;
        location ^~ /downloads/edge-agent/upgrades/sha256/ {
            alias /var/lib/cdnca-control/downloads/edge-agent/upgrades/sha256/;
            limit_except GET { deny all; }
            default_type application/octet-stream;
        }
        location / { return 404; }
    }
