syntax = "proto3";

package common.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// RequestMetadata identifies one logical request. A retry with identical input
// must reuse request_id; a caller must not reuse it for different input.
message RequestMetadata {
  // request_id is a canonical UUID string, preferably UUIDv7.
  string request_id = 1;
  google.protobuf.Timestamp sent_time = 2;
  // traceparent carries the W3C Trace Context header value, never credentials.
  string traceparent = 3;
  // correlation_id groups a workflow without defining idempotency.
  string correlation_id = 4;
  // task_id is set when the request belongs to a durable control-plane task.
  optional string task_id = 5;
}

// EventMetadata identifies a durable event across at-least-once delivery.
message EventMetadata {
  // event_id is stable across redelivery and is the consumer deduplication key.
  string event_id = 1;
  // request_id links the event to the request that caused it.
  string request_id = 2;
  google.protobuf.Timestamp occurred_time = 3;
  string traceparent = 4;
  // causation_id is the direct parent event ID when one exists.
  optional string causation_id = 5;
  // correlation_id groups all events in one workflow.
  string correlation_id = 6;
  optional string task_id = 7;
}

// StreamMetadata identifies and orders a message within one Connect stream.
message StreamMetadata {
  // message_id is stable when the same message is retransmitted.
  string message_id = 1;
  google.protobuf.Timestamp sent_time = 2;
  // sequence starts at 1 and increases within a single stream direction.
  uint64 sequence = 3;
  string traceparent = 4;
}

// ProtocolVersion is the protobuf application protocol version, not a binary
// release version. Major changes may be incompatible; minor changes are additive.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// ProtocolVersionRange is an inclusive range supported by one peer.
message ProtocolVersionRange {
  ProtocolVersion minimum = 1;
  ProtocolVersion maximum = 2;
}

// ErrorCode is used for durable protocol failures. Transport and authentication
// failures still use canonical gRPC status codes.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_ALREADY_EXISTS = 5;
  ERROR_CODE_CONFLICT = 6;
  ERROR_CODE_FAILED_PRECONDITION = 7;
  ERROR_CODE_RATE_LIMITED = 8;
  ERROR_CODE_UNSUPPORTED_VERSION = 9;
  ERROR_CODE_STALE_ATTEMPT = 10;
  ERROR_CODE_DIGEST_MISMATCH = 11;
  ERROR_CODE_REVOKED = 12;
  ERROR_CODE_UNAVAILABLE = 13;
  ERROR_CODE_DEADLINE_EXCEEDED = 14;
  ERROR_CODE_INTERNAL = 15;
}

// FieldViolation reports a safe validation failure. Descriptions must not
// contain tokens, private keys, artifact bytes, or other secret values.
message FieldViolation {
  string field = 1;
  string description = 2;
}

// ProtocolError is safe for persistence and display after message sanitization.
message ProtocolError {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  google.protobuf.Duration retry_after_duration = 4;
  repeated FieldViolation field_violations = 5;
}
