worker_processes 1;
error_log /runtime/error.log notice;
pid /runtime/nginx.pid;

events {
    worker_connections 64;
}

http {
    lua_package_path '/opt/cdnca-waf/?.lua;;';
    lua_shared_dict cdnca_waf_clock 1m;
    lua_shared_dict cdnca_waf_locks 1m;

    server {
        listen 18081;

        access_by_lua_block {
            if ngx.var.uri == "/ready" then
                return
            end
            local telemetry = true
            if ngx.var.uri == "/invalid-telemetry" then
                telemetry = "true"
            end
            require("cdnca_waf").access({
                policy_path = "/policy/current.json",
                telemetry = telemetry,
            })
        }

        location / {
            content_by_lua_block {
                return ngx.exit(204)
            }
        }
    }
}
