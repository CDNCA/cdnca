worker_processes 1;
error_log /runtime/error.log notice;
pid /runtime/nginx.pid;

events {
    worker_connections 512;
}

http {
    lua_package_path '/opt/cdnca-waf/?.lua;;';
    lua_shared_dict cdnca_waf_clock 1m;
    lua_shared_dict cdnca_waf_locks 1m;

    log_format waf_event escape=json
        '{"emit":$cdnca_security_emit,'
        '"type":"$cdnca_security_type",'
        '"action":"$cdnca_security_action",'
        '"severity":"$cdnca_security_severity",'
        '"rule_id":"$cdnca_security_rule_id",'
        '"path":"$uri"}';

    server {
        listen 18080;
        listen 18082;
        set $cdnca_security_emit 0;
        set $cdnca_security_type "-";
        set $cdnca_security_action "-";
        set $cdnca_security_severity "-";
        set $cdnca_security_rule_id "-";

        access_log /runtime/security.jsonl waf_event if=$cdnca_security_emit;
        add_header X-CDNCA-Security-Emit $cdnca_security_emit always;
        add_header X-CDNCA-Security-Type $cdnca_security_type always;
        add_header X-CDNCA-Security-Action $cdnca_security_action always;
        add_header X-CDNCA-Security-Severity $cdnca_security_severity always;
        add_header X-CDNCA-Security-Rule-ID $cdnca_security_rule_id always;

        access_by_lua_block {
            if ngx.var.uri == "/ready" then
                return
            end
            local options = {
                policy_path = "/policy/current.json",
                telemetry = true,
            }
            if ngx.var.uri == "/policy-unavailable" then
                options.policy_path = "/policy/missing.json"
            elseif ngx.var.uri == "/disabled-block" then
                options.telemetry = false
            elseif ngx.var.uri == "/legacy-block" then
                options.telemetry = nil
            end
            require("cdnca_waf").access(options)
        }

        location / {
            content_by_lua_block {
                return ngx.exit(204)
            }
        }

        location = /sink-block {
            access_log /dev/full waf_event if=$cdnca_security_emit;
            content_by_lua_block {
                return ngx.exit(204)
            }
        }
    }
}
