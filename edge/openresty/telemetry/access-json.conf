# Include in the nginx http block, then enable with:
# access_log /var/log/cdnca/access.jsonl cdnca_access_json;
# The deployment compiler must set the cdnca_* scope variables per server.

map $upstream_cache_status $cdnca_telemetry_cache_status {
    ""      "BYPASS";
    default $upstream_cache_status;
}

# The pinned runtime reports upstream phase times in seconds with millisecond
# precision. Non-numeric, negative and multi-upstream values deliberately map
# to an invalid JSON token so the Agent quarantines the line.
map $upstream_connect_time $cdnca_origin_connect_us {
    "" null;
    "-" null;
    ~^0\.000$ 0;
    ~^0\.00(?<cdnca_oc_1>[1-9])$ ${cdnca_oc_1}000;
    ~^0\.0(?<cdnca_oc_2>[1-9][0-9])$ ${cdnca_oc_2}000;
    ~^0\.(?<cdnca_oc_3>[1-9][0-9]{2})$ ${cdnca_oc_3}000;
    ~^(?<cdnca_oc_s>[1-9][0-9]{0,5})\.(?<cdnca_oc_f>[0-9]{3})$ ${cdnca_oc_s}${cdnca_oc_f}000;
    default invalid;
}

map $upstream_header_time $cdnca_origin_first_byte_us {
    "" null;
    "-" null;
    ~^0\.000$ 0;
    ~^0\.00(?<cdnca_ofb_1>[1-9])$ ${cdnca_ofb_1}000;
    ~^0\.0(?<cdnca_ofb_2>[1-9][0-9])$ ${cdnca_ofb_2}000;
    ~^0\.(?<cdnca_ofb_3>[1-9][0-9]{2})$ ${cdnca_ofb_3}000;
    ~^(?<cdnca_ofb_s>[1-9][0-9]{0,5})\.(?<cdnca_ofb_f>[0-9]{3})$ ${cdnca_ofb_s}${cdnca_ofb_f}000;
    default invalid;
}

map $upstream_response_time $cdnca_origin_total_us {
    "" null;
    "-" null;
    ~^0\.000$ 0;
    ~^0\.00(?<cdnca_ot_1>[1-9])$ ${cdnca_ot_1}000;
    ~^0\.0(?<cdnca_ot_2>[1-9][0-9])$ ${cdnca_ot_2}000;
    ~^0\.(?<cdnca_ot_3>[1-9][0-9]{2})$ ${cdnca_ot_3}000;
    ~^(?<cdnca_ot_s>[1-9][0-9]{0,5})\.(?<cdnca_ot_f>[0-9]{3})$ ${cdnca_ot_s}${cdnca_ot_f}000;
    default invalid;
}

# FX60: $cdnca_security_block_page is "1" when the node answered a block page itself.
map $cdnca_security_block_page $cdnca_security_block_page_log {
    "1"     true;
    default false;
}

log_format cdnca_access_json escape=json
    '{"schema_version":1,'
    '"type":"access.v1",'
    '"occurred_at":"$time_iso8601",'
    '"tenant_id":"$cdnca_tenant_id",'
    '"site_id":"$cdnca_site_id",'
    '"node_id":"$cdnca_node_id",'
    '"config_version_id":"$cdnca_config_version_id",'
    '"installation_id":"",'
    '"task_id":null,'
    '"request_id":"$request_id",'
    '"trace_id":"$http_traceparent",'
    '"host":"$host",'
    '"path":"$uri",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"protocol":"$server_protocol",'
    '"cache_status":"$cdnca_telemetry_cache_status",'
    '"status_code":$status,'
    '"request_bytes":$request_length,'
    '"response_bytes":$bytes_sent,'
    '"request_headers":null,'
    '"response_headers":null,'
    '"request_body":null,'
    '"response_body":null,'
    '"ja4":null,'
    '"origin_connect_us":$cdnca_origin_connect_us,'
    '"origin_first_byte_us":$cdnca_origin_first_byte_us,'
    '"origin_total_us":$cdnca_origin_total_us,'
    '"blocked":$cdnca_security_block_page_log}';
