worker_processes 1;
pid /tmp/logs/cdnca-event-telemetry.pid;
error_log /tmp/logs/error.log notice;

events {
    worker_connections 16;
}

http {
    map $host $cdnca_tenant_id { default "11111111-1111-4111-8111-111111111111"; }
    map $host $cdnca_site_id { default "33333333-3333-4333-8333-333333333333"; }
    map $host $cdnca_node_id { default "44444444-4444-4444-8444-444444444444"; }
    map $host $cdnca_config_version_id { default "55555555-5555-4555-8555-555555555555"; }
    map $uri $cdnca_security_emit {
        default      0;
        /waf-block  1;
    }
    map $host $cdnca_security_type { default "waf"; }
    map $host $cdnca_security_action { default "block"; }
    map $host $cdnca_security_severity { default "high"; }
    map $host $cdnca_security_rule_id { default "rule-test"; }
    map $uri $cdnca_security_block_page {
        default      0;
        /waf-block  1;
    }

    include /telemetry/access-json.conf;
    include /telemetry/security-json.conf;

    server {
        listen 18080;
        access_log /tmp/logs/access.jsonl cdnca_access_json;
        access_log /tmp/logs/security.jsonl cdnca_security_json if=$cdnca_security_emit;

        location = /ok { return 204; }
        location = /missing { return 404; }
        location = /error { return 500; }
        location = /waf-block { return 403; }
    }

    # /dev/full makes every telemetry write fail without changing HTTP results.
    server {
        listen 18081;
        access_log /dev/full cdnca_access_json;
        access_log /dev/full cdnca_security_json if=$cdnca_security_emit;

        location = /ok { return 204; }
        location = /missing { return 404; }
        location = /error { return 500; }
        location = /waf-block { return 403; }
    }

    server {
        listen 18082;
        access_log /tmp/logs/benchmark.jsonl cdnca_access_json;

        location = /ok { return 204; }
    }
}
