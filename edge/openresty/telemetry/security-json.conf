# Include in the nginx http block. Security modules set these variables only
# after a rule decision, then use a conditional security access_log.

map "$http_upgrade|$http_connection|$http_accept|$uri" $cdnca_security_request_class {
    default standard;
    ~*^websocket\|[^|]*upgrade\| websocket;
    ~*^[^|]*\|[^|]*\|[^|]*text/event-stream\| sse;
    ~*^[^|]*\|[^|]*\|[^|]*\|/\.well-known/acme-challenge/ acme;
    ~*^[^|]*\|[^|]*\|[^|]*\|/(?:healthz|readyz)$ health;
}

log_format cdnca_security_json escape=json
    '{"schema_version":1,'
    '"type":"security.v1",'
    '"occurred_at":"$time_iso8601",'
    '"tenant_id":"$cdnca_tenant_id",'
    '"site_id":"$cdnca_site_id",'
    '"node_id":"$cdnca_node_id",'
    '"config_version_id":"$cdnca_config_version_id",'
    '"installation_id":"",'
    '"task_id":null,'
    '"request_id":"$request_id",'
    '"trace_id":"$http_traceparent",'
    '"host":"$host",'
    '"path":"$uri",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"listen_port":$server_port,'
    '"protocol":"$scheme",'
    '"request_class":"$cdnca_security_request_class",'
    '"status_code":$status,'
    '"request_bytes":$request_length,'
    '"response_bytes":$bytes_sent,'
    '"security_type":"$cdnca_security_type",'
    '"action":"$cdnca_security_action",'
    '"severity":"$cdnca_security_severity",'
    '"rule_id":"$cdnca_security_rule_id",'
    '"request_headers":null,'
    '"response_headers":null,'
    '"request_body":null,'
    '"response_body":null,'
    '"ja4":null,'
    '"origin_connect_us":$cdnca_origin_connect_us,'
    '"origin_first_byte_us":$cdnca_origin_first_byte_us,'
    '"origin_total_us":$cdnca_origin_total_us}';
