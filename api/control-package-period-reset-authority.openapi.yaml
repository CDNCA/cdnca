openapi: 3.1.0
info:
  title: CDNCA 套餐周期重置授权绑定 API
  version: 1.0.0
  description: >-
    管理租户套餐周期重置 worker 使用的短期授权绑定。所有写操作只接受真实的
    control-api Bearer 会话，并在数据库事务内重新验证 active session、account、
    tenant membership 与 sites.manage。相同 Idempotency-Key 和请求事实返回原始事实，
    改变请求事实返回 idempotency_conflict。
paths:
  /v1/tenant/package-period-reset/authority-bindings:
    post:
      operationId: createPackagePeriodResetAuthorityBinding
      summary: 创建当前租户的周期重置授权绑定
      description: If-Match 必须为强值 "0"；同一租户同时最多存在一个 active binding。
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantScopeID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TTLRequest' }
      responses:
        '201':
          description: 已创建，ETag 为绑定 revision
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/BindingEnvelope' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/tenant/package-period-reset/authority-bindings/{binding_id}:renew:
    post:
      operationId: renewPackagePeriodResetAuthorityBinding
      summary: 续期周期重置授权绑定
      description: >-
        If-Match 必须等于当前 active binding revision。服务锁定旧绑定并重新验证 live
        authority，随后单向撤销旧事实并创建新的不可变 active binding。
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/BindingID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantScopeID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TTLRequest' }
      responses:
        '200':
          description: 已续期并返回新绑定
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/BindingEnvelope' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/tenant/package-period-reset/authority-bindings/{binding_id}:revoke:
    post:
      operationId: revokePackagePeriodResetAuthorityBinding
      summary: 撤销周期重置授权绑定
      description: If-Match 必须等于当前 active binding revision；请求不能包含 body。
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/BindingID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/TenantScopeID'
      responses:
        '200':
          description: 已单向撤销
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/BindingEnvelope' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: control-api-session
  parameters:
    BindingID:
      name: binding_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"(0|[1-9][0-9]*)"$' }
    TenantScopeID:
      name: tenant_scope_id
      in: query
      required: false
      description: >-
        只给平台会话用：平台管理员（platform.admin）代该租户操作，绑定与审计都记管理员本人
        （actor_scope_id 为平台 scope）。租户会话带此参数返回 400；平台会话缺少此参数返回 400。
      schema: { type: string, format: uuid }
    RequestID:
      name: X-Request-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  headers:
    ETag:
      description: 当前绑定的强 revision
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  schemas:
    TTLRequest:
      type: object
      additionalProperties: false
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          type: integer
          format: int64
          minimum: 300
          maximum: 86400
    Binding:
      type: object
      additionalProperties: false
      required: [id, tenant_scope_id, actor_user_id, audience, permission_name, status, revision, not_before, expires_at, created_at, updated_at, replayed]
      properties:
        id: { type: string, format: uuid }
        tenant_scope_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        actor_scope_id:
          type: string
          format: uuid
          description: 平台管理员代建时为其平台 scope；租户成员本人建时不出现。
        audience: { type: string, const: package_period_reset }
        permission_name: { type: string, const: sites.manage }
        status: { type: string, enum: [active, revoked] }
        revision: { type: integer, format: int64, minimum: 1 }
        not_before: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        replayed: { type: boolean }
    BindingEnvelope:
      type: object
      additionalProperties: false
      required: [binding]
      properties: { binding: { $ref: '#/components/schemas/Binding' } }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [validation_error, unauthenticated, permission_denied, binding_not_found, idempotency_conflict, revision_conflict, precondition_required, service_unavailable]
        message: { type: string }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties: { error: { $ref: '#/components/schemas/Error' } }
  responses:
    ValidationError: { description: validation_error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Unauthenticated: { description: unauthenticated, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    PermissionDenied: { description: permission_denied, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    NotFound: { description: binding_not_found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: idempotency_conflict 或 revision_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    PreconditionRequired: { description: precondition_required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    ServiceUnavailable: { description: service_unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

