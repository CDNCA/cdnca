openapi: 3.1.0
info:
  title: CDNCA DNS Credential Rewrap Jobs API
  version: 1.0.0
  description: >-
    Session-only production boundary for durable DNS provider credential rewrap
    jobs. Job progress is reconstructed from authoritative durable write
    receipts; no in-memory job state is authoritative.
servers:
  - url: /
paths:
  /v1/admin/dns-credential-rewrap/jobs:
    post:
      operationId: createDNSCredentialRewrapJob
      summary: Start or replay a bounded DNS credential rewrap job
      description: >-
        Requires a live platform-scoped system administrator session whose
        current RBAC facts grant platform.admin. Tenant sessions, API keys,
        workload identities, revoked sessions, and stale permission claims are
        denied before any provider or job data is returned. The service derives
        each item's idempotency identity from the batch Idempotency-Key and
        provider ID, invokes the production credential rewrap service, and uses
        its durable write receipts as the authoritative per-item progress.
      security:
        - bearerSession: []
      x-required-permissions: [platform.admin]
      x-session-only: true
      x-live-permission-check: true
      x-platform-scope-only: true
      x-tenant-allowed: false
      x-api-key-allowed: false
      x-workload-identity-allowed: false
      x-durable-progress-authority: dns.provider.credential_rewrap.write_receipts
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required: [provider_id, expected_revision]
                    properties:
                      provider_id: {type: string, format: uuid}
                      expected_revision: {type: integer, format: int64, minimum: 1}
      responses:
        '202':
          description: Durable job accepted or replayed; the representation contains current receipt-backed progress.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RewrapJob'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/admin/dns-credential-rewrap/jobs/{job_id}:
    get:
      operationId: getDNSCredentialRewrapJob
      summary: Read receipt-backed DNS credential rewrap job progress
      description: >-
        Requires the same live platform-scoped system administrator session
        identity that created the job and a current platform.admin grant. A
        revoked session or a different actor, session, or scope receives no job
        representation. The returned progress is rebuilt from durable write
        receipts and never from process-local memory.
      security:
        - bearerSession: []
      x-required-permissions: [platform.admin]
      x-session-only: true
      x-live-permission-check: true
      x-platform-scope-only: true
      x-tenant-allowed: false
      x-api-key-allowed: false
      x-workload-identity-allowed: false
      x-job-owner-binding: [actor, session, scope]
      x-durable-progress-authority: dns.provider.credential_rewrap.write_receipts
      parameters:
        - $ref: '#/components/parameters/JobID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '202':
          description: Current durable job progress for the creating actor and session.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RewrapJob'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/JobNotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: session
      description: A live control-plane user session; API keys and workload identities are not accepted.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Binds one immutable ordered batch payload to one durable job identity.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    RequestID:
      name: X-Request-ID
      in: header
      required: true
      description: Caller-supplied trace identifier recorded with durable progress.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    JobID:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    NoStore:
      description: Prevent storage of actor- and session-bound job progress.
      schema: {type: string, const: no-store}
    NoSniff:
      description: Disable MIME sniffing.
      schema: {type: string, const: nosniff}
    IdempotencyReplayed:
      description: True only when POST replayed the completed durable batch.
      schema: {type: string, enum: ['true', 'false']}
  responses:
    InvalidRequest:
      description: Invalid headers, job identity, batch shape, provider ID, or expected revision.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AuthenticationRequired:
      description: Missing, expired, revoked, or otherwise invalid user session.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PermissionDenied:
      description: The live platform session lacks the current platform.admin grant.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    JobNotFound:
      description: No job is visible to this exact actor, session, and scope binding.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    MethodNotAllowed:
      description: The route does not support the requested HTTP method.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    IdempotencyConflict:
      description: The Idempotency-Key is already bound to a different ordered batch payload.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Durable progress or credential rewrap service is unavailable.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    RewrapJob:
      type: object
      additionalProperties: false
      required:
        - job_id
        - status
        - requested
        - completed
        - succeeded
        - replayed
        - conflicted
        - failed
        - items
        - created_at
        - updated_at
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [processing, completed, completed_with_errors]}
        requested: {type: integer, minimum: 1, maximum: 100}
        completed: {type: integer, minimum: 0, maximum: 100}
        succeeded: {type: integer, minimum: 0, maximum: 100}
        replayed: {type: integer, minimum: 0, maximum: 100}
        conflicted: {type: integer, minimum: 0, maximum: 100}
        failed: {type: integer, minimum: 0, maximum: 100}
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/RewrapItemProgress'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    RewrapItemProgress:
      type: object
      additionalProperties: false
      required: [provider_id, expected_revision, status]
      properties:
        provider_id: {type: string, format: uuid}
        expected_revision: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [pending, completed, replayed, conflict, failed]}
        revision: {type: integer, format: int64, minimum: 1}
        credential_version: {type: integer, format: int64, minimum: 1}
        error_code:
          type: string
          enum:
            - revision_conflict
            - provider_not_found
            - credential_unavailable
            - idempotency_conflict
            - operation_failed
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum:
                - dns_credential_rewrap_invalid_request
                - dns_credential_rewrap_authentication_required
                - dns_credential_rewrap_permission_denied
                - dns_credential_rewrap_job_not_found
                - dns_credential_rewrap_idempotency_conflict
                - dns_credential_rewrap_unavailable
                - dns_credential_rewrap_method_not_allowed
