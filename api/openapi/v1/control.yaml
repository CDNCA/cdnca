      required: [host, port, weight]
      properties:
        host:
          type: string
          oneOf:
            - {format: ipv4}
            - {format: ipv6}
        port: {type: integer, minimum: 1, maximum: 65535}
        weight: {type: integer, minimum: 1, maximum: 100}
    StreamRuntimeSpecV1:
      type: object
      additionalProperties: false
      required: [id, protocol, listen_port, origins, connect_timeout_ms, response_timeout_ms, proxy_protocol_v1]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
        protocol: {$ref: '#/components/schemas/StreamProtocol'}
        listen_port: {type: integer, minimum: 1, maximum: 65535}
        origins:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/RuntimeOrigin'}
        connect_timeout_ms: {type: integer, minimum: 50, maximum: 30000}
        response_timeout_ms: {type: integer, minimum: 100, maximum: 600000}
        proxy_protocol_v1: {type: boolean}
    StreamRuntimeListenerV2:
      type: object
      additionalProperties: false
      required: [protocol, address, port]
      properties:
        protocol: {$ref: '#/components/schemas/StreamProtocol'}
        address: {type: string, const: '*'}
        port: {type: integer, minimum: 1, maximum: 65535}
    StreamRuntimeEndpointV2:
      type: object
      additionalProperties: false
      required: [port]
      oneOf:
        - required: [address]
        - required: [host]
      properties:
        address:
          type: string
          oneOf:
            - {format: ipv4}
            - {format: ipv6}
        host: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
    StreamRuntimeDNSPolicyV2:
      type: object
      additionalProperties: false
      required: [positive_min_ttl_seconds, positive_max_ttl_seconds, negative_ttl_seconds, stale_if_error_seconds, allow_private_addresses]
      oneOf:
        - properties:
            positive_min_ttl_seconds: {const: 0}
            positive_max_ttl_seconds: {const: 0}
            negative_ttl_seconds: {const: 0}
            stale_if_error_seconds: {const: 0}
            allow_private_addresses: {const: false}
        - $ref: '#/components/schemas/StreamDNSPolicy'
      properties:
        positive_min_ttl_seconds: {type: integer, minimum: 0, maximum: 300}
        positive_max_ttl_seconds: {type: integer, minimum: 0, maximum: 86400}
        negative_ttl_seconds: {type: integer, minimum: 0, maximum: 3600}
        stale_if_error_seconds: {type: integer, minimum: 0, maximum: 86400}
        allow_private_addresses: {type: boolean, const: false}
    StreamRuntimeGeoPolicyV2:
      type: object
      additionalProperties: false
      required: [enabled, tenant_id, site_id, stream_id, revision, unknown_region_action, trusted_proxy_cidrs, blocked_regions, region_cidrs]
      properties:
        enabled: {type: boolean}
        tenant_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        stream_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        unknown_region_action: {type: string, enum: [allow, block]}
        trusted_proxy_cidrs:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string}
        blocked_regions:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
        region_cidrs:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/StreamGeoRegionCIDRs'}
    StreamRuntimeSpecV2:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, site_id, stream_id, revision, listener, endpoint, dns, geo, connect_timeout_ms, response_timeout_ms, max_connections_per_client, drain_timeout_ms, proxy_protocol_inbound, proxy_protocol_outbound]
      properties:
        schema_version: {type: string, const: 'cdnca.edge.l4/v2'}
        tenant_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        stream_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        listener: {$ref: '#/components/schemas/StreamRuntimeListenerV2'}
        endpoint: {$ref: '#/components/schemas/StreamRuntimeEndpointV2'}
        dns: {$ref: '#/components/schemas/StreamRuntimeDNSPolicyV2'}
        geo: {$ref: '#/components/schemas/StreamRuntimeGeoPolicyV2'}
        connect_timeout_ms: {type: integer, minimum: 50, maximum: 30000}
        response_timeout_ms: {type: integer, minimum: 100, maximum: 600000}
        max_connections_per_client: {type: integer, minimum: 1, maximum: 10000}
        drain_timeout_ms: {type: integer, const: 30000}
        proxy_protocol_inbound: {type: boolean}
        proxy_protocol_outbound: {type: boolean}
    StreamRuntimeSpec:
      oneOf:
        - $ref: '#/components/schemas/StreamRuntimeSpecV1'
        - $ref: '#/components/schemas/StreamRuntimeSpecV2'
    StreamPublishIntent:
      type: object
      additionalProperties: false
      required: [id, version, operation, desired_state, resource_revision, configuration_source_revision, runtime_spec, state, automatic_request_id, publication_id, rollout_id, created_at]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 1}
        operation: {type: string, enum: [create, update, delete]}
        desired_state: {type: string, enum: [enabled, disabled, deleted]}
        resource_revision: {type: integer, format: int64, minimum: 1}
        configuration_source_revision: {type: integer, format: int64, minimum: 1}
        runtime_spec: {$ref: '#/components/schemas/StreamRuntimeSpec'}
        state: {type: string, enum: [unknown, pending, leased, retrying, reconciling, succeeded, failed, superseded]}
        automatic_request_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: 'null'}
        publication_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: 'null'}
        rollout_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
    Stream:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/StreamFields'
        - type: object
          required: [id, display_id, scope_id, owner, revision, publish_intent, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            display_id: {type: string, pattern: '^[1-9][0-9]{0,18}$', readOnly: true}
            scope_id: {type: string, format: uuid}
            package_name:
              type: [string, 'null']
              readOnly: true
              description: Purchased package snapshot name for this stream scope. List and detail reads resolve the persisted subscription; write and legacy replay responses may omit it or return null.
            package_expires_at:
              type: [string, 'null']
              format: date-time
              readOnly: true
              description: Purchased subscription ends_at for this stream scope, not its usage cycle end. List and detail reads resolve the persisted subscription; write and legacy replay responses may omit it or return null.
            owner:
              oneOf:
                - $ref: '#/components/schemas/StreamOwner'
                - type: 'null'
            revision: {type: integer, format: int64, minimum: 1}
            publish_intent: {$ref: '#/components/schemas/StreamPublishIntent'}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
