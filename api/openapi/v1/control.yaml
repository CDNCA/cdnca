  /v1/nodes/registration-credential:
    get:
      operationId: getNodeRegistrationCredential
      summary: Get the reusable node registration credential
      description: >-
        Requires nodes.manage in a platform scope. Returns the scope-level credential embedded in the
        node install command (the same command for every node); issues the first credential when none
        exists. Viewing it never creates a node. Only the credential SHA-256 is persisted; the value is
        derived from a server-side secret. Responses are Cache-Control no-store.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current credential.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegistrationCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/nodes/registration-credential/reset:
    post:
      operationId: resetNodeRegistrationCredential
      summary: Reset the node registration credential
      description: >-
        Requires nodes.manage in a platform scope. Issues a new credential; every previously copied install
        command is rejected from then on. Installed nodes keep their mTLS identity and are unaffected.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New credential.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegistrationCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/node-registrations:
    post:
      operationId: registerNode
      summary: Self-register a node host (called by install-node.sh)
      description: >-
        Unauthenticated except for the registration credential in the body; rate limited per source IP
        (10/min) and globally (120/min) per control-api process. Creates a pending node (待初始化) named after
        the host and records the observed public source IP and OS details, then returns a one-time
        initial_enrollment token (10 minutes) for the Gateway enrollment. Dedupe: the node ID is a keyed
        hash of the machine fingerprint, so the same machine reuses its pending node (200) instead of
        creating a duplicate; once it has enrolled or been initialized the call returns 409
        node_already_registered. A deleted (retired) node lets the machine register again as a new node.
        Self-registered nodes stay pending after enrollment and receive no configuration until an
        administrator sets admin_state=active. A new node gets the region of the region catalog when it has
        exactly one region, else an empty region.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRegistrationRequest'
      responses:
        '201':
          description: Pending node created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegistrationResult'
        '200':
          description: Existing pending node of this machine reused; a fresh token is issued.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegistrationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: invalid_registration_credential - the credential is invalid or was reset.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: node_registration_rate_limited; retry after the Retry-After seconds.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/node-registrations/identity:
    post:
      operationId: recoverNodeRegistrationIdentity
      summary: Fetch the issued identity of an interrupted node install (called by install-node.sh --resume)
      description: >-
        For an install whose Gateway enrollment committed on the controller (certificate issued) but whose
        host never wrote its identity directory. Authenticated by the registration credential in the body and
        rate limited together with POST /v1/node-registrations (same per source IP and global window). Returns
        the live initial certificate of this machine's registered node whose enrollment CSR has the given
        SHA-256, in the agent.v1.EnrollResponse JSON shape; the Agent binds it to the private keys it kept in
        its pending enrollment state. Any miss (unknown machine, no issued certificate, CSR digest mismatch)
        is 404 node_identity_not_found, so the response never reveals whether another node exists. Every
        lookup of a registered machine is audited as node.registration.identity_fetch (success or denied).
        A node installed with a one-time enrollment token has no reusable credential and cannot use this
        endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRegistrationIdentityRequest'
      responses:
        '200':
          description: The issued identity of this machine.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegistrationIdentity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: invalid_registration_credential - the credential is invalid or was reset.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: node_identity_not_found - no issued identity matches this machine and CSR digest.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: node_registration_rate_limited; retry after the Retry-After seconds.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
