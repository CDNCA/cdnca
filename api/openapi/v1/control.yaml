    get:
      operationId: listTenantMembers
      summary: List the members of the caller's tenant scope
      description: Tenant session with identity.users.manage or identity.roles.manage (the tenant owner). The owner is the scope's earliest member.
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: object
