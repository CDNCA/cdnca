        page: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1, maximum: 100}
    CreatePackageGroupRequest:
      type: object
      additionalProperties: false
      required: [name, visible, sort_order]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        visible:
          type: boolean
          description: Whether the group is shown in package selection surfaces.
        sort_order: {type: integer, minimum: 0, maximum: 1000000}
    UpdatePackageGroupRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, name, visible, sort_order]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 128}
        visible:
          type: boolean
          description: Whether the group is shown in package selection surfaces.
        sort_order: {type: integer, minimum: 0, maximum: 1000000}
    PackageGroup:
      type: object
      additionalProperties: false
      required: [id, owner_scope_id, name, visible, sort_order, revision, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        owner_scope_id:
          type: string
          format: uuid
          description: The platform scope or the reseller tenant scope that owns the group; names are unique per owner.
        name: {type: string, minLength: 1, maxLength: 128}
        visible: {type: boolean}
        sort_order: {type: integer, minimum: 0, maximum: 1000000}
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PackageGroupList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PackageGroup'
        total: {type: integer, format: int64, minimum: 0}
    PackageResourceLimits:
      type: object
      additionalProperties: false
      required: [monthly_traffic_bytes, bandwidth_bps, connections, stream_ports, domains, root_domains, http_ports, custom_cc, websocket, http3, l2_origin]
      properties:
        monthly_traffic_bytes:
          type: integer
          format: int64
          minimum: -1
          maximum: 1152921504606846976
          description: Monthly byte quota; -1 means unlimited.
        bandwidth_bps:
          type: integer
          format: int64
          minimum: -1
          maximum: 1000000000000000
          description: Bandwidth quota in bits per second; -1 means unlimited.
        connections:
          type: integer
          format: int64
          minimum: -1
          maximum: 1000000000
          description: Concurrent connection quota; -1 means unlimited.
        stream_ports:
          type: integer
          format: int64
          minimum: -1
          maximum: 1000000000
          description: Layer-four forwarding port quota; -1 means unlimited.
        domains:
          type: integer
          format: int64
          minimum: -1
          maximum: 1000000000
          description: Domain quota; -1 means unlimited.
        root_domains:
          type: integer
          format: int64
          minimum: -1
          maximum: 1000000000
          description: Registrable root-domain quota; -1 means unlimited.
        http_ports:
          type: integer
          format: int64
          minimum: -1
          maximum: 1000000000
          description: HTTP listen-port quota; -1 means unlimited.
        custom_cc: {type: boolean}
        websocket: {type: boolean}
        http3: {type: boolean}
        l2_origin: {type: boolean}
    PackageProtectionDescription:
      type: object
      additionalProperties: false
      required: [cc, ddos]
      properties:
        cc: {type: string, maxLength: 256}
        ddos: {type: string, maxLength: 256}
    PackagePrices:
      type: object
      additionalProperties: false
      required: [currency, monthly_minor, quarterly_minor, yearly_minor]
      properties:
        currency:
          type: string
          const: CNY
          description: ISO 4217 currency. The implementation currently accepts only CNY.
        monthly_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: Monthly price in CNY fen.
        quarterly_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: Quarterly price in CNY fen.
        yearly_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: Yearly price in CNY fen.
    PackageCNAMEPolicy:
      type: object
      additionalProperties: false
      required: [hostname, domain, mode]
      properties:
        hostname:
          type: string
          maxLength: 253
          pattern: '^(?:$|(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(?:\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))*)$'
          description: Optional complete shared CNAME hostname. An empty string delegates hostname construction to the control plane.
        domain:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(?:\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))*$'
          description: Normalized lowercase CNAME suffix without a trailing dot.
        mode:
          type: string
          enum: [per_site, shared]
    PackagePurchasePolicy:
      type: object
      additionalProperties: false
      required: [per_user_limit, sale_expires_at, require_real_name, renew_before_days, restrict_source_ips]
      properties:
        per_user_limit:
          type: integer
          format: int64
          minimum: -1
          maximum: 1000000000
          description: Maximum purchases per user; -1 means unlimited.
        sale_expires_at:
          type: [string, 'null']
          format: date-time
          description: Optional UTC sale cutoff.
        require_real_name: {type: boolean}
        renew_before_days:
          type: integer
          format: int64
          minimum: -1
          maximum: 36500
          description: Earliest renewal window in days; -1 disables the restriction.
        restrict_source_ips: {type: boolean}
    PackageProductSpec:
      type: object
      additionalProperties: false
      required: [name, description, group_ids, region_id, node_group_id, backup_node_group_id, limits, protection, prices, cname, purchase, sort_order, enabled]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 1000}
        group_ids:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Active package-group UUIDs. These references are validated by the catalog service.
          items: {type: string, format: uuid}
        region_id:
          type: string
          format: uuid
          description: Opaque non-zero region UUID. The current catalog does not validate a backing region resource.
        node_group_id:
          type: string
          format: uuid
          description: Opaque non-zero primary node-group UUID. The current catalog does not validate a backing node-group resource.
        backup_node_group_id:
          type: [string, 'null']
          format: uuid
          description: Optional opaque backup node-group UUID; when set it must differ from node_group_id. No backing resource existence check is implemented yet.
        limits:
          $ref: '#/components/schemas/PackageResourceLimits'
        protection:
          $ref: '#/components/schemas/PackageProtectionDescription'
        prices:
          $ref: '#/components/schemas/PackagePrices'
        cname:
          $ref: '#/components/schemas/PackageCNAMEPolicy'
        purchase:
          $ref: '#/components/schemas/PackagePurchasePolicy'
        sort_order: {type: integer, minimum: 0, maximum: 1000000}
        enabled:
          type: boolean
          description: Set false to disable the package in the product catalog.
    UpdatePackageProductRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, spec]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        spec:
          $ref: '#/components/schemas/PackageProductSpec'
    PackageProduct:
      type: object
      additionalProperties: false
      required: [id, owner_scope_id, spec, revision, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        owner_scope_id:
          type: string
          format: uuid
          description: The platform scope or the reseller tenant scope that owns the package; names are unique per owner.
        spec:
          $ref: '#/components/schemas/PackageProductSpec'
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        cname_sync_job_id:
          type: string
          format: uuid
          description: Only on the update response that changed the CNAME of a package with sold subscriptions; poll GET /v1/admin/packages/{id}/cname-sync/{job_id}.
    PackageCNAMESyncJob:
      type: object
      additionalProperties: false
      required: [id, product_id, product_revision, state, synced_count, site_count, skipped_count, attempt, max_attempts, last_error_code, skipped, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        product_revision: {type: integer, format: int64, minimum: 2}
        state: {type: string, enum: [queued, running, succeeded, failed]}
        synced_count: {type: integer, format: int64, minimum: 0}
        site_count: {type: integer, format: int64, minimum: 0, description: Sites asked to regenerate their CNAME.}
        skipped_count: {type: integer, format: int64, minimum: 0}
        attempt: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        last_error_code:
          type: [string, 'null']
          description: actor_session_ended or actor_permission_denied stop the job until retried; sync_failed is retried with backoff.
        skipped:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [subscription_id, reason]
            properties:
              subscription_id: {type: string, format: uuid}
              reason: {type: string, enum: [sold_override, future_entitlement, inactive]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PackageProductList:
      type: object
      additionalProperties: false
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PackageProduct'
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1, maximum: 1000000}
        limit: {type: integer, minimum: 1, maximum: 100}
    NodeAdminState:
      type: string
      enum: [pending, active, draining, disabled, retired]
    ManagedNodeAdminState:
      type: string
      enum: [active, draining, disabled, retired]
    EnrollmentPurpose:
      type: string
      enum: [initial_enrollment, re_enrollment]
    NodeManagementIPLocation:
      type: object
      additionalProperties: false
      required: [country, province, city, isp, country_code]
      properties:
        country: {type: string, maxLength: 128}
        province: {type: string, maxLength: 128}
        city: {type: string, maxLength: 128}
        isp: {type: string, maxLength: 128}
        country_code:
          type: string
          pattern: '^(?:|[A-Z]{2})$'
    NodeIPLocationView:
      type: object
      additionalProperties: false
      required: [node_id, effective, manual_fields, resolution]
      properties:
        node_id: {type: string, format: uuid}
        effective:
          $ref: '#/components/schemas/NodeManagementIPLocation'
        manual_fields:
          type: array
          maxItems: 5
          items: {type: string, enum: [country, province, city, isp, country_code]}
        resolution:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [node_id, outcome, automatic, library_revision, library_version, resolved_at]
              properties:
                node_id: {type: string, format: uuid}
                outcome: {type: string, enum: [resolved, unresolved, no_library]}
                address: {type: string, description: 解析所用的节点地址（outcome resolved 时）}
                automatic:
                  $ref: '#/components/schemas/NodeManagementIPLocation'
                library_revision: {type: integer, format: int64, minimum: 0}
                library_version: {type: string, maxLength: 128}
                resolved_at: {type: string, format: date-time}
    NodeAutoDisableSettings:
      type: object
      additionalProperties: false
      required:
        - bandwidth_limit
        - bandwidth_unit
        - traffic_enabled
        - traffic_from_day
        - traffic_from_time
        - traffic_total_gb
        - traffic_types
        - excluded_interfaces
        - disabled_periods
      properties:
        bandwidth_limit: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
        bandwidth_unit: {type: string, enum: [Mbps, Gbps]}
        traffic_enabled: {type: boolean}
        traffic_from_day: {type: integer, minimum: 1, maximum: 28}
        traffic_from_time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
        traffic_total_gb: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
        traffic_types:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [outbound, inbound]}
        excluded_interfaces: {type: string, maxLength: 512}
        disabled_periods: {type: string, maxLength: 1024}
    NodeManagementSettings:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - sort
        - node_type
        - cache_directory
        - cache_limit_gb
        - log_directory
        - ip_location
        - auto_disable
        - secondary_ips
        - external_probe
      properties:
        schema_version: {type: integer, const: 1}
        sort: {type: integer, minimum: 0, maximum: 999999, default: 100}
        node_type: {type: string, enum: [L1, L2], default: L1}
        cache_directory: {type: string, maxLength: 512, description: '空=节点默认；修改时须为 /data /var/cache /var/lib /var/log /opt /srv /mnt 下的绝对路径，且与日志目录互不包含（400 validation_error）；节点未声明 NODE_STORAGE 时修改返回 409 node_storage_unsupported'}
        cache_limit_gb: {type: integer, format: int64, minimum: 0, maximum: 1000000000, description: '0=节点默认；修改时须 ≤1048576（1 PiB）且不超过节点上报的缓存目录所在磁盘容量（400 node_cache_limit_exceeds_disk）'}
        log_directory: {type: string, maxLength: 512, description: '空=节点默认；规则同 cache_directory；Agent 下次启动生效'}
        ip_location:
          $ref: '#/components/schemas/NodeManagementIPLocation'
        ip_location_manual:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {type: string, enum: [country, province, city, isp, country_code]}
          description: >-
            管理员修正过的 IP 归属字段（迁移 547）。不在列表里的字段取主控 IP 库自动解析的值（写入时
            服务端强制，ip_location 里这些字段的值被忽略）；从列表去掉一个字段即恢复自动。省略时（旧调用方）值有变化的
            字段记为人工修正，其余保持原样。
        auto_disable:
          $ref: '#/components/schemas/NodeAutoDisableSettings'
        secondary_ips:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Additional addresses of the node. A line-group endpoint bound to this node may use one of them; an update that drops an address a current line-group revision still uses fails with node_address_in_use.
          items:
            type: string
            description: Canonical IPv4 or IPv6 address.
        external_probe:
          type: boolean
          default: true
          description: The node votes as a peer in external probing of other nodes (probe only; it never joins the node market). Nodes install probe-only by default.
        schedule302_hostname:
          type: string
          minLength: 4
          maxLength: 253
          pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: >-
            Direct hostname of the node for HTTP 302 scheduling (sites whose scheduling redirects to node
            direct hostnames send visitors here; the operator points it at the node). Omitted when unset;
            unique among nodes (409 node_schedule302_hostname_conflict).
    Node:
      type: object
      additionalProperties: false
      required: [id, display_id, name, description, region, admin_state, management_settings, revision, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        display_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Scope-local immutable decimal identifier; encoded as a string to preserve bigint precision.
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        region:
          type: string
          maxLength: 64
        ipv4:
          type: string
          format: ipv4
        ipv6:
          type: string
          format: ipv6
        admin_state:
          $ref: '#/components/schemas/NodeAdminState'
        management_settings:
          $ref: '#/components/schemas/NodeManagementSettings'
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        presence:
          $ref: '#/components/schemas/NodePresence'
    NodeGatewayEndpoint:
      type: object
      additionalProperties: false
