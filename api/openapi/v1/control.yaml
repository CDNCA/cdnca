        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/nodes/{id}:
    get:
      operationId: getNode
      summary: Get one platform node
      description: Requires nodes.read in a platform scope. platform.admin remains a wildcard permission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200':
          description: Node inventory record.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeInventory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateNode
      summary: Update node inventory metadata or administrative state
      description: >-
        Requires nodes.manage in a platform scope. If-Match supplies the expected revision. pending nodes cannot be
        activated or moved through an intermediate management state; first activation is reserved for the future
        Gateway CompleteEnrollment contract. disabled to active requires a node-bound consumed enrollment
        authorization. That authorization records permission to enroll only and does not prove certificate
        persistence, mTLS connectivity, or completed Gateway enrollment. retired is the delete operation and must be
        the only field: it physically deletes the node. It is rejected with node_in_use while the current revision
        of a live line group or a live L2 configuration lists the node, or while the node takes part in a queued or
        running cache operation or an active CC coordination. In one transaction it revokes the active
        certificates, writes a node.delete audit event (node ID, display ID, name, addresses, revoked certificate
        IDs and serial numbers, deleting user, time), and deletes the node row together with every row that only
        describes the node (certificates, identity, sessions, monitoring samples, deployment receipts, task
        projections). The response is the last node snapshot with admin_state retired. The Gateway ends the
        session on its next authorization refresh (at most 30 seconds) and rejects reconnects. The name and the
        licensed node slot are released at once; running the install command on the same host registers a new
        pending node, which may reuse the name but never the deleted node ID. Disabling or draining the last online
        available node (active, online, not isolated, not held) of a node-market supply that still has a normal
        subscriber is rejected with 409 supply_in_use, error.details {online_available, normal_subscriptions}
        (ADR 0012 §18.4); a supply already without online nodes is not blocked. Line groups only take nodes of
        their own region, so changing region is rejected with 409 node_region_in_use while the current revision
        of a live line group of another region lists the node (remove it from that line group first). When
        pending to active (initialize) leaves the node without a region and the region catalog has exactly one
        region, the node is put into that region; with several, the request may name one in region.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeRequest'
      responses:
        '200':
          description: Updated node, or the original response for an identical idempotent replay.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            ETag:
              $ref: '#/components/headers/RevisionETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
