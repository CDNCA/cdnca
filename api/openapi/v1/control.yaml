    $ref: '../../node-monitoring-latest.openapi.yaml#/paths/~1v1~1nodes~1monitoring~1latest'
  /v1/nodes/metrics/latest:
    get:
      operationId: getLatestNodeMetricsBatch
      summary: Get latest durable load samples for a bounded set of platform nodes
      description: >-
        Requires nodes.read in the current platform scope. Supply only node_id,
        repeated once per unique canonical nonzero UUID (1 to 300 identifiers).
        Missing, duplicate, malformed or extra query parameters return 400
        validation_error. Membership and samples are read in one database snapshot.
        Any nonexistent or other-scope node rejects the entire batch with the same
        404 node_metrics_not_found; no partial results or foreign identifiers are
        returned. Existing in-scope nodes without a durable load sample appear in
        not_reported_node_ids. Those identifiers and items.node_id are disjoint and
        together cover the request exactly, with each array preserving request order.
        Each item is the unchanged single-node latest DTO, including unknown values,
        record_kind, original sample time, telemetry and durable delivery identity.
        No sample is fabricated from presence, and host_metric is not a probe-health
        decision. observed_at is the server UTC read time, not the sample time or a
        claim of freshness. Unavailable storage or batch runtime returns 503
        node_metrics_unavailable. This endpoint does not aggregate monthly traffic.
      security:
        - bearerAuth: []
      parameters:
        - name: node_id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 300
            uniqueItems: true
            items:
              type: string
              format: uuid
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
              not: {const: '00000000-0000-0000-0000-000000000000'}
      responses:
        '200':
          description: Complete scoped batch, with absent samples distinguished from measured values.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeMetricsLatestBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
