  /v1/admin/control-upgrade-checks:
    post:
      operationId: checkControlUpgradeEligibility
      summary: Check local control-plane upgrade eligibility
      description: >-
        Requires control.upgrades.check in a platform scope. The decision re-verifies the
        locally cached signed entitlement lease, checks its release channel and version
        range, then evaluates the current locally cached signed platform policy. The
        license service is not called by this request. Business denials return 200 with
        eligible=false and a stable reason; authentication, validation, and idempotency
        failures retain their normal HTTP status. An identical idempotent replay returns
        the original decision without appending another audit event.
      x-required-permissions: [control.upgrades.check]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlUpgradeCheckRequest'
            example:
              component: control-api
              current_version: 1.4.0
              channel: stable
      responses:
        '200':
          description: Eligible or a stable business denial based only on verified local state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlUpgradeCheckResponse'
              example:
                eligible: true
                reason: eligible
                component: control-api
                current_version: 1.4.0
                channel: stable
                entitlement:
                  serial: 12
                  channel: stable
                  min_version: 1.0.0
                  max_version: 2.0.0
                policy:
                  source: installation
                  target_revision_id: 019bf7d2-774d-7b16-b4bb-99d03f1cb90a
                  stale: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
