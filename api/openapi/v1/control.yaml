      description: >-
        Requires nodes.read in a platform scope. effective 是条件匹配（L2 条件的节点国家代码/运营商/省份/城市、
        市场供货分组）实际使用的值；manual_fields 里的字段是管理员修正的，其余来自 resolution（主控 IP 情报库按
        IPv4、IPv6、子 IP 的顺序解析出的第一个结果，新增节点、地址变化、IP 库更新后一分钟内重新解析）。
        resolution 为 null 表示尚未解析；outcome unresolved 为 IP 库里查不到，no_library 为主控尚无 IP 库。
      security:
        - bearerAuth: []
