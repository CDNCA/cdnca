  /v1/package-commerce/catalog:
    get:
      tags: [Tenant package commerce]
      operationId: listPublishedPackageOffers
      summary: List package products purchasable by the authenticated tenant user
      description: >-
        Requires package_subscriptions.read. Only enabled products linked to a
        currently visible package group are returned. The first page freezes the
        authenticated tenant/user scope, business-time snapshot, catalog publish
        watermark, and package-group visibility watermark; later pages reuse the
        endpoint- and principal-bound signed cursor so catalog changes cannot
        produce mixed pages. Purchasing a returned offer separately requires
        package_subscriptions.manage.
      x-required-permissions: [package_subscriptions.read]
      parameters:
        - $ref: '../../control-package-commerce.openapi.yaml#/components/parameters/CatalogKind'
        - $ref: '../../control-package-commerce.openapi.yaml#/components/parameters/CatalogGroupID'
        - $ref: '../../control-package-commerce.openapi.yaml#/components/parameters/Limit'
        - $ref: '../../control-package-commerce.openapi.yaml#/components/parameters/Cursor'
      responses:
        '200': {$ref: '../../control-package-commerce.openapi.yaml#/components/responses/CatalogPageOK'}
        '400': {$ref: '../../control-package-commerce.openapi.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../control-package-commerce.openapi.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../control-package-commerce.openapi.yaml#/components/responses/Forbidden'}
        '408': {$ref: '../../control-package-commerce.openapi.yaml#/components/responses/QueryCancelled'}
        '502': {$ref: '../../control-package-commerce.openapi.yaml#/components/responses/BadGateway'}
        '503': {$ref: '../../control-package-commerce.openapi.yaml#/components/responses/ServiceUnavailable'}
        '504': {$ref: '../../control-package-commerce.openapi.yaml#/components/responses/QueryTimeout'}
