  /v1/nodes:
    post:
      operationId: createNode
      summary: Create a pending platform node
      description: >-
        Requires nodes.manage in a platform scope and a valid local entitlement granting
        nodes.manage plus nodes.count. The quota counts every platform node whose
        admin_state is not retired; disabled nodes still consume quota. Grace, expired,
        unavailable, missing-feature, and missing-quota states reject creation without
        interrupting existing nodes. The Idempotency-Key is scoped to the actor and
        operation. An identical replay returns the original node before evaluating the
        current lease or quota, but never returns or regenerates the one-time enrollment
        token. Reusing the key with different normalized input returns idempotency_conflict.
        platform.admin remains a wildcard RBAC permission but does not bypass entitlement.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: >-
            Node created, or the original result replayed. A requested raw enrollment
            token is shown only on the first successful response; it is absent on replay.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listNodes
      summary: List platform nodes with explicit inventory order and keyset pagination
      description: >-
        Requires nodes.read in a platform scope. Search is always evaluated after scope isolation and matches
        node name or region by case-insensitive literal containment, a full UUID exactly, a canonical display ID
        prefix, or a normalized IPv4/IPv6 address exactly. platform.admin remains a wildcard permission.
        Without order, the existing UUID ascending order and cursor remain unchanged. With management_sort_desc,
        rows use persisted management sort, numeric display ID, then UUID descending; its opaque cursor is
        bound to the authorized scope and filters. Pages are live reads, not a snapshot.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: >-
            Exact admin state filter. Deleting a node removes it, so retired is not accepted here (validation_error);
            a retired row left by a release before physical deletion is listed without a filter and can be deleted.
          schema:
            $ref: '#/components/schemas/NodeAdminState'
        - name: presence
          in: query
          description: Effective presence derived from the confirmed PostgreSQL projection and the offline threshold.
          schema:
            $ref: '#/components/schemas/NodePresenceStatus'
        - name: search
          in: query
          description: Optional literal node search. Surrounding whitespace is ignored; control characters are rejected.
          schema:
            type: string
            maxLength: 128
        - $ref: './node-inventory-order.yaml#/components/parameters/NodeInventoryOrder'
        - $ref: './node-inventory-order.yaml#/components/parameters/NodeInventoryCursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 300
            default: 20
      responses:
        '200':
          description: Node page in the requested order; explicit order is echoed only for the ordered response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NodeListResponse'
                  - $ref: './node-inventory-order.yaml#/components/schemas/NodeInventoryOrderedListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/nodes/batch-admin-state:
    post:
      operationId: batchUpdateNodeAdminState
      summary: Update one administrative state across a batch of nodes
      description: Requires nodes.manage in a platform scope. The request accepts at most 100 unique node IDs and preserves input order in the response. Nodes are locked in UUID order, successful items and their audits commit in one transaction, and validation or state failures are returned per item. Replaying the same idempotency key with the same normalized request returns the stored result without another revision or audit event. admin_state retired is the batch delete; it follows updateNode. Each deletion runs in its own savepoint, so a node in use fails alone with node_in_use (or node_not_found) and the others are still deleted; a deleted item reports status updated with the last node snapshot. Disabling or draining the last online available node of a node-market supply that still has a normal subscriber fails that item with supply_in_use (with online_available and normal_subscriptions); items are checked in UUID order against the ones applied before them.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchNodeAdminStateRequest'
      responses:
        '200':
          description: Ordered per-item results. Successful items are committed even when other items fail validation against current state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchNodeAdminStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
