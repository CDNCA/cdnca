  /v1/security-policies/batch:
    post:
      operationId: batchSecurityPolicies
      summary: Enable, disable or delete selected WAF rule libraries item by item
      x-summary-zh: 逐项启用、停用或删除选中的 WAF 规则库
      x-required-permissions: [security_policies.manage]
      x-description-zh: >-
        需要 security_policies.manage 权限。每一项单独按版本号校验后写入，幂等键按 Idempotency-Key 逐项派生，重试同一批次会重放已写入的项。
        结果按请求顺序逐项返回；版本冲突、系统规则库、不存在、使用中等拒绝都作为该项结果，不中断整批。存储失败时该项为 error，其余为 not_attempted。
        平台（系统）规则库永远不会被修改。
      description: >-
        Requires security_policies.manage. Each item is written
        on its own with a version check (CAS) under an item key derived from
        Idempotency-Key, so retrying the same batch replays written items.
        Results come back in request order, one per item; refusals (version
        conflict, system library, not found, in use, ...) are item results and
        do not stop the batch. A store failure marks that item error and the
        rest not_attempted. System (platform) libraries are never modified.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, items]
              properties:
                action: {type: string, enum: [enable, disable, delete]}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, version]
                    properties:
                      id: {type: string, format: uuid}
                      version: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: One result per item, in request order.
          x-description-zh: 每项一个结果，按请求顺序。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, status]
                      properties:
                        id: {type: string, format: uuid}
                        status:
                          type: string
                          enum: [ok, unchanged, version_conflict, system_protected, not_found, forbidden, in_use,
                                 unsupported_kind, idempotency_conflict, rejected, error, not_attempted]
                        version: {type: integer, format: int64, minimum: 1, description: 'Version after enable/disable.'}
                        replayed: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
