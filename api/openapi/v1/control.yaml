    ControlUpgradeRolloutList:
      type: object
      additionalProperties: false
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ControlUpgradeRolloutSummary' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    ControlUpgradeRolloutDetailResult:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ControlUpgradeRolloutDetail' }
    ControlUpgradeRolloutWriteResult:
      type: object
      additionalProperties: false
      required: [data, replayed]
      properties:
        data: { $ref: '#/components/schemas/ControlUpgradeRolloutDetail' }
        replayed: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        scope_id:
          type: string
          format: uuid
          description: Optional active platform or tenant scope. Platform is preferred when omitted.
        login_challenge:
          type: object
          additionalProperties: false
          required: [challenge_id, otp]
          description: Additional email/SMS proof. Password, current policy, source, contact and code are rechecked when creating the session in the same transaction.
          properties:
            challenge_id: {type: string, format: uuid}
            otp: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        captcha:
          $ref: '#/components/schemas/LoginCaptchaAnswer'
    TenantMember:
      type: object
      additionalProperties: false
      required: [user_id, username, display_name, email, status, role, owner, created_at]
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        email: {type: string, nullable: true}
        status: {type: string, enum: [active, suspended, disabled]}
        role: {type: string}
        owner: {type: boolean}
        created_at: {type: string, format: date-time}
        password_change_required: {type: boolean}
    AdminAccessPolicy:
      type: object
      additionalProperties: false
      required: [revision, enabled, allowlist, updated_at, current_ip]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        enabled: {type: boolean}
        allowlist: {type: array, maxItems: 64, items: {type: string}}
        updated_at: {type: string, format: date-time, nullable: true}
        current_ip: {type: string}
    LoginCaptchaAnswer:
      type: object
      additionalProperties: false
      required: [id, answer]
      description: Solved built-in sign-in CAPTCHA (POST /v1/auth/login-captchas). Case-insensitive.
      properties:
        id: {type: string, format: uuid}
        answer: {type: string, pattern: '^[A-Za-z0-9]{1,8}$', writeOnly: true}
    LoginCaptcha:
      type: object
      additionalProperties: false
      required: [id, image, expires_at]
      properties:
        id: {type: string, format: uuid}
        image: {type: string, description: 'data:image/png;base64 image of the characters'}
        expires_at: {type: string, format: date-time}
    LoginVerificationRequired:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, params]
          properties:
            code: {type: string, const: login_verification_required}
            message: {type: string}
            request_id: {type: string}
            params:
              type: object
              additionalProperties: false
              required: [channel, scope_id]
              properties:
                channel: {type: string, enum: [email, sms]}
                scope_id: {type: string, format: uuid}
    ManagedUserLoginSecurity:
      type: object
      additionalProperties: false
      required: [user_id, tenant_scope_id, revision, login_verification, login_allowlist]
      properties:
        user_id: {type: string, format: uuid}
        tenant_scope_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 0}
        login_verification: {type: string, enum: [none, sms, email]}
        login_allowlist: {$ref: '#/components/schemas/LoginAllowlist'}
    UpdateManagedUserLoginSecurity:
      type: object
      additionalProperties: false
      required: [expected_revision, login_verification, login_allowlist]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        login_verification: {type: string, enum: [none, sms, email]}
        login_allowlist: {$ref: '#/components/schemas/LoginAllowlist'}
    ManagedUserSecondaryVerification:
      type: object
      additionalProperties: false
      required: [user_id, tenant_scope_id, revision, enabled, deadline, expiry_action, requested_at, completed, enforced_at]
      properties:
        user_id: {type: string, format: uuid}
        tenant_scope_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 0}
        enabled: {type: boolean}
        deadline: {oneOf: [{type: string, format: date-time}, {type: 'null'}]}
        expiry_action: {type: string, enum: [none, lock_sites]}
        requested_at: {oneOf: [{type: string, format: date-time}, {type: 'null'}]}
        completed: {type: boolean, description: An approved and settled personal_reverification exists after requested_at.}
        enforced_at: {description: When the deadline action ran., oneOf: [{type: string, format: date-time}, {type: 'null'}]}
    UpdateManagedUserSecondaryVerification:
      type: object
      additionalProperties: false
      required: [expected_revision, enabled, expiry_action]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        enabled: {type: boolean}
        deadline: {oneOf: [{type: string, format: date-time}, {type: 'null'}]}
        expiry_action: {type: string, enum: [none, lock_sites]}
    LoginAllowlist:
      type: array
      maxItems: 32
      description: IPv4/IPv6 addresses or CIDR prefixes (for example 203.0.113.0/24). Ports, zones and empty entries are rejected. The service unmaps IPv4-mapped IPv6, masks prefixes to their network, collapses full-length prefixes to the address, deduplicates and sorts. Empty clears the restriction.
      items: {type: string, minLength: 1, maxLength: 64}
    AuthResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, principal]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 1
        principal:
          $ref: '#/components/schemas/Principal'
        impersonation:
          $ref: '#/components/schemas/ImpersonationMarker'
    Principal:
      type: object
      additionalProperties: false
      required: [user_id, display_id, scope_id, scope_kind, username, display_name, roles, permissions]
      properties:
        user_id:
          type: string
          format: uuid
        display_id:
          type: string
          pattern: '^[1-9][0-9]{0,18}$'
          description: Stable installation-wide account identifier for display and exact authorized lookup; never an authorization boundary.
        scope_id:
          type: string
          format: uuid
        scope_kind:
          type: string
          enum: [platform, tenant]
        tenant_id:
          type: [string, 'null']
          format: uuid
        username:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        password_change_required:
          type: boolean
          description: Present (true) when an administrator requires a new password at this sign-in; session requests other than GET /v1/auth/me and POST /v1/account/password return 403 password_change_required.
        impersonation:
          $ref: '#/components/schemas/ImpersonationMarker'
    ImpersonationMarker:
      type: object
      additionalProperties: false
      required: [grant_id, actor_user_id, actor_display_name, subject_user_id, subject_display_name, tenant_id, expires_at]
      properties:
        grant_id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
        actor_display_name:
          type: string
        subject_user_id:
          type: string
          format: uuid
        subject_display_name:
          type: string
        tenant_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    UserStatus:
      type: string
      enum: [active, disabled]
    UserRole:
      type: string
      enum: [tenant_owner, tenant_viewer]
    ManagedUser:
      type: object
      additionalProperties: false
      required: [id, display_id, scope_id, tenant_id, username, display_name, email, phone, status, role, group_id, group_name, revision, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        display_id:
          type: string
          pattern: '^[1-9][0-9]{0,18}$'
          readOnly: true
        scope_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/UserStatus'
        role:
          $ref: '#/components/schemas/UserRole'
        group_id:
          type: [string, 'null']
          format: uuid
        group_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        metadata:
          $ref: '#/components/schemas/ManagedUserMetadata'
        verification:
          $ref: '#/components/schemas/ManagedUserVerification'
        reseller:
          $ref: '#/components/schemas/ManagedUserReseller'
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ManagedUserReseller:
      type: object
      additionalProperties: false
      readOnly: true
      required: [is_reseller, status, parent_scope_id, parent_name]
      description: Present only when reseller is requested on the administrator user list (ADR 0018). Reseller identity and owning reseller belong to the user's tenant, so every member of a tenant carries the same values. Platform administrators carry is_reseller false and null fields.
      properties:
        is_reseller: {type: boolean, description: The tenant has a reseller profile (active or suspended).}
        status: {type: [string, 'null'], enum: [active, suspended, null], description: Reseller profile status; null when not a reseller.}
        parent_scope_id: {type: [string, 'null'], format: uuid, description: Owning reseller tenant scope; null = platform customer.}
        parent_name: {type: [string, 'null'], description: Owning reseller tenant display name; null when parent_scope_id is null.}
    ManagedUserVerification:
      type: object
      additionalProperties: false
      readOnly: true
      required: [personal_verified, company_verified]
      description: Present only when user_verification is requested on the administrator user list. Flags belong to the returned user and tenant scope, match current approved identity bindings and settled evidence, and do not disclose names, document numbers, fingerprints, materials or provider data. Detail, mutation, self-service and authentication responses never include this projection.
      properties:
        personal_verified: {type: boolean}
        company_verified: {type: boolean}
    ManagedUserRemark:
      type: [string, 'null']
      maxLength: 512
      pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]*$'
      description: Administrator-only remark, trimmed at both ends. Internal tabs and line breaks are preserved; other control characters are rejected. Null or whitespace-only input clears the stored value. Length counts Unicode code points.
    ManagedUserQQ:
      type: [string, 'null']
      maxLength: 32
      pattern: '^[^\x00-\x1F\x7F-\x9F]*$'
      description: Trimmed QQ contact text, preserving leading zeroes. Not a login identifier and not unique. Control characters are rejected; null or whitespace-only input clears the stored value. Length counts Unicode code points.
    ManagedUserMetadata:
      type: object
      additionalProperties: false
      required: [remark, qq]
      description: Returned only with include=user_metadata on administrator user endpoints. Never included in self-service profile or authentication responses. Historical idempotency receipts without this projection omit the entire object.
      properties:
        remark:
          $ref: '#/components/schemas/ManagedUserRemark'
        qq:
          $ref: '#/components/schemas/ManagedUserQQ'
    NodePresenceStatus:
      type: string
      enum: [online, offline, unknown]
    NodeProjectionFreshness:
      type: string
      enum: [fresh, stale, never]
    NodeLeaseSignal:
      type: string
      enum: [present, absent, unavailable]
    NodePresence:
      type: object
      additionalProperties: false
      required: [status, projection_freshness, lease_signal]
      properties:
        status:
          $ref: '#/components/schemas/NodePresenceStatus'
        last_heartbeat_at:
          type: string
          format: date-time
          description: Time of the latest heartbeat confirmed after its Redis lease write.
        agent_version:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._+:-]{0,127}$'
          description: Omitted when a compatible older Agent did not report its version.
        session_epoch:
          type: integer
          format: int64
          minimum: 1
        heartbeat_sequence:
          type: integer
          format: int64
          minimum: 1
        projection_freshness:
          $ref: '#/components/schemas/NodeProjectionFreshness'
        lease_signal:
          $ref: '#/components/schemas/NodeLeaseSignal'
        projected_at:
          type: string
          format: date-time
          description: Time of the confirmed PostgreSQL projection; never exposes an unconfirmed latest heartbeat.
        market_probe_role:
          type: string
          enum: [probe_only, join_market, disabled]
          description: >-
            Market probe role of the latest heartbeat (EdgeRuntimeStatus.market_probe): probe_only probes other
            nodes only, join_market also joins the node market (only these nodes enter an offer's pool), disabled
            is off. Omitted when the Agent did not report it.
        openresty_version:
          type: string
          maxLength: 128
          description: >-
            OpenResty runtime version declared in the capabilities of the confirmed session. A native node
            (/opt/cdnca-node) switches its OpenResty/Lua runtime to the one shipped with its Agent release on
            startup and declares the switched version on the next connection. Omitted when not declared.
        native_runtime_state:
          type: string
          enum: [switched, unchanged, rolled_back]
          description: >-
            Native runtime switch outcome of the latest heartbeat (EdgeRuntimeStatus.native_runtime): switched
            (the runtime of the Agent release became active), unchanged (it already was) or rolled_back (the
            switch failed, the previous runtime stays active). Omitted when the node is not native or did not
            report it.
        native_runtime_release:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Manifest sha256 of the runtime the switch targeted (the active one unless rolled_back).
        native_runtime_previous_release:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Manifest sha256 of the runtime active before the switch (kept after rolled_back).
        native_runtime_error_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
          description: RUNTIME_* code of a rolled_back switch (see ControlUpgradeRolloutStatusReceipt.error_code).
    NodeInventory:
      allOf:
        - $ref: '#/components/schemas/Node'
        - type: object
          required: [presence]
          properties:
            presence:
              $ref: '#/components/schemas/NodePresence'
            network_inventory:
              $ref: '#/components/schemas/NodeNetworkInventoryStatus'
    NodeNetworkInventoryStatus:
      type: object
      additionalProperties: false
      required: [schema_version, ipv4_state, ipv6_state]
      description: Automatic default-egress address discovery. Verified means the same-family mTLS transport peer matched; it does not prove inbound service reachability. Older servers may omit this object.
      properties:
        schema_version:
          type: integer
          enum: [1]
        ipv4_state:
          $ref: '#/components/schemas/NodeNetworkInventoryState'
        ipv6_state:
          $ref: '#/components/schemas/NodeNetworkInventoryState'
        received_at:
          type: string
          format: date-time
    NodeNetworkInventoryState:
      type: string
      enum: [not_reported, verified, address_conflict, peer_mismatch, no_default_route, no_global_address, ambiguous_route, unavailable]
    AccountProfile:
