        server_name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[^ /\\]+$'
        listen_address:
          type: string
          minLength: 3
          maxLength: 320
          description: Gateway-only host:port listener address; never sent as the Agent active endpoint.
    NodeGatewayPortTransitionState:
      type: string
