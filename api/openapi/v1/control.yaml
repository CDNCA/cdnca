  /v1/nodes/installation-tickets:
    get:
      operationId: getNodeInstallationTickets
      summary: Get each node's last license service ticket and the days left
      description: >-
        PF09 (ADR 0014). Requires nodes.read in the current platform scope. Supply only
        node_id, repeated once per unique canonical nonzero UUID (1 to 300). Each item
        is the ServiceTicket the node reported in its last installation ban receipt:
        valid (with days_left rounded down), expired (the node stopped serving),
        no_ticket (the node never received its first ticket and does not serve yet)
        or unknown (no receipt: the node has not connected since, or an old Agent).
        A node of another scope reads as unknown. Items preserve request order.
      security:
        - bearerAuth: []
      parameters:
        - name: node_id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 300
            uniqueItems: true
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: One ticket view per requested node.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeInstallationTickets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
