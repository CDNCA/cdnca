    post:
      operationId: createURLAuthPolicy
      summary: Create a site-bound HMAC-SHA256 URL authentication policy
      description: >-
        Requires url_auth_policies.manage. The generated key secret is returned exactly once on the first successful
        request. An identical idempotent replay returns the same policy with replayed=true and no secret. Third-party panel Type A,
        Type B, and MD5 are migration provenance only and cannot be selected for new execution. This endpoint records a
        deterministic edge-compatible snapshot but does not publish it to Gateway or an edge node.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateURLAuthPolicyRequest'}
      responses:
        '201':
          description: Policy, revision-one snapshot, and first-response-only key secret.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/URLAuthSecretWriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
