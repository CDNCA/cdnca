    CreateNodeGatewayPortTransitionRequest:
      type: object
      additionalProperties: false
      required: [expected_node_revision, old_endpoint, new_endpoint, compatibility_deadline, rollback_deadline]
      properties:
        expected_node_revision: {type: integer, format: int64, minimum: 1}
        old_endpoint:
          $ref: '#/components/schemas/NodeGatewayEndpoint'
        new_endpoint:
          $ref: '#/components/schemas/NodeGatewayEndpoint'
        compatibility_deadline: {type: string, format: date-time}
        rollback_deadline: {type: string, format: date-time}
    NodeGatewayPortTransition:
      type: object
      additionalProperties: false
      required:
        - id
        - scope_id
        - node_id
        - revision
        - expected_node_revision
        - old_endpoint
        - new_endpoint
        - compatibility_deadline
        - rollback_deadline
        - state
        - status_revision
        - active_endpoint
        - error_code
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        scope_id: {type: string, format: uuid}
        node_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        expected_node_revision: {type: integer, format: int64, minimum: 1}
        old_endpoint:
          $ref: '#/components/schemas/NodeGatewayEndpoint'
        new_endpoint:
          $ref: '#/components/schemas/NodeGatewayEndpoint'
        compatibility_deadline: {type: string, format: date-time}
        rollback_deadline: {type: string, format: date-time}
        state:
          $ref: '#/components/schemas/NodeGatewayPortTransitionState'
        status_revision: {type: integer, format: int64, minimum: 0}
        active_endpoint:
          $ref: '#/components/schemas/NodeGatewayEndpoint'
        error_code: {type: string, maxLength: 64, pattern: '^[a-z0-9_]*$'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateNodeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        region:
          type: string
          maxLength: 64
        ipv4:
          type: string
          format: ipv4
        ipv6:
          type: string
          format: ipv6
        issue_enrollment_token:
          type: boolean
          default: false
        enrollment_purpose:
          $ref: '#/components/schemas/EnrollmentPurpose'
        enrollment_token_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
