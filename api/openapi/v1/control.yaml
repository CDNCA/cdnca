        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: domain, in: query, description: Case-insensitive domain substring., schema: {type: string, maxLength: 253}}
      responses:
        '200':
          description: One page of the customer's sites.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page, limit, total]
