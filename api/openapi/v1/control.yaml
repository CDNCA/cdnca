      description: analytics_storage_unavailable; no zero-value data is substituted.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/AnalyticsErrorEnvelope'}}}
    AnalyticsGatewayTimeout:
