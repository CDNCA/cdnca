        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/nodes/{id}/enrollment-tokens:
    post:
      operationId: issueNodeEnrollmentToken
      summary: Issue a one-time enrollment token
      description: Requires nodes.manage in a platform scope. platform.admin remains a wildcard permission. The raw token is shown only in this response.
      security:
