        - $ref: '#/components/parameters/ManagedUserInclude'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdentityRequestID'
        - $ref: '#/components/parameters/IdentityTraceparent'
      requestBody:
        required: true
