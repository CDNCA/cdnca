  /v1/nodes/{id}/gateway-port-transitions/{transition_id}/finalize:
    post:
      operationId: finalizeNodeGatewayPortTransition
      summary: Finalize a switched Agent Gateway communication port
      description: Requires nodes.manage in a platform scope. Finalization is accepted only after the durable switched state and before the rollback deadline. Reuse both X-Request-ID and Idempotency-Key for an exact retry. A missing, disabled or unavailable command runtime returns 503 node_port_transition_runtime_unavailable without queueing an action. A 202 response confirms acceptance, not listener retirement or completed execution.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeID'
        - $ref: '#/components/parameters/NodeGatewayPortTransitionID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/NodeGatewayPortTransitionRequestID'
      responses:
        '202':
          description: A durable finalize command was accepted, or the original action was replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeGatewayPortTransition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/nodes/{id}/gateway-port-transitions/{transition_id}/rollback:
    post:
      operationId: rollbackNodeGatewayPortTransition
      summary: Roll back an Agent Gateway communication-port transition
      description: Requires nodes.manage in a platform scope. Rollback is accepted only while the previous listener remains inside its versioned rollback window. Reuse both X-Request-ID and Idempotency-Key for an exact retry. A missing, disabled or unavailable command runtime returns 503 node_port_transition_runtime_unavailable without queueing an action. A 202 response confirms acceptance, not completed rollback.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeID'
        - $ref: '#/components/parameters/NodeGatewayPortTransitionID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/NodeGatewayPortTransitionRequestID'
      responses:
        '202':
          description: A durable rollback command was accepted, or the original action was replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeGatewayPortTransition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
