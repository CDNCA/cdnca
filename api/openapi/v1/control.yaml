          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users/{id}/login-security:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - name: tenant_scope_id
        in: query
        required: true
        description: Exact tenant membership scope. Duplicate or unknown query parameters are rejected.
        schema: {type: string, format: uuid}
    get:
      operationId: getManagedUserLoginSecurity
      summary: Read the selected tenant user's login security policy
      description: Requires an active primary platform bearer session and identity.users.manage. API keys and impersonation sessions are rejected. A missing policy returns revision 0, none, and an empty allowlist.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Independent policy, without user profile or contact information.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserLoginSecurity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    put:
      operationId: updateManagedUserLoginSecurity
      summary: Replace a tenant user's login security policy
      description: >-
        Same primary-session authorization as GET. The policy uses its own revision,
        receipt and audit; it does not change users.revision or existing user-write receipts.
        All fields are required. Empty allowlist disables the source restriction; none disables
        the additional login code. Email/SMS require a bound contact and a configured enabled
        channel. Source restrictions apply to new password and code logins, not existing sessions,
        refresh or API keys. Once a policy is enabled, rolling back to a binary without the login
        gate is unsafe. The service never silently clears a policy to permit rollback.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdentityRequestID'
        - $ref: '#/components/parameters/IdentityTraceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateManagedUserLoginSecurity'}
      responses:
        '200':
          description: Saved policy or exact original receipt on replay. Clearing retains and increments its revision.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserLoginSecurity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: login_security_contact_required; the selected channel has no bound contact.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/admin/users/{id}/secondary-verification:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - name: tenant_scope_id
        in: query
        required: true
        description: Exact tenant membership scope. Duplicate or unknown query parameters are rejected.
        schema: {type: string, format: uuid}
    get:
      operationId: getManagedUserSecondaryVerification
      summary: Read the selected tenant user's secondary identity verification request
      description: Same primary-session authorization as login-security. A missing request returns revision 0, disabled, expiry_action none.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Request with derived completion state.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserSecondaryVerification'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    put:
      operationId: updateManagedUserSecondaryVerification
      summary: Replace a tenant user's secondary identity verification request
      description: >-
        Own revision, receipt and audit; users.revision is unchanged. Switching it on records
        requested_at and enqueues the identity.secondary_verification email/SMS notice in the same
        transaction; editing an active request does not notify again. The user completes it with an
        approved personal_reverification created after requested_at. expiry_action lock_sites requires
        a deadline; when the deadline passes without completion the control plane stops the user's
        sites (disables and locks them, then republishes so the nodes stop serving them). Once the
        reverification is approved, or the request is switched off or its deadline moved into the
        future, exactly the changes it made are undone and the scope is republished; sites stopped or
        locked for other reasons are left as they are. Disabling requires deadline null and expiry_action none.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdentityRequestID'
        - $ref: '#/components/parameters/IdentityTraceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateManagedUserSecondaryVerification'}
      responses:
        '200':
          description: Saved request or exact original receipt on replay.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUserSecondaryVerification'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
