        node:
          $ref: '#/components/schemas/Node'
        enrollment_token:
          $ref: '#/components/schemas/IssuedEnrollmentToken'
    IssueEnrollmentTokenRequest:
      type: object
      additionalProperties: false
      properties:
        purpose:
          $ref: '#/components/schemas/EnrollmentPurpose'
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 600
    NodeRegistrationCredential:
      type: object
      additionalProperties: false
      required: [key_id, credential, issued_at]
      properties:
        key_id:
          type: string
          format: uuid
        credential:
          type: string
          pattern: '^nrk1\.[0-9a-f]{32}\.[A-Za-z0-9_-]{43}$'
        issued_at:
          type: string
          format: date-time
    NodeRegistrationRequest:
      type: object
      additionalProperties: false
      required: [credential, machine_fingerprint]
      properties:
        credential:
          type: string
          maxLength: 128
        machine_fingerprint:
          description: Lowercase hex SHA-256 of "cdnca-node-registration-v1" NUL machine-id NUL DMI product_uuid (empty when unreadable).
          type: string
          pattern: '^[0-9a-f]{64}$'
        hostname:
          type: string
          maxLength: 128
        os_name:
          type: string
          maxLength: 128
        kernel_version:
          type: string
          maxLength: 128
        architecture:
          type: string
          maxLength: 128
    NodeRegistrationIdentityRequest:
      type: object
      additionalProperties: false
      required: [credential, machine_fingerprint, csr_sha256]
      properties:
        credential:
          type: string
          maxLength: 128
        machine_fingerprint:
          description: The registration fingerprint sent to POST /v1/node-registrations.
          type: string
          pattern: '^[0-9a-f]{64}$'
        csr_sha256:
          description: Lowercase hex SHA-256 of the CSR DER in the Agent's pending enrollment state (edge-agent enroll --print-pending-csr-sha256).
          type: string
          pattern: '^[0-9a-f]{64}$'
    NodeRegistrationIdentity:
      description: agent.v1.EnrollResponse in JSON (proto field names).
      type: object
      additionalProperties: false
      required: [node_id, selected_protocol_version, certificate, artifact_encryption_key_id]
      properties:
        node_id:
          type: string
          format: uuid
        selected_protocol_version:
          type: object
          additionalProperties: false
          required: [major, minor]
          properties:
            major:
              type: integer
              minimum: 0
            minor:
              type: integer
              minimum: 0
        artifact_encryption_key_id:
          type: string
        certificate:
          type: object
          additionalProperties: false
          required: [leaf_certificate_pem, issuing_chain_pem, serial_number, not_before_time, expiration_time, renewal_time]
          properties:
            leaf_certificate_pem:
              description: Base64 of the leaf certificate PEM.
              type: string
              format: byte
            issuing_chain_pem:
              description: Base64 of each issuing certificate PEM, issuer first.
              type: array
              items:
                type: string
                format: byte
            serial_number:
              type: string
            not_before_time:
              type: string
              format: date-time
            expiration_time:
              type: string
              format: date-time
            renewal_time:
              type: string
              format: date-time
    NodeRegistrationResult:
      type: object
      additionalProperties: false
      required: [node, enrollment_token, reused]
      properties:
        node:
          $ref: '#/components/schemas/Node'
        enrollment_token:
          $ref: '#/components/schemas/IssuedEnrollmentToken'
        reused:
          type: boolean
    IssuedEnrollmentToken:
      type: object
      additionalProperties: false
      required: [id, node_id, purpose, created_at, expires_at, token]
      properties:
        id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/EnrollmentPurpose'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        token:
          type: string
          description: One-time secret shown only in this response.
          minLength: 43
          maxLength: 43
    NodeListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeInventory'
        next_cursor:
          type: string
          format: uuid
    NodeInstallationTickets:
      type: object
      additionalProperties: false
      required: [observed_at, items]
      properties:
        observed_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [node_id, state, issued_at, not_after, days_left, reported_at]
            properties:
              node_id:
                type: string
                format: uuid
              state:
                type: string
                enum: [valid, expired, no_ticket, unknown]
              node_status:
                type: string
                enum: [serving, banned, service_ticket_expired, no_ticket]
              issued_at:
                type: [string, 'null']
                format: date-time
              not_after:
                type: [string, 'null']
                format: date-time
              days_left:
                type: [integer, 'null']
                minimum: 0
              reported_at:
                type: [string, 'null']
                format: date-time
              delivery:
                type: object
                additionalProperties: false
                description: Present while the node's latest answered installation ban revision is not applied. retryable
                  refusals (the node could not persist or enforce it) are sent again at next_retry_at with a doubling
                  backoff capped at 30 minutes; permanent refusals (the documents themselves) wait for a new revision.
                required: [revision, applied_revision, failure_class, reason, failed_attempts, next_retry_at]
                properties:
                  revision:
                    type: integer
                    minimum: 1
                  applied_revision:
                    type: integer
                    minimum: 0
                  failure_class:
                    type: string
                    enum: [retryable, permanent]
                  reason:
                    type: string
                    maxLength: 256
                  failed_attempts:
                    type: integer
                    minimum: 1
                  next_retry_at:
                    type: [string, 'null']
                    format: date-time
    NodeMetricsLatestBatch:
      type: object
      additionalProperties: false
      required: [observed_at, items, not_reported_node_ids]
      properties:
        observed_at:
          type: string
          format: date-time
          description: Server UTC time after reading the batch; per-item observed_at remains the original Agent sample time.
        items:
          type: array
          maxItems: 300
          items:
            $ref: '#/components/schemas/NodeMetricsLatest'
        not_reported_node_ids:
          type: array
          maxItems: 300
          uniqueItems: true
          description: Requested in-scope nodes with no durable load sample; never zero-valued placeholder samples.
          items: {type: string, format: uuid}
    NodeMetricsLatest:
      type: object
      additionalProperties: false
      description: >-
        Latest durable node load sample. record_kind=host_metric means host counters
        collected independently of any service-probe policy. In that case both
        config revisions, probe port and probe counters are zero, probe booleans
        are false placeholders (not a health decision), and known is true.
        Missing record_kind on older responses means metric. A prior recovery
        receipt is historical evidence, not the current host sample's health.
      required:
        - node_id
        - node_name
        - config_revision
        - active_config_revision
        - publication_sequence
        - observed_at
        - probe_port
        - healthy
        - probe_succeeded
        - consecutive_failures
        - consecutive_successes
        - probes_total
        - probe_failures_total
        - recovered
        - recovery_notified
        - rolled_back
        - known
        - cpu_percent
        - memory_used_bytes
        - memory_total_bytes
        - active_connections
        - rx_bandwidth_bps
        - tx_bandwidth_bps
        - total_rx_bytes
        - total_tx_bytes
        - puback_stream
        - puback_sequence
        - consumer_durable
        - consumer_sequence
        - ingested_at
      properties:
        record_kind: {type: string, enum: [metric, host_metric]}
        telemetry_detail:
          type: boolean
          description: >-
            节点最近一次会话声明 NODE_TELEMETRY_DETAIL v1（能力号 69，fz-x11）：遥测带 mounts 与
            port_group_overrides。false 时控制台显示“节点版本未上报”。
        storage_supported:
          type: boolean
          description: >-
            节点最近一次会话声明 NODE_STORAGE v1（能力号 71）：可在编辑节点 → 节点设置修改缓存目录、
            缓存上限与日志目录。false 时这三项只读（409 node_storage_unsupported）。
        node_id: {type: string, format: uuid}
        node_name: {type: string, minLength: 1, maxLength: 128}
        config_revision: {type: integer, format: int64, minimum: 0}
        active_config_revision: {type: integer, format: int64, minimum: 0}
        publication_sequence: {type: integer, format: int64, minimum: 1}
        observed_at: {type: string, format: date-time}
        probe_port: {type: integer, minimum: 0, maximum: 65535}
        healthy: {type: boolean}
        probe_succeeded: {type: boolean}
        consecutive_failures: {type: integer, minimum: 0, maximum: 20}
        consecutive_successes: {type: integer, minimum: 0, maximum: 20}
        probes_total: {type: integer, format: int64, minimum: 0}
        probe_failures_total: {type: integer, format: int64, minimum: 0}
        recovered: {type: boolean}
        recovery_notified: {type: boolean}
        rolled_back: {type: boolean}
        known:
          type: boolean
          description: False for reports from Agents that do not carry NodeLoadMetricsV1.
        cpu_percent: {type: [number, 'null'], format: double, minimum: 0, maximum: 100}
        memory_used_bytes: {type: [integer, 'null'], format: int64, minimum: 0}
        memory_total_bytes: {type: [integer, 'null'], format: int64, minimum: 1}
        active_connections: {type: [integer, 'null'], format: int64, minimum: 0}
        rx_bandwidth_bps: {type: [integer, 'null'], format: int64, minimum: 0}
        tx_bandwidth_bps: {type: [integer, 'null'], format: int64, minimum: 0}
        total_rx_bytes: {type: [integer, 'null'], format: int64, minimum: 0}
        total_tx_bytes: {type: [integer, 'null'], format: int64, minimum: 0}
        telemetry:
          $ref: '#/components/schemas/NodeTelemetry'
        latest_recovery:
          type: object
          additionalProperties: false
          required: [config_revision, publication_sequence, recovered_at, reason_code, puback_stream, puback_sequence]
          properties:
            config_revision: {type: integer, format: int64, minimum: 1}
            publication_sequence: {type: integer, format: int64, minimum: 1}
            recovered_at: {type: string, format: date-time}
            reason_code: {type: string, const: probe_recovered}
            puback_stream: {type: string, const: NODE_MONITORING_STATUS}
            puback_sequence: {type: integer, format: int64, minimum: 1}
        puback_stream:
          type: string
          const: NODE_MONITORING_STATUS
        puback_sequence:
          type: integer
          format: int64
          minimum: 1
          description: JetStream stream sequence returned to the Gateway in the publication acknowledgement.
        consumer_durable:
          type: string
          const: control_api_node_metrics
        consumer_sequence: {type: integer, format: int64, minimum: 1}
        ingested_at: {type: string, format: date-time}
    NodeTelemetry:
      type: object
      additionalProperties: false
      required: [schema_version, total_rx_bytes, total_tx_bytes]
      properties:
        schema_version: {type: integer, const: 1}
        network_selection:
          type: object
          additionalProperties: false
          required: [source, interfaces]
          description: >-
            Optional per-sample monitoring recommendation. Absent on older Agents.
            Does not change listener bindings or host routes. default_route selects
            the lowest-metric usable main-table defaults per IP family, preserving
            ECMP and distinct IPv4/IPv6 devices. Custom routing rules, missing
            iproute2, timeout, absent defaults or ambiguous data yield unavailable.
            Raw network_interfaces and aggregate counters are always preserved.
          properties:
            source: {type: string, enum: [default_route, unavailable]}
            interfaces:
              type: array
              maxItems: 128
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 128}
          allOf:
            - if: {properties: {source: {const: default_route}}}
              then: {properties: {interfaces: {minItems: 1}}}
              else: {properties: {interfaces: {maxItems: 0}}}
        total_rx_bytes: {type: integer, format: int64, minimum: 0}
        total_tx_bytes: {type: integer, format: int64, minimum: 0}
        ddos_drops:
          type: array
          maxItems: 7
          description: >-
            节点 DDoS 表各包过滤器自开启以来累计丢弃（节点计数器，单调递增；节点重启或过滤器关后再开时归零）。
            按 kind 升序、唯一；只含已开启的过滤器。未装 DDoS 表的节点与旧 Agent 不带。
          items:
            type: object
            additionalProperties: false
            required: [kind, packets, bytes]
            properties:
              kind: {type: string, enum: [ct_invalid, tcp_all, tcp_fin, tcp_null, tcp_syn_fin, tcp_syn_rst, tcp_xmas]}
              packets: {type: integer, format: int64, minimum: 0}
              bytes: {type: integer, format: int64, minimum: 0}
        site_drop:
          type: object
          additionalProperties: false
          required: [site_ids, packets, bytes]
          description: >-
            攻击自动升级 D 级站点丢弃（XDP 站点计数 + nftables site_drop）自上一个样本以来的增量。节点计数器不分站点：
            packets/bytes 是节点总量，由 site_ids（本区间内丢弃过的 D 级站点）共享。区间内没有丢弃站点的节点与旧 Agent 不带。
          properties:
            site_ids:
              type: array
              minItems: 1
              maxItems: 256
              uniqueItems: true
              items: {type: string, format: uuid}
            packets: {type: integer, format: int64, minimum: 0}
            bytes: {type: integer, format: int64, minimum: 0}
        network_interfaces:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [name, rx_bytes, tx_bytes, rx_bandwidth_bps, tx_bandwidth_bps]
            properties:
              name: {type: string, minLength: 1, maxLength: 128}
              rx_bytes: {type: integer, format: int64, minimum: 0}
              tx_bytes: {type: integer, format: int64, minimum: 0}
              rx_bandwidth_bps: {type: integer, format: int64, minimum: 0}
              tx_bandwidth_bps: {type: integer, format: int64, minimum: 0}
        system_load:
          type: object
          additionalProperties: false
          required: [one_minute, five_minutes, fifteen_minutes, running_processes, total_processes]
          properties:
            one_minute: {type: number, minimum: 0, maximum: 1000000000}
            five_minutes: {type: number, minimum: 0, maximum: 1000000000}
            fifteen_minutes: {type: number, minimum: 0, maximum: 1000000000}
            running_processes: {type: integer, minimum: 0}
            total_processes: {type: integer, minimum: 1}
        disks:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [path, total_bytes, used_bytes, total_inodes, used_inodes, space_percent, inode_percent]
            properties:
              path: {type: string, minLength: 1, maxLength: 4096}
              total_bytes: {type: integer, format: int64, minimum: 0}
              used_bytes: {type: integer, format: int64, minimum: 0}
              total_inodes: {type: integer, format: int64, minimum: 0}
              used_inodes: {type: integer, format: int64, minimum: 0}
              space_percent: {type: number, minimum: 0, maximum: 100}
              inode_percent: {type: number, minimum: 0, maximum: 100}
        mounts:
          type: array
          maxItems: 256
          description: >-
            节点全部挂载（NODE_TELEMETRY_DETAIL v1），按 path 升序、唯一。filter_reason 为空表示该挂载在 disks（硬盘排行）里；
            否则说明被过滤的原因：system_path（/proc /sys /dev /run）、squashfs、read_only、bind_duplicate（同设备已有排行行）、
            stat_failed（statfs 失败）。旧 Agent 不带。
          items:
            type: object
            additionalProperties: false
            required: [path, device, fstype, read_only, bind]
            properties:
              path: {type: string, minLength: 1, maxLength: 4096}
              device: {type: string, pattern: '^[0-9]{1,10}:[0-9]{1,10}$', description: major:minor}
              fstype: {type: string, maxLength: 64}
              read_only: {type: boolean}
              bind: {type: boolean, description: 子树 bind 挂载，或同设备非首选的另一挂载}
              filter_reason: {type: string, enum: [bind_duplicate, read_only, squashfs, stat_failed, system_path]}
        port_group_overrides:
          type: array
          maxItems: 256
          description: >-
            四层自动防御各端口组覆盖此刻在节点上是否生效（NODE_TELEMETRY_DETAIL v1），按 port_group_id 升序、唯一。
            applied 已写入节点 DDoS 表；standby 生效但当前无收紧；inactive 不生效（reason 说明）；failed 最近一次写表失败。
            旧 Agent 与无四层引擎的节点不带。
          items:
            type: object
            additionalProperties: false
            required: [port_group_id, state]
            properties:
              port_group_id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
              state: {type: string, enum: [applied, failed, inactive, standby]}
              reason: {type: string, enum: [auto_mitigation_off, manual, shared_ports, suggest]}
        storage:
          type: object
          additionalProperties: false
          description: >-
            节点此刻生效的缓存目录、缓存上限与日志目录（NODE_STORAGE v1，能力号 71）。
            state：applied 节点设置已生效；default 未设置，用节点默认；failed 最近一次节点设置被节点拒绝（reason 说明，
            旧设置继续运行）；restart_pending 日志目录待 Agent 下次启动生效（requested_log_directory）。旧 Agent 不带。
          required: [cache_directory, cache_max_bytes, log_directory, state]
          properties:
            cache_directory: {type: string, maxLength: 4096}
            cache_max_bytes: {type: integer, format: int64, minimum: 0}
            log_directory: {type: string, maxLength: 4096}
            state: {type: string, enum: [applied, default, failed, restart_pending]}
            reason: {type: string, maxLength: 512}
            requested_log_directory: {type: string, maxLength: 256}
    UpdateNodeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        region:
          type: string
          maxLength: 64
        ipv4:
          description: An IPv4 address, or an empty string to clear the address.
          oneOf:
            - type: string
              format: ipv4
            - type: string
              maxLength: 0
        ipv6:
          description: An IPv6 address, or an empty string to clear the address.
          oneOf:
            - type: string
              format: ipv6
            - type: string
              maxLength: 0
        admin_state:
          $ref: '#/components/schemas/ManagedNodeAdminState'
        management_settings:
          $ref: '#/components/schemas/NodeManagementSettings'
    BatchNodeAdminStateItem:
      type: object
      additionalProperties: false
      required: [id, expected_revision]
      properties:
        id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          format: int64
          minimum: 1
    BatchNodeAdminStateRequest:
      type: object
      additionalProperties: false
      required: [admin_state, items]
      properties:
        admin_state:
          $ref: '#/components/schemas/ManagedNodeAdminState'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BatchNodeAdminStateItem'
    BatchNodeAdminStateItemError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [node_not_found, version_conflict, node_state_transition_denied, node_identity_required, node_ip_conflict, node_retired, node_in_use, node_address_in_use, supply_in_use]
        online_available:
          type: integer
          minimum: 0
          description: supply_in_use only. Online available nodes of the market supply after the change (0).
        normal_subscriptions:
          type: integer
          minimum: 1
          description: supply_in_use only. Normal (not unpaid-, ticket-stopped or cancelled) subscriptions of the market supply.
    BatchNodeAdminStateItemResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [updated, failed]
        node:
          $ref: '#/components/schemas/Node'
        error:
          $ref: '#/components/schemas/BatchNodeAdminStateItemError'
    BatchNodeAdminStateResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchNodeAdminStateItemResult'
    StreamProtocol:
      type: string
      enum: [tcp, udp]
    StreamFields:
      type: object
      required:
        - package_subscription_id
        - site_id
        - name
        - protocol
        - listen_address
        - listen_port
        - upstream_port
        - connect_timeout_ms
        - response_timeout_ms
        - max_connections_per_client
        - proxy_protocol_inbound
        - proxy_protocol_v1
        - enabled
      oneOf:
        - required: [upstream_address]
          properties:
            upstream_address: {type: string, minLength: 1}
            upstream_host: {type: string, maxLength: 0}
        - required: [upstream_host, dns_policy]
          properties:
            upstream_address: {type: string, maxLength: 0}
            upstream_host: {type: string, minLength: 1}
      properties:
        package_subscription_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        remark: {type: string, maxLength: 256}
        protocol: {$ref: '#/components/schemas/StreamProtocol'}
        listen_address:
          type: string
          const: '*'
          description: Current edge runtime binds both IPv4 and IPv6 wildcard listeners.
        listen_port: {type: integer, minimum: 1, maximum: 65535}
        upstream_address:
          type: string
          oneOf:
            - {format: ipv4}
            - {format: ipv6}
        upstream_host:
          type: string
          maxLength: 253
          description: Canonicalized with IDNA Lookup processing before an immutable runtime intent is created.
        upstream_port: {type: integer, minimum: 1, maximum: 65535}
        dns_policy: {$ref: '#/components/schemas/StreamDNSPolicy'}
        geo_policy: {$ref: '#/components/schemas/StreamGeoPolicy'}
        connect_timeout_ms: {type: integer, minimum: 50, maximum: 30000}
        response_timeout_ms: {type: integer, minimum: 100, maximum: 600000}
        max_connections_per_client: {type: integer, minimum: 1, maximum: 10000}
        proxy_protocol_inbound:
          type: boolean
          description: Required exactly when an enabled geo policy uses trusted proxy CIDRs.
        proxy_protocol_v1:
          type: boolean
          description: Valid only for TCP; UDP requests with this flag are rejected.
        enabled: {type: boolean}
    StreamDNSPolicy:
      type: object
      additionalProperties: false
      required: [positive_min_ttl_seconds, positive_max_ttl_seconds, negative_ttl_seconds, stale_if_error_seconds, allow_private_addresses]
      properties:
        positive_min_ttl_seconds: {type: integer, minimum: 1, maximum: 300}
        positive_max_ttl_seconds: {type: integer, minimum: 1, maximum: 86400}
        negative_ttl_seconds: {type: integer, minimum: 1, maximum: 3600}
        stale_if_error_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Must be greater than or equal to positive_max_ttl_seconds.
        allow_private_addresses:
          type: boolean
          const: false
          description: Domain upstream rebinding to private or otherwise non-routable addresses is rejected fail closed.
    StreamGeoRegionCIDRs:
      type: object
      additionalProperties: false
      required: [region, cidrs]
      properties:
        region: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
        cidrs:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: {type: string}
    StreamGeoPolicy:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean, default: false}
        unknown_region_action: {type: string, enum: [allow, block], default: allow}
        trusted_proxy_cidrs:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string}
        blocked_regions:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
        region_cidrs:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/StreamGeoRegionCIDRs'}
    CreateStreamRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/StreamFields'
        - type: object
          properties:
            target_scope_id:
              type: string
              format: uuid
              description: Required for a platform administrator and ignored only when omitted by a tenant identity.
            owner_id:
              type: string
              format: uuid
              description: Required for a platform administrator and fixed to the current user for a tenant identity.
    UpdateStreamRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/StreamFields'
        - type: object
