      description: Requires security_policies.read. Tenant identities see only their active scope and never receive owner metadata; platform identities may filter across tenant owners.
      x-description-zh: >-
        需要 security_policies.read 权限。租户身份只看到当前作用域内的策略，响应里没有 owner 信息；
        owner 参数只对平台身份生效，可跨租户筛选。
      x-required-permissions: [security_policies.read]
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      parameters:
        - {name: page, in: query, x-description-zh: 页码，从 1 开始, schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}}
        - {name: limit, in: query, x-description-zh: 每页条数，1–100, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: kind, in: query, description: 'Policy kind; omit for all kinds.', x-description-zh: 策略类型；不传表示全部类型, schema: {$ref: '#/components/schemas/SecurityPolicyKind'}}
        - {name: status, in: query, x-description-zh: 按启用状态筛选, schema: {type: string, enum: [enabled, disabled]}}
        - {name: name, in: query, x-description-zh: 按名称筛选, schema: {type: string, maxLength: 128}}
        - {name: id, in: query, description: 'Exact canonical security policy UUID filter.', x-description-zh: 按策略 UUID 精确筛选, schema: {type: string, format: uuid}}
        - {name: owner, in: query, description: 'Platform-only owner name, username, or exact UUID filter.', x-description-zh: 只对平台身份生效：按所属用户的名称、用户名或 UUID 筛选, schema: {type: string, maxLength: 128}}
        - name: scope
          in: query
          description: >-
            WAF rule libraries only: requires kind=waf (400 otherwise). system:
            subscribed platform rule library copies; site: own libraries bound to
            a site; global: own libraries no site is bound to. Total and counts
            follow the filter.
          x-description-zh: >-
            只用于 WAF 规则库，必须同时传 kind=waf，否则返回 400。system：订阅的平台规则库副本；
            site：已绑定到站点的自有规则库；global：没有绑定任何站点的自有规则库。总数与统计按该筛选计算。
          schema: {type: string, enum: [global, site, system]}
      responses:
        '200':
          description: Stable page ordered newest first.
          x-description-zh: 按创建时间从新到旧的稳定分页结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityPolicyList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createSecurityPolicy
      summary: Create a versioned WAF, CC or ACL policy
      x-summary-zh: 创建带版本的 WAF 规则库、CC 或访问控制策略
      x-required-permissions: [security_policies.manage]
      x-description-zh: >-
        需要 security_policies.manage 权限。平台身份必须提供有效租户的 target_scope_id 与 owner_id；租户身份固定为当前作用域和身份。
        规则 ID 由服务端生成，同一幂等请求重放返回原 ID。创建只保存配置，不代表已发布到节点或已生效。
      description: >-
        Requires security_policies.manage. Platform identities must provide an active tenant target_scope_id and owner_id;
        tenant identities are fixed to their current scope and identity. Rule IDs are server-generated and identical
        idempotent replay returns the original IDs. This control-plane slice does not claim edge publication or enforcement.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSecurityPolicyRequest'}
