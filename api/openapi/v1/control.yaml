      x-required-permissions: [security_policies.read]
      x-description-zh: 需要 security_policies.read 权限，并用 If-Match 指定准确版本。同一规则内的条件取“且”；规则按优先级升序、再按 UUID 排序。continue 保留当前判定继续评估，stop 返回最终判定，没有规则命中时才用策略默认动作。预览不发布配置，也不代表节点已生效。
      description: >-
        Requires security_policies.read and an exact If-Match version. Conditions within a rule are ANDed; rules are
        ordered by ascending priority and UUID. continue preserves the current decision while evaluation continues,
        stop returns the terminal decision, and the policy default applies only when no rule matches. Preview does not
