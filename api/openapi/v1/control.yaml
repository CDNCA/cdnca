  /v1/nodes/{id}/gateway-port-transitions/{transition_id}:
    get:
      operationId: getNodeGatewayPortTransition
      summary: Get the durable communication-port transition state
      description: Requires nodes.read in a platform scope. State is advanced only by status events bound to the node certificate and JetStream PubAck identity.
      security:
