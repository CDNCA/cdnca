        '200':
          description: Revoked key metadata.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIKey'}
        '400': {$ref: '#/components/responses/APIKeyBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/dns/providers/{id}/verify:
    post:
      operationId: verifyDNSProvider
      summary: Verify a DNS provider credential against its upstream API
      description: >-
        Requires dns.manage in the active scope, an empty request body, a quoted
        If-Match revision, and an Idempotency-Key. The first implemented adapter
        verifies a Cloudflare API Token with GET /user/tokens/verify. A verified
        result proves token activity only; it does not prove zone-specific
        permissions, mutate DNS records, or start ACME issuance. Deterministic
        denials are audited and idempotently replayed. Rate limits, timeouts,
        upstream failures, and invalid upstream responses leave the provider
        unchanged and the key retryable.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DNSProviderID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The token is active and the provider is now verified, or an identical completed request was replayed.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSProvider'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: >-
            Stable deterministic denial: provider_verification_unsupported,
            provider_credentials_invalid, provider_token_inactive, or
            provider_credentials_rejected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429':
          description: The provider rate limited verification. Retry-After is returned only when the upstream value was valid.
          headers:
            Retry-After:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '502':
          description: The provider returned an oversized, malformed, or otherwise unexpected response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504':
          description: Provider verification exceeded the bounded request timeout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/dns/settings:
    get:
      operationId: getDNSSettings
      summary: Read the DNS settings for the active tenant scope
      security: [{bearerAuth: []}]
      x-required-permissions: [dns.read]
      responses:
        '200':
          description: Scope-level DNS TTL. Provider secrets are never returned.
          headers: {ETag: {$ref: '#/components/headers/RevisionETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DNSSettings'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateDNSSettings
      summary: Update the compatibility DNS TTL with compare-and-swap semantics
      security: [{bearerAuth: []}]
      x-required-permissions: [dns.manage]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateDNSSettings'}}}
      responses:
        '200':
          description: Updated scope-level DNS TTL.
          headers: {ETag: {$ref: '#/components/headers/RevisionETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DNSSettings'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/dns/settings/{kind}:
    post:
      operationId: enqueueDNSOperation
      summary: Enqueue record repair or CDN-unrelated record cleanup
      security: [{bearerAuth: []}]
      x-required-permissions: [dns.manage]
      parameters:
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [repair, cleanup]}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        '202':
          description: Durable background job accepted; no provider mutation is reported until a worker completes it.
          content: {application/json: {schema: {$ref: '#/components/schemas/DNSOperationResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/dns/settings/operations/{operation_id}:
    get:
      operationId: getDNSOperation
      summary: Read a DNS DNS operation status
      security: [{bearerAuth: []}]
      x-required-permissions: [dns.read]
      parameters:
        - name: operation_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current durable operation state.
          content: {application/json: {schema: {$ref: '#/components/schemas/DNSOperation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/dns/platform-config:
    get:
      operationId: getPlatformDNSConfig
      summary: Read the installation-wide DNS configuration (节点管理 > DNS配置, platform administrator)
      responses:
        '200':
          description: Provider, non-secret identifiers, TTL, IP weight, tenant sync summary and the last DNS write failure.
          content: {application/json: {schema: {$ref: '#/components/schemas/PlatformDNSConfig'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: savePlatformDNSConfig
      summary: Save the installation-wide DNS configuration and synchronise every tenant copy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider_type, ttl, ip_weight]
              properties:
                provider_type: {type: string, enum: [aliyun, huawei, dns_la, dnspod_cn, dns_com, cloudflare, namecom, custom_http]}
                credentials:
                  description: Every credential field of the provider; omitted keeps the stored credentials of the same provider.
                  type: object
                  additionalProperties: {type: string}
                ttl: {type: integer, minimum: 1, maximum: 86400, description: 'Cloudflare requires at least 60; name.com at least 300.'}
                ip_weight: {type: boolean}
      responses:
        '200':
          description: Saved configuration.
          content: {application/json: {schema: {$ref: '#/components/schemas/PlatformDNSConfig'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/dns/platform-config/connection-test:
    post:
      operationId: testPlatformDNSConnection
      summary: 连接测试 - verify DNS credentials and the CNAME domains they host (read-only)
      description: >-
        Verifies the entered credentials (or, without credentials, the saved ones of provider_type) with the
        same provider check as a save, then lists the account's domains once per CNAME domain. Nothing is saved
        and no DNS record is written. Custom HTTP and plugin providers have no domain list (status unchecked).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider_type]
              properties:
                provider_type: {type: string}
                credentials: {type: object, additionalProperties: {type: string}}
      responses:
        '200':
          description: The provider accepted the credentials.
          content:
            application/json:
              schema:
                type: object
                required: [provider_type, zones]
                properties:
                  provider_type: {type: string}
                  zones:
                    type: array
                    items:
                      type: object
                      required: [name, status]
                      properties:
                        name: {type: string}
                        status: {type: string, enum: [hosted, not_hosted, unchecked]}
                        apex: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: dns_not_configured (no saved credentials to test).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '422':
          description: provider_credentials_rejected or provider_credentials_invalid.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '429':
          description: provider_verification_rate_limited.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '503':
          description: provider_verification_unavailable or credential_encryption_unavailable.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '504':
          description: provider_verification_timeout.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /v1/dns/platform-config/{kind}:
    post:
      operationId: startPlatformDNSOperation
      summary: Start 记录修复 (repair) or 清除CDN无关解析 (cleanup) as background jobs
      description: >-
        repair queues one dns.repair.v1 job per tenant with settled CNAME owners (one item per owner);
        cleanup lists the CNAME domains at the provider and queues one dns.cleanup.v1 job with one item per
        A/AAAA/CNAME record that is neither the zone apex nor an allocated CNAME hostname. Item ids are the
        result lines shown under 系统管理 > 后台任务.
      parameters:
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: [repair, cleanup]}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        '202':
          description: Background jobs accepted (or replayed).
          content:
            application/json:
              schema:
                type: object
                required: [operations, replayed]
                properties:
                  operations: {type: array, items: {$ref: '#/components/schemas/DNSOperation'}}
                  replayed: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: dns_not_configured, dns_no_tenant or an idempotency conflict.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '502':
          description: dns_provider_unavailable (the provider records could not be listed).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /v1/dns/platform-zones:
    get:
      operationId: listPlatformDNSZones
