  /v1/admin/admin-access-policy:
    get:
      operationId: getAdminAccessPolicy
      summary: Read the platform administration access allowlist
      description: Requires system_configuration.read on the platform scope. current_ip is the client address the control plane resolved for this request.
      responses:
        '200':
          description: Current policy (revision 0 and disabled when never saved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccessPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateAdminAccessPolicy
      summary: Save the platform administration access allowlist
      description: |
        Requires system_configuration.manage on the platform scope. When enabled, platform-scope sign-in, refresh and every platform-scope session request must come from an allowed address or CIDR prefix; loopback is always allowed; tenant sessions and API keys are not affected. A policy that would not allow the saving request's own address is refused (422 admin_access_self_lockout). Recovery when locked out: run `control-api admin-access-allowlist disable` as root on the control host. Requests refused by the policy get 403 admin_access_denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, enabled, allowlist]
              properties:
                expected_revision: {type: integer, format: int64, minimum: 0}
                enabled: {type: boolean}
                allowlist:
                  type: array
                  maxItems: 64
                  items: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccessPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: admin_access_self_lockout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token and issue a new access token
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Rotated. An active impersonation cookie returns the target principal and a non-sensitive impersonation marker. Reusing the previous refresh cookie revokes the complete token family.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: New HttpOnly, SameSite=Strict refresh cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh-token family
      description: >-
        When the request still carries the cdnca_impersonation cookie, the
        impersonation it identifies is revoked first (reason logout), so the
        cookie is refused immediately instead of at its expiry.
      security:
        - refreshCookie: []
      responses:
        '204':
          description: The family is revoked or the cookie was already absent.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: Clears the refresh cookie and the impersonation cookie.
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/me:
    get:
      operationId: getCurrentIdentity
      summary: Return the current user, scope, roles, and permissions
      description: Requires the server-side identity.self.read permission in the active scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/APIKeyListLimit'
        - $ref: '#/components/parameters/APIKeyListStatus'
        - $ref: '#/components/parameters/APIKeyListName'
        - $ref: '#/components/parameters/APIKeyListKeyID'
        - $ref: '#/components/parameters/APIKeyListCursor'
      responses:
        '200':
          description: Current identity and effective RBAC grants. An active impersonation cookie returns the target principal with a non-sensitive impersonation marker.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/modules:
    get:
      operationId: listGrantedModules
      summary: List the module, pack and theme feature codes the local entitlement lease grants
      description: >-
        Any authenticated session. Modules is empty unless the verified local lease is valid (grace included is
        not valid), matching the API entry gate (entitlement_feature_denied) and the publication gate. Front-end
        menu items with requiredModule are shown only when the code is listed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Granted module codes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, lease_serial, modules]
                properties:
                  status:
                    type: string
                    description: Local lease state (valid, grace, expired, revoked, invalid, uninstalled).
                  lease_serial: {type: integer, minimum: 0}
                  modules:
                    type: array
                    items:
                      type: string
                      pattern: '^(module|pack|theme)\.[a-z][a-z0-9_-]*(\.[a-z][a-z0-9_-]*)*$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/runtime-features:
    get:
      operationId: listRuntimeFeatures
      summary: List which optional control-plane runtimes are mounted
      description: >-
        Any authenticated session. Each flag is true exactly when the corresponding route set is mounted on this
        control plane (cache_control /v1/cache-*, custom_rbac /v1/custom-rbac/*, plugin_webhooks
        /v1/tenant-scopes/{id}/plugin-webhook-*); front-end menus for a runtime that is off are hidden instead of answering 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mounted optional runtimes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [features]
                properties:
                  features:
                    type: object
                    additionalProperties: false
                    required: [cache_control, custom_rbac, plugin_webhooks, approval_center, market, package_auto_renew, origin_auth]
                    properties:
                      cache_control: {type: boolean}
                      custom_rbac: {type: boolean}
                      plugin_webhooks: {type: boolean}
                      approval_center:
                        type: boolean
                        description: The platform approval center is turned on (/v1/admin/approval-center/settings); its menu is hidden when false.
                      market:
                        type: boolean
                        description: Node market and plugin store member routes mounted (MARKET_RUNTIME_ENABLED); their menus and purchase links are hidden when false.
                      package_auto_renew:
                        type: boolean
                        description: Package auto-renew worker running (PACKAGE_AUTO_RENEW_ENABLED); the customer auto-renew column and settings button are hidden when false.
                      origin_auth:
                        type: boolean
                        description: Origin authentication routes mounted (ORIGIN_AUTH_RUNTIME_ENABLED); the origin authentication menus are hidden and its routes answer 503 feature_disabled when false.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/plugin-providers:
    get:
      operationId: listPluginProviders
      summary: List third-party DNS / SMS / ICP provider plugins with their installation contract results (PA-22)
      description: >-
        Platform administrators with plugin_installations.read (or platform.admin). A provider plugin appears once
        its installation is enabled here and the license service serves its declaration (plugin_provider/<plugin id>).
        usable is true only while it is active, its contract passed for the current version and it is enabled.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Provider plugins.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PluginProvider'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/admin/plugin-providers/{plugin_id}/{action}:
    post:
      operationId: actOnPluginProvider
      summary: Run the installation contract, enable or disable a provider plugin (PA-22/PA-23)
      description: >-
        Platform administrators with plugin_installations.manage (or platform.admin). contract runs the
        cdnca.provider/v1 contract cases against the plugin sandbox and records the report; enable requires a passed
        contract for the current version (409 plugin_provider_contract_not_passed otherwise, also refused by the
        database). A payment plugin (high_risk) is a high-risk permission: enable needs risk_acknowledged (422
        plugin_provider_risk_not_acknowledged) and an MFA step-up proof issued for the installation tenant with
        audience/action plugin.provider.enable_payment (403 plugin_provider_step_up_required); the proof is bound to
        the plugin declaration when consumed. Audited as plugin.provider.contract / enable / disable (refusals
        included).
      security:
        - bearerAuth: []
      parameters:
        - {name: plugin_id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]+([.-][a-z0-9]+)+$'}}
        - {name: action, in: path, required: true, schema: {enum: [contract, enable, disable]}}
      requestBody:
        required: false
        description: Only for enable of a payment plugin.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                risk_acknowledged: {type: boolean}
                step_up_token: {type: string, maxLength: 4096}
      responses:
        '200':
          description: The provider plugin after the action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginProvider'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: plugin_provider_risk_not_acknowledged (payment plugin enable without the acknowledged risk notice).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/plugin-ui/pages:
    get:
      operationId: listPluginUIPages
      summary: List the ui_page plugin pages this principal may open (PA-19)
      description: >-
        Any authenticated session. Only plugins enabled on this installation (and still served by the license
        service) are listed, filtered by the page role (platform scope = admin), its required_permission (no
        platform.admin fallback) and its required_module (lease). The web app mounts each page in
        <iframe sandbox="allow-scripts allow-forms"> on the plugin origin.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mountable pages.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PluginUIPage'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/plugin-ui/signing-key:
    get:
      operationId: getPluginUISigningKey
      summary: The installation public key plugin backends verify proxied calls with (PA-19)
      description: >-
        Requires plugin_installations.read or plugin_installations.manage (any scope) or platform.admin in the
        platform scope. Public material only: the administrator hands public_key to a ui_page plugin backend so
        it can verify X-Cdnca-Plugin-Signature; key_id equals X-Cdnca-Plugin-Key-Id. 503
        plugin_ui_proxy_unavailable when this installation has no key configured.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The installation signing key.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installation_id, key_id, algorithm, public_key, signature_domain]
                properties:
                  installation_id: {type: string, format: uuid}
                  key_id: {type: string, pattern: '^[0-9a-f]{16}$'}
                  algorithm: {enum: [Ed25519]}
                  public_key: {type: string, description: base64url (no padding) raw 32-byte Ed25519 public key}
                  signature_domain: {enum: [cdnca-plugin-ui-proxy/v1]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/plugin-ui/{plugin_id}/proxy:
    post:
      operationId: proxyPluginUIRequest
      summary: Call a ui_page plugin's own backend on behalf of one of its pages (PA-19)
      description: >-
        Any authenticated session that may open page_id. The control plane forwards method/path/query/body to
        the plugin's declared api_base_url (public addresses only, no redirects, JSON only) without the user's
        session or token; it adds X-Cdnca-Plugin-Context (base64url JSON, schema cdnca.plugin-ui-context/v1, 60 s),
        X-Cdnca-Plugin-Signature (Ed25519 by the installation key over "cdnca-plugin-ui-proxy/v1\n" + METHOD + "\n" +
        path?query + "\n" + hex(sha256(body)) + "\n" + context) and X-Cdnca-Plugin-Key-Id. site_id must be a site
        the caller can access. Writes and refusals are audited as plugin.ui_page.proxy. 120 calls per minute per
        user and plugin.
      security:
        - bearerAuth: []
      parameters:
        - {name: plugin_id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]+([.-][a-z0-9]+)+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method, path, page_id]
              properties:
                method: {enum: [GET, POST, PUT, PATCH, DELETE]}
                path: {type: string, pattern: '^/[A-Za-z0-9._~!$&''()*+,;=:@%/-]{0,511}$'}
                query: {type: string, maxLength: 1024}
                body: {description: JSON body (not with GET), maxLength: 262144}
                page_id: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$'}
                site_id: {type: string, format: uuid}
      responses:
        '200':
          description: The plugin backend answer (status and JSON body only).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, body]
                properties:
                  status: {type: integer}
                  body: {description: JSON value}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: plugin_ui_rate_limited
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: plugin_ui_backend_unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/admin/users:
    get:
      operationId: listManagedUsers
      summary: List tenant users in the customer control plane
      description: Requires identity.users.manage in a platform scope. Platform identities are never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: include
          in: query
          description: Optional comma-separated unique projections. user_metadata adds remark and QQ; user_verification adds only current personal/company verification flags; platform_admins also lists platform-scope administrators (tenant_id null); reseller adds the ADR 0018 reseller projection (ManagedUserReseller). Omission preserves the original fifteen-field representation. Empty, unknown, duplicate items and repeated parameters are rejected. user_verification, platform_admins and reseller are accepted only on this list endpoint.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 4
            uniqueItems: true
            items: {type: string, enum: [user_metadata, user_verification, platform_admins, reseller]}
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 128
        - name: display_id
          in: query
          description: Exact positive-decimal user display ID. Internal UUID identity and write paths are unchanged.
          schema:
            type: string
            pattern: '^[1-9][0-9]{0,18}$'
        - name: username
          in: query
          description: Case-insensitive literal substring of username only. Trim boundary whitespace, reject raw C0/C1 controls, and allow at most 128 Unicode code points after trimming. Empty means no filter; all supplied filters intersect using AND.
          schema:
            type: string
            maxLength: 128
        - name: display_name
          in: query
          description: Case-insensitive literal substring of display name only, with the same trimming, control-character rejection, length and AND semantics as username. Percent and underscore are literal characters.
          schema:
            type: string
            maxLength: 128
        - name: email
          in: query
          description: Case-insensitive literal substring of email only, with the same trimming, control-character rejection, length and AND semantics as username. Partial addresses are allowed; NULL email does not match a nonempty filter.
          schema:
            type: string
            maxLength: 128
        - name: phone
          in: query
          description: Case-insensitive literal substring of phone only, with the same trimming, control-character rejection, length and AND semantics as username. Leading zeroes and plus signs are significant; NULL phone does not match a nonempty filter.
          schema:
            type: string
            maxLength: 128
        - name: remark
          in: query
          description: Trimmed case-insensitive literal substring of the administrator remark. Empty means no filter; combined with every other filter using AND.
          schema:
            type: string
            maxLength: 512
        - name: qq
          in: query
          description: Trimmed case-insensitive literal substring of the QQ contact text. Leading zeroes are significant; empty means no filter and all filters intersect.
          schema:
            type: string
            maxLength: 32
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: real_name_status
          in: query
          description: Optional current verification filter, intersected with all other filters before pagination in the same snapshot as the returned flags. verified means personal_verified OR company_verified; unverified means neither. Omit for all users. Empty or unknown values are invalid. Each flag requires the latest application of that kind to be approved, its authoritative identity binding to match, and its evidence settlement to be settled. Reads never create or approve identity records.
          schema: {type: string, enum: [verified, unverified]}
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: group_id
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          description: ADR 0018 tenant type filter, applied before pagination. reseller = the tenant has a reseller profile (active or suspended); customer = the tenant belongs to a reseller; direct = neither. Any value excludes platform administrators. Omit for all users.
          schema: {type: string, enum: [reseller, customer, direct]}
        - name: parent
          in: query
          description: Owning reseller filter, applied before pagination and intersected with type. none = tenants without a reseller (platform customers, including resellers themselves); a lowercase reseller scope UUID = that reseller's customers. Excludes platform administrators. Omit for all users.
          schema:
            type: string
            pattern: '^(none|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
      responses:
        '200':
          description: Stable tenant user page ordered newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: batchUpdateManagedUsers
      summary: Atomically update tenant users
      description: Applies the complete array or no changes. Disabling a user revokes every refresh family and invalidates existing access sessions immediately.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ManagedUserInclude'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdentityRequestID'
        - $ref: '#/components/parameters/IdentityTraceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/BatchUpdateManagedUserRequest'
      responses:
        '200':
          description: Users updated in request order, or an identical idempotent request replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUpdateManagedUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createManagedUser
      summary: Create an isolated tenant user
      description: Creates the tenant, tenant scope, system roles, membership, and Argon2id credential atomically.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ManagedUserInclude'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdentityRequestID'
        - $ref: '#/components/parameters/IdentityTraceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedUserRequest'
      responses:
        '201':
          description: Tenant user created, or an identical idempotent request replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/tenant-scopes:
    get:
      operationId: listTenantScopes
      summary: List tenant scope targets for platform administration
      description: Returns a small read-only tenant directory for platform identities. Requires identity.users.manage (or platform.admin) in a platform scope. Billing and other tenant data are intentionally excluded; suspended and closed tenants remain visible with their status.
      x-required-permissions: [identity.users.manage]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: search
          in: query
          description: Case-insensitive substring matched against tenant name, stable short tenant ID, tenant UUID, and scope UUID.
          schema:
            type: string
            maxLength: 128
        - name: parent
          in: query
          description: 'Reseller filter (ADR 0018): "none" = platform customers only; a reseller scope UUID (canonical lower case) = its customers; omitted = all.'
          schema:
            type: string
            pattern: '^(none|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
      responses:
        '200':
          description: Stable tenant scope page ordered newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantScopeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/tenant-scopes/{scope_id}/parent:
    put:
      operationId: setTenantParent
      summary: Put a tenant under a reseller, or back to the platform
      description: >-
        ADR 0018 (Q6). parent_scope_id null makes the tenant a platform customer again. The parent must be an active
        reseller, not the tenant itself; a reseller cannot have a parent (one level); a reseller at its customer_limit
        refuses new customers. Existing subscriptions are kept until they expire. Requires identity.users.manage in the
        platform scope.
      x-required-permissions: [identity.users.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: scope_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [parent_scope_id]
              properties:
                parent_scope_id: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: The tenant's reseller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantParent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/reseller/customers:
    get:
      operationId: listResellerCustomers
      summary: A reseller lists its own customers (ADR 0018 RS-05)
      description: >-
        Tenant session of an active reseller with reseller.customers.read or reseller.customers.manage. Items are the
        owner users of tenants whose parent_scope_id is the caller's scope (ManagedUser shape, metadata always set,
        group always null).
      x-required-permissions: [reseller.customers.read]
      security:
        - bearerAuth: []
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000000}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: search, in: query, description: 'Username, name, email, phone or display ID substring.', schema: {type: string, maxLength: 128}}
        - {name: status, in: query, schema: {type: string, enum: [active, disabled]}}
      responses:
        '200':
          description: One page of customers.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, limit, total]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ManagedUser'}}
                  page: {type: integer}
                  limit: {type: integer}
                  total: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createResellerCustomer
      summary: A reseller opens a customer tenant under itself
      description: >-
        Creates tenant + tenant scope + owner user in one transaction with parent_scope_id = the caller's scope (the
        480 guard re-checks the active reseller and customer_limit). Audit identity.user.create in both scopes.
        422 reseller_customer_limit when the limit is reached; 409 username_conflict.
      x-required-permissions: [reseller.customers.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, display_name]
              properties:
                username: {type: string, minLength: 3, maxLength: 128}
                password: {type: string, minLength: 8, maxLength: 1024, pattern: '^[!-~]{8,1024}$', description: '8 to 1024 printable ASCII characters (no space) with at least two of upper case, lower case, digits and symbols (libs/passwordpolicy); otherwise password_policy_unmet.'}
                display_name: {type: string, minLength: 1, maxLength: 128}
                email: {type: [string, 'null']}
                phone: {type: [string, 'null']}
                remark: {type: [string, 'null'], maxLength: 512}
                qq: {type: [string, 'null'], maxLength: 32}
      responses:
        '201':
          description: The customer's owner user.
          content: {application/json: {schema: {$ref: '#/components/schemas/ManagedUser'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/reseller/customers/{scope_id}/sites:
    parameters:
      - {name: scope_id, in: path, required: true, description: The customer's tenant scope ID., schema: {type: string, format: uuid}}
    get:
      operationId: listResellerCustomerSites
