    AnalyticsQueryMetadata:
      type: object
      additionalProperties: false
      required: [from, to, timezone, metric_version]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        timezone: {type: string, const: UTC}
        metric_version: {type: integer, const: 1}
    AnalyticsMetricValues:
      type: object
      required:
        - metric_version
        - request_count
        - request_bytes
        - response_bytes
        - total_bytes
        - average_bandwidth_bps
        - status_2xx
        - status_3xx
        - status_4xx
        - status_5xx
        - security_events
        - cache_hit_requests
        - cache_hit_bytes
        - unique_client_ips
      properties:
        metric_version: {type: integer, const: 1}
        request_count: {type: integer, format: uint64, minimum: 0}
        request_bytes: {type: integer, format: uint64, minimum: 0}
        response_bytes: {type: integer, format: uint64, minimum: 0}
        total_bytes: {type: integer, format: uint64, minimum: 0}
        average_bandwidth_bps: {type: number, format: double, minimum: 0}
        status_2xx: {type: integer, format: uint64, minimum: 0}
        status_3xx: {type: integer, format: uint64, minimum: 0}
        status_4xx: {type: integer, format: uint64, minimum: 0}
        status_5xx: {type: integer, format: uint64, minimum: 0}
        security_events: {type: integer, format: uint64, minimum: 0}
        cache_hit_requests:
          type: integer
          format: uint64
          minimum: 0
          description: Requests answered from the edge cache (cache_status HIT); hit ratio = cache_hit_requests / request_count.
        cache_hit_bytes:
          type: integer
          format: uint64
          minimum: 0
          description: Request plus response bytes of the cache hits.
        unique_client_ips:
          type: integer
          format: uint64
          minimum: 0
          description: Distinct client addresses that sent a request (per trend point, in that hour).
    AnalyticsSummaryMetrics:
      allOf:
        - $ref: '#/components/schemas/AnalyticsMetricValues'
      unevaluatedProperties: false
    AnalyticsSummaryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/AnalyticsSummaryMetrics'}
        meta: {$ref: '#/components/schemas/AnalyticsQueryMetadata'}
    AnalyticsTrendPoint:
      allOf:
        - $ref: '#/components/schemas/AnalyticsMetricValues'
        - type: object
          required: [hour]
          properties:
            hour: {type: string, format: date-time}
      unevaluatedProperties: false
    AnalyticsTrendResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 744
          items: {$ref: '#/components/schemas/AnalyticsTrendPoint'}
        meta: {$ref: '#/components/schemas/AnalyticsQueryMetadata'}
    AnalyticsRankItem:
      type: object
      additionalProperties: false
      required: [key, request_count, response_bytes]
      properties:
        key: {type: string, maxLength: 4355}
        request_count: {type: integer, format: uint64, minimum: 0}
        response_bytes: {type: integer, format: uint64, minimum: 0}
        host: {type: string, maxLength: 253, description: 'domain and url rankings: the host of the key.'}
        port: {type: integer, minimum: 0, maximum: 65535, description: 'domain and url rankings: the listen port; omitted when unknown (events before listen_port was recorded).'}
        path: {type: string, maxLength: 4096, description: 'url ranking: the request path. The url ranking groups by host, port and path.'}
        scheme: {type: string, enum: [http, https], description: 'url ranking: https when the site serves HTTPS on port, http otherwise; omitted when unknown.'}
    AnalyticsRankPage:
      type: object
      additionalProperties: false
      required: [snapshot_at, source]
      properties:
        next_cursor: {type: string, maxLength: 8192}
        snapshot_at: {type: string, format: date-time}
        source:
          type: string
          enum: [history, access_log]
          description: >-
            history: hourly history facts (retention bandwidth_history_days); access_log: raw access log
            (retention access_logs_days). url, ja4 and referer rank from the access log.
        retained_from:
          type: string
          format: date-time
          description: Present when the requested range starts before the oldest data of the source; the ranking covers [retained_from, to).
    AnalyticsRankResponse:
      type: object
      additionalProperties: false
      required: [data, dimension, page, meta]
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AnalyticsRankItem'}
        dimension:
          type: string
          enum: [url, ip, domain, region, carrier, ja4, referer, province, browser, os]
        page: {$ref: '#/components/schemas/AnalyticsRankPage'}
        meta: {$ref: '#/components/schemas/AnalyticsQueryMetadata'}
    AnalyticsErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            - analytics_invalid_request
            - analytics_authentication_required
            - analytics_permission_denied
            - analytics_scope_forbidden
            - analytics_dimension_unsupported
            - analytics_request_cancelled
            - analytics_storage_rejected
            - analytics_storage_invalid_response
            - analytics_response_too_large
            - analytics_storage_unavailable
            - analytics_query_timeout
            - analytics_internal_error
        message: {type: string}
        request_id: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$'}
    AnalyticsErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/AnalyticsErrorDetail'}
    SecurityPolicyKind:
      type: string
      description: waf = WAF rule library, cc = CC protection, acl = access control.
      x-description-zh: waf 为 WAF 规则库，cc 为 CC 防护，acl 为访问控制。
      enum: [waf, cc, acl]
    SecurityPolicyDecision:
      type: string
      enum: [allow, block]
    SecurityPolicyAction:
      type: string
      description: ban is a WAF rule action (temporary ban, action_config.waf_ban); a WAF challenge carries action_config.waf_challenge.
      enum: [allow, block, rate_limit, challenge, log, ban]
    SecurityPolicyFlow:
      type: string
      enum: [continue, stop]
    SecurityPolicyCondition:
      type: object
      additionalProperties: false
      required: [field, operator, values]
      properties:
        field:
          type: string
          description: "content_type, http_version and ip_list are WAF fields and need node CAPABILITY_NAME_WAF v4; multipart_field_names, multipart_part_count and multipart_field_max_length need v5; a release using them is refused for nodes below it."
          enum: [client_ip, host, path, method, header, country, asn, ja4, port, distinct_user_agents, status_404_count,
            args, query, body, request_uri, cookie, user_agent, referer, carrier, ip_tag, province, city,
            upload_filename, upload_extension, header_names, request_length, body_length, uri_length, header_max_length,
            header_count, arg_count, content_type, http_version, ip_list, multipart_field_names, multipart_part_count,
            multipart_field_max_length]
        operator:
          type: string
          description: "http_version takes equals / not_equals with values 1.0, 1.1, 2, 3 and no filters. ip_list takes in_ip_list / not_in_ip_list with exactly one value, the UUID of an IP list of the policy's tenant or of the platform (/v1/security-ip-lists); an unusable list is refused with 422 ip_list_unavailable."
          enum: [equals, not_equals, in, not_in, prefix, suffix, contains, not_contains, contains_all, regex, not_regex, detect,
            number_eq, number_neq, number_gt, number_gte, number_lt, number_lte, ip_in_cidr, ip_not_in_cidr, in_ip_list, not_in_ip_list]
        key:
          type: string
          maxLength: 128
          description: Required only for header conditions; normalized to lowercase.
        filters:
          type: array
          maxItems: 5
          items: {type: string, enum: [lowercase, base64_decode, unicode_decode, html_unescape, length]}
          description: WAF content fields only. Applied in order before the operator; length (last) turns the value into its byte length for number_* operators.
        body_overflow:
          type: string
          enum: [match]
          description: WAF body fields only. match makes the condition hold for a body longer than the 64 KiB inspection limit.
        values:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256}
          description: At most 64 values, except client_ip ip_in_cidr / ip_not_in_cidr whose stored values are the expanded CIDRs (at most 256).
      description: "Field/operator compatibility is server validated. client_ip accepts IPv4 or IPv6 addresses and CIDRs; with ip_in_cidr / ip_not_in_cidr also a dotted IPv4 netmask (10.0.0.1/255.255.255.0) and a range a-b of one family, stored as the fewest covering CIDRs. CC rules may repeat client_ip and header conditions (all must hold). Runtime snippets are rejected."
    SecurityIPListInput:
      type: object
      additionalProperties: false
      required: [name, entries]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        description: {type: string, maxLength: 512}
        entries:
          type: array
          minItems: 1
          maxItems: 10000
          items: {type: string, description: An IPv4 / IPv6 address or CIDR (IPv4-mapped IPv6 and multicast are refused).}
    SecurityIPListUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, name, entries]
      properties:
        expected_revision: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 64}
        description: {type: string, maxLength: 512}
        entries: {type: array, minItems: 1, maxItems: 10000, items: {type: string}}
    SecurityIPList:
      type: object
      additionalProperties: false
      required: [id, name, description, entries, revision, platform, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        entries: {type: array, items: {type: string}, description: Canonical CIDRs (addresses as /32 or /128) in order.}
        revision: {type: integer, minimum: 1}
        platform: {type: boolean, description: A platform list (read only for tenants).}
        updated_at: {type: string, format: date-time}
    SecurityIPListPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SecurityIPList'}}
    SecurityPolicyRateLimit:
      type: object
      additionalProperties: false
      required: [window_seconds, max_requests]
      properties:
        window_seconds: {type: integer, minimum: 1, maximum: 3600}
        max_requests: {type: integer, minimum: 1, maximum: 1000000}
    SecurityPolicyChallenge:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [js, five_second, click, simple_click, slider, simple_slider, captcha, rotate_image]}
    SecurityPolicyActionConfig:
      type: object
      additionalProperties: false
      properties:
        rate_limit: {$ref: '#/components/schemas/SecurityPolicyRateLimit'}
        challenge: {$ref: '#/components/schemas/SecurityPolicyChallenge'}
        waf_ban:
          type: object
          additionalProperties: false
          required: [ban_seconds]
          description: WAF ban rules only (required there).
          properties:
            ban_seconds: {type: integer, minimum: 1, maximum: 604800}
        waf_challenge:
          type: object
          additionalProperties: false
          required: [pass_seconds, pow_bits]
          description: WAF challenge rules only (required there); a proof-of-work page, other methods answered 307.
          properties:
            pass_seconds: {type: integer, minimum: 60, maximum: 86400}
            pow_bits: {type: integer, minimum: 8, maximum: 24}
    SecurityPolicyRuleInput:
      type: object
      additionalProperties: false
      required: [name, priority, enabled, conditions, action, flow, action_config]
      properties:
        id:
          type: string
          format: uuid
          description: Omit on create and for newly added update rules; retain the server ID when editing an existing rule.
        name: {type: string, minLength: 1, maxLength: 128}
        priority: {type: integer, minimum: 1, maximum: 1000000}
        enabled: {type: boolean}
        conditions:
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/SecurityPolicyCondition'}
        action: {$ref: '#/components/schemas/SecurityPolicyAction'}
        flow: {$ref: '#/components/schemas/SecurityPolicyFlow'}
        action_config: {$ref: '#/components/schemas/SecurityPolicyActionConfig'}
        count_by:
          type: array
          minItems: 1
          maxItems: 2
          description: "CC only (CC API v4). One or two keys counted together; omitted means the client IP. Keys are stored in the order client_ip, client_cidr, host, uri, uri_path, ja4; client_ip with client_cidr and uri with uri_path are rejected. A request without a TLS fingerprint is not counted by a ja4 rule."
          items: {$ref: '#/components/schemas/SecurityPolicyCountKey'}
        action_target:
          type: string
          enum: [client_ip, count_key]
          description: CC temporary_ban with count_by only. count_key bans the counted bucket (for example one TLS fingerprint); omitted bans the client.
    SecurityPolicyCountKey:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: {type: string, enum: [client_ip, client_cidr, host, uri, uri_path, ja4]}
        ipv4_prefix: {type: integer, minimum: 8, maximum: 32, description: client_cidr only; default 24.}
        ipv6_prefix: {type: integer, minimum: 32, maximum: 128, description: client_cidr only; default 64.}
    SecurityPolicyRule:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SecurityPolicyRuleInput'
        - type: object
          required: [id]
    SecurityPolicyFields:
      type: object
      additionalProperties: false
      required: [kind, name, description, enabled, default_action, rules]
      properties:
        kind: {$ref: '#/components/schemas/SecurityPolicyKind'}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 1000}
        enabled: {type: boolean}
        default_action: {$ref: '#/components/schemas/SecurityPolicyDecision'}
        rules:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/SecurityPolicyRuleInput'}
        cc_settings: {$ref: '#/components/schemas/SecurityPolicyCCSettings'}
        waf_settings: {$ref: '#/components/schemas/SecurityPolicyWAFSettings'}
    SecurityPolicyWAFSettings:
      type: object
      additionalProperties: false
      description: "WAF only (node CAPABILITY_NAME_WAF v2). Omitted (or defend mode without auto_block) is stored as absent."
      properties:
        mode: {type: string, enum: ['', observe], description: observe records every decision of the policy as log and enforces nothing.}
        auto_block: {$ref: '#/components/schemas/SecurityPolicyWAFAutoBlock'}
    SecurityPolicyWAFAutoBlock:
      type: object
      additionalProperties: false
      required: [window_seconds, hit_threshold, block_seconds]
      description: "同 IP 超阈值自动拉黑 (default off: omitted). A client the policy blocked or challenged hit_threshold times within window_seconds is banned for block_seconds; the ban joins the node's kernel ban path and is a temporary_ban security event."
      properties:
        window_seconds: {type: integer, minimum: 1, maximum: 86400}
        hit_threshold: {type: integer, minimum: 1, maximum: 1000000}
        block_seconds: {type: integer, minimum: 1, maximum: 604800}
    SecurityPolicyCCDuration:
      type: object
      additionalProperties: false
      required: [mode, seconds]
      properties:
        mode: {type: string, enum: [system, custom], description: "system follows the tenant's global CC config (block_time / white_time) and is re-resolved when it changes."}
        seconds: {type: integer, minimum: 1, maximum: 604800, description: "Resolved value the policy compiles with (ban 1..86400, pass 60..604800); ignored on input for system."}
    SecurityPolicyCCAutoSwitch:
      type: object
      additionalProperties: false
      required: [mode, qps_total, qps_5xx, recover_seconds, rule_groups, rules]
      properties:
        mode: {type: string, enum: [system, custom], description: "system follows the global auto_switch (resolved by the server; a disabled global switch resolves to no rules, i.e. off)."}
        qps_total: {type: integer, minimum: 0, maximum: 1000000, description: Requests per second of the site on one node that engage the switch; 0 = not used.}
        qps_5xx: {type: integer, minimum: 0, maximum: 1000000, description: Origin 5xx responses per second that engage the switch; 0 = not used.}
        recover_seconds: {type: integer, minimum: 0, maximum: 86400, description: Seconds below both thresholds before the site's own rules run again (60..86400 when active; 300 is a common choice).}
        rule_groups:
          type: array
          maxItems: 8
          items: {type: string, minLength: 1, maxLength: 128}
          description: System rule groups the rules were expanded from (display only).
        rules:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SecurityPolicyRuleInput'}
          description: "Rules the node runs while switched (CC API v5); IDs differ from the policy's. Empty only for a system switch resolved off."
    SecurityPolicyCCTrustedCrawler:
      type: object
      additionalProperties: false
      required: [name, user_agent_tokens]
      description: "A request whose User-Agent contains one of the tokens is this crawler when the client is in networks, or its address forward-confirms (PTR, then A/AAAA back to it) under one of rdns_suffixes. At least one of networks / rdns_suffixes is required; the User-Agent alone never trusts. Stored lower-cased, sorted and de-duplicated."
      properties:
        name: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$'}
        user_agent_tokens:
          type: array
          minItems: 1
          maxItems: 16
          items: {type: string, minLength: 3, maxLength: 128, description: Printable ASCII without spaces (a product token such as Googlebot).}
        networks:
          type: array
          maxItems: 256
          items: {type: string, description: "CIDR, address, dotted netmask or range a-b (stored as CIDRs, never /0)."}
        rdns_suffixes:
          type: array
          maxItems: 16
          items: {type: string, maxLength: 253, description: DNS name of two labels or more; a hostname equal to it or under it matches.}
    SecurityPolicyCCSettings:
      type: object
      additionalProperties: false
      description: "CC only. Site-level ban/pass durations (override every rule's) and the auto switch (自动切换). Omitted keeps the rules' own values."
      properties:
        ban_seconds: {$ref: '#/components/schemas/SecurityPolicyCCDuration'}
        pass_seconds: {$ref: '#/components/schemas/SecurityPolicyCCDuration'}
        auto_switch: {$ref: '#/components/schemas/SecurityPolicyCCAutoSwitch'}
        trusted_crawlers:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/SecurityPolicyCCTrustedCrawler'}
          description: "蜘蛛白名单 (CC API v6): verified crawlers skip every CC rule, ban and challenge on the node."
        challenge_cookie_domain: {type: string, maxLength: 253, description: "The pass cookie's Domain (CC API v6), set only when the request host is it or under it; empty keeps the cookie host-only."}
    CreateSecurityPolicyRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SecurityPolicyFields'
        - type: object
          properties:
            target_scope_id: {type: string, format: uuid}
            owner_id: {type: string, format: uuid}
    SecurityPolicyOwner:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string, minLength: 1}
    SecurityPolicy:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SecurityPolicyFields'
        - type: object
          required: [id, scope_id, kind, name, description, enabled, default_action, rules, version, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            scope_id: {type: string, format: uuid}
            owner:
              description: Present only for platform identities.
              oneOf:
                - $ref: '#/components/schemas/SecurityPolicyOwner'
                - type: 'null'
            rules:
              type: array
              minItems: 1
              maxItems: 100
              items: {$ref: '#/components/schemas/SecurityPolicyRule'}
            version: {type: integer, format: int64, minimum: 1}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    SecurityPolicyList:
      type: object
      additionalProperties: false
      required: [items, total, page, limit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SecurityPolicy'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1, maximum: 100}
    CCMatcherFields:
      type: object
      additionalProperties: false
      required: [name, description, enabled, field, operator, values]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 1000}
        enabled: {type: boolean}
        field: {type: string, minLength: 1, maxLength: 128}
        operator: {type: string, minLength: 1, maxLength: 128}
        key: {type: string, maxLength: 128}
        values: {type: array, maxItems: 100, items: {type: string, maxLength: 4096}}
    CCFilterFields:
      type: object
      additionalProperties: false
      required: [name, description, enabled, type, parameters]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 1000}
        enabled: {type: boolean}
        type: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$'}
        parameters: {type: object, additionalProperties: true}
    CreateCCMatcherRequest:
      allOf:
        - $ref: '#/components/schemas/CCMatcherFields'
        - type: object
          properties:
            target_scope_id: {type: string, format: uuid}
            owner_id: {type: string, format: uuid}
    CreateCCFilterRequest:
      allOf:
        - $ref: '#/components/schemas/CCFilterFields'
        - type: object
          properties:
            target_scope_id: {type: string, format: uuid}
            owner_id: {type: string, format: uuid}
    SecurityPolicyReference:
      type: object
      additionalProperties: false
      required: [id, scope_id, name, system_rule, status, version, created_at]
      properties:
        id: {type: string, format: uuid}
        scope_id: {type: string, format: uuid}
        owner:
          description: Present only for platform identities.
          oneOf:
            - $ref: '#/components/schemas/SecurityPolicyOwner'
            - type: 'null'
        name: {type: string}
        system_rule: {type: boolean}
        system_rule_id: {type: string, maxLength: 32}
        system_rule_key: {type: string, maxLength: 128}
        status: {type: string, enum: [enabled, disabled]}
        type: {type: string}
        sort: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        description: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        policy_id: {type: string, format: uuid}
        rule_id: {type: string, format: uuid}
        field: {type: string}
        operator: {type: string}
        key: {type: string}
        values: {type: array, items: {type: string}}
        parameters: {type: object, additionalProperties: true}
    SecurityPolicyReferenceList:
      type: object
      additionalProperties: false
      required: [items, total, page, limit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SecurityPolicyReference'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1, maximum: 100}
    SecurityPolicyRequestFacts:
      type: object
      additionalProperties: false
      required: [client_ip, host, path, method, headers, country, asn, ja4, port, distinct_user_agents, status_404_count]
      properties:
        client_ip: {type: string, oneOf: [{format: ipv4}, {format: ipv6}]}
        host: {type: string, maxLength: 253}
        path: {type: string, maxLength: 8192}
        method: {type: string, maxLength: 16}
        headers:
          type: object
          description: Header names are case-insensitive; arrays preserve repeated field values. Scalar values remain accepted for legacy clients.
          additionalProperties:
            oneOf:
              - {type: string, maxLength: 4096}
              - {type: array, minItems: 1, maxItems: 100, items: {type: string, maxLength: 4096}}
        country: {type: string, pattern: '^[A-Za-z]{2}$'}
        asn: {type: integer, minimum: 0, maximum: 4294967295}
        ja4: {type: string, maxLength: 128}
        port: {type: integer, minimum: 0, maximum: 65535}
        distinct_user_agents: {type: integer, minimum: 0}
        status_404_count: {type: integer, minimum: 0}
    SecurityPolicyEvaluation:
      type: object
      additionalProperties: false
      required: [policy_id, policy_version, action, matched_rule_ids, used_default]
      properties:
        policy_id: {type: string, format: uuid}
        policy_version: {type: integer, format: int64, minimum: 1}
        action: {$ref: '#/components/schemas/SecurityPolicyAction'}
        matched_rule_ids: {type: array, items: {type: string, format: uuid}}
        terminal_rule_id: {type: string, format: uuid}
        used_default: {type: boolean}
    URLAuthPolicyFields:
      type: object
      additionalProperties: false
      required:
        - site_id
        - name
        - enabled
        - algorithm
        - signature_parameter
        - expiration_parameter
        - key_id_parameter
        - bind_client_ip
        - max_clock_skew_seconds
        - max_validity_seconds
        - max_signature_uses
        - excluded_query_parameters
        - trusted_proxy_cidrs
      properties:
        site_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        enabled: {type: boolean}
        algorithm: {type: string, const: hmac-sha256}
        signature_parameter: {type: string, pattern: '^[A-Za-z0-9_.~-]{1,64}$'}
        expiration_parameter: {type: string, pattern: '^[A-Za-z0-9_.~-]{1,64}$'}
        key_id_parameter: {type: string, pattern: '^[A-Za-z0-9_.~-]{1,64}$'}
        bind_client_ip: {type: boolean}
        max_clock_skew_seconds: {type: integer, minimum: 0, maximum: 300}
        max_validity_seconds: {type: integer, minimum: 1, maximum: 86400}
        max_signature_uses: {type: integer, minimum: 0, maximum: 1000000}
        excluded_query_parameters:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string, pattern: '^[A-Za-z0-9_.~-]{1,64}$'}
        trusted_proxy_cidrs:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 3, maxLength: 64}
    CreateURLAuthPolicyRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/URLAuthPolicyFields'
        - type: object
          properties:
            target_scope_id: {type: string, format: uuid}
            owner_id: {type: string, format: uuid}
    URLAuthOwner:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string, minLength: 1}
    URLAuthSite:
      type: object
      additionalProperties: false
      required: [id, domain]
      properties:
        id: {type: string, format: uuid}
        domain: {type: string, minLength: 1, maxLength: 253}
    URLAuthKeyMetadata:
      type: object
      additionalProperties: false
      required: [key_id, created_at]
      properties:
        key_id: {type: string, pattern: '^k-[0-9a-f-]{36}$'}
        created_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    URLAuthMigrationMarker:
      type: string
      enum: [cdnfly_type_a_md5, cdnfly_type_b_md5]
      readOnly: true
      description: Read-only import provenance. It never selects the executable edge algorithm.
    URLAuthPolicy:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/URLAuthPolicyFields'
        - type: object
          required: [id, scope_id, site, current_key, version, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            scope_id: {type: string, format: uuid}
            owner:
              description: Present only for platform identities.
              oneOf:
                - $ref: '#/components/schemas/URLAuthOwner'
                - type: 'null'
            site: {$ref: '#/components/schemas/URLAuthSite'}
            migration_marker: {$ref: '#/components/schemas/URLAuthMigrationMarker'}
            current_key: {$ref: '#/components/schemas/URLAuthKeyMetadata'}
            previous_key: {$ref: '#/components/schemas/URLAuthKeyMetadata'}
            version: {type: integer, format: int64, minimum: 1}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    URLAuthPolicyList:
      type: object
      additionalProperties: false
      required: [items, total, page, limit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/URLAuthPolicy'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1, maximum: 100}
    URLAuthWriteResult:
      type: object
      additionalProperties: false
      required: [policy, replayed]
      properties:
        policy: {$ref: '#/components/schemas/URLAuthPolicy'}
        replayed: {type: boolean}
    URLAuthSecretWriteResult:
      type: object
      additionalProperties: false
      required: [policy, replayed]
      properties:
        policy: {$ref: '#/components/schemas/URLAuthPolicy'}
        secret:
          type: string
          minLength: 43
          maxLength: 43
          description: Present only in the first successful create or rotate response. Never persisted in idempotency responses.
        replayed: {type: boolean}
    RevokeURLAuthKeyRequest:
      type: object
      additionalProperties: false
      required: [key_id]
      properties:
        key_id: {type: string, pattern: '^k-[0-9a-f-]{36}$'}
    URLAuthEdgeKey:
      type: object
      additionalProperties: false
      required: [key_id, key_file]
      properties:
        key_id: {type: string, pattern: '^k-[0-9a-f-]{36}$'}
        key_file: {type: string, pattern: '^/var/lib/cdnca/urlauth/keys/.+\\.key$'}
    URLAuthEdgePolicy:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - policy_version
        - tenant_id
        - site_id
        - algorithm
        - signature_parameter
        - expiration_parameter
        - key_id_parameter
        - bind_client_ip
        - max_clock_skew_seconds
        - max_validity_seconds
        - max_signature_uses
        - excluded_query_parameters
        - trusted_proxies
        - current_key
      properties:
        schema_version: {type: string, const: cdnca.edge.urlauth/v1}
        policy_version: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        tenant_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        algorithm: {type: string, const: hmac-sha256}
        signature_parameter: {type: string, pattern: '^[A-Za-z0-9_.~-]{1,64}$'}
        expiration_parameter: {type: string, pattern: '^[A-Za-z0-9_.~-]{1,64}$'}
        key_id_parameter: {type: string, pattern: '^[A-Za-z0-9_.~-]{1,64}$'}
        bind_client_ip: {type: boolean}
        max_clock_skew_seconds: {type: integer, minimum: 0, maximum: 300}
        max_validity_seconds: {type: integer, minimum: 1, maximum: 86400}
        max_signature_uses: {type: integer, minimum: 0, maximum: 1000000}
        excluded_query_parameters: {type: array, maxItems: 32, uniqueItems: true, items: {type: string}}
        trusted_proxies: {type: array, maxItems: 64, uniqueItems: true, items: {type: string}}
        current_key: {$ref: '#/components/schemas/URLAuthEdgeKey'}
        previous_key: {$ref: '#/components/schemas/URLAuthEdgeKey'}
    URLAuthSnapshotResult:
      type: object
      additionalProperties: false
      required: [policy_id, version, sha256, document]
      properties:
        policy_id: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        document: {$ref: '#/components/schemas/URLAuthEdgePolicy'}
    APIKeyIPAllowlist:
      type: array
      maxItems: 32
      uniqueItems: true
      default: []
      description: >-
        Canonical network CIDRs only: no host bits, zones, IPv4-mapped IPv6,
        duplicate prefixes, or overlaps. Empty means unrestricted.
      items:
        type: string
        minLength: 3
        maxLength: 43
        pattern: '^(?:[0-9]{1,3}(?:\.[0-9]{1,3}){3}/(?:[0-9]|[12][0-9]|3[0-2])|[0-9a-f:]+/(?:[0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))$'
    APIKeyStatus:
      type: string
      description: pending_activation becomes active only through owner activation; revoked is terminal.
      enum: [pending_activation, active, revoked]
    APIKey:
      type: object
      additionalProperties: false
      required:
        - id
        - key_id
        - key_prefix
        - scope_id
        - tenant_id
        - user_id
        - name
        - scopes
        - ip_allowlist
        - status
        - revision
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        key_id: {type: string, pattern: '^cfk_[A-Za-z0-9_-]{22}$'}
        key_prefix: {type: string, pattern: '^cfk_[A-Za-z0-9_-]{22}\.$'}
        scope_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        scopes:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          description: >-
            Strict safe subset of the owner's current RBAC permissions. platform.admin, identity.*, and
            api_keys.* are forbidden.
          items: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$'}
        ip_allowlist: {$ref: '#/components/schemas/APIKeyIPAllowlist'}
        status: {$ref: '#/components/schemas/APIKeyStatus'}
        pending_expires_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        activated_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    APIKeyFieldsRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        scopes:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$'}
        ip_allowlist: {$ref: '#/components/schemas/APIKeyIPAllowlist'}
        expires_at:
          type: string
          format: date-time
          description: Must be in the future and no more than 366 days from the server clock.
    AdminCreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        scopes:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$'}
        ip_allowlist: {$ref: '#/components/schemas/APIKeyIPAllowlist'}
        expires_at:
          type: string
          format: date-time
          description: Must be in the future and no more than 366 days from the server clock.
        pending_ttl_seconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 2592000
          default: 604800
    APIKeyMutationRequest:
      type: object
      additionalProperties: false
      required: [ip_allowlist]
      description: >-
        Exact current IP allowlist. It participates in revision and idempotency
        binding and must remain unchanged when retrying an unknown result.
      properties:
        ip_allowlist: {$ref: '#/components/schemas/APIKeyIPAllowlist'}
        grant_all_scopes:
          type: boolean
          default: false
          description: >-
            Rotate only. When true, the rotation also replaces the key scopes with
            every permission the current session may grant to an API key (the
            simple-mode "reset key"). It is part of the idempotency binding.
            Other operations reject true with 400 invalid_request.
    APIKeyList:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/APIKey'}
        next_cursor:
          type: string
          maxLength: 4096
          description: Empty on the terminal page; otherwise pass unchanged as cursor to the next request.
        has_more:
          type: boolean
          description: True exactly when next_cursor is non-empty.
        total:
          type: integer
          minimum: 0
          description: >-
            Exact filtered key count at the page snapshot. Present on the first page and on offset
            pages; omitted on cursor continuation pages.
    IssuedAPIKey:
      type: object
      additionalProperties: false
      required: [key, secret]
      properties:
        key: {$ref: '#/components/schemas/APIKey'}
        secret:
          type: string
          writeOnly: true
          format: password
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: One-time base64url secret. Prefix with key.key_id and a dot when building CdncaKey credentials.
    APIKeyValidationCode:
      type: string
      enum:
        - api_key_ip_allowlist_invalid_cidr
        - api_key_ip_allowlist_unsupported_prefix
        - api_key_ip_allowlist_duplicate
        - api_key_ip_allowlist_overlap
        - api_key_ip_allowlist_too_many
        - invalid_request
        - validation_error
    APIKeyErrorParams:
      type: object
      additionalProperties: false
      description: >-
        Validation metadata only. It never contains secret material, credential
        digests, submitted CIDRs, matched CIDRs, or matching network prefixes.
      properties:
        field: {type: string, const: ip_allowlist}
        index: {type: integer, minimum: 0, maximum: 31}
        duplicate_of: {type: integer, minimum: 0, maximum: 31}
        overlaps: {type: integer, minimum: 0, maximum: 31}
        maximum: {type: integer, const: 32}
        actual: {type: integer, minimum: 33}
    APIKeyErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: {$ref: '#/components/schemas/APIKeyValidationCode'}
            message: {type: string, minLength: 1, maxLength: 256}
            request_id: {type: string, minLength: 1, maxLength: 128}
            params: {$ref: '#/components/schemas/APIKeyErrorParams'}
    DNSProvider:
      type: object
      additionalProperties: false
      required: [id, scope_id, name, provider_type, credentials_configured, status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        scope_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        provider_type:
          type: string
          description: dnsdun is a disabled legacy read-only value; new configurations use dns_la.
          enum: [aliyun, cloudflare, huawei, dnspod_cn, dns_com, dns_la, namecom, custom_http, dnsdun]
        credentials_configured: {type: boolean, const: true}
        status:
          type: string
          enum: [unverified, verified, disabled]
        managed_by:
          type: string
          enum: [tenant, platform]
          description: 'tenant = an account the tenant entered; platform = the read-only platform DNS copy (only the platform-allocated CNAME records and platform administrators use it; dns_provider_platform_managed otherwise)'
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DNSSettings:
      type: object
      additionalProperties: false
      required: [scope_id, ttl, version]
      properties:
        scope_id: {type: string, format: uuid}
        ttl: {type: integer, minimum: 1, maximum: 604800}
        version: {type: integer, format: int64, minimum: 1}
        updated_at: {type: string, format: date-time}
    UpdateDNSSettings:
      type: object
      additionalProperties: false
      required: [ttl]
      properties:
        ttl: {type: integer, minimum: 1, maximum: 604800}
    PlatformDNSConfig:
      type: object
      required: [identifiers, secret_saved, ttl, ip_weight, weight_supported, version, sync, last_error]
      properties:
        provider_type: {type: string}
        identifiers: {type: object, additionalProperties: {type: string}, description: Non-secret credential fields (ID, Huawei region and project).}
        secret_saved: {type: boolean}
        ttl: {type: integer}
        ip_weight: {type: boolean}
        weight_supported: {type: boolean, description: The provider writes record weights (DNSPod).}
        version: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
        sync:
          type: object
          required: [tenants]
          properties:
            tenants: {type: integer, minimum: 0}
            error: {type: string}
            at: {type: string, format: date-time}
        last_error:
          nullable: true
          type: object
          required: [source, code, at]
          properties:
            source: {type: string, enum: [platform_sync, cname_allocation, cname_retarget, dns_repair, dns_cleanup]}
            code: {type: string}
            message: {type: string}
            at: {type: string, format: date-time}
    PlatformDNSZoneInput:
      type: object
      additionalProperties: false
      required: [name, remark]
      properties:
        name: {type: string, minLength: 1, maxLength: 253}
        remark: {type: string, maxLength: 255}
        random_allocation: {type: boolean, description: '参与随机分配. New sites without a CNAME domain draw one of the marked domains (any DNS provider); with none marked they use the default CNAME domain. Allocated CNAMEs do not move. Omitted on update keeps the current value; omitted on create is false.'}
    PlatformDNSZone:
      type: object
      required: [id, display_id, name, remark, in_use, random_allocation, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        display_id: {type: integer, minimum: 1}
        name: {type: string}
        remark: {type: string}
        in_use: {type: boolean, description: Some tenant still has CNAME hostnames allocated under this domain.}
        random_allocation: {type: boolean, description: 参与随机分配 (see PlatformDNSZoneInput).}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DNSOperation:
      type: object
      additionalProperties: false
      required: [id, kind, subject, state, attempt, max_attempts, progress, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [dns.repair.v1, dns.cleanup.v1]}
        subject: {type: string}
        state: {type: string, enum: [queued, running, succeeded, partial_failed, failed, cancelled]}
        attempt: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        progress:
          type: object
          additionalProperties: false
          required: [total, completed, succeeded, failed, cancelled, pending]
          properties:
            total: {type: integer, minimum: 0}
            completed: {type: integer, minimum: 0}
            succeeded: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            cancelled: {type: integer, minimum: 0}
            pending: {type: integer, minimum: 0}
        last_error_code: {type: string}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    DNSOperationResponse:
      type: object
      additionalProperties: false
      required: [operation, replayed]
      properties:
        operation: {$ref: '#/components/schemas/DNSOperation'}
        replayed: {type: boolean}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready]
    ControlUpgradeCheckRequest:
      type: object
      additionalProperties: false
      required: [component, current_version, channel]
      properties:
        component:
          type: string
          minLength: 1
          maxLength: 96
          pattern: '^[a-z][a-z0-9._-]*$'
        current_version:
          type: string
          description: Canonical SemVer without a v prefix or build metadata.
          pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
        channel:
          type: string
          minLength: 1
          maxLength: 96
          pattern: '^[a-z][a-z0-9._-]*$'
    ControlUpgradeEntitlementDecision:
      type: object
      additionalProperties: false
      required: [serial, channel, min_version, max_version]
      properties:
        serial:
          type: integer
          format: int64
          minimum: 1
        channel:
          type: string
        min_version:
          type: string
        max_version:
          type: string
    ControlUpgradePolicyDecision:
      type: object
      additionalProperties: false
      required: [source, stale]
      properties:
        source:
          type: string
          enum: [default, global, installation]
        target_revision_id:
          type: string
          format: uuid
        stale:
          type: boolean
    ControlUpgradeCheckResponse:
      type: object
      additionalProperties: false
      required: [eligible, reason, component, current_version, channel, policy]
      properties:
        eligible:
          type: boolean
        reason:
          type: string
          enum:
            - eligible
            - entitlement_unavailable
            - entitlement_invalid
            - entitlement_state_denied
            - entitlement_channel_mismatch
            - entitlement_version_denied
            - platform_policy_stale
            - release_channel_denied
        component:
          type: string
        current_version:
          type: string
        channel:
          type: string
        entitlement:
          $ref: '#/components/schemas/ControlUpgradeEntitlementDecision'
        policy:
          $ref: '#/components/schemas/ControlUpgradePolicyDecision'
    ControlUpgradeRolloutState:
      type: string
      enum: [queued, canary, running, paused, rolling_back, completed, failed]
    ControlUpgradeRevision:
      type: string
      description: Canonical decimal uint63 in the inclusive range 1..9223372036854775807.
      pattern: '^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9(?:[0-1][0-9]{17}|2(?:[0-1][0-9]{16}|2(?:[0-2][0-9]{15}|3(?:[0-2][0-9]{14}|3(?:[0-6][0-9]{13}|7(?:[0-1][0-9]{12}|20(?:[0-2][0-9]{10}|3(?:[0-5][0-9]{9}|6(?:[0-7][0-9]{8}|8(?:[0-4][0-9]{7}|5(?:[0-3][0-9]{6}|4(?:[0-6][0-9]{5}|7(?:[0-6][0-9]{4}|7(?:[0-4][0-9]{3}|5(?:[0-7][0-9]{2}|80[0-7]))))))))))))))))$'
    ControlUpgradeNodeState:
      type: string
      enum: [pending, dispatched, healthy, failed, rolled_back]
    CreateControlUpgradeRolloutRequest:
      type: object
      additionalProperties: false
      required: [schema, node_ids, canary_node_ids, batch_size, automatic_rollback]
      properties:
        schema:
          type: string
          const: cdnca.control-upgrade-rollout.create/v1
        node_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: Canonical lowercase UUIDs in strictly increasing byte order.
          items: { type: string, format: uuid }
        canary_node_ids:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: One or two strictly sorted canonical UUIDs, each also present in node_ids.
          items: { type: string, format: uuid }
        batch_size:
          type: integer
          minimum: 1
          maximum: 100
        automatic_rollback:
          type: boolean
          const: true
    ControlUpgradeRolloutActionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, reason]
      properties:
        expected_revision:
          $ref: '#/components/schemas/ControlUpgradeRevision'
        reason:
          type: string
          minLength: 1
          maxLength: 96
          pattern: '^[a-z][a-z0-9_]*$'
    ControlUpgradeRolloutBlocker:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [irreversible_migration, rollback_unavailable, agent_incompatible, protocol_incompatible]
        node_id:
          type: string
          format: uuid
    ControlUpgradeRolloutFields:
      type: object
      required:
        - id
        - schema_version
        - installation_id
        - component
        - current_version
        - target_version
        - state
        - completion
        - revision
        - automatic_rollback
        - parent_grant_id
        - artifact_id
        - artifact_sha256
        - artifact_size_bytes
        - rollback_artifact_id
        - rollback_artifact_sha256
        - rollback_artifact_size_bytes
        - active_batch
        - total_nodes
        - pending_nodes
        - dispatched_nodes
        - healthy_nodes
        - failed_nodes
        - rolled_back_nodes
        - blockers
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        schema_version: { type: integer, const: 2 }
        installation_id: { type: string, format: uuid }
        component: { type: string, pattern: '^[a-z][a-z0-9._-]{0,95}$' }
        current_version:
          type: string
          description: Canonical SemVer without a v prefix or build metadata.
        target_version:
          type: string
          description: Canonical SemVer without a v prefix or build metadata.
        state: { $ref: '#/components/schemas/ControlUpgradeRolloutState' }
        completion: { type: string, enum: ['', upgraded, rolled_back] }
        revision: { $ref: '#/components/schemas/ControlUpgradeRevision' }
        automatic_rollback: { type: boolean, const: true }
        parent_grant_id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        artifact_sha256:
          type: string
          description: Canonical unpadded base64url SHA-256 of the signed artifact bytes.
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
        artifact_size_bytes: { type: integer, format: int64, minimum: 1 }
        rollback_artifact_id:
          oneOf:
            - { type: string, const: '' }
            - { type: string, format: uuid }
        rollback_artifact_sha256:
          oneOf:
            - { type: string, const: '' }
            - { type: string, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$' }
        rollback_artifact_size_bytes: { type: integer, format: int64, minimum: 0 }
        active_batch: { type: integer, minimum: -1 }
        total_nodes: { type: integer, minimum: 1 }
        pending_nodes: { type: integer, minimum: 0 }
        dispatched_nodes: { type: integer, minimum: 0 }
        healthy_nodes: { type: integer, minimum: 0 }
        failed_nodes: { type: integer, minimum: 0 }
        rolled_back_nodes: { type: integer, minimum: 0 }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/ControlUpgradeRolloutBlocker' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ControlUpgradeRolloutSummary:
      allOf:
        - $ref: '#/components/schemas/ControlUpgradeRolloutFields'
      unevaluatedProperties: false
    ControlUpgradeRolloutBatch:
      type: object
      additionalProperties: false
      required: [id, group_id, canary, node_ids]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,95}$' }
        canary: { type: boolean }
        node_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    ControlUpgradeRolloutNode:
      type: object
      additionalProperties: false
      required: [node_id, agent_version, protocol_version, state, dispatch_revision]
      properties:
        node_id: { type: string, format: uuid }
        agent_version: { type: string }
        protocol_version: { type: integer, format: int32, minimum: 1 }
        state: { $ref: '#/components/schemas/ControlUpgradeNodeState' }
        dispatch_revision:
          oneOf:
            - { type: string, const: '0' }
            - { $ref: '#/components/schemas/ControlUpgradeRevision' }
    ControlUpgradeRolloutEvent:
      type: object
      additionalProperties: false
      required: [id, revision, from, to, action, reason, batch_id, node_id]
      properties:
        id: { type: string, format: uuid }
        revision: { $ref: '#/components/schemas/ControlUpgradeRevision' }
        from: { $ref: '#/components/schemas/ControlUpgradeRolloutState' }
        to: { $ref: '#/components/schemas/ControlUpgradeRolloutState' }
        action:
          type: string
          enum: [start, pause, resume, rollback, health_failed, health_succeeded, outcome_uncertain]
        reason: { type: string, pattern: '^[a-z][a-z0-9_]{0,95}$' }
        batch_id: { type: string, format: uuid }
        node_id:
          oneOf:
            - { type: string, const: '' }
            - { type: string, format: uuid }
    ControlUpgradeStatusReceipt:
      type: object
      additionalProperties: false
      required: [status_id, status_revision, command_id, plan_id, plan_revision, batch_id,
        installation_id, node_id, action, command_sha256, status_sha256, state, observed_at,
        delivery_stream, delivery_consumer, delivery_sequence]
      properties:
        status_id: { type: string, format: uuid }
        status_revision: { $ref: '#/components/schemas/ControlUpgradeRevision' }
        command_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        plan_revision: { $ref: '#/components/schemas/ControlUpgradeRevision' }
        batch_id: { type: string, format: uuid }
        installation_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        action: { type: string, enum: [upgrade, rollback] }
        command_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        status_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        state:
          type: string
          enum: [accepted, claimed, installing, healthy, failed, rolling_back, rolled_back, uncertain]
        observed_at: { type: string, format: date-time }
        delivery_stream:
          oneOf:
            - { type: string, const: '' }
            - { type: string, const: AGENT_DEPLOYMENT_STATUS }
          description: Empty only for immutable receipts created before migration 102; new receipts bind the exact JetStream stream.
        delivery_consumer:
          type: string
          pattern: '^(|[A-Za-z0-9_-]{1,128})$'
          description: Empty only for immutable receipts created before migration 102.
        delivery_sequence:
          oneOf:
            - { type: string, const: '0' }
            - { $ref: '#/components/schemas/ControlUpgradeRevision' }
          description: Decimal JetStream stream sequence; zero only identifies a pre-migration legacy receipt.
        error_code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: >-
            Stable node updater failure code (for example DOWNLOAD_FAILED or HEALTH_FAILED); omitted when the node
            reported none. RUNTIME_* codes mean the native OpenResty/Lua runtime of the release could not be switched
            and the node kept its previous runtime: RUNTIME_SIGNATURE_INVALID, RUNTIME_AGENT_MISMATCH,
            RUNTIME_NOT_PACKAGED, RUNTIME_INSTALL_FAILED, RUNTIME_PRECHECK_FAILED, RUNTIME_SWITCH_FAILED,
            RUNTIME_RELOAD_FAILED, RUNTIME_STATUS_UNAVAILABLE.
        current_version: { type: string, maxLength: 128, description: Agent version the node reported running; omitted when unknown. }
        previous_version: { type: string, maxLength: 128, description: Agent version before this command; omitted when unknown. }
    ControlUpgradeRolloutDetail:
      allOf:
        - $ref: '#/components/schemas/ControlUpgradeRolloutFields'
        - type: object
          required: [batches, nodes, events, status_receipts]
          properties:
            batches:
              type: array
              items: { $ref: '#/components/schemas/ControlUpgradeRolloutBatch' }
            nodes:
              type: array
              items: { $ref: '#/components/schemas/ControlUpgradeRolloutNode' }
            events:
              type: array
              items: { $ref: '#/components/schemas/ControlUpgradeRolloutEvent' }
            status_receipts:
              type: array
              items: { $ref: '#/components/schemas/ControlUpgradeStatusReceipt' }
