      name: dimension
      in: path
      required: true
      description: >-
        region is the ISO country code, province the GB/T 2260 province code (both from the control plane's
        IP library at ingest), browser and os the node's User-Agent families. Empty values are returned as
        __unknown__. ip, domain, region, carrier, province, browser and os rank from the hourly history facts;
        url, ja4 and referer from the access log (see page.source and page.retained_from).
      schema:
        type: string
        enum: [url, ip, domain, region, carrier, ja4, referer, province, browser, os]
    AnalyticsLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    AnalyticsCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to the authenticated scope, filters, dimension, and snapshot.
      schema: {type: string, maxLength: 8192}
  requestBodies:
    httpPolicyEmptyObject:
      $ref: '../../control-http-policies.openapi.yaml#/components/requestBodies/EmptyObject'
    originAuthEmptyObject:
      $ref: '../../control-origin-auth.openapi.yaml#/components/requestBodies/EmptyObject'
    ControlUpgradeRolloutAction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ControlUpgradeRolloutActionRequest'
  schemas:
    BillingBridgeKey:
      type: object
      required: [id, key_id, owner_scope_id, owner_kind, name, ip_allowlist, status, expires_at, last_used_at, created_by, revision, created_at, updated_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        key_id: {type: string, pattern: '^cbb_[A-Za-z0-9_-]{22}$'}
        owner_scope_id: {type: string, format: uuid}
        owner_kind: {type: string, enum: [platform, reseller]}
        name: {type: string, minLength: 1, maxLength: 64}
        ip_allowlist: {type: array, minItems: 1, maxItems: 32, items: {type: string}}
        status: {type: string, enum: [active, revoked]}
        expires_at: {type: string, format: date-time, nullable: true}
        last_used_at: {type: string, format: date-time, nullable: true}
        created_by: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time, nullable: true}
    BillingBridgeIssuedKey:
      type: object
      required: [key, secret]
      properties:
        key: {$ref: '#/components/schemas/BillingBridgeKey'}
        secret: {type: string, description: 'Shown once; sign requests with it (cbs_ + 43 base64url characters).'}
    BillingBridgeKeyPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BillingBridgeKey'}}
        next_cursor: {type: string}
        has_more: {type: boolean}
    BillingBridgeKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [name, ip_allowlist, step_up_token]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        ip_allowlist: {type: array, minItems: 1, maxItems: 32, items: {type: string}}
        expires_at: {type: string, format: date-time, nullable: true}
        step_up_token: {type: string}
    BillingBridgeKeyMutationRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, step_up_token]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        step_up_token: {type: string}
    BillingBridgeLogEntry:
      type: object
      required: [id, key_id, owner_scope_id, action, external_service_id, result, reason_code, http_status, duration_ms, source_ip, created_at]
      properties:
        id: {type: string, format: uuid}
        key_id: {type: string}
        owner_scope_id: {type: string, format: uuid}
        action: {type: string}
        external_service_id: {type: string, nullable: true}
        result: {type: string, enum: [success, failure, denied]}
        reason_code: {type: string, nullable: true}
        http_status: {type: integer}
        duration_ms: {type: integer}
        source_ip: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    BillingBridgeSettings:
      type: object
      additionalProperties: false
      required: [sso_require_mfa, revision]
      properties:
        sso_require_mfa: {type: boolean}
        revision: {type: integer, format: int64, minimum: 0}
        updated_at: {type: string, format: date-time}
    BillingBridgeSettingsUpdate:
      type: object
      additionalProperties: false
      required: [sso_require_mfa, expected_revision, step_up_token]
      properties:
        sso_require_mfa: {type: boolean}
        expected_revision: {type: integer, format: int64, minimum: 0}
        step_up_token: {type: string, minLength: 1, maxLength: 4096}
    BillingBridgeLogPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BillingBridgeLogEntry'}}
        next_cursor: {type: string}
        has_more: {type: boolean}
    BillingBridgePing:
      type: object
      required: [owner_kind, owner_scope_id, module_enabled, server_time]
      properties:
        owner_kind: {type: string, enum: [platform, reseller]}
        owner_scope_id: {type: string, format: uuid}
        module_enabled: {type: boolean}
        server_time: {type: string, format: date-time}
    BillingBridgeExternalSystem: {type: string, enum: [whmcs, zjmf, zjmf_cbap]}
    BillingBridgeExternalID: {type: string, minLength: 1, maxLength: 64, pattern: '^[!-~]{1,64}$'}
    BillingBridgePeriod: {type: string, enum: [month, quarter, year]}
    BillingBridgeProduct:
      type: object
      required: [id, revision, name, periods, site_limit, node_limit]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        periods:
          type: array
          items:
            type: object
            required: [period, price_minor]
            properties:
              period: {$ref: '#/components/schemas/BillingBridgePeriod'}
              price_minor: {type: integer, format: int64}
              wholesale_minor: {type: integer, format: int64, nullable: true, description: Reseller key only.}
        site_limit: {type: integer, format: int64}
        node_limit: {type: integer, format: int64}
    BillingBridgeCreateService:
      type: object
      additionalProperties: false
      required: [external_system, external_service_id, external_client_id, client, product_id, period]
      properties:
        external_system: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}
        external_service_id: {$ref: '#/components/schemas/BillingBridgeExternalID'}
        external_client_id: {$ref: '#/components/schemas/BillingBridgeExternalID'}
        client:
          type: object
          additionalProperties: false
          required: [email]
          properties:
            email: {type: string, format: email}
            username: {type: string, minLength: 3, maxLength: 120}
            display_name: {type: string, minLength: 1, maxLength: 128}
        product_id: {type: string, format: uuid}
        product_revision: {type: integer, format: int64, minimum: 1}
        period: {$ref: '#/components/schemas/BillingBridgePeriod'}
    BillingBridgeSuspend:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 256}
    BillingBridgeRenew:
      type: object
      additionalProperties: false
      properties:
        period: {$ref: '#/components/schemas/BillingBridgePeriod'}
    BillingBridgeChange:
      type: object
      additionalProperties: false
      required: [product_id]
      properties:
        product_id: {type: string, format: uuid}
        product_revision: {type: integer, format: int64, minimum: 1}
        period: {$ref: '#/components/schemas/BillingBridgePeriod'}
    BillingBridgeService:
      type: object
      required: [external_system, external_service_id, external_client_id, status, product, period, starts_at, ends_at,
        suspended_at, user, console_url, created]
      properties:
        external_system: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}
        external_service_id: {type: string}
        external_client_id: {type: string}
        status: {type: string, enum: [active, suspended, terminated]}
        product:
          type: object
          required: [id, revision, name]
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer, format: int64}
            name: {type: string}
        period: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        suspended_at: {type: string, format: date-time, nullable: true}
        user:
          type: object
          required: [id, username, email]
          properties:
            id: {type: string, format: uuid}
            username: {type: string}
            email: {type: string, nullable: true}
        console_url: {type: string}
        created: {type: boolean}
    BillingBridgeServiceEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/BillingBridgeService'}
    BillingBridgeUsage:
      type: object
      required: [external_service_id, period_start, period_end, traffic_bytes, peak_bandwidth_bps, bandwidth_95th_bps,
        finalized_through]
      properties:
        external_service_id: {type: string}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        traffic_bytes: {type: integer, format: int64}
        peak_bandwidth_bps: {type: integer, format: int64}
        bandwidth_95th_bps: {type: integer, format: int64}
        finalized_through: {type: string, format: date-time}
    AgentGateway:
      type: object
      required: [id, name, host, enrollment_port, agent_port, status, version, created_at, bound_at, ready_at, client_certificate_expires_at, server_certificate_expires_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        host: {type: string}
        enrollment_port: {type: [integer, 'null']}
        agent_port: {type: [integer, 'null']}
        status: {type: string, enum: [pending, bound, active, disabled]}
        version: {type: string}
        created_at: {type: string, format: date-time}
        bound_at: {type: [string, 'null'], format: date-time}
        ready_at: {type: [string, 'null'], format: date-time}
        client_certificate_expires_at: {type: [string, 'null'], format: date-time}
        server_certificate_expires_at: {type: [string, 'null'], format: date-time}
        source_ip: {type: [string, 'null'], description: Address the binding request came from.}
        allowed_ips: {type: array, items: {type: string}, description: 'Addresses ControlInternal, Redis and NATS accept from this Gateway (default source_ip; the nftables set mirrors them).'}
    AgentGatewaySettings:
      type: object
      additionalProperties: false
      required: [trusted_proxies, entrypoints]
      properties:
        trusted_proxies:
          type: array
          maxItems: 512
          description: Trusted CDN back-to-origin ranges (ADR 0013 §4.4). Only Cloudflare is preset (CF-Connecting-IP); an empty header binds X-Forwarded-For.
          items:
            type: object
            additionalProperties: false
            required: [cidr]
            properties:
              cidr: {type: string}
              header: {type: string, pattern: '^[A-Za-z0-9-]{1,64}$'}
        entrypoints:
          type: array
          maxItems: 16
          description: Extra node entry points listed after the online Gateways (ADR 0013 §4.5), e.g. a CDN's 443 with transport ws.
          items:
            type: object
            additionalProperties: false
            required: [address, server_name, transport]
            properties:
              address: {type: string, description: host:port}
              server_name: {type: string, description: Gateway certificate name (inner TLS).}
              transport: {type: string, enum: [grpc, ws]}
              tunnel_host: {type: string, description: Outer SNI/Host of a ws entry (ws only).}
    AgentGatewayBindingToken:
      type: object
      required: [gateway, binding_token, token_expires_at]
      properties:
        gateway: {$ref: '#/components/schemas/AgentGateway'}
        binding_token: {type: string}
        token_expires_at: {type: string, format: date-time}
    AgentGatewayBindResult:
      type: object
      required: [gateway_id, installation_id, workload_uri_san, client_certificate_pem, server_certificate_pem, root_ca_pem, node_ca_pem, endpoints]
      properties:
        gateway_id: {type: string, format: uuid}
        installation_id: {type: string, format: uuid}
        workload_uri_san: {type: string}
        client_certificate_pem: {type: string}
        server_certificate_pem: {type: string}
        root_ca_pem: {type: string}
        node_ca_pem: {type: string}
        endpoints:
          type: object
          required: [control_internal_address, control_internal_server_name, redis_url, nats_url, telemetry_nats_url]
          properties:
            control_internal_address: {type: string}
            control_internal_server_name: {type: string}
            redis_url: {type: string}
            nats_url: {type: string}
            telemetry_nats_url: {type: string}
    PluginProvider:
      type: object
      additionalProperties: false
      required: [plugin_id, version, base_url, kinds, status, contract_status, enabled, usable, updated_at]
      properties:
        plugin_id: {type: string}
        version: {type: string}
        base_url: {type: string, format: uri}
        kinds:
          type: array
          items: {enum: [dns, icp, payment, sms]}
        status: {enum: [active, withdrawn]}
        contract_status: {enum: [pending, passed, failed]}
        contract_version: {type: string}
        contract_checked_at: {type: string, format: date-time}
        contract_report:
          type: object
          additionalProperties: false
          required: [version, passed, cases, duration_ms]
          properties:
            version: {type: string}
            passed: {type: boolean}
            duration_ms: {type: integer}
            cases:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [kind, id, passed]
                properties:
                  kind: {enum: [dns, icp, payment, sms]}
                  id: {type: string}
                  passed: {type: boolean}
                  code: {type: string}
        enabled: {type: boolean}
        usable: {type: boolean}
        updated_at: {type: string, format: date-time}
        high_risk:
          type: boolean
          description: The plugin provides payment (PA-23); enabling it needs risk_acknowledged and an MFA step-up.
        risk_notice: {type: string}
        tenant_id:
          type: string
          format: uuid
          description: Tenant of the plugin installation; the step-up proof is issued for it.
        payment_confirmed_at: {type: string, format: date-time}
    PluginUIPage:
      type: object
      additionalProperties: false
      required: [plugin_id, plugin_version, page_id, origin, url, mount, role, title, has_api]
      properties:
        plugin_id: {type: string}
        plugin_version: {type: string}
        page_id: {type: string}
        origin: {type: string, pattern: '^https://[a-z0-9.-]+$'}
        url: {type: string, description: origin + page path (the iframe src)}
        mount: {enum: [menu, site_tab]}
        menu_parent: {type: string}
        role: {enum: [admin, user]}
        title:
          type: object
          additionalProperties: false
          required: [zh-CN]
          properties:
            zh-CN: {type: string}
            en-US: {type: string}
        required_permission: {type: string}
        required_module: {type: string}
        has_api: {type: boolean, description: the plugin declared a backend reachable through the proxy}
