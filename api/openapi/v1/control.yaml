                        domain: {type: string}
                  page: {type: integer}
                  limit: {type: integer}
                  total: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/reseller/customers/{user_id}/status:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: setResellerCustomerStatus
      summary: A reseller suspends (disabled) or resumes (active) one of its customers
      description: >-
        Only the owner user of the caller's own customer tenant; anything else is 404. Disabling revokes the user's
        sessions. Audit reseller.customer.status in both scopes. 409 version_conflict on a stale expected_revision.
      x-required-permissions: [reseller.customers.manage]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, expected_revision]
              properties:
                status: {type: string, enum: [active, disabled]}
                expected_revision: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: The customer's owner user after the change.
          content: {application/json: {schema: {$ref: '#/components/schemas/ManagedUser'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/resellers:
    get:
      operationId: listResellers
      summary: List reseller profiles (ADR 0018)
      x-required-permissions: [identity.users.manage]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every reseller, active first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ResellerProfile'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/resellers/{scope_id}:
    parameters:
      - {name: scope_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getReseller
      summary: Read a reseller profile
      x-required-permissions: [identity.users.manage]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile.
          content: {application/json: {schema: {$ref: '#/components/schemas/ResellerProfile'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: putReseller
      summary: Open a tenant as a reseller, suspend or resume it, set its parameters
      description: >-
        revision 0 opens the tenant as a reseller (status must be active); otherwise revision is the current one.
        An active reseller's tenant_owner role holds reseller.packages.manage, reseller.customers.manage and
        reseller.customers.read; suspending takes them away (customers and sold subscriptions stay). A tenant under a
        reseller cannot become one (422 reseller_one_level). Prepaid wholesale (ADR 0018 §5, RS-03): each order of the
        reseller's package charges its wholesale cost W (by wholesale_price_list) from the prepaid balance; when an order
        takes the balance below low_balance_minor the reseller is notified (reseller.prepaid.low_balance).
      x-required-permissions: [identity.users.manage]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, revision]
              properties:
                status: {type: string, enum: [active, suspended]}
                customer_limit: {type: [integer, 'null'], minimum: 0, maximum: 1000000, description: null = unlimited}
                wholesale_price_list: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', default: standard}
                low_balance_minor: {type: integer, format: int64, minimum: 0, default: 0}
                revision: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: The profile after the write.
          content: {application/json: {schema: {$ref: '#/components/schemas/ResellerProfile'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/reseller-wholesale-prices:
    get:
      operationId: listResellerWholesalePrices
      summary: List wholesale prices (ADR 0018 RS-03)
      description: >-
        Prices per (price list, platform line group, period) in fen. A reseller's order costs the main line group's
        price plus the backup's (where priced) for the order's period; a package whose main line group has no price
        for a period cannot be sold for it.
      x-required-permissions: [identity.users.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: price_list, in: query, required: false, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}}
      responses:
        '200':
          description: Prices ordered by list, line group name and period.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ResellerWholesalePrice'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/reseller-wholesale-prices/{price_list}/{line_group_id}/{period}:
    parameters:
      - {name: price_list, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}}
      - {name: line_group_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: period, in: path, required: true, schema: {type: string, enum: [month, quarter, year]}}
    put:
      operationId: putResellerWholesalePrice
      summary: Set one wholesale price (audited reseller.wholesale_price.put)
      description: >-
        Conditional write. expected_updated_at is the updated_at of the row the caller read, or null to create a
        row that does not exist yet; if the current row differs (changed, deleted or created by someone else) the
        write is refused with 409 wholesale_price_conflict and nothing changes. Every write moves updated_at
        forward. The line group must be one of the platform's own line groups (404 reseller_not_found otherwise).
      x-required-permissions: [identity.users.manage]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [price_minor, expected_updated_at]
              properties:
                price_minor: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
                expected_updated_at: {type: string, format: date-time, nullable: true, description: 'updated_at of the row the caller read; null = create.'}
      responses:
        '200':
          description: The price after the write.
          content: {application/json: {schema: {$ref: '#/components/schemas/ResellerWholesalePrice'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteResellerWholesalePrice
      summary: Remove one wholesale price (audited reseller.wholesale_price.delete)
      description: >-
        Conditional delete: removes the row only if its updated_at still equals expected_updated_at
        (409 wholesale_price_conflict otherwise; 404 when there is no row).
      x-required-permissions: [identity.users.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: expected_updated_at, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '204': {description: Removed.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/users/{id}:
    get:
      operationId: getManagedUser
      summary: Get one tenant user
      description: A platform identity or an unknown tenant user produces the same 404 response.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ManagedUserInclude'
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: Tenant user details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateManagedUser
      summary: Update tenant user profile, status, and role
