  /v1/admin/gateways:
    get:
      operationId: listAgentGateways
      summary: List standalone Agent Gateways (platform session, system.gateway.manage)
      description: ADR 0013 §3.4. The co-located Gateway of an all-mode installation is not listed. standalone_access_open is false until the control plane opens ControlInternal/Redis/NATS to Gateways (GW-09); binding is refused until then.
      responses:
        '200':
          description: Gateways that are not deleted.
          content:
            application/json:
              schema:
                type: object
                required: [items, installation_id, standalone_access_open]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AgentGateway'}}
                  installation_id: {type: string, format: uuid}
                  standalone_access_open: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createAgentGateway
      summary: Add a Gateway and issue its one-time binding token (1 hour, single use, only the SHA-256 is stored)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, host]
              properties:
                name: {type: string, minLength: 1, maxLength: 64}
                host: {type: string, description: Public Gateway name (domain or IP), the server certificate SAN.}
      responses:
        '201': {description: Created; binding_token is shown once., content: {application/json: {schema: {$ref: '#/components/schemas/AgentGatewayBindingToken'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: gateway_name_taken, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: invalid_input, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /v1/admin/gateways/{id}/binding-token:
    post:
      operationId: reissueAgentGatewayBindingToken
      summary: Replace the binding token of a pending Gateway (the previous token stops working)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: New token., content: {application/json: {schema: {$ref: '#/components/schemas/AgentGatewayBindingToken'}}}}
        '404': {description: gateway_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: gateway_state_conflict (already bound), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /v1/admin/gateways/{id}/disable:
    post:
      operationId: disableAgentGateway
      summary: Disable a bound Gateway; its ControlInternal calls are refused
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Disabled.}
        '404': {description: gateway_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: gateway_state_conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /v1/admin/gateways/{id}/enable:
    post:
      operationId: enableAgentGateway
      summary: Re-enable a disabled Gateway
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Enabled.}
        '404': {description: gateway_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: gateway_state_conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /v1/admin/gateways/{id}:
    delete:
      operationId: deleteAgentGateway
      summary: Delete a Gateway; every certificate it was issued is revoked
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Deleted.}
        '404': {description: gateway_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /v1/admin/gateways/{id}/allowed-ips:
    put:
      operationId: setAgentGatewayAllowedIPs
      summary: Replace the addresses a bound Gateway may connect from (IPv4/IPv6, 1–16, audited)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [allowed_ips]
              properties:
                allowed_ips: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
      responses:
        '200': {description: Saved (normalized)., content: {application/json: {schema: {type: object, required: [allowed_ips], properties: {allowed_ips: {type: array, items: {type: string}}}}}}}
        '404': {description: gateway_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: gateway_state_conflict (not bound yet), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: invalid_input, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /v1/admin/gateway-settings:
    get:
      operationId: getAgentGatewaySettings
      summary: Trusted CDN ranges and extra node entry points published to every Gateway
      responses:
        '200':
          description: Settings. ETag is the content digest to send back in If-Match when saving.
          headers:
            ETag: {$ref: '#/components/headers/AgentGatewaySettingsETag'}
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentGatewaySettings'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: updateAgentGatewaySettings
      summary: Replace both lists (Gateways pick them up within a minute; audited)
      description: Optimistic concurrency without a stored revision. If-Match must equal the ETag of the current settings (compared under the table lock); otherwise nothing is written and 409 gateway_settings_changed tells the page to reload.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag returned by the GET (or the previous PUT) the form was loaded from.
          schema: {type: string, pattern: '^"sha256-[0-9a-f]{64}"$'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentGatewaySettings'}}}
      responses:
        '200':
          description: Saved (normalized). ETag is the digest of the saved settings.
          headers:
            ETag: {$ref: '#/components/headers/AgentGatewaySettingsETag'}
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentGatewaySettings'}}}
        '409': {description: gateway_settings_changed (someone else saved since the form was loaded; reload and retry), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: invalid_input, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '428': {description: precondition_required (If-Match missing or repeated), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /v1/gateway-bindings/complete:
    post:
      operationId: completeAgentGatewayBinding
      summary: Gateway installer completes a binding with its one-time token (public, rate limited per source)
      description: ADR 0013 §3.2 step 4. The installer generated both private keys locally and verified the token's root CA fingerprint against /downloads/gateway-ca.pem first. Returns the client certificate (URI SAN spiffe://cdn-platform/gateway/<gateway_id>, 30 days), the node channel server certificate (90 days), CA bundles and the remote endpoints.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, client_csr_der, server_csr_der, enrollment_port, agent_port]
              properties:
                token: {type: string, description: 'gwt1.<gateway_id>.<root CA SHA-256 first 16 bytes hex>.<secret>'}
                client_csr_der: {type: string, format: byte, description: Ed25519 CSR.}
                server_csr_der: {type: string, format: byte, description: ECDSA P-256 CSR.}
                enrollment_port: {type: integer, minimum: 443, maximum: 65535}
                agent_port: {type: integer, minimum: 443, maximum: 65535}
                version: {type: string, maxLength: 64}
      responses:
        '200': {description: Bound., content: {application/json: {schema: {$ref: '#/components/schemas/AgentGatewayBindResult'}}}}
        '401': {description: gateway_binding_token_invalid (unknown, expired, used or for another control plane), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: gateway_remote_access_disabled, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: invalid_input (ports, CSR key type), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '429': {description: rate_limited, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /v1/admin/billing-bridge/keys:
    get:
      operationId: listPlatformBillingBridgeKeys
      summary: List the platform billing bridge keys (ADR 0019 BB-02)
      description: >-
        Bearer session of the platform owner (platform session, billing_bridge.manage). Lease feature module.billing.bridge (403 entitlement_feature_denied when the
        plugin is not enabled). Keys are paged by (created_at DESC, id DESC); the secret is never returned here.
      x-required-permissions: [billing_bridge.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: One page of keys.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeKeyPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: createPlatformBillingBridgeKey
      summary: Create a platform billing bridge key
      description: >-
        Bearer session of the platform owner (platform session, billing_bridge.manage), MFA step-up proof (audience billing-bridge, action billing_bridge.key.create)
        in step_up_token; 403 mfa_step_up_required without it. ip_allowlist is required (1–32 addresses or CIDR
        networks, no /0). The secret is returned once in this response and only its pepper-derived seed is stored.
        Audit billing_bridge.key.created.
      x-required-permissions: [billing_bridge.manage]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeKeyCreateRequest'}
      responses:
        '201':
          description: The key and its one-time secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeIssuedKey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/admin/billing-bridge/keys/{id}/rotate:
    post:
      operationId: rotatePlatformBillingBridgeKey
      summary: Rotate the secret of a platform billing bridge key
      description: >-
        Step-up action billing_bridge.key.rotate bound to the key id. The old secret stops working at once; the new
        one is returned once. 409 revision_conflict on a stale expected_revision, 409 key_revoked for a revoked key.
        Audit billing_bridge.key.rotated.
      x-required-permissions: [billing_bridge.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeKeyMutationRequest'}
      responses:
        '200':
          description: The key and its new one-time secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeIssuedKey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/admin/billing-bridge/keys/{id}/revoke:
    post:
      operationId: revokePlatformBillingBridgeKey
      summary: Revoke a platform billing bridge key
      description: >-
        Step-up action billing_bridge.key.revoke bound to the key id. Revocation is final. Audit
        billing_bridge.key.revoked.
      x-required-permissions: [billing_bridge.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeKeyMutationRequest'}
      responses:
        '200':
          description: The revoked key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeKey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/admin/billing-bridge/logs:
    get:
      operationId: listPlatformBillingBridgeLogs
      summary: List the platform billing bridge call log
      description: >-
        Calls made with the caller's own keys only (owner scope), newest first, cursor paged. Denied calls carry the
        internal reason_code the caller of the bridge never sees. Rows are kept 90 days.
      x-required-permissions: [billing_bridge.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: One page of log rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeLogPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/admin/billing-bridge/settings:
    get:
      operationId: getPlatformBillingBridgeSettings
      summary: Read the platform billing bridge plugin settings
      description: >-
        Platform plugin settings (ADR 0019 Q4). sso_require_mfa defaults to false (bridge SSO skips the second
        factor); revision 0 means never saved. Lease feature module.billing.bridge (403 entitlement_feature_denied).
      x-required-permissions: [billing_bridge.manage]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    put:
      operationId: putPlatformBillingBridgeSettings
      summary: Change the platform billing bridge plugin settings
      description: >-
        Requires a step-up proof (audience billing-bridge, action billing_bridge.settings.update, bound to the owner
        scope): turning MFA off weakens every bridge SSO sign-in. expected_revision is the revision read (0 for the
        first save); a stale revision is 409. Audited as billing_bridge.settings.updated.
      x-required-permissions: [billing_bridge.manage]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeSettingsUpdate'}
      responses:
        '200':
          description: Saved settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/billing-bridge/keys:
    get:
      operationId: listResellerBillingBridgeKeys
      summary: List the reseller billing bridge keys (ADR 0019 BB-02)
      description: >-
        Bearer session of the active reseller (tenant session, reseller.customers.manage; 403 reseller_inactive when the tenant is not an active reseller). Lease feature module.billing.bridge (403 entitlement_feature_denied when the
        plugin is not enabled). Keys are paged by (created_at DESC, id DESC); the secret is never returned here.
      x-required-permissions: [reseller.customers.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: One page of keys.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeKeyPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: createResellerBillingBridgeKey
      summary: Create a reseller billing bridge key
      description: >-
        Bearer session of the active reseller (tenant session, reseller.customers.manage; 403 reseller_inactive when the tenant is not an active reseller), MFA step-up proof (audience billing-bridge, action billing_bridge.key.create)
        in step_up_token; 403 mfa_step_up_required without it. ip_allowlist is required (1–32 addresses or CIDR
        networks, no /0). The secret is returned once in this response and only its pepper-derived seed is stored.
        Audit billing_bridge.key.created.
      x-required-permissions: [reseller.customers.manage]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeKeyCreateRequest'}
      responses:
        '201':
          description: The key and its one-time secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeIssuedKey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/billing-bridge/keys/{id}/rotate:
    post:
      operationId: rotateResellerBillingBridgeKey
      summary: Rotate the secret of a reseller billing bridge key
      description: >-
        Step-up action billing_bridge.key.rotate bound to the key id. The old secret stops working at once; the new
        one is returned once. 409 revision_conflict on a stale expected_revision, 409 key_revoked for a revoked key.
        Audit billing_bridge.key.rotated.
      x-required-permissions: [reseller.customers.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeKeyMutationRequest'}
      responses:
        '200':
          description: The key and its new one-time secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeIssuedKey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/billing-bridge/keys/{id}/revoke:
    post:
      operationId: revokeResellerBillingBridgeKey
      summary: Revoke a reseller billing bridge key
      description: >-
        Step-up action billing_bridge.key.revoke bound to the key id. Revocation is final. Audit
        billing_bridge.key.revoked.
      x-required-permissions: [reseller.customers.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeKeyMutationRequest'}
      responses:
        '200':
          description: The revoked key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeKey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/billing-bridge/logs:
    get:
      operationId: listResellerBillingBridgeLogs
      summary: List the reseller billing bridge call log
      description: >-
        Calls made with the caller's own keys only (owner scope), newest first, cursor paged. Denied calls carry the
        internal reason_code the caller of the bridge never sees. Rows are kept 90 days.
      x-required-permissions: [reseller.customers.manage]
      security:
        - bearerAuth: []
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: One page of log rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeLogPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/billing-bridge/settings:
    get:
      operationId: getResellerBillingBridgeSettings
      summary: Read the reseller billing bridge plugin settings
      description: >-
        Reseller plugin settings (ADR 0019 Q4). sso_require_mfa defaults to false (bridge SSO skips the second
        factor); revision 0 means never saved. Lease feature module.billing.bridge (403 entitlement_feature_denied).
      x-required-permissions: [reseller.customers.manage]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    put:
      operationId: putResellerBillingBridgeSettings
      summary: Change the reseller billing bridge plugin settings
      description: >-
        Requires a step-up proof (audience billing-bridge, action billing_bridge.settings.update, bound to the owner
        scope): turning MFA off weakens every bridge SSO sign-in. expected_revision is the revision read (0 for the
        first save); a stale revision is 409. Audited as billing_bridge.settings.updated.
      x-required-permissions: [reseller.customers.manage]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeSettingsUpdate'}
      responses:
        '200':
          description: Saved settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/billing-bridge/ping:
    get:
      operationId: pingBillingBridge
      summary: Billing system TestConnection with a signed bridge key
      description: >-
        Signed with the bridge headers (billingBridgeSignature). Any authentication failure (unknown key, clock skew
        over 300 s, replayed nonce, wrong signature, source IP outside the allowlist, revoked or expired key, owner
        no longer an active reseller) is 401 unauthorized with no further detail; the reason is written to the bridge
        log. A valid key whose plugin is not enabled gets 403 entitlement_feature_denied. Bridge keys authenticate
        only /v1/billing-bridge/* facade routes; every other route rejects them.
      security:
        - billingBridgeSignature: []
      responses:
        '200':
          description: The key owner and server time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgePing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/billing-bridge/products:
    get:
      operationId: listBillingBridgeProducts
      summary: Billing system ConfigOptions — the key owner's published packages
      description: >-
        A (reseller key): the reseller's own published packages with its wholesale cost per period; B (platform
        key): the platform's published packages (no wholesale_minor).
      security:
        - billingBridgeSignature: []
      responses:
        '200':
          description: Published packages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/BillingBridgeProduct'}
        '400': {$ref: '#/components/responses/BillingBridgeError'}
        '401': {$ref: '#/components/responses/BillingBridgeError'}
        '403': {$ref: '#/components/responses/BillingBridgeError'}
        '404': {$ref: '#/components/responses/BillingBridgeError'}
        '409': {$ref: '#/components/responses/BillingBridgeError'}
        '412': {$ref: '#/components/responses/BillingBridgeError'}
        '422': {$ref: '#/components/responses/BillingBridgeError'}
        '503': {$ref: '#/components/responses/BillingBridgeError'}
  /v1/billing-bridge/services:
    post:
      operationId: createBillingBridgeService
      summary: Billing system CreateAccount — open a CDN service for a billing service
      description: >-
        (owner, external_system, external_service_id) is the idempotency key of the service: repeating it with the
        same input returns the same service (200, created false); other input is 409 bridge_service_conflict. The
        customer of (external_system, external_client_id) is found or opened (A: a reseller customer, B: a platform
        direct customer; username {system}_{client_id}, a short suffix on a clash, random password not returned).
        A places the order for its customer and pays the prepaid wholesale cost (422 reseller_prepaid_insufficient,
        reseller_wholesale_unpriced); B opens the subscription without a charge.
      security:
        - billingBridgeSignature: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            {system}:{service_id}:{action}:{billing task, invoice ID or date}. A retry with the same key and body
            replays the result; another body with the same key is 409 bridge_service_conflict.
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeCreateService'}
      responses:
        '201':
          description: Opened (created true).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeServiceEnvelope'}
        '200':
          description: Already opened by an earlier call (created false).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeServiceEnvelope'}
        '400': {$ref: '#/components/responses/BillingBridgeError'}
        '401': {$ref: '#/components/responses/BillingBridgeError'}
        '403': {$ref: '#/components/responses/BillingBridgeError'}
        '404': {$ref: '#/components/responses/BillingBridgeError'}
        '409': {$ref: '#/components/responses/BillingBridgeError'}
        '412': {$ref: '#/components/responses/BillingBridgeError'}
        '422': {$ref: '#/components/responses/BillingBridgeError'}
        '503': {$ref: '#/components/responses/BillingBridgeError'}
  /v1/billing-bridge/services/{system}/{service_id}:
    get:
      operationId: getBillingBridgeService
      summary: Billing system ClientArea — one service of the key owner
      description: A service of another owner, or not opened, is 404 bridge_service_not_found.
      security:
        - billingBridgeSignature: []
      parameters:
        - {name: system, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}}
        - {name: service_id, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalID'}}
      responses:
        '200':
          description: The service.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeServiceEnvelope'}
        '400': {$ref: '#/components/responses/BillingBridgeError'}
        '401': {$ref: '#/components/responses/BillingBridgeError'}
        '403': {$ref: '#/components/responses/BillingBridgeError'}
        '404': {$ref: '#/components/responses/BillingBridgeError'}
        '409': {$ref: '#/components/responses/BillingBridgeError'}
        '412': {$ref: '#/components/responses/BillingBridgeError'}
        '422': {$ref: '#/components/responses/BillingBridgeError'}
        '503': {$ref: '#/components/responses/BillingBridgeError'}
  /v1/billing-bridge/services/{system}/{service_id}/suspend:
    post:
      operationId: suspendBillingBridgeService
      summary: Billing system Suspend — stop this service only
      description: >-
        Suspends the subscription: its sites stop being published, configuration is kept, the term keeps running. Other services of the customer are untouched. Already suspended succeeds without a change.
      security:
        - billingBridgeSignature: []
      parameters:
        - {name: system, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}}
        - {name: service_id, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalID'}}
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            {system}:{service_id}:{action}:{billing task, invoice ID or date}. A retry with the same key and body
            replays the result; another body with the same key is 409 bridge_service_conflict.
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeSuspend'}
      responses:
        '200':
          description: The service after the action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeServiceEnvelope'}
        '400': {$ref: '#/components/responses/BillingBridgeError'}
        '401': {$ref: '#/components/responses/BillingBridgeError'}
        '403': {$ref: '#/components/responses/BillingBridgeError'}
        '404': {$ref: '#/components/responses/BillingBridgeError'}
        '409': {$ref: '#/components/responses/BillingBridgeError'}
        '412': {$ref: '#/components/responses/BillingBridgeError'}
        '422': {$ref: '#/components/responses/BillingBridgeError'}
        '503': {$ref: '#/components/responses/BillingBridgeError'}
  /v1/billing-bridge/services/{system}/{service_id}/unsuspend:
    post:
      operationId: unsuspendBillingBridgeService
      summary: Billing system Unsuspend
      description: >-
        Republishes the subscription. Already active succeeds without a change.
      security:
        - billingBridgeSignature: []
      parameters:
        - {name: system, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}}
        - {name: service_id, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalID'}}
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            {system}:{service_id}:{action}:{billing task, invoice ID or date}. A retry with the same key and body
            replays the result; another body with the same key is 409 bridge_service_conflict.
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      responses:
        '200':
          description: The service after the action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeServiceEnvelope'}
        '400': {$ref: '#/components/responses/BillingBridgeError'}
        '401': {$ref: '#/components/responses/BillingBridgeError'}
        '403': {$ref: '#/components/responses/BillingBridgeError'}
        '404': {$ref: '#/components/responses/BillingBridgeError'}
        '409': {$ref: '#/components/responses/BillingBridgeError'}
        '412': {$ref: '#/components/responses/BillingBridgeError'}
        '422': {$ref: '#/components/responses/BillingBridgeError'}
        '503': {$ref: '#/components/responses/BillingBridgeError'}
  /v1/billing-bridge/services/{system}/{service_id}/renew:
    post:
      operationId: renewBillingBridgeService
      summary: Billing system Renew
      description: >-
        Extends the term by period (default the current period). A renews for its customer at the wholesale cost; B renews without a charge. A retry with the same Idempotency-Key does not renew twice.
      security:
        - billingBridgeSignature: []
      parameters:
        - {name: system, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}}
        - {name: service_id, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalID'}}
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            {system}:{service_id}:{action}:{billing task, invoice ID or date}. A retry with the same key and body
            replays the result; another body with the same key is 409 bridge_service_conflict.
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeRenew'}
      responses:
        '200':
          description: The service after the action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeServiceEnvelope'}
        '400': {$ref: '#/components/responses/BillingBridgeError'}
        '401': {$ref: '#/components/responses/BillingBridgeError'}
        '403': {$ref: '#/components/responses/BillingBridgeError'}
        '404': {$ref: '#/components/responses/BillingBridgeError'}
        '409': {$ref: '#/components/responses/BillingBridgeError'}
        '412': {$ref: '#/components/responses/BillingBridgeError'}
        '422': {$ref: '#/components/responses/BillingBridgeError'}
        '503': {$ref: '#/components/responses/BillingBridgeError'}
  /v1/billing-bridge/services/{system}/{service_id}/change:
    post:
      operationId: changeBillingBridgeService
      summary: Billing system ChangePackage
      description: >-
        Upgrade or downgrade by the new and the current period price (same price is an upgrade), effective at once. A: between the reseller's packages, prorated wholesale difference charged or returned (ADR 0019 Q2 a); B: between platform packages, no customer charge.
      security:
        - billingBridgeSignature: []
      parameters:
        - {name: system, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}}
        - {name: service_id, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalID'}}
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            {system}:{service_id}:{action}:{billing task, invoice ID or date}. A retry with the same key and body
            replays the result; another body with the same key is 409 bridge_service_conflict.
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingBridgeChange'}
      responses:
        '200':
          description: The service after the action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeServiceEnvelope'}
        '400': {$ref: '#/components/responses/BillingBridgeError'}
        '401': {$ref: '#/components/responses/BillingBridgeError'}
        '403': {$ref: '#/components/responses/BillingBridgeError'}
        '404': {$ref: '#/components/responses/BillingBridgeError'}
        '409': {$ref: '#/components/responses/BillingBridgeError'}
        '412': {$ref: '#/components/responses/BillingBridgeError'}
        '422': {$ref: '#/components/responses/BillingBridgeError'}
        '503': {$ref: '#/components/responses/BillingBridgeError'}
  /v1/billing-bridge/services/{system}/{service_id}/terminate:
    post:
      operationId: terminateBillingBridgeService
      summary: Billing system Terminate
      description: >-
        Cancels the subscription (sites stop) and marks the service terminated; when the customer has no other live service of this owner, the CDN account is disabled (data kept, ADR 0019 Q3 a). Later actions are 409 bridge_service_terminated.
      security:
        - billingBridgeSignature: []
      parameters:
        - {name: system, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}}
        - {name: service_id, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalID'}}
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            {system}:{service_id}:{action}:{billing task, invoice ID or date}. A retry with the same key and body
            replays the result; another body with the same key is 409 bridge_service_conflict.
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      responses:
        '200':
          description: The service after the action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingBridgeServiceEnvelope'}
        '400': {$ref: '#/components/responses/BillingBridgeError'}
        '401': {$ref: '#/components/responses/BillingBridgeError'}
        '403': {$ref: '#/components/responses/BillingBridgeError'}
        '404': {$ref: '#/components/responses/BillingBridgeError'}
        '409': {$ref: '#/components/responses/BillingBridgeError'}
        '412': {$ref: '#/components/responses/BillingBridgeError'}
        '422': {$ref: '#/components/responses/BillingBridgeError'}
        '503': {$ref: '#/components/responses/BillingBridgeError'}
  /v1/billing-bridge/services/{system}/{service_id}/sso:
    post:
      operationId: issueBillingBridgeSso
      summary: Billing system ServiceSingleSignOn — one-time console sign-in link
      description: >-
        Returns {url, expires_at}: url is {console}/sso/bridge?ticket=…, valid 60 seconds and once. Only the
        ticket's digest is stored. Audited as billing_bridge.sso.issued.
      security:
        - billingBridgeSignature: []
      parameters:
        - {name: system, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}}
        - {name: service_id, in: path, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalID'}}
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            {system}:{service_id}:{action}:{billing task, invoice ID or date}. A retry with the same key and body
            replays the result; another body with the same key is 409 bridge_service_conflict.
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                redirect: {type: string, maxLength: 512, pattern: '^/(?![/\\]).*$', description: Same-site path after sign-in (default /).}
      responses:
        '200':
          description: The sign-in link.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, expires_at]
                    properties:
                      url: {type: string, format: uri}
                      expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/BillingBridgeError'}
        '401': {$ref: '#/components/responses/BillingBridgeError'}
        '403': {$ref: '#/components/responses/BillingBridgeError'}
        '404': {$ref: '#/components/responses/BillingBridgeError'}
        '409': {$ref: '#/components/responses/BillingBridgeError'}
        '412': {$ref: '#/components/responses/BillingBridgeError'}
        '422': {$ref: '#/components/responses/BillingBridgeError'}
        '503': {$ref: '#/components/responses/BillingBridgeError'}
  /v1/billing-bridge/usage:
    get:
      operationId: getBillingBridgeUsage
      summary: Billing system UsageUpdate — current billing cycle usage
      description: Up to 100 ids; ids that are not the owner's opened services are left out.
      security:
        - billingBridgeSignature: []
      parameters:
        - {name: external_system, in: query, required: true, schema: {$ref: '#/components/schemas/BillingBridgeExternalSystem'}}
        - {name: ids, in: query, required: true, description: Comma-separated external_service_id (1–100)., schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: Usage of the current billing cycle.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
