      description: UTC hourly metrics ordered by hour ascending; hours with no events are omitted.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/AnalyticsTrendResponse'}}}
    AnalyticsRankOK:
      description: Deterministically ordered ranking page from one ingestion snapshot.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/AnalyticsRankResponse'}}}
