        - $ref: '#/components/parameters/APIKeyListKeyID'
        - $ref: '#/components/parameters/APIKeyListCursor'
        - $ref: '#/components/parameters/APIKeyListOffset'
      responses:
        '200':
          description: Target user's API key metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIKeyList'}
        '400': {$ref: '#/components/responses/APIKeyBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createPendingManagedUserAPIKey
      summary: Create pending API key metadata for a tenant user
      description: >-
        Platform session-only endpoint requiring api_keys.admin.manage. No secret is created or returned.
        The target user must activate the key with their own bearer session before it can authenticate.
        An unknown result must be retried with the unchanged body, If-Match revision, and Idempotency-Key.
      security:
        - bearerAuth: []
