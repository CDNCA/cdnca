          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          oneOf:
            - $ref: '#/components/schemas/APIFieldErrorDetails'
            - type: object
              description: Only on supply_in_use (node updates, ADR 0012 ML-18).
              additionalProperties: false
              required: [online_available, normal_subscriptions]
              properties:
                online_available:
                  type: integer
                  minimum: 0
                normal_subscriptions:
                  type: integer
                  minimum: 1
    APIFieldErrorDetails:
      type: object
      description: >-
        On a validation_error that can name the refused request field. field is
        the JSON path as sent (name, limits.domains, spec.group_ids[1]); reason
        is a machine code (common: required, too_short, too_long,
        invalid_format, out_of_range, duplicate, invalid; some resources add
        their own, e.g. count). Status and code are unchanged; a
        refusal that cannot name one field has no details.
      x-description-zh: 能定位到字段的 validation_error 附带：field 为请求 JSON 路径（嵌套用 a.b[0].c），reason 为机器码；状态码与 code 不变，无法定位单个字段时不带 details。
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}(?:\.[a-z0-9_]{1,64}|\[\d{1,4}\])*$'
        reason:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
      example: {field: limits.domains, reason: out_of_range}
