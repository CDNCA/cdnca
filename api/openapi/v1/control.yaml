        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
    IdentityRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Caller-stable write attempt identifier. Reuse it only with the same idempotency key and body.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    IdentityTraceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context preserved across an exact retry.
      schema:
        type: string
        pattern: '^00-(?!00000000000000000000000000000000)[0-9a-f]{32}-(?!0000000000000000)[0-9a-f]{16}-(?:00|01)$'
    ControlUpgradeRolloutID:
      name: rollout_id
      in: path
      required: true
      schema:
