  /v1/auth/login:
    post:
      operationId: login
      summary: Authenticate and create a refresh-token family
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Required when login_challenge is present. Reuse only for the same challenge and code.
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated. The rotating refresh token is returned only as an HttpOnly cookie.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Set-Cookie:
              description: HttpOnly, SameSite=Strict refresh cookie; Secure outside explicit local development.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials, login_verification_required after a correct password, login_captcha_required once the platform CAPTCHA threshold (login_captcha_threshold_per_hour) is reached for this account and source, or login_captcha_invalid. No session is created until the required code succeeds.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/LoginVerificationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: login_throttled. The account has login_failure_limit_per_hour credential failures from this source in the last hour (or the source has five times that across accounts). Another source is not affected. Retry after the Retry-After seconds.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1, maximum: 3601}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/bridge-sso:
    post:
      operationId: exchangeBillingBridgeSso
      summary: Exchange a billing bridge one-time ticket for a console session
      description: >-
        Called by the console page /sso/bridge?ticket=… without Authorization (the ticket is the credential). Signs
        the customer in with an ordinary session of its own (not impersonation; audit auth.login with
        authentication_method billing_bridge and auth.session.bridge_sso). Expired, reused, unknown, disabled-user
        and terminated-service tickets are all 401 bridge_sso_invalid. The account's e-mail/SMS login verification
        is skipped (ADR 0019 Q4 a); when the plugin setting sso_require_mfa is on and the customer has TOTP, the
        first call is 401 mfa_required and the same ticket is sent again with authentication (mfa_invalid_code,
        mfa_code_replayed on a wrong code; five wrong codes void the ticket).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              additionalProperties: false
              properties:
                ticket: {type: string, minLength: 16, maxLength: 512}
                authentication:
                  type: object
                  required: [method, code]
                  additionalProperties: false
                  properties:
                    method: {type: string, enum: [totp, recovery_code]}
                    code: {type: string, minLength: 6, maxLength: 64}
      responses:
        '200':
          description: Signed in. The refresh token is set only as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: HttpOnly, SameSite=Strict refresh cookie.
              schema: {type: string}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - type: object
                    required: [redirect]
                    properties:
                      redirect: {type: string, description: The same-site path recorded on the ticket.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: bridge_sso_invalid, mfa_required, mfa_invalid_code or mfa_code_replayed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/auth/login-captchas:
    post:
      operationId: issueLoginCaptcha
      summary: Issue a one-time built-in sign-in CAPTCHA bound to the source address
      description: Requested after login_captcha_required. The answer is never returned as text; send {id, answer} as captcha with the next password attempt. Each challenge is consumed by one attempt and expires after five minutes. Thirty challenges per source per hour.
      security: []
      responses:
        '201':
          description: CAPTCHA issued.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginCaptcha'
        '429':
          description: login_captcha_rate_limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/session-region-verifications:
    post:
      operationId: verifySessionRegion
      summary: Re-bind the session to its current region with the password
      description: Called after a session request returned 401 session_region_changed (platform setting session_region_check). The password attempt is throttled like sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
      responses:
        '204':
          description: Session re-bound to the current region.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: invalid_session or invalid_credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: login_throttled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/admin/inbox:
