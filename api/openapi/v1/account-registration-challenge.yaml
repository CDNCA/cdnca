openapi: 3.1.0
info:
  title: CDNCA Rebuild Account Registration Challenge API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Sessionless human and contact verification for account registration. Human
    tokens, one-time codes, destinations, and proof references are never echoed.
servers:
  - url: /
security: []
tags:
  - name: Account registration challenge
paths:
  /v1/auth/registration-config:
    get:
      tags: [Account registration challenge]
      operationId: getAccountRegistrationConfig
      x-summary-zh: "注册与找回密码页面的公开配置：要求哪些验证、各通道能否发码、人机校验方式"
      summary: Public sign-up and password-reset configuration
      description: >-
        What every sign-up and password-reset page (console and website themes) shows. email / sms
        "required" is the verification in effect: the email / phone verification setting and the matching
        notification channel switch are both on (either off: sign-up needs no code); "available" means a code
        can be sent now (sender and template configured, channel switched on). human_check guards sending a code:
        builtin_captcha (POST /v1/auth/login-captchas; human_token = "captcha:<id>:<answer>") or
        turnstile; the Turnstile flow uses builtin_captcha until both its site key and secret are set.
        ready is false while a required verification cannot be sent. The Turnstile site key is
        ACCOUNT_REGISTRATION_TURNSTILE_SITE_KEY when set, otherwise the one saved on the system settings page.
        Anonymous; a request carrying a platform session with system_configuration.read (or platform.admin)
        additionally receives reasons, the codes of what keeps sign-up verification from being ready.
        Any other caller, including a bad token, is answered as a visitor without reasons.
      x-description-zh: >-
        匿名可读。携带有 system_configuration.read（或 platform.admin）权限的平台会话时额外返回 reasons，
        即注册验证未就绪的原因码；其他调用方（含无效令牌）按访客处理，不返回 reasons。Turnstile 站点密钥取环境变量
        ACCOUNT_REGISTRATION_TURNSTILE_SITE_KEY，未设置时取系统设置页保存的值；站点密钥与 Secret 未填齐时 Turnstile 流程改用内置图形验证码。
        required 为生效值：要求邮箱（手机）验证与对应通知渠道开关都开才为 true，任一关着注册不需要验证码。
      responses:
        '200':
          description: The configuration.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [registration_enabled, mode, human_check, turnstile_site_key, terms_version, terms_published, terms_required, email, sms, email_required, phone_required, qq_required, username_required, ready, recovery]
                    properties:
                      registration_enabled: {type: boolean}
                      mode: {type: string, enum: [builtin, verified, closed]}
                      human_check: {type: string, enum: [builtin_captcha, turnstile]}
                      turnstile_site_key: {type: string}
                      terms_version:
                        type: string
                        description: >-
                          The terms version a sign-up must accept (POST /v1/auth/register terms_version). Derived from the
                          terms title and body saved on the system settings page ("terms-" and 12 hex digits of their
                          SHA-256), so editing them asks for a new acceptance; the Turnstile flow uses
                          ACCOUNT_REGISTRATION_TERMS_VERSION instead when the deployment sets it. Unpublished terms
                          (terms_published false) have a version too (that of the empty body); the site's own terms
                          page is not part of it.
                      terms_published:
                        type: boolean
                        description: >-
                          The system settings page has terms of its own: a body that is not blank and not the old
                          default placeholder pair. False: GET /v1/auth/registration-terms answers 404 and the site pages
                          link their own terms page; sign-up stays open (ready does not depend on it).
                      terms_required:
                        type: boolean
                        description: >-
                          Sign-up must accept terms: a visitor has some to read (published settings terms, a site page
                          keyed terms or tos, or an agree link the site set itself). False: the pages show no agreement
                          line and POST /v1/auth/register neither checks terms_accepted / terms_version nor records an
                          acceptance; an exact retry still replays its receipt.
                      email: {$ref: '#/components/schemas/RegistrationChannel'}
                      sms: {$ref: '#/components/schemas/RegistrationChannel'}
                      email_required: {type: boolean}
                      phone_required: {type: boolean}
                      qq_required:
                        type: boolean
                        description: Sign-up must give a QQ number (5–12 digits, POST /v1/auth/register qq).
                      username_required:
                        type: boolean
                        description: >-
                          Sign-up must give a username. False: it may be left empty and the controller generates one from the
                          email (local part) or phone with a short keyed suffix; the 202 response returns it.
                      ready: {type: boolean}
                      recovery:
                        type: object
                        required: [enabled, channels]
                        properties:
                          enabled: {type: boolean}
                          channels: {type: array, items: {type: string, enum: [email, sms]}}
                      reasons:
                        type: array
                        description: >-
                          Administrators only (never sent to visitors). registration_disabled; notification_runtime_disabled
                          (NOTIFICATION_RUNTIME_ENABLED=off); sender_build_failed (the last sender rebuild failed, see /health/detail);
                          email_sender_unavailable / sms_sender_unavailable (no complete sender on the mail settings page);
                          email_template_missing / sms_template_missing; sms_template_unmapped (native SMS provider without a
                          mapping for the verification template); turnstile_not_configured (the Turnstile site key or secret is
                          missing, so the built-in image CAPTCHA guards sending a code); verification_channel_unavailable
                          (Turnstile flow with no sendable channel).
                        items:
                          type: string
                          enum: [registration_disabled, notification_runtime_disabled, sender_build_failed, email_sender_unavailable,
                            sms_sender_unavailable, email_template_missing, sms_template_missing, sms_template_unmapped,
                            turnstile_not_configured, verification_channel_unavailable]
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /v1/auth/registration-terms:
    get:
      tags: [Account registration challenge]
      operationId: getAccountRegistrationTerms
      x-summary-zh: "注册用户协议：系统设置「账号与安全」里的协议标题、正文与当前版本"
      summary: Sign-up terms
      description: >-
        Anonymous. The terms title and body edited on the system settings page (plain text, shown as text, never
        as HTML) and the version registration-config reports, which a sign-up accepts.
      x-description-zh: 匿名可读。正文为纯文本，页面按文本显示，不解析 HTML；version 与 registration-config 的 terms_version 相同。
      responses:
        '200':
          description: The terms.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [title, body, version]
                    properties:
                      title: {type: string}
                      body: {type: string}
                      version: {type: string}
        '404':
          description: >-
            registration_terms_not_configured: the system settings page has no published terms (registration-config
            terms_published false).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /v1/auth/registration-challenges:
    post:
      tags: [Account registration challenge]
      operationId: createAccountRegistrationChallenge
      x-summary-zh: "完成人机验证并发送一个联系方式验证码"
      security: []
      summary: Verify a human and queue one contact verification code
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChallengeRequest'}
      responses:
        '202':
          description: Challenge accepted without identifying existing accounts.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie:
              description: >-
                Secure, HttpOnly, SameSite=Strict browser binding of the code, one per challenge
                (cdnca_reg_challenge_bind_<channel>_<challenge_id>), Path=/v1/auth/registration-challenge-verifications,
                expiring with the code; the verification is accepted only with it.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChallengeResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /v1/auth/registration-challenge-verifications:
    post:
      tags: [Account registration challenge]
      operationId: verifyAccountRegistrationChallenge
      x-summary-zh: "核销一个联系方式验证码并下发注册凭证 Cookie"
      security: []
      summary: Consume one contact verification code and issue a registration proof cookie
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerificationRequest'}
      responses:
        '204':
          description: Contact verified. The proof reference is available only in a secure host cookie.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie:
              description: >-
                Secure, HttpOnly, SameSite=Strict, host-only registration proof cookie, one per
                verified challenge (__Host-cdnca_registration_proof_<channel>_<challenge_id>) so that several
                required verifications, and several sign-up tabs of one browser, can all be proved;
                registration reads the challenges its verification_challenge_ids names.
              schema: {type: string}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    RequestID:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
  headers:
    RequestID:
      schema: {type: string, minLength: 1, maxLength: 128}
    RetryAfter:
      schema: {type: string, pattern: '^[0-9]+$'}
  responses:
    ErrorResponse:
      description: Stable error without provider details or sensitive input.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Bounded retry response without identifying the limiting dimension.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    RegistrationChannel:
      type: object
      required: [required, available]
      properties:
        required: {type: boolean}
        available: {type: boolean}
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [username, email, phone, verification_channel, human_token]
      properties:
        username:
          type: string
          maxLength: 128
          pattern: '^(?:|[A-Za-z0-9][A-Za-z0-9._-]{2,127})$'
          description: >-
            May be empty while registration-config username_required is false: the code is then bound to the
            username registration generates from the same email / phone.
        email:
          type: string
          maxLength: 254
          description: The email address; may be empty for an SMS code (verification_channel sms).
        phone: {type: string, minLength: 6, maxLength: 21, pattern: '^\+?[0-9]{6,20}$'}
        verification_channel: {type: string, enum: [email, sms]}
        human_token:
          type: string
          writeOnly: true
          minLength: 22
          maxLength: 4096
    VerificationRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, username, email, phone, verification_channel, otp]
      properties:
        challenge_id: {type: string, format: uuid}
        username:
          type: string
          maxLength: 128
          pattern: '^(?:|[A-Za-z0-9][A-Za-z0-9._-]{2,127})$'
          description: >-
            May be empty while registration-config username_required is false: the code is then bound to the
            username registration generates from the same email / phone.
        email:
          type: string
          maxLength: 254
          description: The email address; may be empty for an SMS code (verification_channel sms).
        phone: {type: string, minLength: 6, maxLength: 21, pattern: '^\+?[0-9]{6,20}$'}
        verification_channel: {type: string, enum: [email, sms]}
        otp:
          type: string
          writeOnly: true
          pattern: '^[0-9]{6}$'
    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [accepted, challenge_id, expires_at, replayed]
          properties:
            accepted: {type: boolean, const: true}
            challenge_id: {type: string, format: uuid}
            expires_at: {type: string, format: date-time}
            replayed: {type: boolean}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code:
              type: string
              description: >-
                account_registration_human_invalid (422, challenge creation only): the image CAPTCHA or
                Turnstile check failed, ask for a new one. account_registration_challenge_invalid (422):
                the details (username, email, phone, channel) or the code are invalid.
              enum:
                - account_registration_human_invalid
                - account_registration_challenge_invalid
                - account_registration_challenge_rate_limited
                - account_registration_challenge_conflict
                - account_registration_challenge_unavailable
            request_id: {type: string, minLength: 1, maxLength: 128}
