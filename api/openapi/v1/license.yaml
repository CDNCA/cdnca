        items: {type: array, items: {$ref: '#/components/schemas/OperatorIdentityEvent'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
    RecoveryCode:
      type: string
      minLength: 16
      maxLength: 16
      pattern: '^[A-Z2-7]{16}$'
      writeOnly: true
    IdentityToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      writeOnly: true
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
