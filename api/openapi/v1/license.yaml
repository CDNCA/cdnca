        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Operator Releases]
      operationId: createReleaseArtifact
      summary: Register immutable artifact metadata as a draft
      description: The artifact body is stored outside this service; only its HTTPS location and SHA-256 digest are registered.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.releases.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateReleaseArtifactRequest'}
      responses:
        '201':
          description: Draft artifact created, or exact replay of the original result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseArtifact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/release-artifacts:upload:
    post:
      tags: [Operator Releases]
      operationId: uploadReleaseArtifact
      summary: Upload a release package and register it as a draft
      description: |
        Streams multipart/form-data with exactly two parts in order: `metadata` (JSON
        ReleaseArtifactIngestMetadata) then `file` (the package). The service hashes the bytes while
        receiving them into a private staging file, then publishes the file without ever overwriting at
        `<LICENSE_RELEASE_ARTIFACT_DIR>/<component>/<version>/<filename>`; an identical existing file is
        reused and any different file in that version directory is `artifact_file_conflict`. SHA-256,
        size and the download URL (`<LICENSE_RELEASE_ARTIFACT_BASE_URL>/<component>/<version>/<filename>`)
        are always computed by the server and the measured size is signed. Requires a reauthentication
        within five minutes; every success and failure is audited as `release_artifact.upload`.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.releases.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, file]
              properties:
                metadata: {$ref: '#/components/schemas/ReleaseArtifactIngestMetadata'}
                file: {type: string, format: binary, maxLength: 285229182}
            encoding:
              metadata: {contentType: application/json}
      responses:
        '201':
          description: Draft registered (or exact replay) with server-computed facts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseArtifactIngestResult'}
        '400': {$ref: '#/components/responses/PluginSupplyChainInvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/ReleaseArtifactIngestConflict'}
        '413': {$ref: '#/components/responses/ReleaseArtifactTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {$ref: '#/components/responses/ReleaseArtifactStorageUnavailable'}
  /operator/v1/release-artifacts:import:
    post:
      tags: [Operator Releases]
      operationId: importReleaseArtifact
      summary: Register an externally hosted package; the service downloads it to compute size and digest
      description: |
        Advanced alternative to upload. The address must be a public HTTPS URL that names the version
        (no `/latest` segment). The service downloads it once through the repository fetcher (public
        addresses only, no redirects) to compute SHA-256 and size, then registers and signs them.
        Requires a reauthentication within five minutes; audited as `release_artifact.import`.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.releases.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportReleaseArtifactRequest'}
      responses:
        '201':
          description: Draft registered (or exact replay) with server-computed facts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseArtifactIngestResult'}
        '400': {$ref: '#/components/responses/PluginSupplyChainInvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/ReleaseArtifactIngestConflict'}
        '422': {$ref: '#/components/responses/RepositoryAddressRejected'}
        '502': {$ref: '#/components/responses/RepositoryResponseInvalid'}
  /operator/v1/release-artifacts/{artifact_id}/publish:
    post:
      tags: [Operator Releases]
      operationId: publishReleaseArtifact
      summary: Sign and publish a draft artifact
      description: |
        Freezes a versioned manifest whose signature is independent from upgrade-grant signatures.
        Publication requires the current operator to hold the release-management permission; the platform
        administrator may publish an artifact they registered themselves. The operation records an immutable
        audit event and freezes the signed manifest. Before signing, the service verifies the durable repository verification receipt
        binds the HTTPS object ETag, size, digest, and signer evidence.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.releases.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
        - $ref: '#/components/parameters/ArtifactId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpectedRevisionRequest'}
      responses:
        '200':
          description: Published artifact, or exact replay of the original result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseArtifact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/release-artifacts/{artifact_id}/size-attestations:
    get:
      tags: [Operator Releases]
      operationId: getReleaseArtifactSizeAttestation
      summary: Read and verify the durable signed size attestation
      description: |
        Requires a live operator session and `licensing.releases.manage`. The service
        reads only its licensing database, reconstructs the exact v2 artifact manifest,
        verifies its stored digest, Ed25519 signature, signing-key status and time
        windows, and commits the delivery audit in the same read-write transaction.
        Query strings, bodies, Content-Type, Transfer-Encoding, nonzero Content-Length,
        Idempotency-Key, and noncanonical or multiple validators are rejected.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.releases.manage]
      parameters:
        - $ref: '#/components/parameters/ReleaseArtifactSizeAttestationArtifactId'
        - $ref: '#/components/parameters/ReleaseArtifactSizeAttestationReadbackIfNoneMatch'
      responses:
        '200':
          description: Exact five-field durable attestation representation after successful verification and audit
          headers:
            Content-Length:
              schema: {type: integer, minimum: 1}
            ETag:
              $ref: '#/components/headers/ReleaseArtifactSizeAttestationReadbackETag'
            Cache-Control:
              $ref: '#/components/headers/ReleaseArtifactSizeAttestationReadbackCacheControl'
            Access-Control-Expose-Headers:
              schema: {type: string, const: ETag}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseArtifactSizeAttestation'}
        '304':
          description: Exact strong ETag matched after successful verification and audit; response body is empty
          headers:
            ETag:
              $ref: '#/components/headers/ReleaseArtifactSizeAttestationReadbackETag'
            Cache-Control:
              $ref: '#/components/headers/ReleaseArtifactSizeAttestationReadbackCacheControl'
            Access-Control-Expose-Headers:
              schema: {type: string, const: ETag}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ReleaseArtifactSizeAttestationReadbackUnavailable'}
        '504': {$ref: '#/components/responses/RequestTimeout'}
    post:
      tags: [Operator Releases]
      operationId: attestReleaseArtifactSize
      summary: Freeze the exact signed byte size for a draft release artifact
      description: |
        Creates one immutable v2 artifact manifest whose Ed25519 signature binds the
        exact updater byte limit input. Exact idempotent replay returns the original
        attestation; a changed request digest returns 409.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.releases.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
        - $ref: '#/components/parameters/ArtifactId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReleaseArtifactSizeAttestationRequest'}
      responses:
        '201':
          description: New or exactly replayed immutable size attestation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseArtifactSizeAttestation'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {$ref: '#/components/responses/SignerUnavailable'}
