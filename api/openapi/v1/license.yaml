    PluginRuntimeProjectionRequest:
      type: object
      additionalProperties: false
      description: |
        The body is strict canonical JSON with members in the declared field order.
        consumer_kind and capability_kind MUST be identical. Event codes use
        PluginCapabilityEvent; webhook codes use PluginInstallationScope. The proof
        is the unpadded base64url encoding of exactly 64 Ed25519 signature bytes over
        the length-prefixed domain and strict canonical JSON containing the unsigned fields.
      x-proof-domain: cdnca-plugin-runtime-projection-request/v1
      x-canonical-json-field-order: [schema, request_id, installation_id, certificate_id, consumer_kind, consumer_id, target_scope_id, capability_kind, capability_code, requested_at, proof]
      x-proof-payload-field-order: [schema, request_id, installation_id, certificate_id, consumer_kind, consumer_id, target_scope_id, capability_kind, capability_code, requested_at]
      required: [schema, request_id, installation_id, certificate_id, consumer_kind, consumer_id, target_scope_id, capability_kind, capability_code, requested_at, proof]
      properties:
        schema: {type: string, const: cdnca.plugin-runtime-projection-request/v1}
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
        installation_id: {$ref: '#/components/schemas/CanonicalUUID'}
        certificate_id: {$ref: '#/components/schemas/CanonicalUUID'}
        consumer_kind: {type: string, enum: [event, webhook]}
        consumer_id: {$ref: '#/components/schemas/CanonicalUUID'}
        target_scope_id: {$ref: '#/components/schemas/CanonicalUUID'}
        capability_kind: {type: string, enum: [event, webhook]}
        capability_code: {type: string, minLength: 3, maxLength: 160}
        requested_at:
          type: string
          format: date-time
          description: RFC3339 whole UTC second in the inclusive interval [now-5m, now].
        proof:
          type: string
          minLength: 86
          maxLength: 86
          pattern: '^[A-Za-z0-9_-]{86}$'
      allOf:
        - if:
            required: [consumer_kind]
            properties: {consumer_kind: {const: event}}
          then:
            properties:
              capability_kind: {const: event}
              capability_code: {$ref: '#/components/schemas/PluginCapabilityEvent'}
        - if:
            required: [consumer_kind]
            properties: {consumer_kind: {const: webhook}}
          then:
            properties:
              capability_kind: {const: webhook}
              capability_code: {$ref: '#/components/schemas/PluginInstallationScope'}
    PluginRuntimeProjection:
      type: object
      additionalProperties: false
      description: |
        Signed projection wire encoded as canonical JSON followed by exactly one LF byte.
        The signature covers the preceding fields in canonical order under the declared
        signing domain. expires_at is strictly after issued_at and no more than 60 seconds later.
      x-signing-domain: cdnca-plugin-runtime-projection/v1
      x-line-terminated: true
      x-max-lifetime-seconds: 60
      x-canonical-json-field-order: [schema, request_id, installation_id, certificate_id, generation, binding_id, binding_revision, authorization_id, service_identity, manifest_sha256, verification_id, attestation_id, attestation_revision, approval_revision, capability_kind, capability_code, issued_at, expires_at, algorithm, key_id, signature]
      required: [schema, request_id, installation_id, certificate_id, generation, binding_id, binding_revision, authorization_id, service_identity, manifest_sha256, verification_id, attestation_id, attestation_revision, approval_revision, capability_kind, capability_code, issued_at, expires_at, algorithm, key_id, signature]
      properties:
        schema: {type: string, const: cdnca.plugin-runtime-projection/v1}
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
        installation_id: {$ref: '#/components/schemas/CanonicalUUID'}
        certificate_id: {$ref: '#/components/schemas/CanonicalUUID'}
        generation: {type: integer, format: int64, minimum: 1}
        binding_id: {$ref: '#/components/schemas/CanonicalUUID'}
        binding_revision: {type: integer, format: int64, minimum: 1}
        authorization_id: {$ref: '#/components/schemas/CanonicalUUID'}
        service_identity: {$ref: '#/components/schemas/PluginServiceIdentity'}
        manifest_sha256: {type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
        verification_id: {$ref: '#/components/schemas/CanonicalUUID'}
        attestation_id: {$ref: '#/components/schemas/CanonicalUUID'}
        attestation_revision: {type: integer, format: int64, minimum: 1}
        approval_revision: {type: integer, format: int64, minimum: 1}
        capability_kind: {type: string, enum: [event, webhook]}
        capability_code: {type: string, minLength: 3, maxLength: 160}
        issued_at: {type: string, format: date-time}
        expires_at:
          type: string
          format: date-time
          description: Strictly after issued_at and no more than 60 seconds later.
        algorithm: {type: string, const: Ed25519}
        key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$'}
      allOf:
        - if:
            required: [capability_kind]
            properties: {capability_kind: {const: event}}
          then:
            properties: {capability_code: {$ref: '#/components/schemas/PluginCapabilityEvent'}}
        - if:
            required: [capability_kind]
            properties: {capability_kind: {const: webhook}}
          then:
            properties: {capability_code: {$ref: '#/components/schemas/PluginInstallationScope'}}
