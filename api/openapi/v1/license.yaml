        page_size: {type: integer, minimum: 1, maximum: 100}
    AcceptOperatorInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password, totp_secret, totp_code, recovery_codes]
      properties:
        token: {$ref: '#/components/schemas/IdentityToken'}
        password: {type: string, minLength: 8, maxLength: 1024, pattern: '^[!-~]{8,1024}$', writeOnly: true, description: '8 to 1024 printable ASCII characters (no space) with at least two of upper case, lower case, digits and symbols (libs/passwordpolicy); otherwise password_policy_unmet.'}
        totp_secret:
          type: string
          minLength: 32
          maxLength: 104
          pattern: '^[A-Z2-7]+$'
          writeOnly: true
        totp_code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          writeOnly: true
          items: {$ref: '#/components/schemas/RecoveryCode'}
    OperatorPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username: {type: string, minLength: 3, maxLength: 128, pattern: '^[a-z0-9][a-z0-9._-]+$'}
    CompleteOperatorPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      oneOf:
        - required: [totp_code]
          not: {required: [recovery_code]}
        - required: [recovery_code]
          not: {required: [totp_code]}
      properties:
        token: {$ref: '#/components/schemas/IdentityToken'}
        password: {type: string, minLength: 8, maxLength: 1024, pattern: '^[!-~]{8,1024}$', writeOnly: true, description: '8 to 1024 printable ASCII characters (no space) with at least two of upper case, lower case, digits and symbols (libs/passwordpolicy); otherwise password_policy_unmet.'}
        totp_code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        recovery_code: {$ref: '#/components/schemas/RecoveryCode'}
    ReplaceOperatorRecoveryCodesRequest:
      type: object
      additionalProperties: false
      required: [current_password, totp_code, recovery_codes]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
        totp_code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          writeOnly: true
          items: {$ref: '#/components/schemas/RecoveryCode'}
    ChangeOperatorPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
        new_password: {type: string, minLength: 8, maxLength: 1024, writeOnly: true}
    OperatorIdentityEventAction:
      type: string
      enum: [operator.bootstrap, operator.invitation_created, operator.invitation_revoked, operator.invitation_accepted,
        password_reset.requested, password_reset.completed, password.changed, password.change_denied,
        recovery_codes.replaced, session.login, session.logout, session.login_denied, session.login_rate_limited,
        session.reauthenticated, session.reauthentication_denied]
    OperatorIdentityEvent:
      type: object
      additionalProperties: false
      required: [id, operator_id, username, display_name, action, result, request_id, remote_address, occurred_at]
      properties:
        id: {type: string, format: uuid}
        operator_id: {type: [string, 'null'], format: uuid, description: Null when the account is unknown (failed sign-in with an unknown name).}
        username: {type: string}
        display_name: {type: string}
        action: {$ref: '#/components/schemas/OperatorIdentityEventAction'}
        result: {type: string, enum: [success, denied]}
        request_id: {type: string}
        remote_address: {type: string, maxLength: 256}
        occurred_at: {type: string, format: date-time}
    OperatorIdentityEventPage:
