        display_name_en_us: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000](?:[\s\S]*[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000])?(?![\s\S])'}
        key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        public_key:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Canonical unpadded base64url encoding of exactly 32 raw Ed25519 public-key bytes.
    DisablePluginPublisherRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, reason]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 500, pattern: '^[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000](?:[\s\S]*[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000])?(?![\s\S])'}
    PluginPublisherKeyPossessionProof:
      type: string
      minLength: 86
      maxLength: 86
      pattern: '^[A-Za-z0-9_-]{85}[AQgw]$'
      description: |
        Canonical unpadded base64url encoding of an exact 64-byte Ed25519 signature.
        The signed bytes are nine UTF-8 fields, each prefixed by its unsigned
        4-byte big-endian byte length, in this exact order: domain
        `cdnca-plugin-publisher-key-possession/v1`, action (`rotate` or
        `emergency_replace`), canonical publisher_id, expected_revision in
        base-10, compromised_key_version in base-10 or empty for rotate,
        key_id, canonical public_key, reason or empty for rotate, and the exact
        Idempotency-Key header value. The signature is verified by public_key.
    PluginPublisherLifecycleKey:
      type: object
      additionalProperties: false
      required: [version, key_id, algorithm, public_key, fingerprint, status, created_at]
      properties:
        version: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        algorithm: {type: string, const: Ed25519}
        public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'}
        fingerprint: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'}
        status: {type: string, enum: [active, verify_only, retired]}
        created_at: {type: string, format: date-time}
        retired_at: {type: string, format: date-time}
        retirement_reason: {type: string, minLength: 1, maxLength: 500}
    PluginPublisherKeyPage:
      type: object
      additionalProperties: false
      required: [publisher_id, publisher_revision, items]
      properties:
        publisher_id: {$ref: '#/components/schemas/CanonicalUUID'}
        publisher_revision: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PluginPublisherLifecycleKey'}}
    PluginPublisherKeyReceipt:
      type: object
      additionalProperties: false
      required: [publisher_id, publisher_revision, key]
      properties:
        publisher_id: {$ref: '#/components/schemas/CanonicalUUID'}
        publisher_revision: {type: integer, format: int64, minimum: 2, maximum: 9223372036854775807}
        key: {$ref: '#/components/schemas/PluginPublisherLifecycleKey'}
    RotatePluginPublisherKeyRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, key_id, public_key, possession_proof]
