      properties:
        catalog_id: {$ref: '#/components/schemas/PluginCatalogIdentifier'}
        snapshot_id: {$ref: '#/components/schemas/CanonicalUUID'}
        plugin_id: {$ref: '#/components/schemas/PluginPublisherSlug'}
        version: {$ref: '#/components/schemas/PluginSemanticVersion'}
    PluginManifestVerification:
      type: object
      additionalProperties: false
      description: Supply-chain evidence version 0 is a legacy record and omits both evidence digests. Version 1 includes both signed lowercase SHA-256 digests. No other field combination is valid.
      required: [id, catalog_id, snapshot_id, plugin_id, version, manifest_path, expected_raw_sha256, raw_manifest_sha256, canonical_payload_sha256, supply_chain_evidence_version, publisher_id, publisher_slug, publisher_key_version, publisher_key_id, control_api_version, compatibility_constraint, compatible, stable_reason_code, installable, configuration_schema_verified, verified_at]
      oneOf:
        - properties:
            supply_chain_evidence_version: {const: 0}
          not:
            anyOf:
              - required: [sbom_sha256]
              - required: [provenance_sha256]
        - required: [sbom_sha256, provenance_sha256]
          properties:
            supply_chain_evidence_version: {const: 1}
      properties:
        id: {$ref: '#/components/schemas/CanonicalUUID'}
        catalog_id: {$ref: '#/components/schemas/PluginCatalogIdentifier'}
        snapshot_id: {$ref: '#/components/schemas/CanonicalUUID'}
        plugin_id: {$ref: '#/components/schemas/PluginPublisherSlug'}
        version: {$ref: '#/components/schemas/PluginSemanticVersion'}
        manifest_path: {type: string, minLength: 2, maxLength: 1024, pattern: '^/(?!/)[^?#]+$'}
        expected_raw_sha256: {type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
        raw_manifest_sha256: {type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
        canonical_payload_sha256: {type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
        supply_chain_evidence_version: {type: integer, enum: [0, 1]}
        sbom_sha256: {type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
        provenance_sha256: {type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
        publisher_id: {$ref: '#/components/schemas/CanonicalUUID'}
        publisher_slug: {$ref: '#/components/schemas/PluginPublisherSlug'}
        publisher_key_version: {type: integer, format: int64, minimum: 1}
        publisher_key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        control_api_version: {$ref: '#/components/schemas/PluginSemanticVersion'}
        compatibility_constraint: {type: string, minLength: 2, maxLength: 128}
        compatible: {type: boolean}
        stable_reason_code: {type: string, enum: [compatible, control_api_incompatible]}
        installable: {type: boolean, const: false}
        configuration_schema_verified: {type: boolean, const: false}
        verified_at: {type: string, format: date-time}
    PluginManifestVerificationPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PluginManifestVerification'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
    PluginInstallationScope:
      type: string
      minLength: 3
      maxLength: 128
      pattern: '^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*){1,7}$'
    PluginInstallationScopeList:
      type: array
      maxItems: 64
      uniqueItems: true
      description: Canonical output is strictly sorted, unique, and may be empty.
      items: {$ref: '#/components/schemas/PluginInstallationScope'}
    PluginInstallationStatus:
      type: string
      enum: [pending_confirmation, authorized, disabled, enabled, uninstalled]
    PluginInstallationChecks:
      type: object
      additionalProperties: false
      required: [manifest_verified, catalog_sequence_verified, publisher_proof_verified, compatible, configuration_schema_verified]
      properties:
        manifest_verified: {type: boolean, const: true}
        catalog_sequence_verified: {type: boolean}
        publisher_proof_verified: {type: boolean}
        compatible: {type: boolean}
        configuration_schema_verified:
          type: boolean
          description: Independent configuration-schema verification fact; it is not inferred from a valid manifest signature.
    PluginCapabilityEvent:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '^io\.cdnca\.[a-z][a-z0-9_]*\.v[1-9][0-9]*\.[a-z][a-z0-9_]*$'
    PluginCapabilityEventList:
      type: array
      maxItems: 64
      uniqueItems: true
      description: Canonical output is strictly sorted and unique.
      items: {$ref: '#/components/schemas/PluginCapabilityEvent'}
    PluginCapabilityItem:
      type: object
      additionalProperties: false
      required: [kind, code]
      properties:
        kind: {type: string, enum: [scope, event, webhook]}
        code: {type: string, minLength: 1, maxLength: 160}
    PluginCapabilityKind:
      type: string
      enum: [scope, event, webhook]
    InstallationClientCertificateIssueRequest:
      type: object
      additionalProperties: false
      description: |
        Strict canonical JSON: members use the declared order and unknown, duplicate,
        null, trailing, or whitespace variants are rejected. proof is the canonical
        unpadded base64url Ed25519 signature over the length-prefixed proof domain and
        exact unsigned canonical JSON fields.
      x-proof-domain: cdnca-installation-client-certificate-issue/v1
      x-canonical-json-field-order: [schema, request_id, installation_id, expected_generation, csr_der, requested_at, proof]
      x-proof-payload-field-order: [schema, request_id, installation_id, expected_generation, csr_der, requested_at]
      required: [schema, request_id, installation_id, expected_generation, csr_der, requested_at, proof]
      properties:
        schema: {type: string, const: cdnca.installation-client-certificate-issue/v1}
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
        installation_id: {$ref: '#/components/schemas/CanonicalUUID'}
        expected_generation: {type: integer, format: int64, minimum: 0}
        csr_der:
          type: string
          minLength: 2
          maxLength: 87382
          pattern: '^[A-Za-z0-9_-]+$'
          x-decoded-byte-length: {minimum: 1, maximum: 65536}
          description: |
            The value is canonical unpadded base64url encoding of 1..65536 DER bytes. The signed CSR
            uses Ed25519 and contains exactly one URI SAN equal to
            spiffe://cdn-platform/installation/{installation_id}. No DNS, email, or IP SANs are permitted.
        requested_at:
          type: string
          format: date-time
          description: RFC3339 whole UTC second in the inclusive interval [now-5m, now].
        proof:
          type: string
          minLength: 86
          maxLength: 86
          pattern: '^[A-Za-z0-9_-]{86}$'
          description: Canonical unpadded base64url encoding of exactly 64 Ed25519 signature bytes.
    InstallationClientCertificate:
      type: object
      additionalProperties: false
      required: [schema, certificate_id, installation_id, generation, serial, certificate_der, ca_certificate_der, spiffe_id, status, issued_at, not_before, not_after, revision]
      properties:
        schema: {type: string, const: cdnca.installation-client-certificate/v1}
        certificate_id: {$ref: '#/components/schemas/CanonicalUUID'}
        installation_id: {$ref: '#/components/schemas/CanonicalUUID'}
        generation: {type: integer, format: int64, minimum: 1}
        serial: {type: string, minLength: 32, maxLength: 32, pattern: '^[a-f0-9]{32}$'}
        certificate_der: {type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]+$'}
        ca_certificate_der: {type: string, minLength: 1, pattern: '^[A-Za-z0-9_-]+$'}
        spiffe_id:
          type: string
          format: uri
          pattern: '^spiffe://cdn-platform/installation/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        status: {type: string, const: active}
        issued_at: {type: string, format: date-time}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time, description: Must be exactly 15 minutes after not_before.}
        revoked_at: {type: [string, 'null'], format: date-time}
        revocation_reason: {type: [string, 'null'], minLength: 1, maxLength: 500}
        revision: {type: integer, format: int64, const: 1}
    InstallationClientCertificateItem:
      type: object
      additionalProperties: false
      required: [certificate_id, installation_id, generation, serial, spiffe_id, status, issued_at, not_before, not_after, revoked_at, revocation_reason, revision]
      properties:
        certificate_id: {$ref: '#/components/schemas/CanonicalUUID'}
        installation_id: {$ref: '#/components/schemas/CanonicalUUID'}
        generation: {type: integer, format: int64, minimum: 1}
        serial: {type: string, minLength: 32, maxLength: 32, pattern: '^[a-f0-9]{32}$'}
        spiffe_id:
          type: string
          format: uri
          pattern: '^spiffe://cdn-platform/installation/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        status: {type: string, enum: [active, superseded, revoked]}
        issued_at: {type: string, format: date-time}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        revocation_reason: {type: [string, 'null'], minLength: 1, maxLength: 500}
        revision: {type: integer, format: int64, minimum: 1}
    InstallationClientCertificatePage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/InstallationClientCertificateItem'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
    InstallationClientCertificateRevokeRequest:
      type: object
      additionalProperties: false
      required: [schema, expected_generation, reason]
      properties:
        schema: {type: string, const: cdnca.installation-client-certificate-revoke/v1}
        expected_generation: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 500}
    PluginRuntimeBindingCreateRequest:
      type: object
      additionalProperties: false
