  /operator/v1/plugin-catalogs/{catalog_id}/sync:
    post:
      tags: [Operator Plugin Catalogs]
      operationId: syncPluginCatalog
      summary: Fetch and verify the registered catalog's signed snapshot
      description: |
        Fetches only `/.well-known/cdnca/plugin-catalog-v1.json` below the immutable
        registered HTTPS origin. The service resolves the registered host itself,
        rejects every non-public IPv4 or IPv6 result, pins dialing to the validated
        addresses, preserves the registered Host and TLS SNI, rejects redirects,
        and enforces a ten-second total timeout and a 2 MiB response limit.

        The response must use `application/vnd.cdnca.plugin-catalog.v1+json` and
        carry a strict versioned envelope signed by the catalog's registered Ed25519
        key. Synchronization stores an immutable last-known-good snapshot; it never
        fetches a manifest, installs a plugin, executes third-party code, or trusts a
        key declared by the remote catalog. An exact Idempotency-Key replay returns
        the original result without another outbound request. A snapshot more than
        one sequence ahead of the stored one is refused with 409
        `catalog_snapshot_sequence_gap`; see `resync-latest`.
      security: [{OperatorSession: []}]
      x-required-permissions: [licensing.plugin_catalogs.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
        - $ref: '#/components/parameters/PluginCatalogId'
      responses:
        '200':
          description: Verified snapshot and atomic successful attempt, or an exact replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginCatalogSyncResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableCatalogSnapshot'}
        '502': {$ref: '#/components/responses/CatalogSyncUnavailable'}
  /operator/v1/plugin-catalogs/{catalog_id}/resync-latest:
    post:
      tags: [Operator Plugin Catalogs]
      operationId: resyncPluginCatalogFromLatest
      summary: Accept the origin's current snapshot across a sequence gap
      description: |
        Same fetch, verification and storage as `sync`, except that a snapshot whose
        sequence is more than one ahead of the stored one is accepted. It is the way
        out when the snapshot after the stored one expired at the origin before this
        service fetched it (a long outage), which `sync` can only refuse as
        `sequence_gap`. A lower or equal sequence is still refused (409
        `catalog_snapshot_replay`). The reason is required and the audit event
        `plugin_catalog.resync_latest` records it with `previous_sequence` and
        `skipped_sequences`.
      security: [{OperatorSession: []}]
      x-required-permissions: [licensing.plugin_catalogs.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
        - $ref: '#/components/parameters/PluginCatalogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 4, maxLength: 500}
      responses:
        '200':
          description: Verified snapshot and atomic successful attempt, or an exact replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginCatalogSyncResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableCatalogSnapshot'}
        '502': {$ref: '#/components/responses/CatalogSyncUnavailable'}
