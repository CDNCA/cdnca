  /public/v1/signing-keyset:
    get:
      tags: [Operator Keys]
      operationId: getPublicSigningKeySet
      summary: Fetch the verifiable signing-key lineage
      description: |
        This credential-free endpoint is the trust-key distribution boundary for
        customer control planes. It returns every activated lineage key, including
        retired historical keys needed to verify the chain, plus the canonical new-key
        proof-of-possession document and old-key rotation authorization for each hop.
        A client must begin from an independently deployed public-key pin and verify
        every canonical document and signature; HTTPS success alone never establishes
        trust. Staged keys are never returned. The response allows any Origin with
        `Access-Control-Allow-Origin: *`, never allows credentials, and is cacheable
        for 60 seconds with a 24-hour stale-if-error allowance. ETag is a stable
        SHA-256 digest of the JSON body; send it in If-None-Match to receive 304.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Public verification keyset
          headers:
            Access-Control-Allow-Origin:
              schema: {type: string, const: '*'}
            Cache-Control:
              schema: {type: string, example: 'public, max-age=60, stale-if-error=86400'}
            ETag:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSigningKeySet'}
        '304':
          description: Keyset is unchanged; response has no body
          headers:
            Access-Control-Allow-Origin:
              schema: {type: string, const: '*'}
            Cache-Control:
              schema: {type: string, example: 'public, max-age=60, stale-if-error=86400'}
            ETag:
              required: true
              schema: {type: string}
        '409': {$ref: '#/components/responses/Conflict'}
    options:
      tags: [Operator Keys]
      operationId: preflightPublicSigningKeySet
      summary: Read the credential-free public keyset CORS policy
      security: []
      responses:
        '204':
          description: Public GET is allowed without credentials
          headers:
            Access-Control-Allow-Origin:
              schema: {type: string, const: '*'}
            Access-Control-Allow-Methods:
              schema: {type: string, const: 'GET, OPTIONS'}
            Access-Control-Max-Age:
              schema: {type: string, const: '600'}
  /operator/v1/signing-keys:
    get:
      tags: [Operator Keys]
      operationId: listSigningKeyMetadata
      summary: List signing-key metadata without key material
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.keys.manage]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: {type: string, enum: [staged, active, verify_only, retired]}
      responses:
        '200':
          description: Signing-key metadata page; public and private key material are omitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningKeyPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Operator Keys]
      operationId: createSigningKeyRotationChallenge
      summary: Stage an Ed25519 signer and create its proof-of-possession challenge
      description: |
        Every new key is staged and cannot sign until a later service-start reconcile
        injects the matching signer. Private key material is never accepted. The
        `challenge` response is unpadded base64url of the exact canonical JSON bytes
        to sign directly with the new Ed25519 private key; clients must decode and
        sign those bytes, not reconstruct or hash the JSON. The canonical JSON field
        order is `domain`, `rotation_id`, `new_key_id`, `public_key_fingerprint`,
        `not_before`, `sign_until`, `verify_until`, `nonce`,
        `challenge_expires_at`; domain is
        `cdnca.signing-key-rotation-pop/v1`. Fingerprint and nonce are unpadded
        base64url. The service never receives the private key.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.keys.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSigningKeyChallengeRequest'
      responses:
        '201':
          description: Staged key and exact proof-of-possession challenge, or exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningKeyChallenge'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/signing-provider-health:
    get:
      tags: [Operator Keys]
      operationId: getSigningProviderHealth
      summary: Read non-secret signing-provider readiness and active key overlap
      security: [{OperatorSession: []}]
      x-required-permissions: [licensing.keys.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/SignerProviderHealthRequestId'
      responses:
        '200':
          description: Current non-secret signing-provider health
          headers:
            Cache-Control: {$ref: '#/components/headers/SignerProviderHealthCacheControl'}
            X-Request-ID: {$ref: '#/components/headers/SignerProviderHealthRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerProviderHealth'}
        '401': {$ref: '#/components/responses/SignerProviderHealthUnauthorized'}
        '403': {$ref: '#/components/responses/SignerProviderHealthForbidden'}
        '503': {$ref: '#/components/responses/SignerProviderHealthUnavailable'}
  /operator/v1/signing-keys/{key_id}/proof:
    post:
      tags: [Operator Keys]
      operationId: submitSigningKeyProofOfPossession
      summary: Verify the staged signer and authorize rotation with the active signer
      description: |
        Submit an unpadded base64url Ed25519 signature over the decoded challenge
        bytes returned by the staging request. A successful proof causes the current
        active signer to sign a domain-separated canonical rotation authorization;
        it does not activate the new key. Activation occurs only on service startup
        or reconcile when the matching new signer is injected and every reported
        blocker is clear. Proofs are single-use apart from exact idempotent replay.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.keys.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
        - $ref: '#/components/parameters/SigningKeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitSigningKeyProofRequest'}
      responses:
        '200':
          description: Proof verified and active-signer authorization persisted, or exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningKeyProofResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
