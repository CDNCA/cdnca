        received_at: {type: string, format: date-time}
        policies:
          type: array
          minItems: 1
          maxItems: 256
          items: {type: object, additionalProperties: true}
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{85}[AQgw]$'}
