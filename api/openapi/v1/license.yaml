          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        revision: {type: integer, format: int64, minimum: 1}
        is_system: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at:
          type: [string, 'null']
