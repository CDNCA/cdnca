    PlatformPolicy:
      type: object
      additionalProperties: false
      required: [schema, minimum_control_version, blocked_control_versions, allowed_release_channels, plugin_market]
      properties:
        schema: {type: string, const: platform-policy/v1}
        minimum_control_version: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'}
        blocked_control_versions:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'}
        allowed_release_channels:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9._-]{0,95}$'}
        plugin_market:
          type: object
          additionalProperties: false
          required: [enabled, trusted_catalog_ids]
          properties:
            enabled: {type: boolean}
            trusted_catalog_ids:
              type: array
              maxItems: 256
              uniqueItems: true
              items: {type: string, pattern: '^[a-z][a-z0-9._-]{0,95}$'}
        cc_protection:
          anyOf:
            - $ref: '#/components/schemas/PlatformCCProtection'
            - type: 'null'
        waf_rule_libraries:
          type: [array, 'null']
          maxItems: 64
          items: {$ref: '#/components/schemas/PlatformPolicyWAFRuleLibrary'}
          x-order-by: [id]
          x-unique-by: [id, name]
          description: Optional. Libraries MUST be strictly ordered by UUID bytes; each ID and each name MUST be unique. Omitted, null and empty arrays all represent no WAF libraries.
        cc_system_rules:
          type: [array, 'null']
          maxItems: 32
          items: {$ref: '#/components/schemas/PlatformCCSystemRule'}
          x-order-by: [key]
          description: Optional. Rules MUST be in strictly increasing key order. See the policy description for the ordinary-publish difference between omitted/null and explicit empty arrays.
      x-max-canonical-utf8-bytes: 65536
      description: |
        The original five fields remain required. The blocked_control_versions,
        allowed_release_channels and plugin_market.trusted_catalog_ids arrays
        MUST already be strict UTF-8 ascending and unique; they are rejected
        rather than sorted. The CC matcher values array has no such restriction.

        For an ordinary publish, omitted or null cc_system_rules inserts the 10
        built-in CC system rules before canonicalization; explicit [] does not.
        Preflight does not insert these defaults, so its digest can differ from
        the subsequent ordinary publish. Rollback restores the stored canonical
        policy bytes and digest of the selected historical revision, without
        injecting current defaults. Null/omitted cc_protection is not distributed.
        Canonical bytes omit nil cc_protection and empty/nil CC and WAF lists.
        API policy responses include waf_rule_libraries (possibly null) but omit
        empty cc_system_rules; readback cannot recover the original omitted,
        null or explicit-empty command intent.

        The added schemas describe accepted requests as well as responses.
        Optional Go scalar fields accept omission or null as their zero value;
        optional value objects accept omission or null as a zero-valued object.
        Responses fill their non-omitempty fields with concrete zero values.
        Required values that reject the zero value cannot be null. Unknown
        fields are rejected except within CC filter parameters.

        The complete canonical UTF-8 JSON must not exceed 65536 bytes. CC text
        limits count UTF-8 bytes, whereas WAF text limits count Unicode runes
        and require strings.TrimSpace(value) == value. JSON Schema maxLength
        counts characters, not bytes. The x-* annotations document additional
        server checks; they are not standard JSON Schema validation keywords.
        Cross-item ordering/field uniqueness, UTF-8 byte limits, Go trimming,
        canonical CIDRs and total canonical size still require server validation.
    PlatformCCProtection:
      type: object
      additionalProperties: false
      required: [white_time]
      properties:
        cc_enable: {type: [boolean, 'null']}
        block_time: {type: [integer, 'null'], format: int64, minimum: 0}
        white_time: {type: integer, format: int64, minimum: 600}
        tmp_white_total_limit: {type: [integer, 'null'], format: int64, minimum: 0}
        tmp_white_per_limit: {type: [integer, 'null'], format: int64, minimum: 0}
        default_page_rule: {type: [string, 'null'], maxLength: 128, x-max-utf8-bytes: 128}
        auto_switch:
          anyOf:
            - $ref: '#/components/schemas/PlatformCCAutoSwitch'
            - type: 'null'
        templates:
          anyOf:
            - $ref: '#/components/schemas/PlatformCCTemplates'
            - type: 'null'
      x-go-integer-type: int
      description: |
        Only white_time is required: the zero value of every other field is
        accepted. Missing/null booleans, numbers and strings decode as false, 0
        and empty text; missing/null auto_switch and templates become objects
        containing those zero values in responses. CC text is not trimmed and
        rule names are not checked against a catalog. Integer fields use the
        native Go int decoder, with only the documented lower bounds in policy
        validation (signed 64-bit maximum 9223372036854775807 on a 64-bit server).
        This is not a 9007199254740991 server limit: JavaScript clients may reject
        larger response integers to avoid silent precision loss. The int64 format
        is a type hint, not a guarantee of exact JavaScript numeric validation.
    PlatformCCAutoSwitch:
      type: object
      additionalProperties: false
      properties:
        enable: {type: [boolean, 'null']}
        qps_50x: {type: [integer, 'null'], format: int64, minimum: 0}
        qps_total: {type: [integer, 'null'], format: int64, minimum: 0}
        rule: {type: [string, 'null'], maxLength: 128, x-max-utf8-bytes: 128}
        seconds: {type: [integer, 'null'], format: int64, minimum: 0}
      x-go-integer-type: int
      description: All fields may be omitted or null and decode to Go zero values. Integer decoding and client precision caveats are the same as PlatformCCProtection; rule is at most 128 UTF-8 bytes without a whitelist.
    PlatformCCTemplates:
      type: object
      additionalProperties: false
      properties:
        slider_html: {type: [string, 'null'], maxLength: 8192, x-max-utf8-bytes: 8192}
        captcha_html: {type: [string, 'null'], maxLength: 8192, x-max-utf8-bytes: 8192}
        click_html: {type: [string, 'null'], maxLength: 8192, x-max-utf8-bytes: 8192}
        delay_jump_html: {type: [string, 'null'], maxLength: 8192, x-max-utf8-bytes: 8192}
        rotate_html: {type: [string, 'null'], maxLength: 8192, x-max-utf8-bytes: 8192}
        easy_click_html: {type: [string, 'null'], maxLength: 8192, x-max-utf8-bytes: 8192}
        easy_slider_html: {type: [string, 'null'], maxLength: 8192, x-max-utf8-bytes: 8192}
      description: Each template is optional, untrimmed and limited to 8192 UTF-8 bytes. Missing/null strings decode to empty text and are included as strings in responses. maxLength alone cannot enforce the byte limit for multibyte text.
    PlatformCCSystemRule:
      type: object
      additionalProperties: false
      required: [id, key, name, sort]
      properties:
        id: {type: string, pattern: '^[0-9]{1,32}$'}
        key: {type: string, pattern: '^[a-z][a-z0-9._-]{0,95}$'}
        name: {type: string, minLength: 1, maxLength: 128, x-max-utf8-bytes: 128}
        sort: {type: integer, minimum: 1, maximum: 10000}
        matcher:
          anyOf:
            - $ref: '#/components/schemas/PlatformCCSystemMatcher'
            - type: 'null'
        filter:
          anyOf:
            - $ref: '#/components/schemas/PlatformCCSystemFilter'
            - type: 'null'
      oneOf:
        - required: [matcher]
          properties:
            matcher: {type: object}
            filter: {type: 'null'}
        - required: [filter]
          properties:
            filter: {type: object}
            matcher: {type: 'null'}
      description: Exactly one of matcher or filter MUST be non-null; the other may be omitted or null. Name is 1 to 128 UTF-8 bytes without trimming. Decimal IDs may have leading zeros and need not be unique; only the enclosing array's keys must be strictly ordered and unique.
    PlatformCCSystemMatcher:
      type: object
      additionalProperties: false
      required: [field, operator]
      properties:
        field: {type: string, minLength: 1, maxLength: 128, x-max-utf8-bytes: 128}
        operator: {type: string, minLength: 1, maxLength: 128, x-max-utf8-bytes: 128}
        key: {type: [string, 'null'], maxLength: 128, x-max-utf8-bytes: 128}
        values:
          type: [array, 'null']
          maxItems: 100
          items: {type: [string, 'null']}
      description: |
        Field and operator are arbitrary nonempty strings of at most 128 UTF-8
        bytes, not a whitelist of WAF field/operator names. Key is optional with
        the same byte maximum. Values may be omitted, null or empty; individual
        strings may be empty, repeated, unsorted and have no per-item size limit
        beyond the policy's canonical byte cap. A null values element decodes
        to an empty string. Missing/null key decodes to empty text and is omitted
        from responses. Missing/null values are returned as null; explicit []
        remains empty. Text is not trimmed.
    PlatformCCSystemFilter:
      type: object
      additionalProperties: false
      required: [type, parameters]
      properties:
        type: {type: string, enum: [off, relaxed, js, five_second, click, slider, captcha, rotate_image, simple_click, simple_slider]}
        parameters:
          type: object
          additionalProperties: true
      description: Parameters MUST be a non-null JSON object, including for off. Its keys and nested JSON values are unrestricted by this policy validator, subject to the whole canonical policy byte cap.
    PlatformPolicyWAFRuleLibrary:
      type: object
      additionalProperties: false
      required: [id, name, revision, rules]
      properties:
        id: {type: string, format: uuid, not: {const: '00000000-0000-0000-0000-000000000000'}}
        name: {type: string, minLength: 1, maxLength: 128, x-go-trim-space-equal: true}
        description: {type: [string, 'null'], maxLength: 1000, x-go-trim-space-equal: true}
        revision: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        enabled: {type: [boolean, 'null']}
        rules:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/PlatformPolicyWAFRule'}
          x-order-by: [priority, id]
          x-unique-by: [id, name]
          description: Strictly ordered by ascending priority, then UUID bytes for equal priorities. Each rule ID and each name MUST be unique within the library.
      description: Non-zero UUIDs are serialized in canonical lower-case form. Name and description MUST already be Go TrimSpace-trimmed valid UTF-8, with limits in Unicode runes. Omitted/null description and enabled decode to empty text and false and are filled in responses. Rules cannot be omitted, null or empty.
    PlatformPolicyWAFRule:
      type: object
      additionalProperties: false
      required: [id, name, priority, conditions, action, flow]
      properties:
        id: {type: string, format: uuid, not: {const: '00000000-0000-0000-0000-000000000000'}}
        name: {type: string, minLength: 1, maxLength: 128, x-go-trim-space-equal: true}
        priority: {type: integer, minimum: 1, maximum: 1000000}
        enabled: {type: [boolean, 'null']}
        conditions:
          type: array
          minItems: 1
          maxItems: 4
          items: {$ref: '#/components/schemas/PlatformPolicyWAFRuleCondition'}
          x-order-by: [field]
          x-unique-by: [field]
          description: Conditions MUST be strictly ordered by UTF-8 field name, with no repeated field.
        action: {type: string, enum: [allow, block, log]}
        flow: {type: string, enum: [continue, stop]}
      description: Name MUST already be Go TrimSpace-trimmed valid UTF-8 and is limited to 128 Unicode runes. ID is a non-zero UUID, serialized in canonical lower-case form. Omitted/null enabled decodes to false and is filled in responses.
    PlatformPolicyWAFRuleCondition:
      type: object
      additionalProperties: false
      required: [field, operator, values]
      properties:
        field: {type: string, enum: [client_ip, header, method, path, port]}
        operator: {type: string, enum: [ip_in_cidr, equals, prefix, number_eq]}
        key: {type: [string, 'null']}
        values:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256, x-go-trim-space-equal: true}
          x-order-by: [utf8_bytes]
      oneOf:
        - properties:
            field: {const: client_ip}
            operator: {const: ip_in_cidr}
        - required: [key]
          properties:
            field: {const: header}
            operator: {const: equals}
            key: {type: string, pattern: "^[!#$%&'*+.^_`|~0-9a-z-]{1,128}$"}
        - properties:
            field: {const: method}
            operator: {const: equals}
            values: {items: {type: string, pattern: '^[A-Z]{1,16}$'}}
        - properties:
            field: {const: path}
            operator: {enum: [equals, prefix]}
        - properties:
            field: {const: port}
            operator: {const: number_eq}
            values:
              maxItems: 1
              items: {type: string, pattern: '^(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'}
      allOf:
        - if:
            properties:
              field: {const: header}
          else:
            properties:
              key: {enum: ['', null]}
      description: |
        Values MUST be strictly increasing UTF-8 strings, already Go TrimSpace-
        trimmed, and contain 1 to 256 Unicode runes. client_ip requires masked,
        canonical CIDR text accepted by Go netip.ParsePrefix: the prefix must
        equal Prefix.Masked() and its text must equal Prefix.String(). This is
        an additional server check, not a JSON Schema format guarantee. Header
        requires a lower-case ASCII HTTP token key; all other fields accept only
        omitted/null/empty key, which is omitted in responses. Methods contain
        only 1 to 16 uppercase ASCII letters. Port has exactly one canonical
        decimal value from 1 to 65535, with no sign or leading zero. No regex,
        challenge action or other field/operator combination is supported here.
    PlatformPolicyEnvelope:
      type: object
      additionalProperties: false
      required: [domain, target_revision_id, action, schema, scope_kind, installation_id, scope_revision, signed_at, valid_from, expires_at, control_protocol_min, control_protocol_max, canonical_policy_sha256, supersedes, rollback_of, key_id]
      properties:
