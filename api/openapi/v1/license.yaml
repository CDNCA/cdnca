        '200':
          description: Redacted metadata for the revoked lease, or the original exact idempotent replay
          headers:
            ETag: {$ref: '#/components/headers/IssuedLeaseRevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedLeaseMetadata'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
        '504': {$ref: '#/components/responses/RequestTimeout'}
  /operator/v1/licenses/{license_id}/activation-credentials:
    post:
      tags: [Operator Licenses]
      operationId: issueActivationCredential
      summary: Issue a single-use installation activation credential
      description: |
        The credential is returned on the first success and on an exact idempotent replay.
        The database stores only its SHA-256 hash and a non-secret derivation key ID;
        replay recovery requires the corresponding server-held HMAC key. The credential
        is never accepted in a URL or written to audit payloads.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
