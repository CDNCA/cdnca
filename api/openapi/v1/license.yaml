  /operator/v1/plugin-catalogs/discover:
    post:
      tags: [Operator Plugin Catalogs]
      operationId: discoverPluginCatalog
      summary: Read an origin's announced catalog key and current snapshot for confirmation
      description: |
        Registration by origin. Fetches https://<origin>/.well-known/cdnca/plugin-catalog-key-v1.json
        (only https on 443, public addresses, no redirects, size and time limits), verifies the current
        snapshot with that key and returns the fingerprint and snapshot summary. Nothing is stored; the
        operator then registers with createPluginCatalog. public_key overrides the key document for
        offline or intranet catalogs, in which case a verifiable snapshot is required.
      security: [{OperatorSession: []}]
      x-required-permissions: [licensing.plugin_catalogs.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [origin]
              properties:
                origin: {type: string, maxLength: 2048}
                public_key: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200':
          description: Announced (or overriding) key and the current snapshot summary (null when none is published yet)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginCatalogDiscovery'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Key document or snapshot failed validation; reason_code names the check (catalog_snapshot_invalid)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: The origin could not be read; reason_code names the cause (catalog_sync_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
