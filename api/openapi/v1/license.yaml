            - type: object
              additionalProperties: false
              required: [id, username, email, status, verification]
              properties:
                id: {type: string, format: uuid}
                username: {type: string}
                email: {type: string}
                status: {type: string, enum: [active, disabled]}
                verification: {type: string, enum: [company_approved, personal_approved, pending, rejected, none]}
    CustomerPage:
      type: object
