      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PluginInstallationUnprocessable:
      description: Stable code is manifest_unverified, catalog_sequence_invalid, publisher_proof_invalid, control_api_incompatible, configuration_schema_unverified, scope_approval_required, or execution_mode_invalid. Protective disable and uninstall never return these trust-readiness errors.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PluginCapabilityInvalidRequest:
      description: Stable code is invalid_request, invalid_idempotency_key, or invalid_if_match. Strict JSON rejects duplicate, unknown, trailing, omitted, and null fields.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PluginCapabilityConflict:
      description: Stable code is idempotency_conflict, revision_conflict, or approval_state_conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PluginCapabilityUnprocessable:
      description: Stable code is capability_subset_invalid, sensitive_confirmation_required, new_confirmation_required, or capability_attestation_unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PluginCapabilityPreconditionRequired:
      description: Stable code precondition_required; the exact single strong If-Match field is missing.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RequestTooLarge:
      description: Stable code request_too_large; the request body exceeds 1 MiB.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: Stable code unsupported_media_type; POST requires exactly one Content-Type header field value that parses as application/json; valid unique parameters and media type casing are accepted, while missing, duplicate fields or parameters, combined, trailing-semicolon, malformed, alias, and other media type values are rejected.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PluginManifestInvalid:
      description: Stable code plugin_manifest_invalid; fetched immutable manifest evidence failed digest, signature, canonical encoding, identity, or compatibility validation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PluginManifestUnavailable:
      description: Stable code plugin_manifest_unavailable; the verifier could not safely fetch the remote manifest.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RequestTimeout:
      description: Stable code request_timeout; the bounded verifier operation timed out.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PortalInvalidRequest:
      description: |
        Stable code invalid_request. When one request JSON key is at fault the body
        also carries field (that key) and reason (required, too_short, too_long,
        invalid_format or out_of_range): ip, valid_hours, plan_id, billing_cycle,
        license_id, master_ip. A malformed body, path or Idempotency-Key names no field.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidRequest:
      description: The request body, identifier, pagination, or lifecycle operation shape is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Operator credentials, MFA, or server-side session are invalid, expired, disabled, or revoked.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MasterIPRebound:
      description: |
        Stable code master_ip_rebound. The license's master IP was changed to
        another server: installation-signed requests are accepted only from the master IP or an
        unexpired migration IP, and an installation retired by the rebind (status retired,
        retired_reason rebound) is always refused. The old controller keeps its current lease
        until it expires and then freezes (running sites keep serving).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Stable code is invalid_origin, foreign_identity_forbidden, forbidden, or reauthentication_required. Customer and control-plane identities are never accepted as platform operators.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: The requested licensing resource does not exist.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RulePackKeysUnavailable:
      description: Stable code rule_pack_keys_unavailable; the rule pack key custody is not configured, encrypted packs cannot be published.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Resource conflict, or idempotency_conflict when a key is reused with a different canonical request digest.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReleaseArtifactIngestConflict:
      description: Stable code is artifact_file_conflict (a different package already occupies that component version directory; it is never overwritten), conflict (component version already registered), or idempotency_conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReleaseArtifactTooLarge:
      description: Stable code artifact_too_large or request_too_large; the package exceeds 285229182 bytes and nothing was published.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReleaseArtifactStorageUnavailable:
      description: Stable code artifact_storage_unavailable; upload storage is not configured or not writable on this server.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerUnavailable:
      description: The active signing key is unavailable, outside its signing window, or failed closed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReleaseArtifactSizeAttestationReadbackUnavailable:
      description: Stable code `manifest_unavailable` for corrupt, retired, or expired durable evidence, or `audit_unavailable` when the required delivery audit cannot commit.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RepositoryVerificationConflict:
      description: Stable code is revision_conflict, idempotency_conflict, resource_unavailable, artifact_size_mismatch, or artifact_digest_mismatch.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RepositoryAddressRejected:
      description: Stable code repository_address_rejected; one or more resolved repository addresses are not public.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RepositoryResponseInvalid:
      description: Stable code is repository_response_invalid or repository_redirect_rejected; raw transport details are never exposed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RepositoryVerificationUnavailable:
      description: Stable code is repository_unavailable or signer_unavailable; raw configuration and transport errors are never exposed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: A required If-Match revision precondition is missing.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableCatalogSnapshot:
      description: The remote document, envelope, payload digest, time window, catalog identity, key version, or Ed25519 signature is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CatalogSyncUnavailable:
      description: The remote catalog failed public-address, TLS, redirect, status, Content-Type, size, timeout, or body-read validation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidCredential:
      description: Activation credential or proof of possession is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many login attempts from the current source address.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuleIntelMergeConflict:
      description: Stable code rule_intel_merge_state (the merge state does not allow the operation), rule_intel_gate_pending, rule_intel_candidate_state, conflict (an open draft for the target exists), rule_pack_version_not_newer, or idempotency_conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuleIntelGateFailed:
      description: Stable code rule_intel_gate_failed; a pack failed G1/G2 or has no passed G3 run.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuleIntelConflict:
      description: Stable code rule_intel_candidate_state (the candidate state does not allow the operation), rule_intel_corpus_duplicate, report_sequence_conflict, report_sequence_stale, or idempotency_conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuleIntelNotRedacted:
      description: Stable code report_not_redacted; the report carries a value the redaction check refuses, and the whole report is rejected and audited.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuleIntelSampleNotRedacted:
      description: Stable code sample_not_redacted; a string in the sample still contains personal data.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuleIntelRateLimited:
      description: Stable code rate_limited; the installation already sent 4 reports this UTC day.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RuleIntelUnavailable:
      description: Stable code rule_intel_unavailable; the rule intel anonymization key is not configured.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LoginProtectionRateLimited:
      description: |
        Login protection denied the attempt with stable code `operator_login_locked`
        or `operator_login_source_limited`. The response includes reason_code and
        retry_after_seconds and the required Retry-After header.
      headers:
        Retry-After: {$ref: '#/components/headers/LoginProtectionRetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    LoginProtectionUnavailable:
      description: Login protection coordination is unavailable; stable code `login_protection_unavailable`; the login fails closed.
      headers:
        Retry-After: {$ref: '#/components/headers/LoginProtectionRetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationConflict:
      description: |
        Stable code is one of `idempotency_conflict`,
        `signer_revocation_sequence_replay`,
        `signer_revocation_sequence_conflict`,
        `signer_revocation_chain_branch`,
        `signer_revocation_creator_approval_forbidden`,
        `signer_revocation_creator_publish_forbidden`,
        `signer_revocation_already_approved`,
        `signer_revocation_approval_required`,
        `signer_revocation_approval_expired`, `invalid_state`, or
        `signer_revocation_manifest_not_current`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationLengthRequired:
      description: Stable code `content_length_required`; Content-Length must be explicit and transfer encoding is forbidden.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationRequestTooLarge:
      description: Stable code `request_too_large`; the configured operator JSON limit is 64 KiB by default.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationUnsupportedMediaType:
      description: Stable code `unsupported_media_type`; Content-Type must be exactly application/json with no parameters.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationOperatorUnavailable:
      description: Stable code `signer_unavailable` or `audit_unavailable`; no successful write is reported when its audit fact fails.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationRequestTimeout:
      description: Stable code `request_timeout`; the operator request exceeded the bounded service deadline.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationInstallationUnauthorized:
      description: Stable code `unauthorized` or `request_expired`; unknown installations and invalid proofs are indistinguishable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationRateLimited:
      description: Stable code `rate_limited`; rejected by the bounded unauthenticated ingress gate.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationHeadersTooLarge:
      description: Stable code `headers_too_large`; checked before authentication and append-only attempt storage.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationDeliveryUnavailable:
      description: |
        Stable code is one of `installation_identity_unavailable`,
        `manifest_unavailable`, `request_timeout`, `manifest_invalid`,
        `manifest_digest_mismatch`, `manifest_sequence_gap`,
        `manifest_chain_branch`, or `attempt_unavailable`. A 200 or 304 is not
        sent when the required delivery-attempt append fails.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationCheckpointInvalid:
      description: |
        Stable code identifies non-canonical JSON, an invalid outer signature or
        authority, invalid checkpoint/keyset/inner chain, or an invalid current
        time window. No checkpoint fact is published.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationCheckpointConflict:
      description: |
        Stable code identifies idempotency conflict, same-revision different
        bytes, revision rollback/gap/fork, or mismatch with the authoritative
        keyset and published v1 manifest snapshot.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationCheckpointKnownStateConflict:
      description: |
        Stable code `checkpoint_known_state_conflict`; authentication succeeded,
        but the claimed known revision/digest is future, unknown, forked, or a
        same-revision digest conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationCheckpointTooLarge:
      description: Stable code `request_too_large`; exact signed checkpoint bytes must not exceed 8 MiB.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationCheckpointUnsupportedMediaType:
      description: Stable code `unsupported_media_type`; the exact checkpoint v2 media type is required without parameters.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationCheckpointUnavailable:
      description: |
        Stable code identifies offline-root verifier configuration, authoritative
        source snapshot, checkpoint store, audit, or request-timeout failure. A
        200/201 response is never sent before the successful transaction commits.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationCheckpointNotFound:
      description: Stable code `checkpoint_not_found`; no checkpoint has been imported.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationCheckpointOperatorReadUnavailable:
      description: |
        Stable code `checkpoint_unavailable` or `audit_unavailable`. Metadata is
        not returned unless the live-RBAC read and its required audit complete.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SignerRevocationCheckpointDeliveryUnavailable:
      description: |
        Stable code identifies unavailable fresh checkpoint, installation lookup,
        delivery-attempt persistence, or request timeout. A 200 or 304 is not sent
        before the delivery-attempt fact commits.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
