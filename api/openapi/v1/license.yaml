  /operator/v1/portal/verifications:
    get:
      tags: [Operator Customers]
      operationId: listPortalVerificationsForOperator
      summary: Page the customer verification (实名认证) review queue
      description: |
        Submissions in submission order ((submitted_at, id) ascending, backed by
        portal_customer_verifications_queue_idx). Pass the cursor of the previous
        page to continue; cursor is null and has_more is false on the last page.
        total counts every submission matching the status filter.
      security:
        - OperatorSession: []
