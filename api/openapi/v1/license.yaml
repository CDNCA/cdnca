      summary: Suspend, resume, or permanently close a licensing customer
      description: |
        The expected status is an optimistic concurrency precondition. An exact
        idempotent replay returns the original response after live RBAC succeeds.
        Closing a customer is terminal and does not cascade to licenses,
        installations, leases, customer control planes, or active Edge traffic.
