        expected_revision: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'}
        possession_proof: {$ref: '#/components/schemas/PluginPublisherKeyPossessionProof'}
    RetirePluginPublisherKeyRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, reason]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        reason: {type: string, minLength: 1, maxLength: 500}
    EmergencyReplacePluginPublisherKeyRequest:
      type: object
      additionalProperties: false
