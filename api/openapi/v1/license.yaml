      properties:
        version: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        algorithm: {type: string, const: Ed25519}
        public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'}
        fingerprint: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'}
        status: {type: string, const: active}
        created_at: {type: string, format: date-time}
    PluginPublisherKeyEmergencyReplacement:
      type: object
