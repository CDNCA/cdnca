        - type: object
          additionalProperties: false
          required: [operation, expected_status, reason]
          properties:
            operation: {type: string, const: resume}
            expected_status: {type: string, const: suspended}
            reason: {$ref: '#/components/schemas/CustomerLifecycleReason'}
        - type: object
          additionalProperties: false
          required: [operation, expected_status, reason]
          properties:
