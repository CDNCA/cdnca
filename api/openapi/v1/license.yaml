    post:
      tags: [Installation Runtime Credentials]
      operationId: issueInstallationClientCertificate
      summary: 签发安装客户端证书
      description: |
        Bootstrap authentication is the Ed25519 proof in the strict canonical body;
        no operator session or mTLS identity is accepted. request_id is the signed request_id replay key.
        The same installation_id, request_id, and canonical request digest
        replays the original immutable response; changed bytes return idempotency_conflict.
        The control-api runtime composition consumes this route through its rotating
        certificate manager and binds the returned certificate to projection mTLS.
      security: []
      x-maxLength: 1048576
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallationClientCertificateIssueRequest'}
      responses:
        '201':
          description: Fresh 15-minute installation client certificate or byte-equivalent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationClientCertificate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401':
          description: Stable code unauthorized; the installation is unavailable or the signed proof is invalid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Stable code idempotency_conflict or revision_conflict.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: Stable code certificate_signer_unavailable; no certificate or receipt is committed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '504': {$ref: '#/components/responses/RequestTimeout'}
