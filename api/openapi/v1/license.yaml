          in: query
          schema: {$ref: '#/components/schemas/LeaseStatus'}
      responses:
        '200':
          description: Redacted issued-lease metadata page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedLeasePage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
