      tags: [Operator Platform]
      operationId: getInstallationEndpoints
      summary: Read the latest installation-signed public endpoint report
      description: Read-only metadata, not a reachability probe. The customer must own the installation. An installation that has not reported returns report null.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/EntitlementLeaseInstallationId'
      responses:
        '200':
          description: Latest report or an explicit unreported state
          headers:
            Cache-Control: {$ref: '#/components/headers/EntitlementLeaseCacheControl'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [report]
                properties:
                  report:
                    oneOf:
                      - $ref: '#/components/schemas/InstallationEndpointReport'
                      - type: 'null'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /activation/v1/installations/{installation_id}/endpoints:report:
    post:
      tags: [Control Activation]
      operationId: reportInstallationEndpoints
      summary: Report public endpoints after local installation readiness
      description: |
        The current active installation signs this independent v1 report using its
        Ed25519 identity. Customer and license binding are derived from the installation,
        never accepted from the request. Private keys and activation credentials are forbidden.
        Sign SHA-256 of the following UTF-8 strings, each prefixed by its four-byte unsigned
        big-endian byte length, in this exact order: cdnca-installation-endpoint-report-proof/v1,
        schema, request_id, installation_id, control_url, gateway_host, decimal enrollment_port,
        decimal control_port, observed_at. Encode the signature as canonical unpadded base64url.
        Request IDs must be canonical nonzero UUIDs and match Idempotency-Key. Installation ID
        must match the path. observed_at must be UTC RFC3339 seconds with a Z suffix.
        New reports must be no older than 24 hours and no more than 5 minutes in the future;
        they must be newer than the previous report. Exact accepted-request replay returns
        the original receipt without overwriting newer metadata, even after the time window.
        Same ID with different signed content returns 409. All JSON fields are strict.
      security: []
      parameters:
        - $ref: '#/components/parameters/EntitlementLeaseInstallationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallationEndpointReportRequest'}
      responses:
        '200':
          description: Accepted report or exact idempotent replay
          headers:
            Cache-Control: {$ref: '#/components/headers/EntitlementLeaseCacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationEndpointReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
  /operator/v1/customers/{customer_id}/license-master-ips:
    get:
      tags: [Operator Licenses]
      operationId: listCustomerLicenseMasterIPs
      summary: List registered master IPs of one customer's licenses
      description: |
        Feeds the 主控IP column. Licenses without a binding row are omitted.
        open_mismatches counts installation-signed request sources seen in the
        last 7 days that differ from the registered master IP.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Master IP summaries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LicenseMasterIPSummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /operator/v1/licenses/{license_id}/master-ip:
    get:
      tags: [Operator Licenses]
      operationId: getLicenseMasterIP
      summary: Read a license's master IP binding, change history and mismatches
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      parameters:
        - $ref: '#/components/parameters/LicenseId'
      responses:
        '200':
          description: Binding (empty when never registered), last 100 changes, last 50 mismatch observations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseMasterIPView'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Operator Licenses]
      operationId: setLicenseMasterIP
      summary: Set or clear the master IP or the migration download IP
      description: |
        An empty ip clears the field. Clearing master_ip lets the next activation
        register its public source again (TOFU). Every change writes a history row
        with source operator and the given reason.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/LicenseId'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [field, ip, reason]
              properties:
                field: {type: string, enum: [master_ip, migration_ip]}
                ip: {type: string, description: Public unicast IPv4 or IPv6 address; empty clears.}
                valid_hours: {type: integer, minimum: 1, maximum: 720, description: 'migration_ip only, default 168'}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: Updated binding, or exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MasterIPBinding'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /download-authorization/v1/master:
    get:
      tags: [Control Activation]
      operationId: authorizeMasterDownload
      summary: nginx auth_request check for master release artifacts
      description: |
        Internal subrequest target of the authorization host's nginx for
        /downloads/control-native/ and /downloads/control-api/. The source is
        the TCP peer, or X-Forwarded-For / X-Real-IP only when the peer is in
        LICENSE_TRUSTED_PROXY_CIDRS. Allowed when the source is the registered
        master IP or an unexpired migration IP of an active license of an active
        customer. No body is returned in either case.
      security: []
      responses:
        '204':
          description: Source authorized
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
        '403':
          description: Source not registered; nginx answers the client with 403 and a 中文提示
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
        '503':
          description: Authorization store unavailable; nginx fails closed
  /portal/v1/licenses:
    get:
      tags: [Customer Portal]
      operationId: listPortalLicenses
      summary: 我的授权 (search, filters, tabs and pagination)
      description: |
        Only the session customer's licenses. 授权 IP is the license's registered
        master IP (license_master_ip_bindings.master_ip, the same IP 授权IP下载文件
        and master downloads check). 授权域名 is the console host of the latest
        endpoint report of each active installation that belongs to the same
        customer and license, newest activation first. search matches license ID,
        plan name, 授权 IP, 授权域名 and note (case-insensitive substring). Without
        page and page_size every matching license is returned.
      security:
        - PortalSession: []
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: tab, in: query, schema: {type: string, enum: [all, in_use, expiring, overdue, deleted], default: all}}
        - {name: plan_id, in: query, schema: {type: string, format: uuid}}
        - {name: expires_from, in: query, description: expires_at >= this (RFC 3339), schema: {type: string, format: date-time}}
        - {name: expires_to, in: query, description: expires_at < this (RFC 3339), schema: {type: string, format: date-time}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Matching licenses, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalLicensePage'}
        '400': {$ref: '#/components/responses/PortalInvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /portal/v1/licenses/{license_id}/master-ip:
    put:
      tags: [Customer Portal]
      operationId: setPortalLicenseMasterIP
      summary: 修改主控IP (customer self-service)
      description: |
        The portal page asks for a second confirmation. Each change is recorded in
        the history (source portal). At most 10 portal registrations or changes
        per license in 24 hours. The old master keeps its signed lease; its signed
        requests from the old IP are logged as mismatches, never refused.
        A retry with the same Idempotency-Key and body returns the first result and
        changes nothing (no history row, no allowance used, even after the limit);
        the same key with another body is 409 idempotency_conflict. expected_revision
        is the master_ip_revision the draft was made from; a newer binding is 409
        master_ip_revision_conflict. Re-sending the current value is a no-op.
      security:
        - PortalSession: []
      parameters:
        - $ref: '#/components/parameters/LicenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ip, expected_revision]
              properties:
                ip: {type: string, description: Public unicast IPv4 or IPv6 address}
                expected_revision: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Updated binding (or the first result of a replayed request)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MasterIPBinding'}
        '400': {$ref: '#/components/responses/PortalInvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Stable codes idempotency_conflict, master_ip_revision_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Stable code master_ip_change_limit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /portal/v1/licenses/{license_id}/download-ip:
    put:
      tags: [Customer Portal]
      operationId: setPortalLicenseMigrationIP
      summary: 授权IP下载文件 (temporary migration download IP)
      description: |
        The IP may download the master package and activate until it expires;
        activating from it promotes it to master IP. An empty ip clears it.
        Each new Idempotency-Key is a new intent (setting the same IP again
        restarts the validity); a retry with the same key and body returns the
        first result and never extends it. Same key with another body is 409
        idempotency_conflict; a stale expected_revision is 409
        master_ip_revision_conflict.
      security:
        - PortalSession: []
      parameters:
        - $ref: '#/components/parameters/LicenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ip, expected_revision]
              properties:
                ip: {type: string}
                valid_hours: {type: integer, minimum: 1, maximum: 720, default: 168}
                expected_revision: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Updated binding (or the first result of a replayed request)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MasterIPBinding'}
        '400': {$ref: '#/components/responses/PortalInvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Stable codes idempotency_conflict, master_ip_revision_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /portal/v1/licenses/{license_id}/master-ip-changes:
    get:
      tags: [Customer Portal]
      operationId: listPortalLicenseMasterIPChanges
      summary: Master IP change history of one of the customer's licenses
      security:
        - PortalSession: []
      parameters:
        - $ref: '#/components/parameters/LicenseId'
      responses:
        '200':
          description: Last 100 changes, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/MasterIPChange'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /portal/v1/orders:
    post:
      tags: [Customer Portal]
      operationId: createPortalOrder
      summary: 购买 / 续费 / 试用授权 (customer self-service order)
      description: |
        One transaction debits the balance, writes the order, ledger entry,
        license grant or extension and audit. license_id renews that license;
        without it a new license is bought (master_ip optionally registered).
        Free licensing mode sells only the free plan (billing_cycle free, 0 fen).
        When the operator switch 客户购买授权必须实名 is on
        (GET /operator/v1/identity-proof/purchase-policy) a new purchase or renewal,
        including a 0-fen free license, needs an approved verification (face,
        legal representative or company) of the customer; otherwise 409
        identity_proof_required and the portal sends the customer to 实名认证.
        Licenses bought earlier, master IP changes and the system's automatic
        0-fen free renewals are not affected.
      security:
        - PortalSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_id, billing_cycle]
              properties:
                plan_id: {type: string, format: uuid}
                billing_cycle: {type: string, enum: [monthly, yearly, permanent, trial, free]}
                license_id: {type: string, format: uuid, description: Renew this license (not allowed with trial or free)}
                master_ip: {type: string, description: Public unicast IP registered on a new license}
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalPurchaseResult'}
        '200':
          description: Exact replay of an earlier order with the same Idempotency-Key (replayed true)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalPurchaseResult'}
        '400': {$ref: '#/components/responses/PortalInvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: |
            Stable code identity_proof_required (实名开关已开启而客户未通过实名), insufficient_balance,
            trial_already_used, licensing_mode_free, licensing_mode_paid, free_license_limit,
            plan_unavailable, license_unavailable or idempotency_conflict.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /portal/v1/free-license-usage:
    get:
      tags: [Customer Portal]
      operationId: getPortalFreeLicenseUsage
      summary: 免费授权已领份数 (free plan card 领取 / 已领满)
      description: |
        used counts every free purchase order the customer ever placed, the same
        count POST /portal/v1/orders enforces against limit (free_max_per_customer);
        a revoked or expired free license still uses its place. Display hint only:
        the purchase re-checks the limit in its transaction.
      security:
        - PortalSession: []
      responses:
        '200':
          description: Free licenses taken and the per-customer limit
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [used, limit]
                properties:
                  used: {type: integer, minimum: 0}
                  limit: {type: integer, minimum: 1, maximum: 100}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /portal/v1/pow-challenges:
    post:
      tags: [Customer Portal]
      operationId: issuePortalPoWChallenge
      summary: Issue a proof-of-work challenge (portal prefix)
      description: |
        Same challenge as POST /auth/v1/pow-challenges, which the portal pages
        use; this path stays for clients on the /portal/v1 prefix. The client
        finds a nonce so that sha256(salt || nonce) has difficulty leading zero
        bits and sends pow_id + pow_nonce with the guarded request. Shares the
        image captcha's per-source rate window.
      security: []
      responses:
        '201':
          description: Single-use challenge
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PoWChallenge'}
        '429':
          description: Stable code rate_limited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /operator/v1/identity-proof/providers:
    get:
      tags: [Operator Customers]
      operationId: listIdentityProofProviders
      summary: 实名认证服务商（支付宝身份验证、腾讯云慧眼）settings
      description: |
        Mounted only when face verification is wired. Secrets are never returned,
        only whether one is stored and its fingerprint. service_ready is false
        when LICENSE_SELLER_SECRET_BASE64 is unset, so customers cannot start a check.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.identity_proof.manage]
      responses:
        '200':
          description: Both providers
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, service_ready]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/IdentityProofProvider'}
                  service_ready: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/identity-proof/providers/{provider}:
    put:
      tags: [Operator Customers]
      operationId: updateIdentityProofProvider
      summary: Replace one provider's settings
      description: |
        Optimistic concurrency on expected_revision. Omitted secret keeps the
        stored one, an empty string clears it, anything else replaces it (sealed
        with AES-256-GCM). Enabling builds the adapter once so malformed
        credentials are refused here. Audited as identity_proof_provider.update.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.identity_proof.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/IdentityProofProviderCode'
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityProofProviderInput'}
      responses:
        '200':
          description: Saved settings, or the original response for an exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityProofProvider'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Stable code revision_conflict or idempotency_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Stable code internal_error (for example the credential keyring is not configured)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /operator/v1/identity-proof/providers/{provider}/connection-tests:
    post:
      tags: [Operator Customers]
      operationId: testIdentityProofProvider
      summary: 测试连接 with the stored credentials
      description: |
        Queries the platform about a probe token that can never be a real
        session; nothing is written and no customer data is sent. ok true means
        the platform accepted the credentials (it answered a business error about
        the probe). code is ok, not_configured, invalid_configuration,
        signature_invalid, unreachable, invalid_response or the platform's own code.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.identity_proof.manage]
      parameters:
        - $ref: '#/components/parameters/IdentityProofProviderCode'
        - $ref: '#/components/parameters/OperatorOrigin'
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, code]
                properties:
                  ok: {type: boolean}
                  code: {type: string}
                  message: {type: string, description: The platform's short text, when it gave one}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/identity-proof/purchase-policy:
    get:
      tags: [Operator Customers]
      operationId: getPortalPurchaseIdentityPolicy
      summary: 客户购买授权必须实名 switch
      description: |
        Global, default off (migration 111, stored with the portal licensing
        settings and sharing their revision). On: portal purchases and renewals
        (POST /portal/v1/orders, including 0-fen free licenses) need an approved
        verification of the customer. Mounted even when face verification is not wired.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.identity_proof.manage]
      responses:
        '200':
          description: Current switch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalPurchaseIdentityPolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Operator Customers]
      operationId: setPortalPurchaseIdentityPolicy
      summary: Turn 客户购买授权必须实名 on or off
      description: Only affects later orders; licenses bought earlier keep working. Audited as portal_purchase_identity.update.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.identity_proof.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, required]
              properties:
                expected_revision: {type: integer, format: int64, minimum: 1}
                required: {type: boolean}
      responses:
        '200':
          description: Saved switch, or the original response for an exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalPurchaseIdentityPolicy'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Stable code revision_conflict or idempotency_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /activation/v1/installations:activate:
    post:
      tags: [Control Activation]
      operationId: activateControlInstallation
      summary: Activate a customer control-plane installation
      description: |
        The single-use activation credential and Ed25519 proof are body fields.
        The proof binds request ID, installation ID, name, public key and a hash
        of the credential. Repeating the same request returns the same lease.
        Master IP: when the license has a registered master IP the request source
        must equal it or an unexpired migration IP (which then becomes the master
        IP); otherwise 403 master_ip_mismatch and the credential stays unused. A
        license without any registration records a public source as its master IP
        (trust on first use); private or unknown sources activate without binding.
        After a master IP rebind, activating from the new master IP makes the new
        installation current and retires the license's other active installations.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateInstallationRequest'
      responses:
        '200':
          description: Installation activated, or exact idempotent replay of the same lease
          headers:
            Cache-Control: {$ref: '#/components/headers/EntitlementLeaseCacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaseResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403':
          description: Stable code master_ip_mismatch; the source is not the registered master IP or a valid migration IP.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409': {$ref: '#/components/responses/Conflict'}
  /activation/v1/installations/{installation_id}/identity:reactivate:
    post:
      tags: [Control Activation]
      operationId: reactivateControlInstallation
      summary: Replace an installation identity for migration or reinstall
      description: |
        The new Ed25519 private key is generated and retained by the customer control
        installation. Only its public key and signatures cross this API. The new-key proof
        binds the operation, request ID, installation, name, public key and credential hash.
        Migration additionally requires the current installation key to authorize that exact
        new-key proof; reinstall must omit previous_key_proof and relies on the step-up-issued
        one-time credential. Exact replay returns the same signed lease. Old signed bytes stay
        immutable while authoritative revocation facts prevent further use by the old identity.
      security: []
      parameters:
        - $ref: '#/components/parameters/EntitlementLeaseInstallationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReactivateInstallationRequest'}
      responses:
        '200':
          description: Updated identity snapshot and new signed lease, or exact replay
          headers:
            Cache-Control: {$ref: '#/components/headers/EntitlementLeaseCacheControl'}
            ETag:
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationReactivationResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /activation/v1/installations/{installation_id}/leases:renew:
    post:
      tags: [Control Activation]
      operationId: renewEntitlementLease
      summary: Renew an installation entitlement lease using proof of possession
      description: |
        After a master IP rebind the first successful renewal (or activation) from the new master IP
        makes this installation the license's current one and retires every other active installation
        of the license (whole-machine migration keeps its installation this way).
      security: []
      parameters:
        - $ref: '#/components/parameters/EntitlementLeaseInstallationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proof]
              properties:
                proof:
                  type: string
                  minLength: 86
                  maxLength: 86
                  pattern: '^[A-Za-z0-9_-]{85}[AQgw]$'
                  description: Canonical unpadded base64url raw 64-byte Ed25519 signature over the versioned renewal proof message.
      responses:
        '200':
          description: New or existing idempotent lease
          headers:
            Cache-Control: {$ref: '#/components/headers/EntitlementLeaseCacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaseResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/MasterIPRebound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /activation/v1/installations/{installation_id}/upgrade-candidates:resolve:
    $ref: ../../license-upgrade-candidates.openapi.yaml#/paths/~1activation~1v1~1installations~1{installation_id}~1upgrade-candidates:resolve
  /activation/v1/installations/{installation_id}/upgrade-grants:issue:
    post:
      tags: [Control Activation]
      operationId: issueInstallationUpgradeGrant
      summary: Issue a short-lived signed upgrade grant using installation proof
      description: |
        Idempotency-Key is also the signed proof request ID. The proof binds installation,
        component, current version and protocol version (v2 also binds requested_artifact_id).
        Without requested_artifact_id the service selects the operator pin or the channel target.
        A semver downgrade is granted only when the schema gate allows it; otherwise 409
        upgrade_target_blocked with a reason.
      security: []
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueUpgradeGrantRequest'}
      responses:
        '200':
          description: New or exactly replayed signed upgrade grant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpgradeGrantResponse'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/MasterIPRebound'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Resource unavailable, idempotency conflict, or upgrade_target_blocked (schema gate).
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/Error'}
                  - {$ref: '#/components/schemas/UpgradeTargetBlocked'}
  /activation/v1/installations/{installation_id}/upgrade-options:list:
    post:
      tags: [Control Activation]
      operationId: listInstallationUpgradeOptions
      summary: List channel versions the customer may choose, with reasons for the others
      description: |
        Read-only, no-store. Canonical JSON body. Proof headers X-CDNCA-Installation-ID,
        X-CDNCA-Requested-At and X-CDNCA-Proof; the Ed25519 proof domain is
        `cdnca-upgrade-options-request-proof/v1` over method, path, Idempotency-Key,
        installation, requested-at and the body SHA-256. Each option applies the same checks
        upgrade-grants:issue applies to requested_artifact_id.
      security: []
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpgradeOptionsRequest'}
      responses:
        '200':
          description: Selectable version list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpgradeOptions'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: upgrade_options_unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /activation/v1/installations/{installation_id}/upgrade-plan-artifact-bundles:issue:
    post:
      tags: [Control Activation]
      operationId: issueInstallationUpgradePlanArtifactBundle
      summary: Issue one signed immutable artifact bundle for a new upgrade plan
      description: |
        Accepts only canonical JSON and the exact installation proof headers. The
        Ed25519 proof domain is `cdnca-upgrade-plan-artifact-bundle-request-proof/v1`
        and binds method, path, Idempotency-Key, installation, requested-at and the
        SHA-256 of the exact canonical body. `initial_plan_revision` is exactly 1.
        The service validates the current parent upgrade grant and freezes its forward
        artifact plus the historical channel artifact for rollback. The caller selects
        `command_issuance_not_after`; it must be after database time, no more than seven
        days later, and no later than a finite license expiry. This endpoint never
        accepts a node ID or issues a node command. Exact replay returns the original
        encoded bytes; changed body digest returns 409.
      security: []
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/UpgradeCommandIdempotencyKey'
        - $ref: '#/components/parameters/UpgradeCommandRequestId'
        - $ref: '#/components/parameters/UpgradeCommandInstallationId'
        - $ref: '#/components/parameters/UpgradeCommandRequestedAt'
        - $ref: '#/components/parameters/UpgradeCommandProof'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueUpgradePlanArtifactBundleRequest'}
      responses:
        '200':
          description: New or exactly replayed signed plan artifact bundle
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpgradePlanArtifactBundleResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/MasterIPRebound'}
        '409':
          description: |
            upgrade_target_blocked with reason_code when the parent grant is not a forward upgrade
            (same_version for reinstall, downgrade_not_supported for rollback); otherwise
            upgrade_plan_artifact_bundle_unavailable or a replay conflict.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpgradeTargetBlocked'
                  - $ref: '#/components/schemas/Error'
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {$ref: '#/components/responses/SignerUnavailable'}
  /activation/v1/installations/{installation_id}/upgrade-command-grants:issue:
    post:
      tags: [Control Activation]
      operationId: issueInstallationUpgradeCommandGrant
      summary: Bind an upgrade command to one verified parent grant and node
      description: |
        Accepts only canonical JSON and the exact installation proof headers. The
        Ed25519 proof domain is `cdnca-upgrade-command-grant-request-proof/v1` and
        binds method, path, Idempotency-Key, installation, requested-at and the
        SHA-256 of the exact canonical body. The service revalidates the stored signed
        artifact bundle, installation, license, channel and signing keys, then binds
        the actual positive plan revision and canonical batch ID and freezes forward
        and rollback profiles. A command is valid for at most fifteen minutes and no
        later than the bundle's command issuance deadline. No Authorization header is used.
        Exact same-key replay returns the original encoded bytes, including after the
        command grant expires; changed body digest returns 409.
      security: []
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/UpgradeCommandIdempotencyKey'
        - $ref: '#/components/parameters/UpgradeCommandRequestId'
        - $ref: '#/components/parameters/UpgradeCommandInstallationId'
        - $ref: '#/components/parameters/UpgradeCommandRequestedAt'
        - $ref: '#/components/parameters/UpgradeCommandProof'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueUpgradeCommandGrantRequest'}
      responses:
        '200':
          description: New or exactly replayed signed upgrade command grant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpgradeCommandGrantResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/MasterIPRebound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {$ref: '#/components/responses/SignerUnavailable'}
  /installation/v1/upgrade-grant-receipts:
    post:
      tags: [Installation Upgrade Receipts]
      operationId: recordInstallationUpgradeGrantReceipt
      summary: Record one installation-signed upgrade grant lifecycle transition
      description: |
        Accepts only the exact v2 JSON object and no Authorization or Idempotency-Key
        header. The Ed25519 proof domain is `cdnca-upgrade-grant-receipt-proof/v1`
        and binds schema, request ID, installation ID, fresh requested-at, grant ID,
        status, installed version, error code and observed-at in that order. The
        stable logical replay digest uses domain
        `cdnca-upgrade-grant-receipt-idempotency/v2` and the same fields except
        requested-at and proof, so every retry uses a fresh proof and repeats live
        installation/key checks. The service derives the predecessor while locking
        the parent grant ledger; clients cannot supply it. A terminal observation
        after grant expiry requires a fetched and verified chain observed before
        expiry. A successful rolled_back transition has a null error_code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpgradeGrantReceiptRequestV2'}
      responses:
        '200':
          description: New receipt or live-authorized exact logical replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpgradeGrantReceiptResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
  /control/v1/installations/{installation_id}/usage-reports:
    post:
      tags: [Control Usage]
      operationId: reportInstallationEntitlementUsage
      summary: Submit one low-frequency signed aggregate usage report
      description: |
        The report is an operational observation, not a real-time metering stream and
        not an authorization decision. It contains exactly the six v1 quota codes and
        is retained in the licensing database only as low-frequency report history.
        Customer and license identity are derived from the registered installation.
        A lower policy limit may produce an over-limit warning, but this endpoint never
        stops existing edge traffic. New reports must reference the serial of the
        installation's current last_lease_id; an exactly replayed successful request
        remains replayable after lease renewal. Idempotency-Key is part of the Ed25519 proof.
      security: []
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntitlementUsageReportRequest'}
      responses:
        '200':
          description: Accepted report or exact replay of the original accepted report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementUsageReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /control/v2/installations/{installation_id}/usage-reports:
    post:
      tags: [Control Usage]
      operationId: reportInstallationEntitlementUsageV2
      summary: Submit one signed thirteen-code aggregate usage report
      description: |
        Accepts exactly application/json up to 1 MiB and exactly one strict
        Idempotency-Key. The installation Ed25519 proof is the SHA-256 digest of
        four-byte big-endian length-prefixed UTF-8 fields in this order: domain
        `cdnca-entitlement-usage-report-proof/v2`, Idempotency-Key, canonical
        installation UUID, schema, sequence, lease serial, whole-second observed_at,
        then the thirteen lexical code/used pairs. Exact replay returns the original
        201 response bytes; the same key with a different digest conflicts. Once a v2
        report commits, a new v1 sequence is rejected as usage_schema_downgrade.
        Current lease, grace and revocation fences apply. Reporting remains outside the
        edge request path and cannot interrupt existing traffic.
      security: []
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntitlementUsageReportRequestV2'}
      responses:
        '201':
          description: Accepted v2 report or exact replay of the original accepted report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementUsageReportV2'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
  /installation/v1/platform-policies:resolve:
    post:
      tags: [Installation Policies]
      operationId: resolveInstallationPlatformPolicies
      summary: Resolve at most one global and one installation-scoped signed target
      description: |
        The proof is produced only by the installation key. The response targets
        are SignedPlatformPolicy values directly and never include operator metadata.
        A cursor is bound to the known applied revision high-water marks, not merely
        delivered candidates, so rejected or future targets cannot poison retries.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolvePlatformPolicyRequest'}
      responses:
        '200':
          description: Signed target candidates or a not-modified response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvePlatformPolicyResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /installation/v1/platform-policy-acknowledgements:
    post:
      tags: [Installation Policies]
      operationId: acknowledgeInstallationPlatformPolicy
      summary: Append a proof-bound delivery acknowledgement
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcknowledgePlatformPolicyRequest'}
      responses:
        '200':
          description: Accepted status or exact request replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcknowledgePlatformPolicyResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/InvalidCredential'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /installation/v1/waf-rule-reports:
    post:
      tags: [Control Usage]
      operationId: reportInstallationWAFCustomRules
      summary: Submit an installation-signed custom WAF rule snapshot
      description: |
        The installation signs a canonical digest containing the request id,
        installation identity, schema, sequence, observed-at timestamp, and the
        canonical policy digest. Reports are append-only and strictly increasing;
        exact request-id replay is idempotent. The licensing service stores the
        complete user-authored snapshot, while platform-provided protected rules
        are not included in this response path.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WAFCustomRuleReportRequest'}
      responses:
        '201':
          description: Accepted report or exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WAFCustomRuleReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/signer-revocations/{proposal_id}:
    get:
      tags: [Operator Signer Revocations]
      operationId: getSignerRevocationProposal
      summary: Read one signer revocation proposal and its impact projection
      description: |
        This high-risk detail view is audited. The request must have no query,
        body, Content-Type or transfer encoding.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.view]
      parameters:
        - $ref: '#/components/parameters/SignerRevocationProposalId'
      responses:
        '200':
          description: Current immutable proposal projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationProposal'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocations/current:
    get:
      tags: [Operator Signer Revocations]
      operationId: getCurrentSignerRevocationOperatorView
      summary: Read current published signer revocation metadata
      description: |
        Audited high-risk view of the current publication. It returns publication
        metadata and the associated proposal projection, not signed manifest bytes
        or private signer material. `workflow_version` distinguishes immutable
        migrated v1 history from v2 maker-checker publications. A migrated v1
        publication has `published_by: null` because that actor was not recorded;
        the service never fabricates legacy provenance. V2 publication always has
        a non-null operator UUID. The installation proof delivery route is a
        separate trust boundary.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.view]
      responses:
        '200':
          description: Current published manifest metadata and proposal projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentSignerRevocationView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocations/{proposal_id}/history:
    get:
      tags: [Operator Signer Revocations]
      operationId: listSignerRevocationProposalHistory
      summary: Read append-only signer revocation proposal history
      description: |
        Returns redacted audit facts for the proposal. The request must have no
        body, Content-Type or transfer encoding and accepts only page parameters.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.view]
      parameters:
        - $ref: '#/components/parameters/SignerRevocationProposalId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Append-only proposal history page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationHistoryPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocation-previews:
    post:
      tags: [Operator Signer Revocations]
      operationId: previewSignerRevocationProposal
      summary: Preview signer revocation lineage and impact
      description: |
        Requires exactly `application/json` with no media-type parameters, an
        explicit Content-Length, no transfer encoding, a body no larger than 64
        KiB by default, and strict JSON with no duplicate or unknown fields or
        trailing value. `Idempotency-Key` is forbidden because this operation
        creates no domain fact. The returned canonical digest contains this
        preview's trusted operation time as `issued_at`; it is sample-only and
        must not be used as a later create, approval or publication precondition.
        The created draft returns the exact digest for approval and publication.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.view]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignerRevocationSpec'}
      responses:
        '200':
          description: Point-in-time lineage and impact preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationPreview'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '411': {$ref: '#/components/responses/SignerRevocationLengthRequired'}
        '413': {$ref: '#/components/responses/SignerRevocationRequestTooLarge'}
        '415': {$ref: '#/components/responses/SignerRevocationUnsupportedMediaType'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocations/{proposal_id}/approvals:
    post:
      tags: [Operator Signer Revocations]
      operationId: approveSignerRevocationProposal
      summary: Append an exact-digest signer revocation approval
      description: |
        Approval is a separate append-only operation. The active approver must
        differ from the creator. It binds the exact draft canonical digest and
        expires no more than 24 hours after approval. The client cannot claim an
        approved or verified state. Exact idempotent replay returns the original
        immutable result; the same key with another payload returns 409.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.approve]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/SignerRevocationIdempotencyKey'
        - $ref: '#/components/parameters/SignerRevocationProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignerRevocationApprovalRequest'}
      responses:
        '200':
          description: Approved proposal or exact immutable replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationProposal'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/SignerRevocationConflict'}
        '411': {$ref: '#/components/responses/SignerRevocationLengthRequired'}
        '413': {$ref: '#/components/responses/SignerRevocationRequestTooLarge'}
        '415': {$ref: '#/components/responses/SignerRevocationUnsupportedMediaType'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocations/{proposal_id}/publish:
    post:
      tags: [Operator Signer Revocations]
      operationId: publishSignerRevocationProposal
      summary: Publish an approved signer revocation manifest
      description: |
        Publication is a separate permission, operation and audit fact. The
        publisher must differ from the creator; the approver may publish only
        when independently granted this permission. Under the global writer lock,
        the service revalidates the exact digest, live approval and expiry,
        proposal expiry, current head and sequence, previous digest, authority
        generation and effective authority revocations before using the injected
        Signer/KMS. Published revocations are permanent and this API provides no
        withdraw or unrevoke operation. Concurrent publication has one winner.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.publish]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/SignerRevocationIdempotencyKey'
        - $ref: '#/components/parameters/SignerRevocationProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignerRevocationDigestRequest'}
      responses:
        '200':
          description: Published proposal or exact immutable replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationProposal'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/SignerRevocationConflict'}
        '411': {$ref: '#/components/responses/SignerRevocationLengthRequired'}
        '413': {$ref: '#/components/responses/SignerRevocationRequestTooLarge'}
        '415': {$ref: '#/components/responses/SignerRevocationUnsupportedMediaType'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocations/{proposal_id}/cancel:
    post:
      tags: [Operator Signer Revocations]
      operationId: cancelSignerRevocationProposal
      summary: Cancel an unpublished signer revocation draft
      description: |
        Only the creator may append the single `creator_cancelled` terminal fact.
        Approval, publication and deletion are then forbidden. This operation
        cannot cancel or withdraw a published manifest.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.create]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/SignerRevocationIdempotencyKey'
        - $ref: '#/components/parameters/SignerRevocationProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignerRevocationCancelRequest'}
      responses:
        '200':
          description: Cancelled proposal or exact immutable replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationProposal'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/SignerRevocationConflict'}
        '411': {$ref: '#/components/responses/SignerRevocationLengthRequired'}
        '413': {$ref: '#/components/responses/SignerRevocationRequestTooLarge'}
        '415': {$ref: '#/components/responses/SignerRevocationUnsupportedMediaType'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocations/{proposal_id}/reject:
    post:
      tags: [Operator Signer Revocations]
      operationId: rejectSignerRevocationProposal
      summary: Reject an unpublished signer revocation proposal
      description: |
        An active operator other than the creator, with approve permission,
        appends the single `approval_rejected` terminal fact. This operation
        cannot reject, withdraw or undo a published manifest.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.approve]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/SignerRevocationIdempotencyKey'
        - $ref: '#/components/parameters/SignerRevocationProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignerRevocationRejectRequest'}
      responses:
        '200':
          description: Rejected proposal or exact immutable replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationProposal'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/SignerRevocationConflict'}
        '411': {$ref: '#/components/responses/SignerRevocationLengthRequired'}
        '413': {$ref: '#/components/responses/SignerRevocationRequestTooLarge'}
        '415': {$ref: '#/components/responses/SignerRevocationUnsupportedMediaType'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocations:
    get:
      tags: [Operator Signer Revocations]
      operationId: listSignerRevocationProposals
      summary: List signer revocation proposals and publication state
      description: |
        Returns redacted proposal projections. The request must have no body,
        Content-Type or transfer encoding. Ordinary list reads do not append one
        audit fact per returned row. The legacy
        `licensing.signer_revocations.manage` permission is never accepted.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.view]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SignerRevocationStatus'
      responses:
        '200':
          description: Proposal page ordered by the service projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationProposalPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
    post:
      tags: [Operator Signer Revocations]
      operationId: createSignerRevocationProposal
      summary: Create an unpublished signer revocation draft
      description: |
        Requires exactly `application/json`, explicit Content-Length, no transfer
        encoding, and strict JSON no larger than 64 KiB by default. The request
        binds the expected sequence, previous sequence and previous manifest
        digest; it does not accept a client-claimed approval, verification result
        or preview digest. A superseding draft may reference exactly one
        cancelled or rejected, unpublished predecessor at the same sequence and
        chain head. Exact replay returns the original draft; changed payload with
        the same Idempotency-Key returns 409.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.create]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/SignerRevocationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSignerRevocationProposalRequest'}
      responses:
        '201':
          description: Created draft or exact immutable replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationProposal'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/SignerRevocationConflict'}
        '411': {$ref: '#/components/responses/SignerRevocationLengthRequired'}
        '413': {$ref: '#/components/responses/SignerRevocationRequestTooLarge'}
        '415': {$ref: '#/components/responses/SignerRevocationUnsupportedMediaType'}
        '503': {$ref: '#/components/responses/SignerRevocationOperatorUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocation-checkpoints:
    get:
      tags: [Operator Signer Revocations]
      operationId: getCurrentSignerRevocationCheckpointForOperator
      summary: Read the current signer-revocation checkpoint metadata
      description: |
        Returns only the persisted current checkpoint metadata needed to confirm
        an offline-root checkpoint import. Signed checkpoint bytes, signatures,
        keys, operator identity, idempotency data and internal errors are never
        returned. The OperatorSession cookie is the only accepted identity; a
        bearer, control or installation identity cannot substitute for it.

        The request must contain exactly one visible-ASCII X-Request-ID and no
        query, body, Content-Type, transfer encoding or nonzero Content-Length.
        The service rechecks `licensing.signer_revocations.view` against live
        licensing-database RBAC and atomically appends the read audit before
        returning. `fresh` means the database operation time is strictly before
        `expires_at`; an expired checkpoint remains visible for diagnosis but is
        not made valid for installation recovery.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.view]
      parameters:
        - $ref: '#/components/parameters/SignerRevocationRequestId'
      responses:
        '200':
          description: Current persisted checkpoint metadata after the successful read audit commits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationCheckpointOperatorReadback'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SignerRevocationCheckpointNotFound'}
        '503': {$ref: '#/components/responses/SignerRevocationCheckpointOperatorReadUnavailable'}
    post:
      tags: [Operator Signer Revocations]
      operationId: importSignerRevocationCheckpoint
      summary: Import and publish a pre-signed full signer-revocation checkpoint
      description: |
        Accepts exact canonical `SignedCheckpoint` bytes produced by an external
        offline signer or KMS. The online license-service holds only the pinned
        offline-root public key and never signs or re-signs checkpoints. The body
        is not wrapped or base64 encoded. It must use the exact checkpoint media
        type, an explicit Content-Length no larger than 8 MiB, no transfer
        encoding, strict canonical JSON, Idempotency-Key and X-Request-ID.

        Before publication, the service verifies the fresh outer signature and
        bounded TTL, revision lineage, exact current canonical keyset, and every
        original signed v1 manifest in the complete `1..head` prefix against the
        authoritative database snapshot. The approved and published v1 facts are
        not replaced by a client assertion. The checkpoint fact, successful import
        attempt and audit append commit atomically. Exact same-revision bytes are
        an idempotent replay; changed bytes, rollback, gap, fork or source-snapshot
        mismatch return 409. Failed high-risk attempts are durably audited without
        reporting a successful publication.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.publish]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/SignerRevocationIdempotencyKey'
        - $ref: '#/components/parameters/SignerRevocationRequestId'
      requestBody:
        required: true
        content:
          application/vnd.cdnca.signer-revocation-checkpoint.v2+json:
            schema:
              $ref: '../../schemas/licensing/v2/signer-revocation-checkpoint.schema.json#/$defs/signedCheckpoint'
      responses:
        '201':
          description: First atomic publication of this checkpoint revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationCheckpointImportResult'}
        '200':
          description: Exact idempotent replay of the already published bytes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationCheckpointImportResult'}
        '400': {$ref: '#/components/responses/SignerRevocationCheckpointInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/SignerRevocationCheckpointConflict'}
        '411': {$ref: '#/components/responses/SignerRevocationLengthRequired'}
        '413': {$ref: '#/components/responses/SignerRevocationCheckpointTooLarge'}
        '415': {$ref: '#/components/responses/SignerRevocationCheckpointUnsupportedMediaType'}
        '431': {$ref: '#/components/responses/SignerRevocationHeadersTooLarge'}
        '503': {$ref: '#/components/responses/SignerRevocationCheckpointUnavailable'}
        '504': {$ref: '#/components/responses/SignerRevocationRequestTimeout'}
  /operator/v1/signer-revocation-checkpoints/expiry-reminder:
    get:
      tags: [Operator Signer Revocations]
      operationId: getSignerRevocationCheckpointExpiryReminder
      summary: Read the offline-root re-sign reminder for the latest imported checkpoint
      description: |
        Evaluates the latest imported checkpoint at the database operation time
        so the operator console can remind operators to re-sign it with the
        offline root (default validity 30 days, reminder 7 days before
        expiry). `state` is `not_imported`, `valid`, `expiring`
        (0 < remaining <= 7 days) or `expired` (operation time >= expires_at;
        newly installed control planes cannot obtain revocation facts).
        `head_sequence` is the published signer-revocation head of the license
        service; when it is 0 (no revocation ever published) every level is one
        step lower. Levels: valid `none`; expiring `warning` (`info` at head 0);
        expired and not_imported `critical` (`warning` at head 0).
        `remaining_days` rounds up and is 0 once expired; `revision`,
        `expires_at` and `remaining_days` are null when nothing was imported.

        Same request surface, live `licensing.signer_revocations.view` RBAC
        recheck and read audit (`signer_revocation.view`) as the checkpoint
        metadata GET; a never-imported reminder is still 200 and its audit
        records `checkpoint_not_found`. A persisted checkpoint that no longer
        verifies against the configured offline-root trust returns 503.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.view]
      parameters:
        - $ref: '#/components/parameters/SignerRevocationRequestId'
      responses:
        '200':
          description: Reminder evaluated after the read audit commits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignerRevocationCheckpointExpiryReminder'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/SignerRevocationCheckpointOperatorReadUnavailable'}
  /operator/v1/edge-signer-trust:
    get:
      tags: [Operator Signer Revocations]
      operationId: listEdgeSignerTrustPublications
      summary: List published node signer trust documents (newest first, at most 100)
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.view]
      responses:
        '200':
          description: Published revisions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/EdgeSignerTrustPublication'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Operator Signer Revocations]
      operationId: publishEdgeSignerTrust
      summary: Publish an offline-signed node signer trust document
      description: |
        The body is the exact signed `cdnca.edge-signer-trust/v1` file from
        `signer-offline-root sign-edge-trust`. It must verify against the
        configured offline-root trust, be exactly the next revision and keep
        every earlier revocation; the same bytes as the latest revision are a
        replay (200). Requires live `licensing.signer_revocations.publish`, a
        recent re-authentication and the operator origin. Every attempt is
        audited as `system.signer_trust.publish` (source IP, change summary).
        Control planes pull the latest revision from
        `GET /public/v1/edge-signer-trust`. After storing (or replaying) the
        latest revision the service refreshes its own edge download copies
        (`edge-agent/signer-trust.json`, `edge-agent/artifacts.json`) and
        reports each one in `download_copies`; a failed copy does not undo the
        publication, and uploading the same file again (replay) retries it.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.publish]
      parameters:
        - $ref: '#/components/parameters/SignerRevocationRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: string, format: binary, maxLength: 266240}
      responses:
        '200':
          description: Replay of the latest revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EdgeSignerTrustPublishResult'}
        '201':
          description: Published as the next revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EdgeSignerTrustPublishResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: revision_gap, revision_conflict or dropped_revocation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /operator/v1/edge-signer-trust/draft:
    get:
      tags: [Operator Signer Revocations]
      operationId: draftEdgeSignerTrust
      summary: Generate the next unsigned draft (revision + 1, current keys and every revocation)
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.signer_revocations.view]
      responses:
        '200':
          description: Draft to edit and sign offline.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EdgeSignerTrustDocument'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /public/v1/edge-signer-trust:
    get:
      tags: [Installation Signer Revocations]
      operationId: getLatestEdgeSignerTrust
      summary: Download the latest published node signer trust document
      description: |
        Exact bytes of the latest offline-signed document. No authentication:
        the document carries its own offline-root signature and control planes
        verify it against their pin. 404 `not_published` before the first publication.
      security: []
      responses:
        '200':
          description: Signed document.
          content:
            application/json:
              schema: {type: string, format: binary}
        '404':
          description: Nothing published yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /installation/v1/signer-revocations/current:
    get:
      tags: [Installation Signer Revocations]
      operationId: getCurrentSignerRevocationManifest
      summary: Fetch the current signed signer revocation manifest
      description: |
        Installation authentication is proof of possession of the registered
        Ed25519 installation key; no client-claimed approved or verified state is
        accepted. Query strings, bodies, Content-Type, transfer encoding and
        nonzero Content-Length are forbidden. Before any append-only attempt write,
        bounded header and rate gates run. A request must pass normalized client
        IP, HMAC(claimed installation identity), and higher-capacity process-global
        buckets; per-client/per-claim defaults are 60 attempts per minute with at
        most 4096 tracked entries. Client IP resolution is direct-peer only unless
        the runtime explicitly configures trusted proxy CIDRs. Only a matching
        immediate peer may supply one bounded `Forwarded` or
        `X-Forwarded-For` chain; otherwise those headers are ignored. The default
        request timeout is 10 seconds and accepted requested-at skew is five
        minutes. Unknown/inactive installations and invalid proofs have the same
        external `401 unauthorized` response. Proof base64url must be the exact
        canonical unpadded encoding.

        Build the proof message by encoding each following UTF-8 value as a
        four-byte unsigned big-endian length followed by its bytes, concatenating
        in order, then SHA-256 hashing: `cdnca.signer-revocation-fetch-proof/v1`,
        `GET`, `/installation/v1/signer-revocations/current`, the exact effective
        `X-Request-ID` value, canonical lower-case installation UUID,
        requested-at Unix seconds, after-sequence decimal, known manifest digest
        or empty, and exact If-None-Match value or empty. `X-CDNCA-Proof` is the
        86-character unpadded base64url encoding of the raw 64-byte Ed25519
        signature over that 32-byte digest.

        The strong ETag is the quoted unpadded base64url SHA-256 of the exact
        signed-manifest response bytes, not only the inner manifest. A successful
        `served` or `not_modified` delivery attempt is durably appended before
        sending 200 or 304; attempt failure returns 503. Attempts describe the
        server decision/response attempt and do not prove client receipt or apply.
        Trust pins and offline roots are locally provisioned and never learned
        from this response.

        This sequential v1 delivery route has a known cold-start limitation. A
        fresh consumer starts at sequence zero and must verify sequence one before
        later manifests, while every fetched manifest must still be unexpired. Once
        historical sequence one expires, a fresh consumer cannot establish the
        chain and the server must not skip to the head, rewrite history, or re-sign
        sequence one. The frozen follow-up is a separate, fresh, offline-root-
        signed v2 bootstrap checkpoint that binds the exact verification keyset,
        head sequence/digest, and complete ordered `1..head` original signed v1
        chain. Only a valid, unexpired outer checkpoint may authorize importing an
        expired enclosed v1 manifest as a permanent historical revocation fact;
        inner bytes remain unchanged and are never re-signed. That independent
        transport is exposed by the v2 checkpoint operation below; this v1
        operation keeps its sequential response semantics unchanged.
      security:
        - InstallationSignerRevocationProof: []
      parameters:
        - $ref: '#/components/parameters/SignerRevocationRequestId'
        - $ref: '#/components/parameters/SignerRevocationInstallationId'
        - $ref: '#/components/parameters/SignerRevocationRequestedAt'
        - $ref: '#/components/parameters/SignerRevocationAfterSequence'
        - $ref: '#/components/parameters/SignerRevocationKnownManifestSHA256'
        - $ref: '#/components/parameters/SignerRevocationIfNoneMatch'
        - $ref: '#/components/parameters/SignerRevocationProof'
      responses:
        '200':
          description: Current canonical signed manifest, after durable served-attempt append
          headers:
            Content-Length:
              description: Exact response body byte length, at most 131072.
              schema: {type: integer, minimum: 1, maximum: 131072}
            ETag:
              $ref: '#/components/headers/SignerRevocationETag'
            Cache-Control:
              $ref: '#/components/headers/SignerRevocationCacheControl'
          content:
            application/vnd.cdnca.signer-revocation-manifest.v1+json:
              schema: {$ref: '#/components/schemas/SignedSignerRevocationManifest'}
        '304':
          description: Exact current signed bytes are already known, after durable not-modified-attempt append; no body is sent.
          headers:
            ETag:
              $ref: '#/components/headers/SignerRevocationETag'
            Cache-Control:
              $ref: '#/components/headers/SignerRevocationCacheControl'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/SignerRevocationInstallationUnauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/SignerRevocationRateLimited'}
        '431': {$ref: '#/components/responses/SignerRevocationHeadersTooLarge'}
        '503': {$ref: '#/components/responses/SignerRevocationDeliveryUnavailable'}
  /installation/v2/signer-revocation-checkpoints/current:
    get:
      tags: [Installation Signer Revocations]
      operationId: getCurrentSignerRevocationCheckpoint
      summary: Fetch the latest fresh full signer-revocation checkpoint
      description: |
        Returns the latest fresh globally offline-root-signed full-state
        checkpoint after authenticating proof of possession of the registered
        installation Ed25519 key. Query strings, request bodies, Content-Type,
        transfer encoding and nonzero Content-Length are forbidden. Unknown or
        inactive installations and invalid proofs share the same 401 response.

        Build the proof message by encoding each following UTF-8 value as a
        four-byte unsigned big-endian length followed by its bytes, concatenating
        in order, then SHA-256 hashing:
        `cdnca.signer-revocation-checkpoint-fetch-proof/v2`, `GET`,
        `/installation/v2/signer-revocation-checkpoints/current`, the exact
        effective X-Request-ID, canonical lower-case installation UUID,
        requested-at Unix seconds, known checkpoint revision decimal, known
        checkpoint SHA-256 or empty, and exact If-None-Match or empty.
        X-CDNCA-Proof is canonical unpadded base64url of the raw 64-byte Ed25519
        signature over that digest. Known revision zero requires an empty digest;
        a positive known revision requires a 43-character digest.

        A fresh consumer and a consumer whose known revision/digest identifies
        any published ancestor receive the latest fresh full checkpoint directly.
        Historical outer checkpoints are not replayed in sequence because their
        15-minute expiry must not prevent cold-start or long-offline recovery. A
        known current exact checkpoint plus an exact matching strong ETag returns
        304; otherwise the exact current bytes return 200. Future, unknown, forked
        or same-revision/different-digest known state returns 409 after successful
        authentication. The strong ETag is the quoted unpadded base64url SHA-256
        of the exact signed checkpoint response bytes. A successful `served` or
        `not_modified` delivery attempt commits before the 200 or 304 response.
      security:
        - InstallationSignerRevocationProof: []
      parameters:
        - $ref: '#/components/parameters/SignerRevocationRequestId'
        - $ref: '#/components/parameters/SignerRevocationInstallationId'
        - $ref: '#/components/parameters/SignerRevocationRequestedAt'
        - $ref: '#/components/parameters/SignerRevocationKnownCheckpointRevision'
        - $ref: '#/components/parameters/SignerRevocationKnownCheckpointSHA256'
        - $ref: '#/components/parameters/SignerRevocationCheckpointIfNoneMatch'
        - $ref: '#/components/parameters/SignerRevocationProof'
      responses:
        '200':
          description: Latest exact signed checkpoint bytes after durable served-attempt append.
          headers:
            Content-Length:
              description: Exact response body byte length, at most 8388608.
              schema: {type: integer, minimum: 1, maximum: 8388608}
            ETag:
              $ref: '#/components/headers/SignerRevocationCheckpointETag'
            Cache-Control:
              $ref: '#/components/headers/SignerRevocationCacheControl'
          content:
            application/vnd.cdnca.signer-revocation-checkpoint.v2+json:
              schema:
                $ref: '../../schemas/licensing/v2/signer-revocation-checkpoint.schema.json#/$defs/signedCheckpoint'
        '304':
          description: Exact current signed bytes are already known, after durable not-modified-attempt append; no body is sent.
          headers:
            ETag:
              $ref: '#/components/headers/SignerRevocationCheckpointETag'
            Cache-Control:
              $ref: '#/components/headers/SignerRevocationCacheControl'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/SignerRevocationInstallationUnauthorized'}
        '409': {$ref: '#/components/responses/SignerRevocationCheckpointKnownStateConflict'}
        '429': {$ref: '#/components/responses/SignerRevocationRateLimited'}
        '431': {$ref: '#/components/responses/SignerRevocationHeadersTooLarge'}
        '503': {$ref: '#/components/responses/SignerRevocationCheckpointDeliveryUnavailable'}
  /operator/v1/rule-packs:
    post:
      tags: [Operator Rule Packs]
      operationId: publishRulePack
      summary: Publish a rule pack version (system or developer layer)
      description: |
        The body is the cdnca.rule-pack/v1 document (any valid JSON spelling,
        at most 1 MiB); options are query parameters. The document has no
        crs_rule_ids field: a pack carrying one is refused with invalid_request
        (the publisher never supplies CRS rule numbers).

        Before anything is stored the pack passes the publication gate, the
        same for encrypted and plaintext packs: it compiles (budget, regex,
        canonical form), carries no watermark, resolves when mounted alone
        (parameters, budget, conflicts) and, for a modsecurity pack, yields the
        CRS rule numbers its rule sets evaluate in the CRS rule text this
        service publishes. Those numbers are computed here and returned as
        crs_rule_ids; every sealed copy delivered to an installation carries
        them in its manifest, computed again from the plaintext when it is
        sealed, and the signed artifact catalog covers that copy's digest.
        The replay against real OpenResty (evaluation worker, ADR 0011 RI-11)
        is not part of this gate yet.

        encrypted=true stores the pack only under a per-version content key;
        it needs the rule pack key custody (503 rule_pack_keys_unavailable
        otherwise). The version must be newer than the latest published one
        (409 rule_pack_version_not_newer). An exact idempotent replay returns
        the original release. Needs a recently reauthenticated (sensitive)
        operator session (403 reauthentication_required otherwise).
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.security_rules.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
        - name: requires_feature
          in: query
          required: false
          description: License feature an installation needs to receive the pack (empty for none).
          schema: {type: string, maxLength: 128}
        - name: resident
          in: query
          required: false
          schema: {type: string, enum: ['true', 'false']}
        - name: encrypted
          in: query
          required: false
          description: Deliver only sealed, watermarked copies per installation.
          schema: {type: string, enum: ['true', 'false']}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: cdnca.rule-pack/v1 (libs/rulepack); no crs_rule_ids field.
              required: [schema, pack_id, version, layer, engine, engine_min_version, name, rules]
              properties:
                schema: {const: cdnca.rule-pack/v1}
                pack_id: {type: string}
                version: {type: string}
                layer: {type: string, enum: [system, developer]}
                engine: {type: string, enum: [waf_v2, cc_v2, challenge, modsecurity]}
      responses:
        '201':
          description: Published (or exact replay of the original result)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RulePackRelease'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '503': {$ref: '#/components/responses/RulePackKeysUnavailable'}
  /installation/v1/rule-intel-reports:
    post:
      tags: [Control Usage]
      operationId: reportInstallationRuleIntel
      summary: Submit an installation-signed rule intelligence report (ADR 0011 §4.3)
      description: |
        Served only on the installation mTLS listener (the business listener answers 404).
        The SPIFFE installation identity of the client certificate must equal installation_id,
        and signature is the installation Ed25519 signature over ruleintel.ProofMessage
        (schema, request_id, installation_id, sequence, observed_at, report digest).
        The report carries statistics and normalized features only; the license service
        re-checks redaction and rejects the whole report with 422 report_not_redacted.
        At most 4 reports per installation per UTC day; an exact request_id replay is idempotent.
      security:
        - PluginRuntimeMTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleIntelReportRequest'}
      responses:
        '201':
          description: Accepted report or exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelReceipt'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/RuleIntelConflict'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '422': {$ref: '#/components/responses/RuleIntelNotRedacted'}
        '429': {$ref: '#/components/responses/RuleIntelRateLimited'}
        '503': {$ref: '#/components/responses/RuleIntelUnavailable'}
  /operator/v1/rule-intel/overview:
    get:
      tags: [Operator Platform]
      operationId: getRuleIntelOverview
      summary: Rule intelligence overview (ADR 0011 §5.6 page 1)
      description: |
        Root candidate counts per kind and state (merged variants count toward their
        representative; candidates keyed by an off-dictionary parameter hash seen by fewer
        than 3 installations in 30 days are hidden), unpublished pool usage against the
        per-kind and total caps, reporting installations and reports in the last 30 days,
        corpus samples per source and the latest daily job. The request must have no query.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.view]
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelOverview'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/rule-intel/candidates:
    get:
      tags: [Operator Platform]
      operationId: listRuleIntelCandidates
      summary: List rule intelligence candidates by score (ADR 0011 §5.6 page 2)
      description: |
        Ordered by score descending, then last_seen descending. Merged variants are
        omitted unless include_variants=true. Candidates keyed by an off-dictionary
        parameter hash seen by fewer than 3 installations in 30 days are never listed.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.view]
      parameters:
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/RuleIntelCandidateKind'}
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/RuleIntelCandidateState'}
        - name: pack_id
          in: query
          schema: {type: string, maxLength: 128}
        - name: rule_id
          in: query
          description: Matches the target rule id or rule set.
          schema: {type: string, maxLength: 64}
        - name: include_variants
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Candidate page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelCandidatePage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/rule-intel/candidates/{candidate_id}:
    get:
      tags: [Operator Platform]
      operationId: getRuleIntelCandidate
      summary: Read one candidate with cluster members, daily evidence, tombstone and history (page 3)
      description: |
        synthetic_request is generated from the canonical form and contains no real data;
        an operator may edit it and add it to the corpus. Hidden off-dictionary candidates
        answer 404.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.view]
      parameters:
        - $ref: '#/components/parameters/RuleIntelCandidateId'
      responses:
        '200':
          description: Candidate detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelCandidateDetail'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /operator/v1/rule-intel/candidates/rejections:
    post:
      tags: [Operator Platform]
      operationId: rejectRuleIntelCandidates
      summary: Reject candidates and write tombstones (ADR 0011 §5.3)
      description: |
        Each rejection writes or extends the fingerprint tombstone: 180 days, permanent from
        the third rejection. Already rejected candidates are skipped. Released candidates
        cannot be rejected (manual withdrawal is a separate release operation); a batch
        containing one answers 409 rule_intel_candidate_state and changes nothing.
        Audited as rule.intel.candidate.reject per candidate.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleIntelRejectRequest'}
      responses:
        '200':
          description: Rejection result (also returned for an exact idempotent replay)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelRejectResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RuleIntelConflict'}
  /operator/v1/rule-intel/candidates/{candidate_id}/restore:
    post:
      tags: [Operator Platform]
      operationId: restoreRuleIntelCandidate
      summary: Undo a rejection
      description: |
        The tombstone stops blocking at once (its rejection count is kept, so a later
        rejection still counts toward "permanent from the third") and the candidate goes
        back to new. Only rejected candidates can be restored.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.manage]
      parameters:
        - $ref: '#/components/parameters/RuleIntelCandidateId'
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleIntelRestoreRequest'}
      responses:
        '200':
          description: Restored candidate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelCandidate'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RuleIntelConflict'}
  /operator/v1/rule-intel/corpus:
    get:
      tags: [Operator Platform]
      operationId: listRuleIntelCorpus
      summary: Browse the quality-gate corpus (page 5; append-only, no delete)
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.view]
      parameters:
        - name: source
          in: query
          schema: {$ref: '#/components/schemas/RuleIntelCorpusSource'}
        - name: kind
          in: query
          schema: {type: string, enum: [attack, benign]}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Corpus page, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelCorpusPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Operator Platform]
      operationId: addRuleIntelCorpusSample
      summary: Add a normalized synthetic sample to the corpus (source manual)
      description: |
        Every string in the sample (keys and values) must pass the shared redaction
        library (libs/entitlement/ruleintel/redact); 64-hex digests are allowed. A sample
        with personal data answers 422 sample_not_redacted. One manual sample per
        fingerprint (409 rule_intel_corpus_duplicate). Audited as rule.intel.corpus.add.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleIntelCorpusAddRequest'}
      responses:
        '201':
          description: Added sample (also returned for an exact idempotent replay)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelCorpusSample'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/RuleIntelConflict'}
        '422': {$ref: '#/components/responses/RuleIntelSampleNotRedacted'}
  /operator/v1/rule-intel/merges:
    get:
      tags: [Operator Platform]
      operationId: listRuleIntelMerges
      summary: List merge drafts (published=false) or release records (published=true) with their rollouts
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.view]
      parameters:
        - name: published
          in: query
          schema: {type: string, enum: ['true', 'false']}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Merge page, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelMergePage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Operator Platform]
      operationId: createRuleIntelMerge
      summary: Merge ready root candidates into a draft of the next official pack version (ADR 0011 RI-12)
      description: |
        Only ready root candidates (merged_into empty) of the target's kind are accepted
        (409 rule_intel_candidate_state otherwise); their merged variants are merged with them.
        waf_exclusion → system/crs-tuning entries, scanner_fingerprint / autodefense_signature →
        mark-only rules of system/scanner-signatures / system/autodefense-intel, waf_reweight →
        crs_tiers (the strict and very strict CRS profile packs together). Nothing published is
        removed. Candidates that cannot be merged are listed in skipped; the rest become drafted.
        One open draft per target (409 conflict). Audited as rule.intel.merge.create.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.publish]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleIntelMergeRequest'}
      responses:
        '201':
          description: Draft (also returned for an exact idempotent replay)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelMerge'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RuleIntelMergeConflict'}
  /operator/v1/rule-intel/merges/{merge_id}:
    get:
      tags: [Operator Platform]
      operationId: getRuleIntelMerge
      summary: Read one merge draft or release record with its gate report and rollouts
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.view]
      parameters:
        - $ref: '#/components/parameters/RuleIntelMergeID'
      responses:
        '200':
          description: Merge
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelMerge'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /operator/v1/rule-intel/merges/{merge_id}/gate:
    post:
      tags: [Operator Platform]
      operationId: gateRuleIntelMerge
      summary: Run the quality gate of a draft (G1/G2 now; CRS profile packs queue G3)
      description: |
        A draft of official intelligence packs runs G1/G2 at once (gated or failed). A crs_tiers
        draft is queued for the evaluation worker (state gating); call again once it finished
        (409 rule_intel_gate_pending while it runs or the evaluation was unavailable). A failed
        gate returns the candidates to ready. Audited as rule.intel.merge.gate.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.publish]
      parameters:
        - $ref: '#/components/parameters/RuleIntelMergeID'
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      responses:
        '200':
          description: Merge after the gate step
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelMerge'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RuleIntelMergeConflict'}
  /operator/v1/rule-intel/merges/{merge_id}/abandon:
    post:
      tags: [Operator Platform]
      operationId: abandonRuleIntelMerge
      summary: Abandon an unpublished draft (its candidates return to ready)
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.publish]
      parameters:
        - $ref: '#/components/parameters/RuleIntelMergeID'
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      responses:
        '200':
          description: Abandoned merge
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelMerge'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RuleIntelMergeConflict'}
  /operator/v1/rule-intel/merges/{merge_id}/publish:
    post:
      tags: [Operator Platform]
      operationId: publishRuleIntelMerge
      summary: Publish a gated draft as new revisions with a per-installation rollout (G5 step-up)
      description: |
        Each pack becomes a higher revision (official intelligence packs: system, free, resident,
        install_wrapped; CRS profile packs: crs_profile_pack_versions, a passed G3 run required).
        Each gets a rollout starting at canary: only the listed installations receive the new
        revision; the others keep the previous one (a first version is served to nobody else).
        The candidates and their merged variants become released (never retired). Needs a recently
        reauthenticated session (403 reauthentication_required). Audited as rule.intel.merge.publish.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.publish]
      parameters:
        - $ref: '#/components/parameters/RuleIntelMergeID'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleIntelPublishRequest'}
      responses:
        '200':
          description: Published merge with its rollouts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelMerge'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RuleIntelMergeConflict'}
        '422': {$ref: '#/components/responses/RuleIntelGateFailed'}
        '503': {$ref: '#/components/responses/RulePackKeysUnavailable'}
  /operator/v1/rule-intel/merges/{merge_id}/rollout:
    post:
      tags: [Operator Platform]
      operationId: actRuleIntelRollout
      summary: Advance, pause, resume or roll back the rollout of a published merge (G5 step-up)
      description: |
        advance: next stage (canary → 5 → 25 → 100; at 100 the rollout is done). pause / resume:
        stop or continue advancing (installations already inside keep the new revision). rollback:
        publish the previous content of every pack as a higher revision (version patch+1, the
        description says which version it rolls back) as a new published merge (rollback_of) served
        to every installation at once; G1/G2 run again, G3 reuses the previous report. The license
        service also evaluates running rollouts hourly: false-positive feedback on a merged
        candidate pauses it, otherwise it advances after 24 hours per stage.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.publish]
      parameters:
        - $ref: '#/components/parameters/RuleIntelMergeID'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleIntelRolloutAction'}
      responses:
        '200':
          description: The merge (for rollback, the new rollback merge)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelMerge'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RuleIntelMergeConflict'}
        '422': {$ref: '#/components/responses/RuleIntelGateFailed'}
        '503': {$ref: '#/components/responses/RulePackKeysUnavailable'}
  /operator/v1/rule-intel/rules:
    get:
      tags: [Operator Platform]
      operationId: listRuleIntelPublishedRules
      summary: List the rules of the official rule intel packs (current and withdrawn)
      description: |
        Every rule of the current version of system/crs-tuning, system/scanner-signatures and
        system/autodefense-intel (state active), and every rule an earlier version had that the
        current one no longer has (state withdrawn, restorable). dormant is the read-only
        "sleeping" mark (fewer than 3 installations hit it in the last 180 days by the reported
        waf_rule_stats / cc_rule_stats, ADR 0011 §7.2); null for a rule first published less than
        180 days ago and for withdrawn rules. Sleeping rules stay in the pack and keep acting.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.view]
      responses:
        '200':
          description: Packs that have been published at least once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelPublishedRules'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/RulePackKeysUnavailable'}
  /operator/v1/rule-intel/rules/withdraw:
    post:
      tags: [Operator Platform]
      operationId: withdrawRuleIntelRule
      summary: Withdraw one official rule (publishes a higher version without it, G5 step-up)
      description: |
        Publishes the next major version of the pack without the rule, served to every
        installation at once; earlier versions stay. The rule number is never reused. A pack keeps
        at least one rule (422 rule_intel_last_rule).
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.publish]
      parameters:
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleIntelRuleAction'}
      responses:
        '200':
          description: The published withdraw record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelMerge'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RuleIntelMergeConflict'}
        '422': {$ref: '#/components/responses/RuleIntelGateFailed'}
        '503': {$ref: '#/components/responses/RulePackKeysUnavailable'}
  /operator/v1/rule-intel/rules/restore:
    post:
      tags: [Operator Platform]
      operationId: restoreRuleIntelRule
      summary: Restore a withdrawn official rule from history (publishes a higher version with it, G5 step-up)
      description: |
        Takes the rule body from the latest earlier version that had it and publishes the next
        minor version of the pack with it, served to every installation at once. 409 when the
        current version already has the rule.
      security:
        - OperatorSession: []
      x-required-permissions: [rule_intel.publish]
      parameters:
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleIntelRuleAction'}
      responses:
        '200':
          description: The published restore record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleIntelMerge'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RuleIntelMergeConflict'}
        '422': {$ref: '#/components/responses/RuleIntelGateFailed'}
        '503': {$ref: '#/components/responses/RulePackKeysUnavailable'}
components:
  securitySchemes:
    BillingProviderSignature:
      type: apiKey
      in: header
      name: X-CDNCA-Billing-Signature
      description: Unpadded base64url Ed25519 signature over the canonical provider event digest.
    PluginRuntimeMTLS:
      type: mutualTLS
      description: |
        Dedicated TLS 1.3 listener requiring a client certificate from the configured
        plugin-runtime CA. The only URI SAN is
        spiffe://cdn-platform/installation/{canonical-installation-uuid}; it must match
        both installation_id fields in the canonical request. Bearer credentials are rejected.
    OperatorSession:
      type: apiKey
      in: cookie
      name: __Host-cdnca_operator_session
      description: |
        Opaque, short-lived, server-revocable license-service operator session.
        The production cookie is Secure, HttpOnly and SameSite=Strict. Customer
        control-api sessions and tokens are never accepted in this identity domain.
    PortalSession:
      type: apiKey
      in: cookie
      name: __Secure-cdnca_portal_session
      description: Customer portal session (Path=/portal/v1, HttpOnly, SameSite=Strict); writes need the exact portal Origin.
    InstallationSignerRevocationProof:
      type: apiKey
      in: header
      name: X-CDNCA-Proof
      description: |
        Proof of possession of the installation's registered Ed25519 private key.
        The signature binds every request identity, freshness and chain header as
        specified by getCurrentSignerRevocationManifest. Installation identity and
        key material are looked up server-side; downloaded data cannot establish trust.
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    OperatorOrigin:
      name: Origin
      in: header
      required: true
      description: Exact configured operator-console origin; required for every operator cookie write request.
      schema: {type: string, format: uri}
    OperatorIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Exactly one Idempotency-Key header field value is required for every operator
        write and recorded as its request ID. It is not trimmed or normalized; every
        byte must be visible ASCII 0x21..0x7e. The key is scoped by authenticated
        operator, operation and target collection/resource.
        Reusing it with the same canonical request digest returns the original result;
        reusing it with a different digest returns 409 idempotency_conflict.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    PluginSupplyChainIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Exactly one visible-ASCII field value of 1-128 bytes. The key is scoped by
        authenticated operator and operation. Exact canonical digest replay returns
        the original successful response; a changed digest returns 409
        `idempotency_conflict`. X-Request-ID remains independent audit correlation.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    PluginWorkloadIdentityRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional visible-ASCII audit correlation identifier; it is independent of Idempotency-Key and is echoed or generated in every response.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    SignerProviderHealthRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional visible-ASCII audit correlation identifier echoed or generated in every response.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    PluginRuntimeProjectionRequestIdParameter:
      name: X-Request-ID
      in: header
      required: false
      description: Optional visible-ASCII audit correlation identifier, independent of the signed body request_id and echoed or generated in every response.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    PluginInstallationIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Exactly one strong quoted positive decimal authorization revision, for
        example "3". Missing, weak, unquoted, zero, noncanonical, duplicate, or
        list validators return 400 invalid_if_match; a stale revision returns
        409 revision_conflict.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    PluginCapabilityIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Exactly one strong quoted canonical decimal projection revision. Pending is
        ETag "0". A missing field returns 428 precondition_required; malformed,
        weak, duplicate, list, or noncanonical values return 400 invalid_if_match.
      schema: {type: string, pattern: '^"(0|[1-9][0-9]*)"$'}
    SignerRevocationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Visible-ASCII key, 1-128 bytes, scoped by authenticated operator, operation
        and proposal. Exact payload replay returns the original immutable result;
        a changed payload returns 409 `idempotency_conflict`. A malformed key is
        rejected with 400 `invalid_idempotency_key`.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    LicenseIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Quoted decimal current license revision, for example "3". It must equal
        expected_revision in the request body. A stale revision returns 409.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    IssuedLeaseIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong quoted positive decimal lease revision equal to expected_revision.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    LicenseBillingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Exactly one visible-ASCII field value of 1-128 bytes. It is scoped by the
        authenticated operator, reconciliation operation and license. Exact canonical
        request replay returns the original successful result; a changed request returns
        409 idempotency_conflict. X-Request-ID remains independent audit correlation.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    LicenseBillingRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Optional single visible-ASCII correlation identifier of 1-128 bytes. A valid
        value is echoed in every response; when absent or invalid the service generates
        and returns a new identifier. It is not an idempotency key or payment proof.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    LicenseBillingIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Exactly one strong quoted decimal license revision, for example "7". It must
        equal expected_revision in the JSON body. Missing is 428; malformed is 400;
        a valid stale revision is 409 revision_conflict.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same digest returns the same signed lease; different input returns 409.
      schema: {type: string, minLength: 1, maxLength: 128}
    UpgradeCommandIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Exactly one 1-128 byte value matching `[A-Za-z0-9._-]+`. It is included in
        the installation proof. Exact canonical body replay returns the original
        encoded grant; changed body digest returns 409 `idempotency_conflict`.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
    UpgradeCommandRequestId:
      name: X-Request-ID
      in: header
      required: true
      description: Exact single visible correlation identifier; it is independent of Idempotency-Key.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    UpgradeCommandInstallationId:
      name: X-CDNCA-Installation-ID
      in: header
      required: true
      description: Canonical lower-case UUID that must exactly equal installation_id in the path.
      schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
    UpgradeCommandRequestedAt:
      name: X-CDNCA-Requested-At
      in: header
      required: true
      description: Canonical positive Unix seconds within the server freshness window.
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    UpgradeCommandProof:
      name: X-CDNCA-Proof
      in: header
      required: true
      description: Canonical unpadded base64url encoding of the raw 64-byte installation Ed25519 signature.
      schema: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{85}[AQgw]$'}
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RuleIntelCandidateId:
      name: candidate_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RuleIntelMergeID:
      name: merge_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdentityProofProviderCode:
      name: provider
      in: path
      required: true
      schema: {type: string, enum: [alipay, wechat]}
    LicenseId:
      name: license_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    BillingEventId:
      name: billing_event_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    OriginalBillingEventId:
      name: original_event_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    InstallationId:
      name: installation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    EntitlementLeaseInstallationId:
      name: installation_id
      in: path
      required: true
      description: Canonical lowercase nonnil installation UUID.
      schema: {$ref: '#/components/schemas/CanonicalUUID'}
    LeaseId:
      name: lease_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlatformPolicyTargetRevisionId:
      name: target_revision_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReleaseArtifactSizeAttestationArtifactId:
      name: artifact_id
      in: path
      required: true
      description: Canonical lowercase nonnil release artifact UUID.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        not: {const: 00000000-0000-0000-0000-000000000000}
    ReleaseArtifactSizeAttestationReadbackIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Empty or exactly one strong quoted canonical unpadded-base64url SHA-256 validator.
      schema:
        oneOf:
          - {type: string, const: ''}
          - {type: string, minLength: 45, maxLength: 45, pattern: '^"[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]"$'}
    ReleaseArtifactRepositoryVerificationArtifactId:
      name: artifact_id
      in: path
      required: true
      description: Canonical lowercase nonnil release artifact UUID.
      schema: {$ref: '#/components/schemas/CanonicalUUID'}
    ReleaseArtifactRepositoryVerificationIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong quoted positive decimal artifact revision, equal to expected_revision.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    ReleaseArtifactRepositoryVerificationIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Empty or exactly one strong quoted canonical unpadded-base64url SHA-256 validator.
      schema:
        oneOf:
          - {type: string, const: ''}
          - {type: string, minLength: 45, maxLength: 45, pattern: '^"[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]"$'}
    ChannelCode:
      name: channel_code
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ReleaseComponent'}
    ReleaseComponent:
      name: component
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ReleaseComponent'}
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SigningKeyId:
      name: key_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
    PluginCatalogId:
      name: catalog_id
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9._-]{0,95}$'}
    PluginCatalogSnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PluginPublisherId:
      name: publisher_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CanonicalUUID'}
    PluginManifestVerificationId:
      name: verification_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CanonicalUUID'}
    PluginInstallationCustomerId:
      name: customer_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CanonicalUUID'}
    PluginInstallationInstallationId:
      name: installation_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CanonicalUUID'}
    InstallationClientCertificateRevokeAction:
      name: certificate_action
      in: path
      required: true
      description: Canonical non-zero certificate UUID followed by the literal :revoke action; slash aliases are rejected.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:revoke$'
        x-resource-id-schema: {$ref: '#/components/schemas/CanonicalUUID'}
    PluginRuntimeBindingRevokeAction:
      name: binding_action
      in: path
      required: true
      description: Canonical non-zero binding UUID followed by the literal :revoke action; slash aliases are rejected.
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:revoke$'
        x-resource-id-schema: {$ref: '#/components/schemas/CanonicalUUID'}
    PluginInstallationAuthorizationId:
      name: authorization_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CanonicalUUID'}
    PluginWorkloadIdentityTokenId:
      name: token_id
      in: path
      required: true
      description: Canonical lowercase nonnil workload identity token UUID.
      schema: {$ref: '#/components/schemas/CanonicalUUID'}
    SignerRevocationProposalId:
      name: proposal_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SignerRevocationStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [draft, approved, cancelled, rejected, published, superseded]
    SignerRevocationRequestId:
      name: X-Request-ID
      in: header
      required: true
      description: |
        Visible ASCII request identifier used by audit records. Installation
        proof routes additionally bind this exact value into their proof.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    SignerRevocationInstallationId:
      name: X-CDNCA-Installation-ID
      in: header
      required: true
      description: Canonical lower-case installation UUID bound by the proof.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        not: {const: 00000000-0000-0000-0000-000000000000}
    SignerRevocationRequestedAt:
      name: X-CDNCA-Requested-At
      in: header
      required: true
      description: Whole UTC Unix seconds, within the configured skew window (five minutes by default).
      schema: {type: string, minLength: 1, maxLength: 20, pattern: '^-?[0-9]+$'}
    SignerRevocationAfterSequence:
      name: X-CDNCA-After-Sequence
      in: header
      required: true
      description: Highest locally accepted sequence; zero requests genesis.
      schema: {type: string, minLength: 1, maxLength: 19, pattern: '^(0|[1-9][0-9]*)$'}
    SignerRevocationKnownManifestSHA256:
      name: X-CDNCA-Known-Manifest-SHA256
      in: header
      required: true
      description: |
        Empty when after-sequence is zero; otherwise the 43-character unpadded
        base64url SHA-256 of the locally accepted inner canonical manifest.
      schema:
        oneOf:
          - {type: string, const: ''}
          - {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
    SignerRevocationKnownCheckpointRevision:
      name: X-CDNCA-Known-Checkpoint-Revision
      in: header
      required: true
      description: Highest locally accepted checkpoint revision; zero denotes no LKG.
      schema: {type: string, minLength: 1, maxLength: 19, pattern: '^(0|[1-9][0-9]*)$'}
    SignerRevocationKnownCheckpointSHA256:
      name: X-CDNCA-Known-Checkpoint-SHA256
      in: header
      required: true
      description: |
        Empty when the known revision is zero; otherwise the 43-character
        unpadded base64url SHA-256 of the locally accepted canonical checkpoint.
      schema:
        oneOf:
          - {type: string, const: ''}
          - {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
    SignerRevocationIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: One strong quoted ETag for exact signed-manifest bytes; weak or list validators are rejected.
      schema: {type: string, minLength: 45, maxLength: 45, pattern: '^"[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]"$'}
    SignerRevocationCheckpointIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: One strong quoted ETag for exact signed-checkpoint bytes; weak or list validators are rejected.
      schema: {type: string, minLength: 45, maxLength: 45, pattern: '^"[A-Za-z0-9_-]{43}"$'}
    SignerRevocationProof:
      name: X-CDNCA-Proof
      in: header
      required: true
      description: Unpadded base64url encoding of the raw 64-byte Ed25519 signature over the fetch-proof digest.
      schema: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{85}[AQgw]$'}
  headers:
    LicenseBillingRequestId:
      description: Effective request correlation identifier, either the valid supplied value or a server-generated value.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    LoginProtectionRetryAfter:
      description: Retry delay in whole seconds for a login-protection decision.
      required: true
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    PlatformPolicyRequestSHA256:
      description: Lowercase hexadecimal SHA-256 of the operation-specific, domain-separated, length-prefixed canonical request fields.
      required: true
      schema: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
    PlatformPolicyRestoreFromTargetRevisionID:
      description: Canonical restore source target revision UUID. Present only when creating a rollback revision.
      schema: {type: string, format: uuid}
    PlatformPolicyRestoredCanonicalPolicySHA256:
      description: Unpadded base64url canonical policy SHA-256 restored from the source target. Present only when creating a rollback revision.
      schema: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
    IssuedLeaseRevisionETag:
      description: Strong quoted positive decimal issued-lease revision.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    EntitlementLeaseCacheControl:
      description: Signed entitlement lease responses must never be stored by HTTP caches.
      schema: {type: string, const: no-store}
    InstallationReactivationCredentialRevisionETag:
      description: Strong quoted positive decimal reactivation credential revision.
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    ReleaseArtifactSizeAttestationReadbackETag:
      description: Strong quoted canonical unpadded-base64url SHA-256 of the exact five-field JSON response bytes.
      schema: {type: string, minLength: 45, maxLength: 45, pattern: '^"[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]"$'}
    ReleaseArtifactSizeAttestationReadbackCacheControl:
      description: Private bounded freshness with a last-known-good outage allowance for this immutable attestation.
      schema: {type: string, const: 'private, max-age=60, stale-if-error=86400, immutable'}
    ReleaseArtifactRepositoryVerificationETag:
      description: Strong quoted canonical unpadded-base64url SHA-256 of the exact response body bytes.
      schema: {type: string, minLength: 45, maxLength: 45, pattern: '^"[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]"$'}
    ReleaseArtifactRepositoryVerificationCacheControl:
      description: Private bounded freshness and stale fallback for immutable verified evidence.
      schema: {type: string, const: 'private, max-age=60, stale-if-error=3600, immutable'}
    SignerRevocationETag:
      description: Strong quoted unpadded base64url SHA-256 of the exact signed-manifest response bytes.
      schema: {type: string, minLength: 45, maxLength: 45, pattern: '^"[A-Za-z0-9_-]{43}"$'}
    SignerRevocationCheckpointETag:
      description: Strong quoted unpadded base64url SHA-256 of the exact signed-checkpoint response bytes.
      schema: {type: string, minLength: 45, maxLength: 45, pattern: '^"[A-Za-z0-9_-]{43}"$'}
    PluginInstallationRevisionETag:
      description: Strong quoted positive decimal plugin authorization revision; exposed through Access-Control-Expose-Headers.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    PluginCapabilityRevisionETag:
      description: Strong quoted decimal installation-scoped capability approval revision; pending is "0".
      schema: {type: string, pattern: '^"(0|[1-9][0-9]*)"$'}
    InstallationClientCertificateRevisionETag:
      description: Strong validator "installation-client-certificate:{certificate_id}:{revision}" for the returned certificate revision.
      required: true
      schema: {type: string, pattern: '^"installation-client-certificate:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[1-9][0-9]*"$'}
    PluginRuntimeBindingRevisionETag:
      description: Strong validator "plugin-runtime-binding:{binding_id}:{revision}" for the returned binding revision.
      required: true
      schema: {type: string, pattern: '^"plugin-runtime-binding:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[1-9][0-9]*"$'}
    PluginWorkloadIdentityCacheControl:
      description: Workload identity responses must never be stored.
      schema: {type: string, const: no-store}
    PluginWorkloadIdentityRequestId:
      description: Effective audit correlation identifier supplied by the operator or generated by the service.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    SignerProviderHealthCacheControl:
      description: Signing-provider health responses must never be stored.
      schema: {type: string, const: no-store}
    SignerProviderHealthRequestId:
      description: Effective visible-ASCII audit correlation identifier supplied by the operator or generated by the service.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    PluginRuntimeProjectionCacheControl:
      description: Plugin runtime projection responses must never be stored.
      schema: {type: string, const: no-store}
    PluginRuntimeProjectionRequestId:
      description: Effective visible-ASCII X-Request-ID audit correlation identifier supplied by the caller or generated by the service.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    SignerRevocationCacheControl:
      description: Private bounded freshness with last-known-good outage allowance.
      schema: {type: string, const: 'private, max-age=60, stale-if-error=86400'}
  schemas:
    WAFCustomRuleReportRequest:
      type: object
      additionalProperties: false
      required: [schema, installation_id, sequence, observed_at, policies, request_id, signature]
      properties:
        schema: {type: string, const: cdnca.waf-custom-rule-report/v1}
        installation_id: {$ref: '#/components/schemas/CanonicalUUID'}
