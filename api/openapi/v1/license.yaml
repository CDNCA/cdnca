        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
        - $ref: '#/components/parameters/IssuedLeaseIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeIssuedLeaseRequest'}
