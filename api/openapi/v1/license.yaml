openapi: 3.1.0
info:
  title: CDN Platform Licensing API
  version: 0.8.0
  license:
    name: Internal use only
    identifier: LicenseRef-Proprietary
  description: |
    Independent API for platform licensing operators and customer control-plane
    installation activation. The contract requires a separate operator identity
    domain whose credentials are never interchangeable with customer control-plane
    tokens. Browser sessions use a dedicated Secure, HttpOnly, SameSite=Strict
    cookie and exact Origin checks; the session token is never returned to JavaScript.

    Installation activation, lease renewal and upgrade-request proofs use the same
    versioned wire format. Encode each ordered field as a four-byte unsigned
    big-endian byte length followed by its UTF-8 bytes, concatenate the fields,
    SHA-256 the result, sign the 32-byte digest with Ed25519, and transport the
    signature as unpadded base64url. Activation field order is domain
    `cdnca-license-activation-proof/v1`, Idempotency-Key, canonical installation
    UUID, trimmed installation name, unpadded base64url raw 32-byte public key,
    and unpadded base64url SHA-256 of the activation credential. Renewal field
    order is domain `cdnca-license-renewal-proof/v1`, Idempotency-Key, canonical
    installation UUID. Upgrade field order is domain
    `cdnca-upgrade-grant-request-proof/v1`, Idempotency-Key, canonical installation
    UUID, lower-case trimmed component, normalized current semantic version, and
    decimal protocol version. Usage report field order is domain
    `cdnca-entitlement-usage-report-proof/v1`, Idempotency-Key, canonical
    installation UUID, schema, decimal sequence, decimal lease serial, decimal
    observed-at Unix timestamp, then each strictly sorted quota code and decimal
    used value. Stable activation and renewal vectors live at
    `tests/contracts/entitlement-proof-v1.json`; implementations must not infer
    encoding from JSON serialization.
servers:
  - url: https://license.example.invalid
tags:
  - name: Operator Identity
    description: Independent operator login, invitation, recovery, TOTP MFA and revocable short sessions.
  - name: Operator Customers
    description: Platform-operator customer records in the licensing trust domain.
  - name: Operator Licenses
    description: Platform-operator grants, activation credentials and revocations.
  - name: Operator Billing
    description: Manual, operator-entered license billing reconciliation facts and settlement projections.
  - name: Operator Keys
    description: Public signing-key metadata and rotation state.
  - name: Operator Platform
    description: Release channels and control-plane installation inventory.
  - name: Operator Releases
    description: Signed release artifacts, channel targets and per-installation upgrade policy.
  - name: Operator Policies
    description: Signed global and installation-scoped platform policy publication and rollout.
  - name: Operator Plugin Catalogs
    description: Trusted plugin catalog registrations and immutable publisher key metadata.
  - name: Operator Plugin Supply Chain
    description: Trusted plugin publisher identities and immutable successful manifest verification evidence.
  - name: Operator Plugin Installations
    description: |
      Customer- and installation-bound plugin authorization lifecycle. The API exposes
      immutable transition receipts, redacted service-identity metadata, and dedicated
      issue and rotate operations that return a short-lived signed workload identity
      only in the successful response. Revoke returns metadata and never returns a secret.
  - name: Operator Audit
    description: Redacted append-only licensing audit views.
  - name: Operator Signer Revocations
    description: Maker-checker emergency revocation proposals and immutable publication history.
  - name: Control Activation
    description: Customer control-plane installation activation and lease renewal.
  - name: Customer Portal
    description: Customer self-service portal (/portal/v1); only the master IP endpoints are described here.
  - name: Control Usage
    description: Low-frequency, installation-signed aggregate entitlement usage observations.
  - name: Installation Upgrade Receipts
    description: Installation-signed, append-only upgrade grant lifecycle evidence.
  - name: Installation Policies
    description: Installation-authenticated platform policy resolve and acknowledgement protocol.
  - name: Installation Signer Revocations
    description: |
      Installation-authenticated delivery of v1 revocation manifests and fresh v2
      full-state checkpoints. A v2 checkpoint is globally offline-root signed; the
      installation identity is bound by request proof and durable delivery facts,
      not by re-signing the checkpoint for each installation.
paths:
  /operator/v1/sessions:
    post:
      tags: [Operator Identity]
      operationId: createOperatorSession
      summary: Authenticate an operator with username and password
      description: |
        Sets the __Host-cdnca_operator_session cookie. The cookie is Secure,
        HttpOnly, SameSite=Strict and scoped to Path=/ with no Domain attribute.
        The opaque session token is not included in the JSON response.
      security: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorLoginRequest'
      responses:
        '201':
          description: Authenticated session created and cookie set
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/LoginProtectionRateLimited'}
        '503': {$ref: '#/components/responses/LoginProtectionUnavailable'}
  /operator/v1/session:
    get:
      tags: [Operator Identity]
      operationId: getCurrentOperator
      summary: Read the current operator profile and live permissions
      security:
        - OperatorSession: []
      responses:
        '200':
          description: Current active operator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    delete:
      tags: [Operator Identity]
      operationId: revokeCurrentOperatorSession
      summary: Revoke the current server-side session
      security:
        - OperatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      responses:
        '204': {description: Session revoked and cookie cleared}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/session/reauthenticate:
    post:
      tags: [Operator Identity]
      operationId: reauthenticateOperatorSession
      summary: Refresh the five-minute authorization window for sensitive identity writes
      description: Verifies the current password and, when the operator has enrolled TOTP, a fresh non-replayed TOTP code. Success and denial are recorded as immutable identity audit events.
      security:
        - OperatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperatorReauthenticationRequest'}
      responses:
        '204': {description: The authenticated operator session is authorized for sensitive identity writes for five minutes}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/rbac/permissions:
    get:
      tags: [Operator Identity]
      operationId: listOperatorPermissions
      summary: List the live platform-operator permission matrix
      security:
        - OperatorSession: []
      x-required-permissions: [identity.rbac.manage]
      responses:
        '200':
          description: Stable permission list ordered by code
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OperatorPermission'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/rbac/roles:
    get:
      tags: [Operator Identity]
      operationId: listOperatorRoles
      summary: List platform-operator roles
      description: Archived roles are hidden unless `status` is `archived` (only archived) or `all`.
      security:
        - OperatorSession: []
      x-required-permissions: [identity.rbac.manage]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
        - name: status
          in: query
          schema: {type: string, enum: [archived, all]}
      responses:
        '200':
          description: Stable role page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorRolePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Operator Identity]
      operationId: createOperatorRole
      summary: Create a custom platform-operator role
      security:
        - OperatorSession: []
      x-required-permissions: [identity.rbac.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOperatorRoleRequest'}
      responses:
        '201':
          description: Role created, or the original response for an exact idempotent replay after live RBAC and recent-reauthentication checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorRole'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/rbac/roles/{role_id}:
    put:
      tags: [Operator Identity]
      operationId: updateOperatorRole
      summary: Replace a custom role using optimistic concurrency
      security:
        - OperatorSession: []
      x-required-permissions: [identity.rbac.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - name: role_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOperatorRoleRequest'}
      responses:
        '200':
          description: Updated role, or the original response for an exact idempotent replay after live checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorRole'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/rbac/roles/{role_id}/archive:
    post:
      tags: [Operator Identity]
      operationId: archiveOperatorRole
      summary: Archive a custom role
      description: |
        Roles are never deleted because audit events reference them. An archived role keeps its
        permissions and current members (their access is unchanged), cannot be edited and cannot be
        newly assigned (`409 role_archived`) until restored. System roles cannot be archived (`409 conflict`);
        archiving an archived role is `409 role_archive_state`.
      security:
        - OperatorSession: []
      x-required-permissions: [identity.rbac.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - name: role_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperatorRoleArchiveRequest'}
      responses:
        '200':
          description: Archived role, or the original response for an exact idempotent replay after live checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorRole'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/rbac/roles/{role_id}/restore:
    post:
      tags: [Operator Identity]
      operationId: restoreOperatorRole
      summary: Restore an archived custom role
      description: The role becomes assignable and editable again; restoring a role in use is `409 role_archive_state`.
      security:
        - OperatorSession: []
      x-required-permissions: [identity.rbac.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - name: role_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperatorRoleArchiveRequest'}
      responses:
        '200':
          description: Restored role, or the original response for an exact idempotent replay after live checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorRole'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/rbac/operators:
    get:
      tags: [Operator Identity]
      operationId: listRBACOperators
      summary: List platform operators and their role assignments
      security:
        - OperatorSession: []
      x-required-permissions: [identity.rbac.manage]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: {type: string, maxLength: 320}
        - name: status
          in: query
          schema: {type: string, enum: [active, disabled]}
      responses:
        '200':
          description: Stable platform-operator page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RBACOperatorPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/rbac/operators/{operator_id}/login-lock/unlock:
    post:
      tags: [Operator Identity]
      operationId: unlockOperatorLogin
      summary: Clear one operator's distributed login lock and source limiter
      description: |
        Requires the platform RBAC permission and the current five-minute sensitive
        operator step-up. The request is idempotent and records an immutable audit
        fact; raw usernames, source addresses and rate-limit digests are never returned.
      security:
        - OperatorSession: []
      x-required-permissions: [identity.rbac.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - name: operator_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UnlockOperatorLoginRequest'}
      responses:
        '200':
          description: Lock cleared or exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorLoginProtection'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/rbac/operators/{operator_id}/roles:
    put:
      tags: [Operator Identity]
      operationId: assignOperatorRoles
      summary: Replace a platform operator's roles using optimistic concurrency
      security:
        - OperatorSession: []
      x-required-permissions: [identity.rbac.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - name: operator_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignOperatorRolesRequest'}
      responses:
        '200':
          description: Updated operator account, or the original response for an exact idempotent replay after live checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RBACOperator'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/operator-invitations:
    get:
      tags: [Operator Identity]
      operationId: listOperatorInvitations
      summary: List redacted operator invitations
      security:
        - OperatorSession: []
      x-required-permissions: [identity.operators.manage]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Invitation metadata without token digests, tokens or MFA material
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorInvitationPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Operator Identity]
      operationId: createOperatorInvitation
      summary: Invite an operator and deliver a single-use token out of band
      description: |
        The database stores only a domain-separated HMAC digest of the token. The
        raw token and invitation are committed atomically to an encrypted delivery
        outbox. Delivery is retried in the background; the token is never returned by
        this API, written to audit events or exposed by the list operation.
      security:
        - OperatorSession: []
      x-required-permissions: [identity.operators.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOperatorInvitationRequest'}
      responses:
        '201':
          description: Invitation and its notification were durably queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorInvitation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/operator-invitations/{invitation_id}/revoke:
    post:
      tags: [Operator Identity]
      operationId: revokeOperatorInvitation
      summary: Revoke an unused operator invitation
      security:
        - OperatorSession: []
      x-required-permissions: [identity.operators.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204': {description: Invitation revoked or already revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /operator/v1/invitations/accept:
    post:
      tags: [Operator Identity]
      operationId: acceptOperatorInvitation
      summary: Accept an invitation and enroll password, TOTP and recovery codes
      description: |
        Passwords are stored with Argon2id, TOTP secrets are envelope encrypted and
        recovery codes are stored only as domain-separated HMAC digests. The token,
        TOTP secret and recovery codes are write-only and never returned.
      security: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptOperatorInvitationRequest'}
      responses:
        '204': {description: Operator activated; invitation consumed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /operator/v1/password-reset-requests:
    post:
      tags: [Operator Identity]
      operationId: requestOperatorPasswordReset
      summary: Request an operator password reset without account enumeration
      description: |
        Always returns the same response for validly shaped requests, whether or not
        the account exists. For an existing account, the reset token and an encrypted
        delivery outbox record are committed atomically. The database stores only the
        token's domain-separated HMAC digest. A newer request revokes any older unused
        reset token and securely discards its pending notification.
      security: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperatorPasswordResetRequest'}
      responses:
        '202': {description: Request accepted regardless of account existence}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /operator/v1/password-resets/complete:
    post:
      tags: [Operator Identity]
      operationId: completeOperatorPasswordReset
      summary: Consume a reset token and replace the password
      description: |
        Requires either a fresh TOTP code or one unused recovery code. Completion
        consumes the token, consumes a recovery code when supplied and revokes every
        prior operator session. Invalid, expired, used or revoked material shares the
        same unauthorized response.
      security: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteOperatorPasswordResetRequest'}
      responses:
        '204': {description: 'Password replaced, reset token consumed and old sessions revoked'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /operator/v1/recovery-codes:
    put:
      tags: [Operator Identity]
      operationId: replaceOperatorRecoveryCodes
      summary: Revoke existing recovery codes and register a new client-generated set
      description: |
        Requires the current password and a fresh TOTP code. Codes are write-only;
        the response never displays them, and every old unused code is revoked.
      security:
        - OperatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceOperatorRecoveryCodesRequest'}
      responses:
        '204': {description: Recovery-code set replaced}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/password:
    put:
      tags: [Operator Identity]
      operationId: changeOperatorPassword
      summary: Change the signed-in operator's own password
      description: |
        Requires the current password and a step-up reauthentication within the
        last five minutes (403 reauthentication_required otherwise). A wrong
        current password is 400 invalid_request with field current_password and
        reason incorrect (the session stays signed in). Every other session of
        the operator is revoked; this one stays. Records password.changed or
        password.change_denied in the identity events.
      security:
        - OperatorSession: []
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeOperatorPasswordRequest'}
      responses:
        '204': {description: Password replaced; other sessions revoked}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /operator/v1/identity-events:
    get:
      tags: [Operator Identity]
      operationId: listOperatorIdentityEvents
      summary: List operator sign-in and account security events
      description: Sign-in, sign-out, failed sign-in, step-up, password reset and change, recovery codes and invitations, newest first.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.audit.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: action
          in: query
          schema: {$ref: '#/components/schemas/OperatorIdentityEventAction'}
        - name: result
          in: query
          schema: {type: string, enum: [success, denied]}
        - name: request_id
          in: query
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: Identity event page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorIdentityEventPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /operator/v1/customers:
    get:
      tags: [Operator Customers]
      operationId: listLicensingCustomers
      summary: List licensing customers
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.customers.manage]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Substring of the customer name, external reference, portal username or e-mail.
          schema: {type: string, maxLength: 200}
        - name: status
          in: query
          schema: {type: string, enum: [active, suspended, closed]}
      responses:
        '200':
          description: Stable customer page ordered by creation time and ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Operator Customers]
      operationId: createLicensingCustomer
      summary: Create a licensing customer
      description: Requires an independently authenticated platform operator.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.customers.manage]
      parameters:
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
