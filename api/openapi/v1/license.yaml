        expected_revision: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        compromised_key_version: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        public_key:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
          description: Canonical unpadded base64url encoding of exactly 32 raw Ed25519 public-key bytes.
        reason: {type: string, minLength: 1, maxLength: 500, pattern: '^[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000](?:[\s\S]*[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000])?(?![\s\S])'}
        possession_proof: {$ref: '#/components/schemas/PluginPublisherKeyPossessionProof'}
    PluginPublisherEmergencyRetiredKey:
      type: object
      additionalProperties: false
      required: [version, key_id, algorithm, public_key, fingerprint, status, created_at, retired_at, retirement_reason]
      properties:
        version: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        algorithm: {type: string, const: Ed25519}
        public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'}
        fingerprint: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'}
        status: {type: string, const: retired}
        created_at: {type: string, format: date-time}
        retired_at: {type: string, format: date-time}
