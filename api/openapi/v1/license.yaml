        description: {type: string, maxLength: 200}
        permissions:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
    UpdateOperatorRoleRequest:
      type: object
      additionalProperties: false
      required: [name, description, permissions, expected_revision]
      properties:
        name: {type: string, minLength: 3, maxLength: 64, pattern: '^[a-z][a-z0-9._-]{2,63}$'}
        description: {type: string, maxLength: 200}
        permissions:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        expected_revision: {type: integer, format: int64, minimum: 1}
    RBACOperator:
      type: object
      additionalProperties: false
      required: [id, username, display_name, status, role_ids, role_names, archived_role_ids, revision, created_at,
        login_protection]
      properties:
        id: {type: string, format: uuid}
        username: {type: string, minLength: 3, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, format: email, maxLength: 320}
        status: {type: string, enum: [active, disabled]}
        role_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, format: uuid}
        role_names:
          type: array
