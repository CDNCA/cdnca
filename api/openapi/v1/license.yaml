        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
    SignerRevocationCheckpointImportResult:
      type: object
      additionalProperties: false
      required: [revision, checkpoint_sha256, etag, head_sequence, published_at, replayed]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        checkpoint_sha256: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        etag: {type: string, minLength: 45, maxLength: 45, pattern: '^"[A-Za-z0-9_-]{43}"$'}
        head_sequence: {type: integer, format: int64, minimum: 0, maximum: 10000}
        published_at: {type: string, format: date-time}
        replayed: {type: boolean}
    SignerRevocationCheckpointOperatorReadback:
      type: object
      additionalProperties: false
      required: [schema, revision, checkpoint_sha256, etag, head_sequence, published_at, expires_at, status]
      properties:
        schema: {type: string, const: cdnca.signer-revocation-checkpoint-operator-readback/v1}
        revision: {type: integer, format: int64, minimum: 1}
        checkpoint_sha256: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        etag:
          description: Strong quoted unpadded-base64url SHA-256 of the exact signed-checkpoint bytes; this is independent of the inner canonical checkpoint_sha256.
          type: string
          minLength: 45
          maxLength: 45
          pattern: '^"[A-Za-z0-9_-]{43}"$'
        head_sequence: {type: integer, format: int64, minimum: 0, maximum: 10000}
        published_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        status: {type: string, enum: [fresh, expired]}
    SignerRevocationCheckpointExpiryReminder:
      type: object
      additionalProperties: false
      required: [schema, state, level, head_sequence, revision, expires_at, remaining_days, checkpoint_head_sequence, lagging, evaluated_at]
      properties:
        schema: {type: string, const: cdnca.signer-revocation-checkpoint-expiry-reminder/v1}
        state: {type: string, enum: [not_imported, valid, expiring, expired]}
        level: {type: string, enum: [none, info, warning, critical]}
        head_sequence: {type: integer, format: int64, minimum: 0, maximum: 10000}
        revision: {type: [integer, 'null'], format: int64, minimum: 1}
        expires_at: {type: [string, 'null'], format: date-time}
        remaining_days: {type: [integer, 'null'], minimum: 0, maximum: 31}
        checkpoint_head_sequence:
          type: [integer, 'null']
          format: int64
          minimum: 0
          maximum: 10000
          description: Revocation head the imported checkpoint covers; null when nothing was imported.
        lagging:
          type: boolean
          description: |
            True when revocations were published after the imported checkpoint
            (checkpoint_head_sequence < head_sequence); the level is then at
            least warning until a new checkpoint is exported, signed offline and imported.
        evaluated_at: {type: string, format: date-time}
    EdgeSignerTrustPublication:
      type: object
      additionalProperties: false
      required: [revision, document_sha256, authority_key_id, authority_key_generation, issued_at, trusted_keys,
        revoked_keys, published_by_operator_id, published_at, replayed]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        document_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        authority_key_id: {type: string}
        authority_key_generation: {type: integer, format: int64, minimum: 1}
        issued_at: {type: string, format: date-time}
        trusted_keys: {type: integer, minimum: 0, maximum: 64}
        revoked_keys: {type: integer, minimum: 0, maximum: 256}
        published_by_operator_id: {type: string, format: uuid}
        published_at: {type: string, format: date-time}
        replayed: {type: boolean}
    EdgeSignerTrustPublishResult:
      type: object
      additionalProperties: false
      required: [revision, document_sha256, authority_key_id, authority_key_generation, issued_at, trusted_keys,
        revoked_keys, published_by_operator_id, published_at, replayed, download_copies]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        document_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        authority_key_id: {type: string}
        authority_key_generation: {type: integer, format: int64, minimum: 1}
        issued_at: {type: string, format: date-time}
        trusted_keys: {type: integer, minimum: 0, maximum: 64}
        revoked_keys: {type: integer, minimum: 0, maximum: 256}
        published_by_operator_id: {type: string, format: uuid}
        published_at: {type: string, format: date-time}
        replayed: {type: boolean}
        download_copies:
          type: array
          description: One entry per edge download copy, in this order; empty when the service has no downloads directory.
          maxItems: 2
          items: {$ref: '#/components/schemas/EdgeSignerTrustDownloadCopy'}
    EdgeSignerTrustDownloadCopy:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: {type: string, enum: [signer-trust.json, artifacts.json]}
        status:
          type: string
          enum: [refreshed, unchanged, failed, skipped]
          description: skipped = not attempted because the other copy failed first.
        reason:
          type: string
          description: Present for failed and skipped copies.
          enum: [document_invalid, directory_invalid, latest_unavailable, artifact_trust_unreadable,
            artifact_trust_invalid, every_key_revoked, write_failed, artifact_trust_failed, signer_trust_failed]
    EdgeSignerTrustDocument:
      type: object
      description: Unsigned cdnca.edge-signer-trust/v1 document (draft to edit and sign offline).
      additionalProperties: false
      required: [schema, revision, issued_at, trusted_keys, revoked_keys]
      properties:
        schema: {type: string, const: cdnca.edge-signer-trust/v1}
        revision: {type: integer, format: int64, minimum: 1}
        issued_at: {type: string, format: date-time}
        trusted_keys:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [key_id, public_key_pem]
            properties:
              key_id: {type: string}
              public_key_pem: {type: string}
        revoked_keys:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [key_id, revoked_at, reason]
            properties:
              key_id: {type: string}
              public_key_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
              revoked_at: {type: string, format: date-time}
              reason: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    OperatorLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 128, pattern: '^[a-z0-9][a-z0-9._-]+$'}
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
          description: Optional legacy login factor. Operator Console login uses username and password only.
        recovery_code:
          allOf: [{$ref: '#/components/schemas/RecoveryCode'}]
          writeOnly: true
          description: Optional legacy recovery factor. Operator Console login uses username and password only.
    OperatorSession:
      type: object
      additionalProperties: false
      required: [expires_at]
      properties:
        expires_at: {type: string, format: date-time}
    OperatorProfile:
      type: object
      additionalProperties: false
      required: [id, username, display_name, permissions, totp_enabled]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        permissions:
          type: array
          items: {type: string}
        totp_enabled: {type: boolean, description: Whether this operator has enrolled TOTP for sensitive operations}
    OperatorReauthenticationRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
        totp_code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true, description: Required only when the operator has enrolled TOTP}
    OperatorPermission:
      type: object
      additionalProperties: false
