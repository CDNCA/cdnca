        operation: {type: string, enum: [migrate, reinstall]}
        name: {type: string, minLength: 1, maxLength: 200}
        activation_code: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$', description: New public key only; private keys are forbidden.}
        proof: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{85}[AQgw]$', description: New-key proof of possession.}
        previous_key_proof: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{85}[AQgw]$', description: Required only for migrate; old key authorization of the exact new-key proof.}
      oneOf:
        - properties: {operation: {const: migrate}}
          required: [previous_key_proof]
        - properties: {operation: {const: reinstall}}
          not: {required: [previous_key_proof]}
    InstallationReactivationResponse:
      type: object
      additionalProperties: false
      required: [installation, lease_id, signed_lease]
      properties:
        installation: {$ref: '#/components/schemas/ControlInstallation'}
        lease_id: {type: string, format: uuid}
        signed_lease: {$ref: '#/components/schemas/SignedLease'}
    EntitlementUsageValue:
      type: object
      additionalProperties: false
      required: [code, used]
      properties:
        code: {$ref: '#/components/schemas/QuotaCode'}
        used: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    EntitlementUsageReportRequest:
      type: object
      additionalProperties: false
      required: [schema, sequence, lease_serial, observed_at, values, proof]
      properties:
        schema: {type: string, const: cdnca.entitlement.usage-report/v1}
        sequence: {type: integer, format: int64, minimum: 1}
        lease_serial: {type: integer, format: int64, minimum: 1, description: Serial of the installation's current last_lease_id for a new report.}
        observed_at: {type: integer, format: int64, minimum: 1, description: Whole-second UTC Unix timestamp covered by the installation signature; it must not be more than five minutes in the future relative to service time.}
        values:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactly the six built-in quota codes in strict lexical order, without duplicates.
          items: {$ref: '#/components/schemas/EntitlementUsageValue'}
        proof:
          type: string
          minLength: 86
          maxLength: 86
          pattern: '^[A-Za-z0-9_-]{86}$'
          description: Unpadded base64url raw Ed25519 signature over the versioned usage-report proof message.
    EntitlementUsageReport:
      type: object
      additionalProperties: false
      required: [id, installation_id, license_id, sequence, lease_serial, values, observed_at, received_at]
      properties:
        id: {type: string, format: uuid}
        installation_id: {type: string, format: uuid}
        license_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        lease_serial: {type: integer, format: int64, minimum: 1}
        values:
          type: array
          minItems: 6
          maxItems: 6
          items: {$ref: '#/components/schemas/EntitlementUsageValue'}
        observed_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
    EntitlementUsageObservationCode:
      type: string
      enum:
        - domains.count
        - error_pages.asset_bytes
        - error_pages.assets_count
        - error_pages.publication_bytes
        - error_pages.publication_sites
        - error_pages.rules_per_scope
        - error_pages.total_bytes
        - extensions.webhooks.count
        - monthly_traffic_bytes
        - nodes.count
        - packages.count
        - release_channels.count
        - sites.count
    EntitlementUsageObservationValue:
      type: object
      additionalProperties: false
      required: [code, used]
      properties:
        code: {$ref: '#/components/schemas/EntitlementUsageObservationCode'}
        used: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    EntitlementUsageReportRequestV2:
      type: object
      additionalProperties: false
      required: [schema, sequence, lease_serial, observed_at, values, proof]
      properties:
        schema: {type: string, const: cdnca.entitlement.usage-report/v2}
        sequence: {type: integer, format: int64, minimum: 1}
        lease_serial: {type: integer, format: int64, minimum: 1, description: Serial of the installation's current last_lease_id for a new report.}
        observed_at: {type: integer, format: int64, minimum: 1, description: Whole-second UTC Unix timestamp covered by the installation signature; it must not be more than five minutes in the future relative to service time.}
        values:
          type: array
          minItems: 13
          maxItems: 13
          uniqueItems: true
          description: Exactly the thirteen built-in quota codes in strict lexical order, without duplicates.
          items: {$ref: '#/components/schemas/EntitlementUsageObservationValue'}
        proof:
          type: string
          minLength: 86
          maxLength: 86
          pattern: '^[A-Za-z0-9_-]{86}$'
          description: Canonical unpadded base64url raw Ed25519 signature over the versioned v2 usage-report proof message.
    EntitlementUsageReportV2:
      type: object
      additionalProperties: false
      required: [schema, id, installation_id, license_id, sequence, lease_serial, values, observed_at, received_at]
      properties:
        schema: {type: string, const: cdnca.entitlement.usage-report/v2}
        id: {type: string, format: uuid}
        installation_id: {type: string, format: uuid}
        license_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        lease_serial: {type: integer, format: int64, minimum: 1}
        values:
          type: array
          minItems: 13
          maxItems: 13
          uniqueItems: true
          description: Exactly the thirteen built-in quota codes in strict lexical order, without duplicates.
          items: {$ref: '#/components/schemas/EntitlementUsageObservationValue'}
        observed_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
    LicenseQuotaObservationStatus:
      type: object
      additionalProperties: false
      required: [code, entitlement, observation]
      properties:
        code: {$ref: '#/components/schemas/EntitlementUsageObservationCode'}
        entitlement: {type: string, enum: [not_entitled, within_limit, at_limit, over_limit]}
        observation: {type: string, enum: [missing, fresh, stale]}
        limit: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        used: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        installation_id: {type: string, format: uuid, description: Installation with the largest latest observed value for this license-scoped code.}
        observed_at: {type: string, format: date-time}
      description: |
        limit is present exactly when the quota is entitled. used, installation_id and
        observed_at are either all present for the selected observation or all absent.
    LicenseQuotaObservations:
      type: object
      additionalProperties: false
      required: [schema, license_id, license_revision, freshness_seconds, quota_statuses]
      properties:
        schema: {type: string, const: cdnca.license-quota-observations/v1}
        license_id: {type: string, format: uuid}
        license_revision: {type: integer, format: int64, minimum: 1}
        freshness_seconds: {type: integer, const: 86400}
        quota_statuses:
          type: array
          minItems: 13
          maxItems: 13
          uniqueItems: true
          description: Exactly the thirteen built-in quota codes in strict lexical order, without duplicates.
          items: {$ref: '#/components/schemas/LicenseQuotaObservationStatus'}
    InstallationUpgradeAuthorizationState:
      type: object
      additionalProperties: false
      required: [schema, installation_id, installation_status, installation_updated_at, customer_status, license_id, license_status, license_revision, license_updated_at, version, release_channel, quota_observations, blockers]
      properties:
        schema: {type: string, const: cdnca.installation-upgrade-authorization-state/v1}
        installation_id: {type: string, format: uuid}
        installation_status: {type: string, enum: [active, suspended, revoked, banned, retired]}
        installation_updated_at: {type: string, format: date-time}
        customer_status: {type: string, enum: [active, suspended, closed]}
        license_id: {type: string, format: uuid}
        license_status: {type: string, enum: [active, scheduled, suspended, expired, revoked]}
        license_revision: {type: integer, format: int64, minimum: 1}
        license_updated_at: {type: string, format: date-time}
        version: {$ref: '#/components/schemas/VersionRange'}
        release_channel: {$ref: '#/components/schemas/ReleaseChannel'}
        quota_observations: {$ref: '#/components/schemas/LicenseQuotaObservations'}
        blockers:
          type: array
          maxItems: 4
          uniqueItems: true
          description: Stable enforcement order is installation, customer, license, then channel.
          items:
            type: string
            enum: [installation_inactive, customer_inactive, license_inactive, channel_inactive]
    LeaseResponse:
      type: object
      additionalProperties: false
      required: [lease_id, signed_lease]
      properties:
        lease_id: {type: string, format: uuid}
        signed_lease: {$ref: '#/components/schemas/SignedLease'}
    SignedLease:
      type: object
      additionalProperties: false
      required: [algorithm, key_id, lease, signature]
      properties:
        algorithm: {type: string, const: Ed25519}
        key_id: {type: string}
        lease: {$ref: '#/components/schemas/EntitlementLease'}
        signature: {type: string, description: Base64url raw Ed25519 signature.}
    EntitlementLease:
      type: object
      additionalProperties: false
      required: [schema, audience, customer_id, installation_id, license_id, serial, not_before, expires_at, grace_until, version, features, quotas]
      properties:
        schema: {type: string, const: cdnca.entitlement.lease/v1}
        audience: {type: string, const: cdnca-control-plane}
        customer_id: {type: string}
        installation_id: {type: string}
        license_id: {type: string}
        serial: {type: integer, minimum: 1}
        not_before: {type: integer, format: int64}
        expires_at: {type: integer, format: int64}
        grace_until: {type: integer, format: int64}
        version: {$ref: '#/components/schemas/VersionRange'}
        features:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code: {$ref: '#/components/schemas/LeaseFeatureCode'}
        quotas:
          type: array
          items: {$ref: '#/components/schemas/LeaseQuota'}
    LeaseFeatureCode:
      type: string
      pattern: '^[a-z][a-z0-9._-]*$'
      maxLength: 96
      description: |
        Feature vocabulary accepted by the v1 parser. error_pages.manage and
        extensions.webhooks are recognized, but this issuer does not emit them
        until verifier capability is confirmed for the target installation.
    LeaseQuota:
      type: object
      additionalProperties: false
      required: [code, limit]
      properties:
        code: {$ref: '#/components/schemas/LeaseQuotaCode'}
        limit:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    LeaseQuotaCode:
      type: string
      description: |
        Quota vocabulary accepted by the v1 parser. The error_pages.* codes and
        extensions.webhooks.count are not issuable until the target installation
        has a trusted verifier capability fact; older verifiers may reject the
        entire lease.
      enum: [domains.count, error_pages.asset_bytes, error_pages.assets_count, error_pages.publication_bytes, error_pages.publication_sites, error_pages.rules_per_scope, error_pages.total_bytes, extensions.webhooks.count, monthly_traffic_bytes, nodes.count, packages.count, release_channels.count, sites.count]
    SignerRevocationDigest:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Unpadded base64url SHA-256 digest.
    SignerRevocationArtifactClass:
      type: string
      enum: [lease, policy, release]
    SignerRevocationArtifactClasses:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      description: Nonempty canonical lexical order; these are the only valid v1 combinations.
      items: {$ref: '#/components/schemas/SignerRevocationArtifactClass'}
      enum:
        - [lease]
        - [policy]
        - [release]
        - [lease, policy]
        - [lease, release]
        - [policy, release]
        - [lease, policy, release]
    SignerRevocationAuthorityKind:
      type: string
      enum: [lineage, offline_root]
      description: |
        A lineage authority must be the locked current higher-generation,
        uneffectively-revoked signing key. An offline root is accepted only from
        an independently provisioned local pin, never from downloaded content.
    SignerRevocationSpec:
      type: object
      additionalProperties: false
      required:
        - revoked_key_id
        - revoked_key_generation
        - artifact_classes
        - effective_not_before
        - expires_at
        - reason_code
        - authority_kind
        - authority_key_id
        - authority_key_generation
      properties:
        revoked_key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        revoked_key_generation: {type: integer, format: int64, minimum: 1}
        artifact_classes: {$ref: '#/components/schemas/SignerRevocationArtifactClasses'}
        effective_not_before:
          type: string
          format: date-time
          description: Once reached, every matching artifact is rejected regardless of artifact-supplied issue time.
        expires_at:
          type: string
          format: date-time
          description: Transport freshness deadline; expiry never removes an accepted revocation.
        reason_code: {type: string, const: signer_compromise}
        authority_kind: {$ref: '#/components/schemas/SignerRevocationAuthorityKind'}
        authority_key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        authority_key_generation: {type: integer, format: int64, minimum: 1}
        supersedes_proposal_id:
          type: string
          format: uuid
          description: Exactly one cancelled or rejected unpublished predecessor at the same sequence and head.
    CreateSignerRevocationProposalRequest:
      type: object
      additionalProperties: false
      required:
        - revoked_key_id
        - revoked_key_generation
        - artifact_classes
        - effective_not_before
        - expires_at
        - reason_code
        - authority_kind
        - authority_key_id
        - authority_key_generation
        - expected_sequence
        - expected_previous_sequence
        - expected_previous_manifest_sha256
      properties:
        revoked_key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        revoked_key_generation: {type: integer, format: int64, minimum: 1}
        artifact_classes: {$ref: '#/components/schemas/SignerRevocationArtifactClasses'}
        effective_not_before: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        reason_code: {type: string, const: signer_compromise}
        authority_kind: {$ref: '#/components/schemas/SignerRevocationAuthorityKind'}
        authority_key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        authority_key_generation: {type: integer, format: int64, minimum: 1}
        supersedes_proposal_id: {type: string, format: uuid}
        expected_sequence: {type: integer, format: int64, minimum: 1}
        expected_previous_sequence:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Null for genesis; otherwise exactly expected_sequence minus one.
        expected_previous_manifest_sha256:
          description: Null for genesis; otherwise the exact current head inner-manifest digest.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SignerRevocationDigest'}
    SignerRevocationImpact:
      type: object
      additionalProperties: false
      required: [installations, active_leases, platform_policies, release_artifacts]
      properties:
        installations: {type: integer, format: int64, minimum: 0}
        active_leases: {type: integer, format: int64, minimum: 0}
        platform_policies: {type: integer, format: int64, minimum: 0}
        release_artifacts: {type: integer, format: int64, minimum: 0}
    SignerRevocationPreview:
      type: object
      additionalProperties: false
      required:
        - revoked_key_id
        - revoked_key_generation
        - artifact_classes
        - effective_not_before
        - expires_at
        - reason_code
        - authority_kind
        - authority_key_id
        - authority_key_generation
        - sequence
        - previous_sequence
        - previous_manifest_sha256
        - canonical_manifest_sha256
        - impact
      properties:
        revoked_key_id: {type: string}
        revoked_key_generation: {type: integer, format: int64, minimum: 1}
        artifact_classes: {$ref: '#/components/schemas/SignerRevocationArtifactClasses'}
        effective_not_before: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        reason_code: {type: string, const: signer_compromise}
        authority_kind: {$ref: '#/components/schemas/SignerRevocationAuthorityKind'}
        authority_key_id: {type: string}
        authority_key_generation: {type: integer, format: int64, minimum: 1}
        supersedes_proposal_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        previous_sequence: {type: [integer, 'null'], format: int64, minimum: 1}
        previous_manifest_sha256:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SignerRevocationDigest'}
        canonical_manifest_sha256:
          allOf:
            - {$ref: '#/components/schemas/SignerRevocationDigest'}
          description: Sample-only digest for this preview operation time; it cannot authorize later creation, approval or publication.
        impact: {$ref: '#/components/schemas/SignerRevocationImpact'}
    SignerRevocationApprovalRequest:
      type: object
      additionalProperties: false
      required: [manifest_sha256, approval_expires_at]
      properties:
        manifest_sha256: {$ref: '#/components/schemas/SignerRevocationDigest'}
        approval_expires_at:
          type: string
          format: date-time
          description: Must be after trusted approval time and no more than 24 hours later.
    SignerRevocationDigestRequest:
      type: object
      additionalProperties: false
      required: [manifest_sha256]
      properties:
        manifest_sha256: {$ref: '#/components/schemas/SignerRevocationDigest'}
    SignerRevocationCancelRequest:
      type: object
      additionalProperties: false
      required: [manifest_sha256, reason_code]
      properties:
        manifest_sha256: {$ref: '#/components/schemas/SignerRevocationDigest'}
        reason_code: {type: string, const: creator_cancelled}
    SignerRevocationRejectRequest:
      type: object
      additionalProperties: false
      required: [manifest_sha256, reason_code]
      properties:
        manifest_sha256: {$ref: '#/components/schemas/SignerRevocationDigest'}
        reason_code: {type: string, const: approval_rejected}
    SignerRevocationApproval:
      type: object
      additionalProperties: false
      required: [approved_by, approved_at, expires_at]
      properties:
        approved_by: {type: string, format: uuid}
        approved_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    SignerRevocationPublication:
      type: object
      additionalProperties: false
      required: [published_by, published_at]
      properties:
        published_by:
          description: Null only for immutable v1 publications migrated from history that did not record the actor; v2 always contains an operator UUID.
          oneOf:
            - {type: 'null'}
            - {type: string, format: uuid}
        published_at: {type: string, format: date-time}
    SignerRevocationProposal:
      type: object
      additionalProperties: false
      required:
        - id
        - workflow_version
        - status
        - sequence
        - previous_sequence
        - previous_manifest_sha256
        - revoked_key_id
        - revoked_key_generation
        - artifact_classes
        - effective_not_before
        - reason_code
        - issued_at
        - expires_at
        - authority_kind
        - authority_key_id
        - authority_key_generation
        - canonical_manifest_sha256
        - created_by
        - created_at
        - impact
      properties:
        id: {type: string, format: uuid}
        workflow_version:
          type: integer
          enum: [1, 2]
          description: Version 1 identifies immutable migrated history; version 2 identifies the maker-checker workflow.
        status: {type: string, enum: [draft, approved, cancelled, rejected, published, superseded]}
        sequence: {type: integer, format: int64, minimum: 1}
        previous_sequence: {type: [integer, 'null'], format: int64, minimum: 1}
        previous_manifest_sha256:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SignerRevocationDigest'}
        revoked_key_id: {type: string}
        revoked_key_generation: {type: integer, format: int64, minimum: 1}
        artifact_classes: {$ref: '#/components/schemas/SignerRevocationArtifactClasses'}
        effective_not_before: {type: string, format: date-time}
        reason_code: {type: string, const: signer_compromise}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        authority_kind: {$ref: '#/components/schemas/SignerRevocationAuthorityKind'}
        authority_key_id: {type: string}
        authority_key_generation: {type: integer, format: int64, minimum: 1}
        canonical_manifest_sha256: {$ref: '#/components/schemas/SignerRevocationDigest'}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        supersedes_proposal_id: {type: string, format: uuid}
        approval: {$ref: '#/components/schemas/SignerRevocationApproval'}
        publication: {$ref: '#/components/schemas/SignerRevocationPublication'}
        impact: {$ref: '#/components/schemas/SignerRevocationImpact'}
      allOf:
        - if:
            required: [workflow_version]
            properties:
              workflow_version: {const: 2}
          then:
            properties:
              publication:
                properties:
                  published_by: {type: string, format: uuid}
        - if:
            required: [workflow_version, status]
            properties:
              workflow_version: {const: 2}
              status: {const: approved}
          then:
            required: [approval]
        - if:
            required: [workflow_version, status]
            properties:
              workflow_version: {const: 2}
              status: {const: published}
          then:
            required: [approval, publication]
    CurrentSignerRevocationView:
      type: object
      additionalProperties: false
      required:
        - manifest_id
        - workflow_version
        - sequence
        - manifest_sha256
        - signed_manifest_sha256
        - etag
        - published_at
        - published_by
        - response_bytes
        - proposal
      properties:
        manifest_id: {type: string, format: uuid}
        workflow_version:
          type: integer
          enum: [1, 2]
          description: Publication workflow version; 1 is immutable migrated history and 2 is maker-checker publication.
        sequence: {type: integer, format: int64, minimum: 1}
        manifest_sha256: {$ref: '#/components/schemas/SignerRevocationDigest'}
        signed_manifest_sha256: {$ref: '#/components/schemas/SignerRevocationDigest'}
        etag:
          type: string
          minLength: 45
          maxLength: 45
          pattern: '^"[A-Za-z0-9_-]{43}"$'
          description: Strong ETag derived from the exact signed manifest bytes.
        published_at: {type: string, format: date-time}
        published_by:
          description: Null only for immutable v1 publications whose historical schema did not record the publisher; v2 always contains an operator UUID.
          oneOf:
            - {type: 'null'}
            - {type: string, format: uuid}
        response_bytes: {type: integer, format: int64, minimum: 1, maximum: 131072}
        proposal: {$ref: '#/components/schemas/SignerRevocationProposal'}
      allOf:
        - if:
            required: [workflow_version]
            properties:
              workflow_version: {const: 2}
          then:
            properties:
              published_by: {type: string, format: uuid}
    SignerRevocationProposalPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SignerRevocationProposal'}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
    SignerRevocationHistoryEvent:
      type: object
      additionalProperties: false
      required: [id, action, result, actor_id, request_id, occurred_at]
      properties:
        id: {type: string, format: uuid}
        action:
          type: string
          enum:
            - signer_revocation.view
            - signer_revocation.preview
            - signer_revocation.create
            - signer_revocation.approve
            - signer_revocation.publish
            - signer_revocation.cancel
            - signer_revocation.reject
        result: {type: string, enum: [success, denied, failure]}
        actor_id: {type: string, format: uuid}
        reason_code:
          type: string
          minLength: 1
          maxLength: 96
          pattern: '^[a-z][a-z0-9_]*$'
          description: Stable redacted error or terminal reason code; raw secrets and service errors are never exposed.
        request_id: {type: string, minLength: 1, maxLength: 128}
        occurred_at: {type: string, format: date-time}
    SignerRevocationHistoryPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SignerRevocationHistoryEvent'}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
    SignerRevocationManifest:
      type: object
      additionalProperties: false
      required:
        - schema
        - sequence
        - previous_sequence
        - previous_manifest_sha256
        - revoked_key_id
        - revoked_key_generation
        - artifact_classes
        - effective_not_before
        - reason
        - issued_at
        - expires_at
      properties:
        schema: {type: string, const: cdnca.signer-revocation-manifest/v1}
        sequence: {type: integer, format: int64, minimum: 1}
        previous_sequence: {type: [integer, 'null'], format: int64, minimum: 1}
        previous_manifest_sha256:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SignerRevocationDigest'}
        revoked_key_id: {type: string, minLength: 1, maxLength: 128}
        revoked_key_generation: {type: integer, format: int64, minimum: 1}
        artifact_classes: {$ref: '#/components/schemas/SignerRevocationArtifactClasses'}
        effective_not_before: {type: string, format: date-time}
        reason: {type: string, const: signer_compromise}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    SignerRevocationEnvelope:
      type: object
      additionalProperties: false
      required: [schema, algorithm, authority_kind, authority_key_id, authority_key_generation, manifest_sha256]
      properties:
        schema: {type: string, const: cdnca.signer-revocation-envelope/v1}
        algorithm: {type: string, const: Ed25519}
        authority_kind: {$ref: '#/components/schemas/SignerRevocationAuthorityKind'}
        authority_key_id: {type: string, minLength: 1, maxLength: 128}
        authority_key_generation: {type: integer, format: int64, minimum: 1}
        manifest_sha256: {$ref: '#/components/schemas/SignerRevocationDigest'}
    SignedSignerRevocationManifest:
      type: object
      additionalProperties: false
      required: [manifest, envelope, signature]
      description: |
        Exact canonical JSON object. Field order, timestamps, digest encoding and
        absence of extra whitespace are part of the accepted byte representation;
        consumers must verify canonical encoding before trusting the signature.
      properties:
        manifest: {$ref: '#/components/schemas/SignerRevocationManifest'}
        envelope: {$ref: '#/components/schemas/SignerRevocationEnvelope'}
        signature:
          type: string
          minLength: 86
          maxLength: 86
          pattern: '^[A-Za-z0-9_-]{86}$'
          description: Unpadded base64url raw Ed25519 signature over exact canonical envelope bytes.
    MasterIPBinding:
      type: object
      additionalProperties: false
      required: [license_id, master_ip, migration_ip, migration_ip_expires_at, revision, updated_at]
      properties:
        license_id: {type: string, format: uuid}
        master_ip: {type: [string, 'null'], description: Normalized IPv4 or IPv6 (RFC 5952) text}
        migration_ip: {type: [string, 'null']}
        migration_ip_expires_at: {type: [string, 'null'], format: date-time}
        revision: {type: integer, format: int64, minimum: 0}
        updated_at: {type: [string, 'null'], format: date-time}
    LicenseMasterIPSummary:
      allOf:
        - $ref: '#/components/schemas/MasterIPBinding'
        - type: object
          required: [open_mismatches]
          properties:
            open_mismatches: {type: integer, minimum: 0}
    MasterIPChange:
      type: object
      additionalProperties: false
      required: [id, field, old_value, new_value, migration_ip_expires_at, source, actor_kind, actor_id, request_source_ip, reason, created_at]
      properties:
        id: {type: string, format: uuid}
        field: {type: string, enum: [master_ip, migration_ip]}
        old_value: {type: [string, 'null']}
        new_value: {type: [string, 'null']}
        migration_ip_expires_at: {type: [string, 'null'], format: date-time}
        source: {type: string, enum: [portal, operator, activation_tofu, installation_tofu, migration_activation, legacy_download_ip]}
        actor_kind: {type: string, enum: [customer, operator, installation, system]}
        actor_id: {type: string}
        request_source_ip: {type: [string, 'null']}
        reason: {type: string}
        created_at: {type: string, format: date-time}
    MasterIPMismatch:
      type: object
      additionalProperties: false
      required: [installation_id, observed_ip, registered_ip, last_operation, first_seen_at, last_seen_at, occurrences]
      properties:
        installation_id: {type: string, format: uuid}
        observed_ip: {type: string}
        registered_ip: {type: string}
        last_operation: {type: string, enum: [renewal, reactivation, upgrade_grant, upgrade_plan_artifact_bundle, upgrade_command_grant]}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        occurrences: {type: integer, format: int64, minimum: 1}
    LicenseMasterIPView:
      type: object
      additionalProperties: false
      required: [binding, changes, mismatches]
      properties:
        binding: {$ref: '#/components/schemas/MasterIPBinding'}
        changes:
          type: array
          items: {$ref: '#/components/schemas/MasterIPChange'}
        mismatches:
          type: array
          items: {$ref: '#/components/schemas/MasterIPMismatch'}
    RulePackRelease:
      type: object
      additionalProperties: false
      required: [id, artifact_id, pack_id, version, revision, layer, engine, name, requires_feature, resident, encryption,
        content_sha256, crs_rule_ids, created_at]
      properties:
        id: {type: string, format: uuid}
        artifact_id: {type: string}
        pack_id: {type: string}
        version: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        layer: {type: string, enum: [system, developer]}
        engine: {type: string}
        name: {type: string}
        requires_feature: {type: string}
        resident: {type: boolean}
        encryption: {type: string, enum: [none, install_wrapped]}
        content_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        crs_rule_ids:
          type: array
          description: |
            Computed by this service for a modsecurity pack (CRS rule numbers
            its rule sets evaluate, sorted, at most 2048); empty for other
            engines. Never taken from the publisher.
          maxItems: 2048
          items: {type: integer, minimum: 900000, maximum: 999999}
        created_at: {type: string, format: date-time}
    RuleIntelCandidateKind:
      type: string
      enum: [waf_exclusion, waf_typed_param, waf_reweight, autodefense_signature, cc_rule_tune, scanner_fingerprint]
    RuleIntelCandidateState:
      type: string
      enum: [new, ready, drafted, released, rejected, expired, quarantined]
    RuleIntelCorpusSource:
      type: string
      enum: [crs_regression, builtin, intel, intel_variant, intel_expired, manual, report]
    RuleIntelTarget:
      type: object
      additionalProperties: false
      required: [engine, pack_id]
      properties:
        engine: {type: string}
        pack_id: {type: string}
        rule_id: {type: string}
        set: {type: string}
    RuleIntelCondition:
      description: A normalized [dimension, value] pair; parameter values never leave the control plane.
      type: array
      minItems: 2
      maxItems: 2
      items: {type: string}
    RuleIntelReportItem:
      type: object
      additionalProperties: false
      required: [kind, target, conds, hits, sources, days]
      properties:
        kind: {$ref: '#/components/schemas/RuleIntelCandidateKind'}
        target: {$ref: '#/components/schemas/RuleIntelTarget'}
        conds:
          type: array
          items: {$ref: '#/components/schemas/RuleIntelCondition'}
        hits: {type: integer, format: int64, minimum: 0}
        sources: {type: integer, format: int64, minimum: 0}
        days: {type: integer, minimum: 0}
        pass_ratio: {type: number, minimum: 0, maximum: 1}
        attack_ratio: {type: number, minimum: 0, maximum: 1}
        params:
          description: cc_rule_tunes only; this installation's suggested parameters.
          type: object
          additionalProperties: {type: number}
        reason: {type: string, enum: [false_positive, attack, unneeded]}
    RuleIntelRuleStat:
      type: object
      additionalProperties: false
      required: [engine, pack_id, pack_version, rule_id, hits, grey_ratio, pass_ratio, excluded_sites]
      properties:
        engine: {type: string}
        pack_id: {type: string}
        pack_version: {type: string}
        rule_id: {type: string}
        hits: {type: integer, format: int64, minimum: 0}
        grey_ratio: {type: number, minimum: 0, maximum: 1}
        pass_ratio: {type: number, minimum: 0, maximum: 1}
        excluded_sites: {type: integer, format: int64, minimum: 0}
    RuleIntelAttackFragment:
      description: A redacted fragment of a request blocked by a strong signal (ADR 0011 §4.4).
      type: object
      additionalProperties: false
      required: [target, location, fragment, encoding, signal, hits, sites]
      properties:
        target: {$ref: '#/components/schemas/RuleIntelTarget'}
        location: {type: string}
        param_key: {type: string}
        fragment: {type: string, maxLength: 1024}
        encoding: {type: string, enum: [text, percent]}
        signal: {type: string}
        hits: {type: integer, format: int64, minimum: 0}
        sites: {type: integer, format: int64, minimum: 0}
    RuleIntelReport:
      description: cdnca.rule-intel-report/v1 body; at most 512 KiB.
      type: object
      additionalProperties: false
      required: [waf_exclusions, waf_rejections, waf_tighten, waf_rule_stats, autodefense_signatures, cc_rule_stats,
        cc_rule_tunes, false_positives, scanner_fingerprints]
      properties:
        waf_exclusions: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/RuleIntelReportItem'}}
        waf_rejections: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/RuleIntelReportItem'}}
        waf_tighten: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/RuleIntelReportItem'}}
        waf_rule_stats: {type: array, items: {$ref: '#/components/schemas/RuleIntelRuleStat'}}
        autodefense_signatures: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/RuleIntelReportItem'}}
        cc_rule_stats: {type: array, items: {$ref: '#/components/schemas/RuleIntelRuleStat'}}
        cc_rule_tunes: {type: array, items: {$ref: '#/components/schemas/RuleIntelReportItem'}}
        false_positives: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/RuleIntelReportItem'}}
        scanner_fingerprints: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/RuleIntelReportItem'}}
        attack_fragments: {type: array, minItems: 1, maxItems: 512, items: {$ref: '#/components/schemas/RuleIntelAttackFragment'}}
        pack_receipts:
          description: |
            Node artifact set receipts summed by official pack version (latest receipt per node; items
            rejected as set_rejected not counted). Ascending by (pack_id, version), no duplicates;
            omitted when no official pack is delivered. Rollouts pause on rejected > 0 (ADR 0011 §6.2).
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [pack_id, version, applied, rejected]
            properties:
              pack_id: {type: string, pattern: '^system/[a-z0-9][a-z0-9-]{0,62}$'}
              version: {type: string, pattern: '^[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}$'}
              applied: {type: integer, format: int64, minimum: 0}
              rejected: {type: integer, format: int64, minimum: 0}
    RuleIntelReportRequest:
      type: object
      additionalProperties: false
      required: [schema, installation_id, sequence, observed_at, report, request_id, signature]
      properties:
        schema: {type: string, enum: [cdnca.rule-intel-report/v1]}
        installation_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        observed_at: {type: integer, format: int64, minimum: 1, description: Unix seconds}
        report: {$ref: '#/components/schemas/RuleIntelReport'}
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
        signature: {type: string, pattern: '^[A-Za-z0-9_-]{86}$', description: Unpadded base64url Ed25519 signature}
    RuleIntelReceipt:
      type: object
      additionalProperties: false
      required: [schema, id, sequence, report_digest, section_counts, accepted, blocked, dropped, fragments, received_at, remaining_today]
      properties:
        schema: {type: string, enum: [cdnca.rule-intel-receipt/v1]}
        id: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        report_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        section_counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
        accepted: {type: integer, minimum: 0}
        blocked: {type: integer, minimum: 0, description: Items stopped by a tombstone}
        dropped: {type: integer, minimum: 0}
        fragments: {type: integer, minimum: 0, description: Attack fragment samples newly added to the corpus}
        received_at: {type: string, format: date-time}
        remaining_today: {type: integer, minimum: 0}
    RuleIntelOverview:
      type: object
      additionalProperties: false
      required: [schema, today, kinds, installs_30d, reports_30d, pool, corpus, last_job]
      properties:
        schema: {type: string, enum: [cdnca.rule-intel.overview/v1]}
        today: {type: integer, description: UTC day number (Unix seconds / 86400)}
        kinds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, states]
            properties:
              kind: {$ref: '#/components/schemas/RuleIntelCandidateKind'}
              states: {type: object, additionalProperties: {type: integer, minimum: 0}}
        installs_30d: {type: integer, minimum: 0}
        reports_30d: {type: integer, minimum: 0}
        pool:
          type: object
          additionalProperties: false
          required: [total, total_cap, kind_cap, by_kind]
          properties:
            total: {type: integer, minimum: 0}
            total_cap: {type: integer, minimum: 1}
            kind_cap: {type: integer, minimum: 1}
            by_kind: {type: object, additionalProperties: {type: integer, minimum: 0}}
        corpus: {type: object, additionalProperties: {type: integer, minimum: 0}}
        last_job:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [day, candidates, clusters, archived, pool_total, finished_at]
              properties:
                day: {type: integer}
                candidates: {type: integer, minimum: 0}
                clusters: {type: integer, minimum: 0}
                archived: {type: integer, minimum: 0}
                pool_total: {type: integer, minimum: 0}
                finished_at: {type: string, format: date-time}
    RuleIntelCandidate:
      type: object
      additionalProperties: false
      required: [id, kind, fingerprint, target, conds, state, state_day, first_seen, last_seen, installs_7d, installs_30d,
        customers_30d, weight, fp_weight, fp_ratio, confidence, score, hits, member_count, synthetic]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/RuleIntelCandidateKind'}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        target: {$ref: '#/components/schemas/RuleIntelTarget'}
        conds:
          type: array
          items: {$ref: '#/components/schemas/RuleIntelCondition'}
        state: {$ref: '#/components/schemas/RuleIntelCandidateState'}
        state_day: {type: integer, minimum: 0}
        first_seen: {type: integer, minimum: 0}
        last_seen: {type: integer, minimum: 0}
        installs_7d: {type: integer, minimum: 0}
        installs_30d: {type: integer, minimum: 0}
        customers_30d: {type: integer, minimum: 0}
        weight: {type: number, minimum: 0}
        fp_weight: {type: number, minimum: 0}
        fp_ratio: {type: number, minimum: 0}
        confidence: {type: number, minimum: 0, maximum: 1}
        score: {type: number, minimum: 0}
        hits: {type: integer, format: int64, minimum: 0}
        cluster_id: {type: string, pattern: '^[0-9a-f]{64}$'}
        member_count: {type: integer, minimum: 0}
        merged_into: {type: string, pattern: '^[0-9a-f]{64}$'}
        generalization_of: {type: string, pattern: '^[0-9a-f]{64}$'}
        synthetic: {type: boolean}
        tune: {type: object, additionalProperties: true}
        release_ref: {type: string}
    RuleIntelCandidatePage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RuleIntelCandidate'}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
    RuleIntelTombstone:
      type: object
      additionalProperties: false
      required: [reason, until_day, permanent, reject_count, active]
      properties:
        reason: {type: string}
        until_day: {type: [integer, 'null']}
        permanent: {type: boolean}
        reject_count: {type: integer, minimum: 1}
        active: {type: boolean}
    RuleIntelCandidateDetail:
      type: object
      additionalProperties: false
      required: [schema, candidate, members, evidence, tombstone, synthetic_request, samples, history]
      properties:
        schema: {type: string, enum: [cdnca.rule-intel.candidate/v1]}
        candidate: {$ref: '#/components/schemas/RuleIntelCandidate'}
        members:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/RuleIntelCandidate'}
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [day, weight, fp, installs, hits]
            properties:
              day: {type: integer}
              weight: {type: number, minimum: 0}
              fp: {type: number, minimum: 0}
              installs: {type: integer, minimum: 0}
              hits: {type: integer, format: int64, minimum: 0}
        tombstone:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RuleIntelTombstone'
        synthetic_request: {type: object, additionalProperties: true}
        samples:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/RuleIntelCorpusSample'}
        history:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [action, actor_kind, actor_id, result, payload, occurred_at]
            properties:
              action: {type: string}
              actor_kind: {type: string, enum: [operator, installation, system]}
              actor_id: {type: string}
              result: {type: string, enum: [success, denied, failure]}
              payload: {type: object, additionalProperties: true}
              occurred_at: {type: string, format: date-time}
    RuleIntelRejectRequest:
      type: object
      additionalProperties: false
      required: [candidate_ids, reason_code]
      properties:
        candidate_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, format: uuid}
        reason_code: {type: string, enum: [false_positive, attack, not_needed, duplicate, other]}
        note: {type: string, maxLength: 256}
    RuleIntelRejectResult:
      type: object
      additionalProperties: false
      required: [rejected, skipped, items]
      properties:
        rejected: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0, description: Candidates that were already rejected}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, state, tombstone]
            properties:
              id: {type: string, format: uuid}
              state: {type: string, enum: [rejected]}
              tombstone: {$ref: '#/components/schemas/RuleIntelTombstone'}
    RuleIntelRestoreRequest:
      type: object
      additionalProperties: false
      properties:
        note: {type: string, maxLength: 256}
    RuleIntelMergeRequest:
      type: object
      additionalProperties: false
      required: [target, candidate_ids]
      properties:
        target: {type: string, enum: [system/crs-tuning, system/scanner-signatures, system/autodefense-intel, crs_tiers]}
        candidate_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: string, format: uuid}
        bump: {type: string, enum: ['', patch, minor, major], description: Empty picks patch (crs_tiers minor).}
    RuleIntelPublishRequest:
      type: object
      additionalProperties: false
      properties:
        canary_installation_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, format: uuid}
    RuleIntelRolloutAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [advance, pause, resume, rollback]}
        reason: {type: string, maxLength: 1024}
    RuleIntelRollout:
      type: object
      additionalProperties: false
      required: [id, merge_id, artifact_id, from_revision, to_revision, stage, percent, canary_installation_ids, state, started_at, advanced_at]
      properties:
        id: {type: string, format: uuid}
        merge_id: {type: string, format: uuid}
        artifact_id: {type: string}
        from_revision: {type: [integer, 'null'], format: int64}
        to_revision: {type: integer, format: int64}
        stage: {type: string, enum: [canary, '5', '25', '100']}
        percent: {type: integer, minimum: 0, maximum: 100}
        canary_installation_ids:
          type: array
          items: {type: string, format: uuid}
        state: {type: string, enum: [running, paused, done, rolled_back]}
        paused_reason: {type: string}
        started_at: {type: string, format: date-time}
        advanced_at: {type: string, format: date-time}
    RuleIntelMerge:
      type: object
      additionalProperties: false
      required: [id, target, bump, candidate_ids, pack_sha256, base_refs, new_versions, skipped, state, release_refs, operation,
        created_at, updated_at, rollouts]
      properties:
        id: {type: string, format: uuid}
        target: {type: string}
        bump: {type: string, enum: [patch, minor, major]}
        candidate_ids:
          type: array
          items: {type: string, format: uuid}
        pack_sha256:
          type: array
          items: {type: string, pattern: '^[0-9a-f]{64}$'}
        base_refs:
          type: array
          items: {type: string}
        new_versions:
          type: array
          items: {type: string}
        skipped:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, reason]
            properties:
              candidate_id: {type: string}
              reason: {type: string, enum: [no_exact_parameter, already_released, not_expressible, compile_failed, no_rule, not_reweightable]}
        state: {type: string, enum: [draft, gating, gated, failed, published, abandoned]}
        gate_request_id: {type: string, format: uuid}
        gate_report: {type: object, additionalProperties: true}
        failure: {type: string}
        release_refs:
          type: array
          items: {type: string}
        rollback_of: {type: string, format: uuid}
        operation:
          description: merge (rule intel), rollback, withdraw / restore (one rule, published-rules page)
          type: string
          enum: [merge, rollback, withdraw, restore]
        rule_id: {type: string, description: The withdrawn or restored rule}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        published_at: {type: string, format: date-time}
        rollouts:
          type: array
          items: {$ref: '#/components/schemas/RuleIntelRollout'}
    RuleIntelRuleAction:
      type: object
      additionalProperties: false
      required: [pack_id, rule_id]
      properties:
        pack_id: {type: string, enum: [system/crs-tuning, system/scanner-signatures, system/autodefense-intel]}
        rule_id: {type: string, maxLength: 64}
        reason: {type: string, maxLength: 1024}
    RuleIntelPublishedRules:
      type: object
      additionalProperties: false
      required: [packs]
      properties:
        packs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pack_id, version, revision, rules]
            properties:
              pack_id: {type: string}
              version: {type: string}
              revision: {type: integer, format: int64}
              rules:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [pack_id, rule_id, name, state, version, dormant, summary]
                  properties:
                    pack_id: {type: string}
                    rule_id: {type: string}
                    name: {type: string}
                    state: {type: string, enum: [active, withdrawn]}
