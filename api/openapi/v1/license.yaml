  /operator/v1/installations/{installation_id}/lifecycle-changes:
    post:
      tags: [Operator Platform]
      operationId: changeControlInstallationLifecycle
      summary: Suspend, resume, or permanently revoke a control installation
      description: |
        Requires a five-minute Operator step-up. Status is the optimistic concurrency
        precondition. Exact replay rechecks live RBAC and returns the original result.
        Suspension never rewrites signed lease bytes; revocation records authoritative
        lease revocation facts without putting the licensing service in the Edge request path.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeInstallationStatusRequest'}
      responses:
        '200':
          description: Updated installation or the original exact replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlInstallation'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /operator/v1/installations/{installation_id}/bans:
    post:
      tags: [Operator Platform]
      operationId: banControlInstallation
      summary: Ban a control installation and all of its nodes (ADR 0014)
      description: |
        Requires a five-minute Operator step-up. The installation must be active or
        suspended; it becomes banned, every unrevoked lease is revoked (reason
        installation_banned) and a signed BanNotice is archived for the controller.
        until null or absent bans permanently; otherwise it must be in the future and the
        ban is lifted automatically at that time. Renewals answer 403 installation_banned.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.installation_bans.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BanInstallationRequest'}
      responses:
        '201':
          description: Created ban or the original exact replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationBan'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: installation_ban_conflict (already banned or revoked) or idempotency_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      tags: [Operator Platform]
      operationId: listControlInstallationBans
      summary: Ban history of a control installation, newest first (at most 200)
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.installation_bans.manage]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: Ban history including lifted bans
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items: {$ref: '#/components/schemas/InstallationBan'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /operator/v1/installation-bans/{ban_id}/lift:
    post:
      tags: [Operator Platform]
      operationId: liftControlInstallationBan
      summary: Lift an active installation ban manually
      description: |
        Requires a five-minute Operator step-up. The installation returns to the status it
        had when banned and a signed lifted BanNotice is archived. Revoked lease serials stay
        revoked; the controller renews to receive new ones.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.installation_bans.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - name: ban_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: Lifted ban or the original exact replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationBan'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: installation_ban_conflict (already lifted) or idempotency_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /installation/v2/installation-state/current:
    get:
      tags: [Installation]
      operationId: getInstallationState
      summary: Signed ban notice and node service ticket for the calling installation (ADR 0014)
      description: |
        Authenticated by an installation-key Ed25519 proof over
        cdnca-installation-state-fetch-proof/v1 (libs/entitlement/installationban),
        valid within 5 minutes of X-Cdnca-Requested-At. Banned installations still receive
        their BanNotice. Only active installations with an eligible license receive a
        ServiceTicket (valid for the node offline tolerance, default 7 days, reissued daily).
        Documents are base64url of canonical signed bytes; an empty string means absent.
      parameters:
        - {name: X-Request-ID, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: X-Cdnca-Installation-ID, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: X-Cdnca-Requested-At, in: header, required: true, schema: {type: integer, format: int64}}
        - {name: X-Cdnca-Proof, in: header, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Current installation state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationState'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401':
          description: invalid_proof
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/MasterIPRebound'}
        '503':
          description: signer_unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /operator/v1/installations/{installation_id}/reactivation-credentials:
    post:
      tags: [Operator Platform]
      operationId: issueInstallationReactivationCredential
      summary: Authorize one migration or reinstall identity replacement
      description: |
        Requires a five-minute Operator step-up and the current installation revision.
        The response credential is recoverable only for an exact idempotent replay. The
        database stores its SHA-256 hash and derivation key ID, never the credential or
        any installation private key. Migration still requires authorization by the old
        installation key; reinstall is the explicit operator recovery path.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          description: Strong quoted decimal ControlInstallation revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueInstallationReactivationCredentialRequest'}
      responses:
        '201':
          description: One-time credential or the original exact replay
          headers:
            Cache-Control: {$ref: '#/components/headers/EntitlementLeaseCacheControl'}
            ETag:
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationReactivationCredential'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
    get:
      tags: [Operator Platform]
      operationId: listInstallationReactivationCredentials
      summary: List redacted reactivation credential lifecycle facts for one installation
      description: |
        Returns owner, installation, status and expiry metadata only. Activation codes,
        secret hashes, derivation key IDs and private keys are never returned.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/InstallationReactivationCredentialStatus'}
      responses:
        '200':
          description: Redacted reactivation credential metadata page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationReactivationCredentialMetadataPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /operator/v1/installation-reactivation-credentials/{credential_id}:
    get:
      tags: [Operator Platform]
      operationId: getInstallationReactivationCredential
      summary: Read one redacted reactivation credential lifecycle fact
      description: Activation codes, secret hashes, derivation key IDs and private keys are never returned.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      parameters:
        - name: credential_id
