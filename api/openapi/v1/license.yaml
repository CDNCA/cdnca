          headers:
            ETag: {$ref: '#/components/headers/InstallationReactivationCredentialRevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationReactivationCredentialMetadata'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /operator/v1/installation-reactivation-credentials/{credential_id}/revoke:
    post:
      tags: [Operator Platform]
      operationId: revokeInstallationReactivationCredential
      summary: Revoke one unused reactivation credential
      description: |
        Requires licensing.licenses.manage and a five-minute Operator step-up. The
        operation is append-only, revision-guarded and idempotent; revocation races
        with installation consumption so only one mutation can succeed.
      security:
        - OperatorSession: []
      x-required-permissions: [licensing.licenses.manage]
      x-requires-recent-reauthentication: true
      parameters:
        - name: credential_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/OperatorOrigin'
        - $ref: '#/components/parameters/OperatorIdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeInstallationReactivationCredentialRequest'}
      responses:
        '200':
          description: Revoked metadata or the original exact idempotent replay
          headers:
            ETag: {$ref: '#/components/headers/InstallationReactivationCredentialRevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationReactivationCredentialMetadata'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /operator/v1/installations/{installation_id}/leases:
    get:
      tags: [Operator Licenses]
