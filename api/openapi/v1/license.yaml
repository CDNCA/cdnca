      minLength: 3
      maxLength: 128
      pattern: '^[a-z0-9]+(?:[.-][a-z0-9]+)+$'
    PluginSemanticVersion:
      type: string
      minLength: 5
      maxLength: 128
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
    PluginPublisherKey:
      type: object
      additionalProperties: false
      required: [version, key_id, algorithm, public_key, fingerprint, created_at]
      properties:
        version: {type: integer, format: int64, minimum: 1}
        key_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        algorithm: {type: string, const: Ed25519}
        public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        fingerprint: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        created_at: {type: string, format: date-time}
    PluginPublisher:
      type: object
      additionalProperties: false
      required: [id, slug, display_name_zh_cn, display_name_en_us, status, revision, current_key, created_at, updated_at]
      oneOf:
        - type: object
          properties:
            status: {const: active}
          not:
            anyOf:
              - required: [disabled_at]
              - required: [disable_reason]
        - type: object
          properties:
            status: {const: disabled}
          required: [disabled_at, disable_reason]
      properties:
        id: {$ref: '#/components/schemas/CanonicalUUID'}
        slug: {$ref: '#/components/schemas/PluginPublisherSlug'}
        display_name_zh_cn: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000](?:[\s\S]*[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000])?(?![\s\S])'}
        display_name_en_us: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000](?:[\s\S]*[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000])?(?![\s\S])'}
        status: {type: string, enum: [active, disabled]}
        revision: {type: integer, format: int64, minimum: 1}
        current_key: {$ref: '#/components/schemas/PluginPublisherKey'}
        disabled_at: {type: string, format: date-time}
        disable_reason: {type: string, minLength: 1, maxLength: 500, pattern: '^[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000](?:[\s\S]*[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000])?(?![\s\S])'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PluginPublisherPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PluginPublisher'}}
