openapi: 3.1.0
info:
  title: CDNCA Rebuild Account Registration API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Sessionless account registration source contract. The route may only be
    mounted when the control plane has a durable, idempotent server-side
    authority that proves both a human challenge and ownership of the selected
    email or phone destination. Proof is resolved from trusted server context;
    client booleans and request-body proof fields are never accepted. Duplicate
    identities receive the same 202 representation as newly created accounts.
servers:
  - url: /
security: []
tags:
  - name: Account registration
    description: Enumeration-resistant tenant owner registration.
paths:
  /v1/auth/register:
    post:
      tags: [Account registration]
      operationId: registerAccount
      security: []
      summary: Register a tenant owner account
      description: >-
        Requires exact application/json, one Idempotency-Key, and one trusted
        X-Request-ID. JSON is size bounded and rejects duplicate keys, unknown
        fields, media-type parameters, trailing values, and query parameters.
        The configured current terms version must be accepted. A 202 response
        never reports whether username, email, or phone already existed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountRegistrationRequest'}
      responses:
        '202':
          description: Uniform registration acceptance or exact idempotent replay.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountRegistrationResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable key for the normalized registration and server-verified proof.
        Reusing it with a different payload or proof evidence returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    RequestID:
      name: X-Request-ID
      in: header
      required: true
      description: Trusted request identifier for receipt and audit correlation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
  headers:
    RequestID:
      description: Trusted request identifier used for support and audit correlation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RetryAfter:
      description: Bounded seconds until the registration rate window may permit another attempt.
      schema:
        type: string
        pattern: '^[0-9]+$'
  responses:
    ErrorResponse:
      description: Stable error without raw service messages or sensitive input.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Rate limit response without identifying the limiting dimension.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    AccountRegistrationRequest:
      type: object
      additionalProperties: false
      required: [username, password, display_name, email, phone, terms_accepted, terms_version, verification_channel]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 1024
          pattern: '^[!-~]{8,1024}$'
          description: 8 to 1024 printable ASCII characters (no space) with at least two of upper case, lower case, digits and symbols (libs/passwordpolicy); otherwise password_policy_unmet.
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        phone:
          type: string
          minLength: 6
          maxLength: 21
          pattern: '^\+?[0-9]{6,20}$'
        terms_accepted:
          type: boolean
          const: true
        terms_version:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
        verification_channel:
          type: string
          enum: [email, sms]
    AccountRegistrationResponse:
      type: object
      additionalProperties: false
      required: [accepted, replayed]
      properties:
        accepted:
          type: boolean
          const: true
        replayed:
          type: boolean
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code:
              type: string
              enum:
                - account_registration_invalid_input
                - password_policy_unmet
                - account_registration_terms_required
                - account_registration_rate_limited
                - account_registration_idempotency_conflict
                - account_registration_unavailable
            details:
              type: object
              additionalProperties: false
              required: [unmet]
              description: Present with password_policy_unmet only.
              properties:
                unmet:
                  type: array
                  minItems: 1
                  items: {type: string, enum: [length, character_classes, invalid_character]}
            request_id:
              type: string
              minLength: 1
              maxLength: 128
