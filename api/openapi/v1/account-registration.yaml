openapi: 3.1.0
info:
  title: CDNCA Rebuild Account Registration API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Sessionless account registration source contract. The route may only be
    mounted when the control plane has a durable, idempotent server-side
    authority that proves both a human challenge and ownership of the selected
    email or phone destination. Proof is resolved from trusted server context;
    client booleans and request-body proof fields are never accepted. Duplicate
    identities receive the same 202 representation as newly created accounts.
servers:
  - url: /
security: []
tags:
  - name: Account registration
    description: Enumeration-resistant tenant owner registration.
paths:
  /v1/auth/register:
    post:
      tags: [Account registration]
      operationId: registerAccount
      x-summary-zh: "注册租户所有者账号"
      security: []
      summary: Register a tenant owner account
      description: >-
        Requires exact application/json, one Idempotency-Key, and one trusted
        X-Request-ID. JSON is size bounded and rejects duplicate keys, unknown
        fields, media-type parameters, trailing values, and query parameters.
        The configured current terms version must be accepted. A 202 response
        never reports whether username, email, or phone already existed.
        Two flows share this path. With the registration verification runtime
        (Turnstile plus a contact code) the proof comes from the registration
        proof cookie of each challenge verification_challenge_ids names. Without it (fresh-install default, login-methods
        registration_mode builtin) the body carries the built-in image CAPTCHA
        from POST /v1/auth/login-captchas; it is spent once whether or not it
        matches, and an exact retry of a completed registration replays without
        a new CAPTCHA. Built-in registration is refused while the platform
        requires a verified email or phone.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountRegistrationRequest'}
      responses:
        '202':
          description: Uniform registration acceptance or exact idempotent replay.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountRegistrationResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable key for the normalized registration and server-verified proof.
        Reusing it with a different payload or proof evidence returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    RequestID:
      name: X-Request-ID
      in: header
      required: true
      description: Trusted request identifier for receipt and audit correlation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
  headers:
    RequestID:
      description: Trusted request identifier used for support and audit correlation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RetryAfter:
      description: Bounded seconds until the registration rate window may permit another attempt.
      schema:
        type: string
        pattern: '^[0-9]+$'
  responses:
    ErrorResponse:
      description: Stable error without raw service messages or sensitive input.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Rate limit response without identifying the limiting dimension.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    AccountRegistrationRequest:
      type: object
      additionalProperties: false
      required: [username, password, display_name, email, phone, verification_channel]
      properties:
        username:
          type: string
          maxLength: 128
          pattern: '^(?:|[A-Za-z0-9][A-Za-z0-9._-]{2,127})$'
          description: >-
            Empty only while registration-config username_required is false: the controller then generates one
            and returns it in the 202 response.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 1024
          pattern: '^[!-~]{8,1024}$'
          description: 8 to 1024 printable ASCII characters (no space) with at least two of upper case, lower case, digits and symbols (libs/passwordpolicy); otherwise password_policy_unmet.
        display_name:
          type: string
          maxLength: 128
          description: 1 to 128 characters; may be empty with a generated username, which it then defaults to.
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        phone:
          type: string
          minLength: 6
          maxLength: 21
          pattern: '^\+?[0-9]{6,20}$'
        qq:
          type: string
          pattern: '^(?:|[1-9][0-9]{4,11})$'
          description: >-
            QQ number, 5 to 12 digits without a leading zero; required while registration-config qq_required is true.
            Stored as the user's QQ (user management).
        terms_accepted:
          type: boolean
          description: >-
            Required (true) while registration-config terms_required is true; otherwise not read and no acceptance
            is recorded.
        terms_version:
          type: string
          description: >-
            While registration-config terms_required is true, must be the current registration-config
            terms_version; an older one (the terms were edited since the page loaded) or no acceptance is refused
            with account_registration_terms_required. Not read while terms_required is false.
          maxLength: 128
          pattern: '^(?:|[A-Za-z0-9][A-Za-z0-9._-]{0,127})$'
        verification_channel:
          type: string
          enum: [email, sms]
        verification_challenge_ids:
          type: object
          additionalProperties: false
          description: >-
            The verified challenge (challenge_id of POST /v1/auth/registration-challenges) of each channel whose
            code was checked: only its proof cookie is spent, so several sign-up tabs of one browser do not use
            each other's proof. A channel not named uses its only proof cookie, none when the browser holds several.
          properties:
            email: {type: string, format: uuid}
            sms: {type: string, format: uuid}
        captcha:
          type: object
          additionalProperties: false
          required: [id, answer]
          description: >-
            Built-in image CAPTCHA (POST /v1/auth/login-captchas). Required when
            login-methods registration_mode is builtin; not accepted otherwise.
          properties:
            id: {type: string, format: uuid}
            answer: {type: string, pattern: '^[A-Za-z0-9]{1,8}$'}
    AccountRegistrationResponse:
      type: object
      additionalProperties: false
      required: [accepted, replayed]
      properties:
        accepted:
          type: boolean
          const: true
        replayed:
          type: boolean
        username:
          type: string
          description: The generated username, only when the request left it empty.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code:
              type: string
              enum:
                - account_registration_invalid_input
                - password_policy_unmet
                - account_registration_terms_required
                - account_registration_rate_limited
                - account_registration_idempotency_conflict
                - account_registration_unavailable
                - account_registration_captcha_invalid
                - account_registration_disabled
                - account_registration_verification_unavailable
            message:
              type: string
              description: Fixed English text of the built-in flow; never raw input.
            details:
              type: object
              additionalProperties: false
              required: [unmet]
              description: Present with password_policy_unmet only.
              properties:
                unmet:
                  type: array
                  minItems: 1
                  items: {type: string, enum: [length, character_classes, invalid_character]}
            request_id:
              type: string
              minLength: 1
              maxLength: 128
