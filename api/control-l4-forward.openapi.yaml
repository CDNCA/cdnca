              minimum: 1
              description: Must exactly equal the quoted If-Match revision.
            group_ids:
              type: array
              maxItems: 64
              uniqueItems: true
              items: {type: string, format: uuid}
              description: Omitted keeps current membership; an empty array clears it.
    StreamOwner:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
    StreamBalanceWay:
      type: string
      enum: [rr, ip_hash]
      description: Origin connection balancing strategy; this is independent of the selected node line group.
    StreamGroupReference:
      type: object
