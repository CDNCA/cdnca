        scope_id: {type: string, format: uuid}
        owner:
          oneOf:
            - $ref: '#/components/schemas/StreamOwner'
            - {type: 'null'}
        name: {type: string, minLength: 1, maxLength: 128}
        remark: {type: string, maxLength: 256}
        stream_count: {type: integer, format: int64, minimum: 0, readOnly: true}
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    StreamGroupFields:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        remark: {type: string, maxLength: 256}
    CreateStreamGroupRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/StreamGroupFields'
        - type: object
          properties:
            target_scope_id:
              type: string
              format: uuid
              description: Required for platform principals; tenant principals may omit it or use their current scope.
            owner_id:
              type: string
              format: uuid
              description: Required for platform principals; tenant principals may omit it or use their current user.
    UpdateStreamGroupRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/StreamGroupFields'
        - type: object
          required: [expected_revision]
          properties:
            expected_revision:
              type: integer
              format: int64
              minimum: 1
              description: Must exactly equal the quoted If-Match revision.
    StreamGroupListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/StreamGroup'}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1, maximum: 1000000}
        limit: {type: integer, minimum: 1, maximum: 100}
    StreamUserConfig:
      type: object
      additionalProperties: false
      required: [id, display_id, scope_id, owner, setting_name, setting_value, scope_name, group, created_at]
      properties:
        id: {type: string, format: uuid}
        display_id: {type: string, pattern: '^[1-9][0-9]{0,18}$', readOnly: true}
        scope_id: {type: string, format: uuid}
        owner:
          oneOf:
            - $ref: '#/components/schemas/StreamOwner'
            - {type: 'null'}
        setting_name:
          type: string
          enum: [proxy_protocol, listen_protocol, balance_way]
        setting_value: {type: string}
        scope_name:
          type: string
          enum: [global, group]
        group:
          oneOf:
            - $ref: '#/components/schemas/StreamGroupReference'
            - {type: 'null'}
        created_at: {type: string, format: date-time}
    CreateStreamUserConfigRequest:
      type: object
      additionalProperties: false
      required: [setting_name, setting_value, scope_name]
      properties:
        target_scope_id:
          type: string
          format: uuid
          description: Required for platform principals; tenant principals may omit it or use their current scope.
        owner_id:
          type: string
          format: uuid
          description: Required for platform principals; tenant principals may omit it or use their current user.
        setting_name:
          type: string
          enum: [proxy_protocol, listen_protocol, balance_way]
        setting_value: {type: string}
        scope_name:
          type: string
          enum: [global, group]
        group_id:
          type: string
          format: uuid
          description: Required exactly when scope_name is group, and must exist in the same scope.
    StreamUserConfigListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/StreamUserConfig'}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1, maximum: 1000000}
        limit: {type: integer, minimum: 1, maximum: 100}
    StreamEffectiveDefaults:
      type: object
      additionalProperties: false
      required: [protocol, proxy_protocol_inbound, balance_way]
      description: null means no default is set for the item.
      properties:
        protocol: {type: [string, 'null'], enum: [tcp, udp, null]}
        proxy_protocol_inbound: {type: [boolean, 'null']}
        balance_way: {type: [string, 'null'], enum: [rr, ip_hash, null]}
    StreamRuntimeListenerV2:
      type: object
      additionalProperties: false
      required: [protocol, address, port]
      properties:
        protocol: {$ref: '#/components/schemas/StreamProtocol'}
        address: {type: string, const: '*'}
        port: {type: integer, minimum: 1, maximum: 65535}
        port_end:
          type: integer
          minimum: 2
          maximum: 65535
          description: Present only for a port range port..port_end. Requires TCP/UDP capability API version 9.
    StreamAdditionalListener:
      type: object
      additionalProperties: false
      required: [id, protocol, address, port]
      properties:
        id: {type: string, format: uuid, not: {const: '00000000-0000-0000-0000-000000000000'}}
        protocol: {$ref: '#/components/schemas/StreamProtocol'}
        address: {type: string, const: '*'}
        port: {type: integer, minimum: 1, maximum: 65535}
        port_end:
          type: integer
          minimum: 2
          maximum: 65535
          description: Present for a port range port..port_end (at most 1000 ports), as listen_port_end. Requires TCP/UDP capability API version 9.
    StreamRuntimeEndpointV2:
      type: object
      additionalProperties: false
      required: [port]
      oneOf:
        - required: [address]
          properties:
            address:
              type: string
              oneOf:
                - {format: ipv4}
                - {format: ipv6}
        - required: [host]
          properties:
            host: {type: string, minLength: 1, maxLength: 253}
      properties:
        address:
          type: string
          oneOf:
            - {format: ipv4}
            - {format: ipv6}
        host: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        follow_port:
          const: true
          description: Present only for follow-port origins; port then equals listener.port and the node connects on the client's port. Requires TCP/UDP capability API version 9.
        origins:
          type: array
          minItems: 2
          maxItems: 64
          description: Present only for several origins (address is the first). Requires TCP/UDP capability API version 11.
          items:
            type: object
            additionalProperties: false
            required: [address, weight]
            properties:
              address: {type: string, oneOf: [{format: ipv4}, {format: ipv6}]}
              weight: {type: integer, minimum: 1, maximum: 100}
              down: {const: true}
        balance:
          const: ip_hash
          description: Present only for 定源 (balance_way ip_hash); otherwise weighted round robin. Requires TCP/UDP capability API version 11.
    StreamRuntimeGeoPolicyV2:
      type: object
      additionalProperties: false
      required: [enabled, tenant_id, stream_id, revision, unknown_region_action, trusted_proxy_cidrs, blocked_regions, region_cidrs]
      properties:
        enabled: {type: boolean}
        tenant_id: {type: string, format: uuid}
        stream_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        unknown_region_action: {type: string, enum: [allow, block]}
        trusted_proxy_cidrs:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string}
        blocked_regions:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$'}
        region_cidrs:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/StreamGeoRegionCIDRs'}
      description: tenant_id, stream_id, and revision exactly match the enclosing v2 runtime target.
    StreamRuntimeSpecV2:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, stream_id, revision, listener, endpoint, dns, geo, connect_timeout_ms, response_timeout_ms, max_connections_per_client, drain_timeout_ms, proxy_protocol_inbound, proxy_protocol_outbound]
      properties:
        schema_version: {type: string, const: 'cdnca.edge.l4/v2'}
        tenant_id: {type: string, format: uuid}
        stream_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        listener: {$ref: '#/components/schemas/StreamRuntimeListenerV2'}
        additional_listeners:
          type: array
          minItems: 1
          maxItems: 63
          items: {$ref: '#/components/schemas/StreamAdditionalListener'}
          description: Omitted when empty. Canonically sorted by stable listener UUID; the primary listener identity remains stream_id. Requires TCP/UDP capability API version 3 for all protocols in the scope's current and bounded historical listener lifecycle.
        endpoint: {$ref: '#/components/schemas/StreamRuntimeEndpointV2'}
        dns: {$ref: '#/components/schemas/StreamDNSPolicyState'}
        geo: {$ref: '#/components/schemas/StreamRuntimeGeoPolicyV2'}
        connect_timeout_ms: {type: integer, minimum: 50, maximum: 30000}
        response_timeout_ms: {type: integer, minimum: 100, maximum: 600000}
        max_connections_per_client: {type: integer, minimum: 1, maximum: 10000}
        drain_timeout_ms: {type: integer, minimum: 1000, maximum: 600000}
        proxy_protocol_inbound: {type: boolean}
        proxy_protocol_outbound: {type: boolean}
        tls_passthrough:
          type: boolean
          const: true
          description: Present only for TLS passthrough streams, together with server_names. Requires TCP capability API version 4, as does any v2 socket that shares a port with a website or another stream.
        server_names:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: {$ref: '#/components/schemas/StreamServerName'}
        new_conn_rate:
          type: object
          additionalProperties: false
          required: [rate_per_second, burst, ban_seconds]
          properties:
            rate_per_second: {type: integer, minimum: 1, maximum: 100000}
            burst: {type: integer, minimum: 0, maximum: 100000}
            ban_seconds: {type: integer, minimum: 0, maximum: 86400}
          description: Present only for streams with a per-client new connection rate. Requires TCP/UDP capability API version 6.
        toa:
          const: true
          description: Present only for TOA streams (TCP, no PROXY protocol). Requires capability L4_TOA v1.
        session_log:
          const: true
          description: Present only for streams with a session log. Requires TCP/UDP capability API version 7.
        guard_rules:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/StreamGuardRule'}
          description: Present only for streams with guard rules (the ACL's rules first, then the stream's own). Requires TCP/UDP capability API version 10 (and IP_INTEL v2 for geo conditions).
        listen_ipv6:
          const: true
          description: Present only for IPv6开启. Requires TCP/UDP capability API version 11.
      dependentRequired:
        tls_passthrough: [server_names]
        server_names: [tls_passthrough]
      description: >-
        Immutable target identity (no site_id since migration 506; every v2
        stream requires TCP/UDP capability API version 12). tenant_id, stream_id, and revision
        identify the exact configuration compiled for publication; callers must
        not substitute a list index or the stream's current revision.
    StreamRuntimeSpec:
      oneOf:
        - $ref: '#/components/schemas/StreamRuntimeSpecV2'
    StreamPublishIntent:
      type: object
      additionalProperties: false
      required: [id, version, operation, desired_state, resource_revision, configuration_source_revision, runtime_spec, state, automatic_request_id, publication_id, rollout_id, created_at]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 1}
        operation: {type: string, enum: [create, update, delete]}
        desired_state: {type: string, enum: [enabled, disabled, deleted]}
        resource_revision: {type: integer, format: int64, minimum: 1}
        configuration_source_revision: {type: integer, format: int64, minimum: 1}
        runtime_spec: {$ref: '#/components/schemas/StreamRuntimeSpec'}
        state: {type: string, enum: [unknown, pending, leased, retrying, reconciling, succeeded, failed, superseded]}
        automatic_request_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: 'null'}
        publication_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: 'null'}
        rollout_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
      description: >-
        id, version, resource_revision, configuration_source_revision, and
        runtime_spec identify the immutable intent. publication_id, rollout_id,
        and state are the exact durable publication result projection; null or
        unknown never implies edge activation.
    Stream:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/StreamAttributes'
        - type: object
          required:
            - id
            - display_id
            - scope_id
            - package_subscription_id
            - eligibility_state
            - owner
            - name
            - remark
            - protocol
            - listen_address
            - listen_port
            - upstream_address
            - upstream_host
            - upstream_port
            - dns_policy
            - geo_policy
            - connect_timeout_ms
            - response_timeout_ms
            - max_connections_per_client
            - proxy_protocol_inbound
            - proxy_protocol_v1
            - tls_passthrough
            - server_names
            - max_new_connections_per_client_per_second
            - new_connection_burst
            - new_connection_ban_seconds
            - toa
            - session_log_enabled
            - guard_rules
            - origins
            - listen_ipv6
            - acl
            - admin_status
            - overrides
            - line
            - sync_state
            - enabled
            - revision
            - publish_intent
            - created_at
            - updated_at
          properties:
            id: {type: string, format: uuid}
            display_id: {type: string, pattern: '^[1-9][0-9]{0,18}$', readOnly: true}
            scope_id: {type: string, format: uuid}
            package_name:
              type: [string, 'null']
              readOnly: true
              description: Purchased package snapshot name for this stream scope. List and detail reads resolve the persisted subscription; write and legacy replay responses may omit it or return null.
            package_expires_at:
              type: [string, 'null']
              format: date-time
              readOnly: true
              description: Purchased subscription ends_at for this stream scope, not its usage cycle end. List and detail reads resolve the persisted subscription; write and legacy replay responses may omit it or return null.
            cname:
              type: [string, 'null']
              readOnly: true
              description: Current CNAME hostname. With the stream's own CNAME domain or mode (overrides) it is the stream's own hostname (migration 505) once written to DNS; otherwise 按套餐 (effective cname_mode package) projects the package's allocation, and 按转发 without an override has none (null).
            cname_domain:
              type: [string, 'null']
              readOnly: true
              description: Effective CNAME domain, the stream's own (overrides.cname_domain), then its own allocation's zone, then its package's.
            cname_hostname:
              type: [string, 'null']
              readOnly: true
              description: Explicit CNAME hostname; not projected for streams (null).
            cname_state:
              type: [string, 'null']
              enum: [pending, failed, done, null]
              readOnly: true
              description: CNAME state (生成中 / 失败可重试 / 已生成) of the stream's own CNAME when it has an override, else of the package's allocation (按套餐 only).
            cname_failure_code:
              type: [string, 'null']
              readOnly: true
              description: Why the stream's own CNAME failed (cname_state failed), e.g. cname_zone_not_configured, dns_propagation_unconfirmed.
            geo_policy: {$ref: '#/components/schemas/StreamGeoPolicyState'}
            eligibility_state: {type: string, enum: [eligible, ineligible]}
            admin_status: {$ref: '#/components/schemas/StreamAdminStatus'}
            overrides: {$ref: '#/components/schemas/StreamOverrides'}
            line: {$ref: '#/components/schemas/StreamLine'}
            sync_state:
              type: string
              enum: [done, pending, failed]
              readOnly: true
              description: 同步状态. From the latest intent's automatic publication, whose outcome is every target node's deployment receipt (done = all healthy); pending until then. Never written by clients.
            owner:
              oneOf:
                - $ref: '#/components/schemas/StreamOwner'
                - {type: 'null'}
            revision: {type: integer, format: int64, minimum: 1}
            publish_intent: {$ref: '#/components/schemas/StreamPublishIntent'}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    StreamListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Stream'}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1, maximum: 1000000}
        limit: {type: integer, minimum: 1, maximum: 100}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [invalid_session, permission_denied, validation_error, invalid_request, unsupported_media_type, stream_not_found, stream_port_conflict, stream_shared_port_proxy_protocol, stream_name_conflict, stream_group_not_found, stream_group_name_conflict, stream_group_in_use, stream_default_not_found, version_conflict, idempotency_conflict, internal_error]
            message: {type: string}
            request_id: {type: string, minLength: 1, maxLength: 128}
            details:
              type: object
              additionalProperties: false
              required: [protocol, port, with]
              description: Only on stream_port_conflict when the collision is located. with is reserved (node ports 80/443/18080/18443), self (another listener of this stream), stream or site; name is the other stream or website when it is in the caller's scope.
              properties:
                protocol: {$ref: '#/components/schemas/StreamProtocol'}
                port: {type: integer, minimum: 1, maximum: 65535}
                port_end: {type: integer, minimum: 2, maximum: 65535}
                with: {type: string, enum: [reserved, self, stream, site]}
                name: {type: string}
  responses:
    BadRequest:
      description: Stable invalid request or validation error.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: The authenticated principal lacks the required permission or owner scope.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: No visible stream matches the exact immutable stream identity.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: Revision, idempotency, name, or listener-port conflict.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    UnsupportedMediaType:
      description: Exactly one Content-Type field parsing as application/json is required.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    InternalError:
      description: Internal operation failure without publication or activation claims.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
