openapi: 3.1.0
info:
  title: CDNCA Firewall Action Policy API
  version: 1.0.0
  description: Site-scoped immutable firewall actions with durable candidate, active, and last-known-good revisions. A site without its own policy inherits the tenant default, else the system default (not delivered).
servers: [{url: /}]
security: [{bearerAuth: []}]
paths:
  /v1/firewall-actions/policy:
    get:
      operationId: getFirewallActionPolicy
      x-summary-zh: "读取网站实际生效的防火墙动作策略"
      summary: Read the site's effective firewall action policy
      description: A site without its own policy answers 200 with inherited=true and the tenant default (source tenant_default) or the undelivered system default (source system_default); 404 means the site is absent or outside the actor scope.
      x-required-permissions: [firewall.read]
      parameters: [{$ref: '#/components/parameters/TargetScopeID'}, {$ref: '#/components/parameters/SiteID'}]
      responses:
        '200':
          description: Desired, active, and LKG state
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: putFirewallActionPolicy
      x-summary-zh: "为网站单独设置一份不可变的防火墙动作策略候选"
      summary: Override the site with its own immutable firewall action policy candidate
      description: If-Match is the site's revision from GET (0 for a site that never had its own policy). A pending candidate is replaced.
      x-required-permissions: [firewall.manage]
      parameters:
        - {$ref: '#/components/parameters/TargetScopeID'}
        - {$ref: '#/components/parameters/SiteID'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PolicyInput'}}}
      responses:
        '200':
          description: Immutable candidate accepted for publication
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    patch:
      operationId: setFirewallActionPolicyEnabled
      x-summary-zh: "启用或停用网站的防火墙动作策略"
      summary: Enable or disable the site's firewall action policy
      description: Switches the site's own policy on or off without a new revision (If-Match is the current revision, the ETag stays). A disabled policy keeps its revisions and last-known-good document but is not delivered to the nodes; enabling delivers the current revision again. Only a revision mismatch is a 409; 404 while the site inherits the tenant default (it has no policy of its own to switch).
      x-required-permissions: [firewall.manage]
      parameters:
        - {$ref: '#/components/parameters/TargetScopeID'}
        - {$ref: '#/components/parameters/SiteID'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [enabled], properties: {enabled: {type: boolean}}}
      responses:
        '200':
          description: Policy switched
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: inheritFirewallActionPolicy
      x-summary-zh: "删除网站自己的策略，重新继承租户默认"
      summary: Drop the site's own policy and inherit the tenant default again
      description: Records the next revision as an inherited marker (revisions are never deleted). 404 when the site has no policy of its own.
      x-required-permissions: [firewall.manage]
      parameters:
        - {$ref: '#/components/parameters/TargetScopeID'}
        - {$ref: '#/components/parameters/SiteID'}
        - {$ref: '#/components/parameters/IfMatchExisting'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      responses:
        '200':
          description: Site inherits again; the inherited view
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/firewall-actions/default:
    get:
      operationId: getFirewallActionTenantDefault
      x-summary-zh: "读取租户默认防火墙动作"
      summary: Read the tenant default firewall action
      description: source system_default with revision 0 when the tenant never saved one.
      x-required-permissions: [firewall.read]
      parameters: [{$ref: '#/components/parameters/TargetScopeID'}]
      responses:
        '200':
          description: Tenant default
          headers: {ETag: {$ref: '#/components/headers/DefaultETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DefaultPolicy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: putFirewallActionTenantDefault
      x-summary-zh: "保存租户默认防火墙动作"
      summary: Save the tenant default firewall action
      description: Validated as a site policy. Only inheriting sites change; without any the scope is not republished.
      x-required-permissions: [firewall.manage]
      parameters:
        - {$ref: '#/components/parameters/TargetScopeID'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PolicyInput'}}}
      responses:
        '200':
          description: Tenant default saved
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DefaultPolicy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/firewall-actions/policy/recover:
    post:
      operationId: recoverFirewallActionLKG
      x-summary-zh: "从最近一次正常的策略生成单调递增的恢复候选"
      summary: Create a monotonic recovery candidate from the last-known-good policy
      description: Creates a new monotonic candidate from the durable last-known-good document; it never rewinds revisions.
      x-required-permissions: [firewall.manage]
      parameters:
        - {$ref: '#/components/parameters/TargetScopeID'}
        - {$ref: '#/components/parameters/SiteID'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        '200':
          description: LKG recovery candidate accepted
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    TargetScopeID: {name: target_scope_id, in: query, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    SiteID: {name: site_id, in: query, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[0-9]+"$'}}
    IfMatchExisting: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$', minLength: 1, maxLength: 128}}
    RequestID: {name: X-Request-ID, in: header, required: true, schema: {$ref: '#/components/schemas/UUID'}}
  headers:
    ETag: {description: Quoted desired revision, schema: {type: string, pattern: '^"[0-9]+"$'}}
    DefaultETag: {description: Quoted tenant default revision (0 never saved), schema: {type: string, pattern: '^"[0-9]+"$'}}
  responses:
    BadRequest: {description: Invalid policy or request metadata, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Policy absent or outside actor scope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: 'Revision, idempotency, or LKG conflict', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    UUID: {type: string, format: uuid}
    Error:
      type: object
      additionalProperties: false
      required: [code, request_id]
      properties: {code: {type: string}, request_id: {type: string, description: 'Same value as the X-Request-ID response header.'}}
    ReturnPage:
      type: object
      additionalProperties: false
      required: [status, content_type, body]
      properties:
        status: {type: integer, minimum: 400, maximum: 599}
        content_type: {type: string, enum: ['text/html; charset=utf-8', 'text/plain; charset=utf-8']}
        body: {type: string, minLength: 1, maxLength: 16384}
    TrustedCrawler:
      type: object
      additionalProperties: false
      required: [name, networks, user_agent_prefixes]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        networks: {type: array, minItems: 1, maxItems: 256, uniqueItems: true, items: {type: string}}
        user_agent_prefixes: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string, maxLength: 128}}
    PolicyInput:
      type: object
      additionalProperties: false
      required: [normal_action, escalated_action, engage_threshold, recover_threshold, recovery_windows, block_networks, trusted_proxies, trusted_crawlers, return_page]
      properties:
        normal_action: {type: string, enum: [disconnect, return_page]}
        escalated_action: {type: string, enum: [nftables]}
        engage_threshold: {type: integer, minimum: 1}
        recover_threshold: {type: integer, minimum: 0}
        recovery_windows: {type: integer, minimum: 1, maximum: 60}
        block_networks: {type: array, minItems: 1, maxItems: 4092, uniqueItems: true, items: {type: string}}
        trusted_proxies: {type: array, maxItems: 256, uniqueItems: true, items: {type: string}}
        trusted_crawlers: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/TrustedCrawler'}}
        return_page: {$ref: '#/components/schemas/ReturnPage'}
    Policy:
      allOf:
        - {$ref: '#/components/schemas/PolicyInput'}
        - type: object
          additionalProperties: false
          required: [id, tenant_scope_id, site_id, revision, active_revision, lkg_revision, deployment_state, enabled, host_escalation, document_sha256, created_at, updated_at, inherited, source, delivered]
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            tenant_scope_id: {$ref: '#/components/schemas/UUID'}
            site_id: {$ref: '#/components/schemas/UUID'}
            revision: {type: integer, minimum: 0, description: "The site's own revision counter, the If-Match of its next PUT (0: never had its own policy)."}
            active_revision: {type: integer, minimum: 0}
            lkg_revision: {type: integer, minimum: 0}
            deployment_state: {type: string, enum: [pending, active, failed, inherited]}
            inherited: {type: boolean, description: No policy of the site's own; the fields are the effective tenant or system default.}
            source: {type: string, enum: [site, tenant_default, system_default]}
            delivered: {type: boolean, description: Whether nodes receive the policy; false only for the system default.}
            enabled: {type: boolean, description: 'false - the site''s own policy is disabled, not delivered to the nodes (revisions and LKG kept); always true while inherited'}
            host_escalation:
              type: string
              enum: [owned, shared_unsupported]
              description: Where the nftables escalation runs. owned - the scope owns an active node, the escalation applies there; shared_unsupported - the scope has only shared platform nodes, which never take tenant host rules, so only the OpenResty normal action applies (use site access control).
            document_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            created_at: {type: [string, 'null'], format: date-time, description: Null for the system default.}
            updated_at: {type: [string, 'null'], format: date-time, description: Null for the system default.}
    DefaultPolicy:
      allOf:
        - {$ref: '#/components/schemas/PolicyInput'}
        - type: object
          additionalProperties: false
          required: [tenant_scope_id, source, revision, inheriting_site_count, updated_at]
          properties:
            tenant_scope_id: {$ref: '#/components/schemas/UUID'}
            source: {type: string, enum: [tenant_default, system_default]}
            revision: {type: integer, minimum: 0, description: 0 when never saved (the system default).}
            inheriting_site_count: {type: integer, minimum: 0, description: Live sites without a policy of their own.}
            updated_at: {type: [string, 'null'], format: date-time}
