      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
  responses:
    AdminDashboardOK:
      description: Version 2 platform dashboard snapshot.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminDashboard'}
    TenantDashboardOK:
      description: Version 2 dashboard snapshot for the authenticated tenant only.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TenantDashboard'}
