openapi: 3.1.0
info:
  title: Smart Auto Defense API (module.autodefense)
  version: 1.0.0
  description: >-
    ADR 0010 sections 7.4, 7A, 9.1, 9.3 and 9.4 (AD-11). Tenant routes live under /v1/security/autodefense and act on
    the session tenant; the same routes under /v1/admin/security/autodefense need platform.admin and a
    tenant_scope_id query parameter (optional on the list reads: without it they read every tenant). Reads need security_policies.read, writes security_policies.manage (the adaptive WAF
    routes sites/{site_id}/waf-adapt waf_adapt.read / waf_adapt.manage). Every route
    needs the module.autodefense lease feature; starting protection, switching a module to auto and resuming automatic
    items need module.autodefense.auto. A refusal is 403 entitlement_feature_denied with error.capability.feature
    naming the missing feature. Locking an item (a person raising or lowering it) needs module.autodefense only and the
    item stays manual until a person resumes it (user decision Q3). Every write appends a security.autodefense.* audit
    event; item_manual and item_auto record the operator and time.
paths:
  /v1/security/autodefense/sites:
    get:
      operationId: listAutoDefenseSites
      summary: "Sites with mode, baseline maturity, circuit, overlay and the auto-mitigation grant"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/SiteList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites:
    get:
      operationId: adminListAutoDefenseSites
      summary: "Sites with mode, baseline maturity, circuit, overlay and the auto-mitigation grant"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TenantScopeFilter'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/SiteList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/mode:
    post:
      operationId: setAutoDefenseSiteModes
      summary: "Batch 开始学习 / 仅观察 / 开始防护 / 关闭 / 恢复跟随平台 (follow); protect needs module.autodefense.auto; one audit event per site"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      requestBody: {$ref: '#/components/requestBodies/ModeChange'}
      responses:
        '200': {$ref: '#/components/responses/ModeChanged'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/mode:
    post:
      operationId: adminSetAutoDefenseSiteModes
      summary: "Batch 开始学习 / 仅观察 / 开始防护 / 关闭 / 恢复跟随平台 (follow); protect needs module.autodefense.auto; one audit event per site"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/ModeChange'}
      responses:
        '200': {$ref: '#/components/responses/ModeChanged'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}:
    get:
      operationId: getAutoDefenseSite
      summary: "One site with its overlay"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}]
      responses:
        '200': {$ref: '#/components/responses/SiteDetail'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateAutoDefenseSite
      summary: "Sensitivity and cross-site federation (revision guarded)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}]
      requestBody: {$ref: '#/components/requestBodies/SiteSettings'}
      responses:
        '200': {$ref: '#/components/responses/Site'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}:
    get:
      operationId: adminGetAutoDefenseSite
      summary: "One site with its overlay"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      responses:
        '200': {$ref: '#/components/responses/SiteDetail'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: adminUpdateAutoDefenseSite
      summary: "Sensitivity and cross-site federation (revision guarded)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/SiteSettings'}
      responses:
        '200': {$ref: '#/components/responses/Site'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/release:
    post:
      operationId: releaseAutoDefenseSite
      summary: "一键解除: undo every automatic mitigation and hold the site in observe only (default 30 minutes)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}]
      requestBody: {$ref: '#/components/requestBodies/SiteRelease'}
      responses:
        '200': {$ref: '#/components/responses/ReleaseResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/release:
    post:
      operationId: adminReleaseAutoDefenseSite
      summary: "一键解除: undo every automatic mitigation and hold the site in observe only (default 30 minutes)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/SiteRelease'}
      responses:
        '200': {$ref: '#/components/responses/ReleaseResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/drifts/confirm:
    post:
      operationId: confirmAutoDefenseSiteDrifts
      summary: "确认基线漂移: confirm the site's pending baseline drifts (node baselines are not changed)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/DriftList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/drifts/confirm:
    post:
      operationId: adminConfirmAutoDefenseSiteDrifts
      summary: "确认基线漂移: confirm the site's pending baseline drifts (node baselines are not changed)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/DriftList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/circuit/resume:
    post:
      operationId: resumeAutoDefenseSiteCircuit
      summary: "恢复自动防护: close the site circuit the nodes reported open (Q6: a second break within 24 hours needs a person)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Site'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/circuit/resume:
    post:
      operationId: adminResumeAutoDefenseSiteCircuit
      summary: "恢复自动防护: close the site circuit the nodes reported open (Q6: a second break within 24 hours needs a person)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Site'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/allows:
    get:
      operationId: listAutoDefenseSiteAllows
      summary: "白名单: the site's allow list as the nodes get it (ACL allow rules = user, 解除并加白 = release, admin sign-in sources = admin_login); never mitigated"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}]
      responses:
        '200': {$ref: '#/components/responses/SiteAllowList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/allows/remove:
    post:
      operationId: removeAutoDefenseSiteAllow
      summary: "移出白名单: remove one 解除并加白 entry (ACL allows are edited in the ACL policy; admin sign-in sources expire)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}]
      requestBody: {$ref: '#/components/requestBodies/SiteAllowRemove'}
      responses:
        '200': {$ref: '#/components/responses/SiteAllow'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/allows:
    get:
      operationId: adminListAutoDefenseSiteAllows
      summary: "白名单: the site's allow list as the nodes get it (ACL allow rules = user, 解除并加白 = release, admin sign-in sources = admin_login); never mitigated"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      responses:
        '200': {$ref: '#/components/responses/SiteAllowList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/allows/remove:
    post:
      operationId: adminRemoveAutoDefenseSiteAllow
      summary: "移出白名单: remove one 解除并加白 entry (ACL allows are edited in the ACL policy; admin sign-in sources expire)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/SiteAllowRemove'}
      responses:
        '200': {$ref: '#/components/responses/SiteAllow'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/releases/status:
    get:
      operationId: getAutoDefenseReleaseStatus
      summary: "解除状态: per node delivery of the site's single release of one target (已保存 → 待节点 → 全部节点已生效 / 部分失败)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/ReleaseKind'}, {$ref: '#/components/parameters/ReleaseTarget'}]
      responses:
        '200': {$ref: '#/components/responses/ReleaseStatus'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/releases/retry:
    post:
      operationId: retryAutoDefenseRelease
      summary: "重试: every serving node applies and answers the release again (retry + 1, at most 100; audited release_retry)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}]
      requestBody: {$ref: '#/components/requestBodies/ReleaseRetry'}
      responses:
        '200': {$ref: '#/components/responses/ReleaseStatus'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/releases/status:
    get:
      operationId: adminGetAutoDefenseReleaseStatus
      summary: "解除状态: per node delivery of the site's single release of one target (已保存 → 待节点 → 全部节点已生效 / 部分失败)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}, {$ref: '#/components/parameters/ReleaseKind'}, {$ref: '#/components/parameters/ReleaseTarget'}]
      responses:
        '200': {$ref: '#/components/responses/ReleaseStatus'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/releases/retry:
    post:
      operationId: adminRetryAutoDefenseRelease
      summary: "重试: every serving node applies and answers the release again (retry + 1, at most 100; audited release_retry)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/ReleaseRetry'}
      responses:
        '200': {$ref: '#/components/responses/ReleaseStatus'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/modules:
    get:
      operationId: listAutoDefenseSiteModules
      summary: "Modules site (site.max_level), bot, cc, scan, waf with every item state 自动/人工"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}]
      responses:
        '200': {$ref: '#/components/responses/ModuleList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/modules:
    get:
      operationId: adminListAutoDefenseSiteModules
      summary: "Modules site (site.max_level), bot, cc, scan, waf with every item state 自动/人工"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.read]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/TenantScopeID'}]
      responses:
        '200': {$ref: '#/components/responses/ModuleList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/modules/{module}/mode:
    put:
      operationId: setAutoDefenseSiteModuleMode
      summary: "manual / auto / suggest; auto needs module.autodefense.auto"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/SiteModuleName'}]
      requestBody: {$ref: '#/components/requestBodies/ModuleMode'}
      responses:
        '200': {$ref: '#/components/responses/ModuleModeSet'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/modules/{module}/mode:
    put:
      operationId: adminSetAutoDefenseSiteModuleMode
      summary: "manual / auto / suggest; auto needs module.autodefense.auto"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/SiteModuleName'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/ModuleMode'}
      responses:
        '200': {$ref: '#/components/responses/ModuleModeSet'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/modules/{module}/resume:
    post:
      operationId: resumeAutoDefenseSiteModule
      summary: "全部恢复自动: every manual item of the module returns to automatic"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/SiteModuleName'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/ItemList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/modules/{module}/resume:
    post:
      operationId: adminResumeAutoDefenseSiteModule
      summary: "全部恢复自动: every manual item of the module returns to automatic"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/SiteModuleName'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/ItemList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/modules/{module}/items/{field}:
    put:
      operationId: lockAutoDefenseSiteItem
      summary: "A person sets the item: it becomes manual and runs on this value until resumed (Q3)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/SiteModuleName'}, {$ref: '#/components/parameters/Field'}]
      requestBody: {$ref: '#/components/requestBodies/ItemValue'}
      responses:
        '200': {$ref: '#/components/responses/Item'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/modules/{module}/items/{field}:
    put:
      operationId: adminLockAutoDefenseSiteItem
      summary: "A person sets the item: it becomes manual and runs on this value until resumed (Q3)"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/SiteModuleName'}, {$ref: '#/components/parameters/Field'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/ItemValue'}
      responses:
        '200': {$ref: '#/components/responses/Item'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/modules/{module}/items/{field}/resume:
    post:
      operationId: resumeAutoDefenseSiteItem
      summary: "恢复自动 for one item"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/SiteModuleName'}, {$ref: '#/components/parameters/Field'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/ItemList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/security/autodefense/sites/{site_id}/modules/{module}/items/{field}/resume:
    post:
      operationId: adminResumeAutoDefenseSiteItem
      summary: "恢复自动 for one item"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [platform.admin, security_policies.manage]
      x-required-features: [module.autodefense, module.autodefense.auto]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/SiteModuleName'}, {$ref: '#/components/parameters/Field'}, {$ref: '#/components/parameters/TenantScopeID'}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/ItemList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/security/autodefense/sites/{site_id}/modules/{module}/items/{field}/range:
    put:
      operationId: setAutoDefenseSiteItemRange
      summary: "Narrow the item's automatic range (上下限); state and manual value unchanged"
      tags: [autodefense]
      security: [{bearerAuth: []}]
      x-required-permissions: [security_policies.manage]
      x-required-features: [module.autodefense]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/SiteID'}, {$ref: '#/components/parameters/SiteModuleName'}, {$ref: '#/components/parameters/Field'}]
      requestBody: {$ref: '#/components/requestBodies/ItemRange'}
      responses:
