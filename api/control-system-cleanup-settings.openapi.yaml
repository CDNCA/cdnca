openapi: 3.1.0
info:
  title: CDNCA Platform System Cleanup Settings API
  version: 0.1.0
  description: Platform-scoped retention and backup policy settings. Saving a policy does not execute cleanup or legacy scripts.
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - {url: /}
security:
  - bearerAuth: []
paths:
  /v1/admin/system-cleanup-settings:
    get:
      summary: Read platform cleanup and backup settings
      operationId: getPlatformSystemCleanupSettings
      x-required-permissions: [system_configuration.read]
      responses:
        '200': {description: Current retention and backup policy, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '401': {description: Unauthenticated}
        '403': {description: Permission denied}
        '500': {description: Unexpected internal failure}
        '503': {description: Settings storage or policy is unavailable}
    put:
      summary: Update platform cleanup and backup settings
      operationId: updatePlatformSystemCleanupSettings
      x-required-permissions: [system_configuration.manage]
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WriteRequest'}}}
      responses:
        '200': {description: Saved policy, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '400': {description: Validation error}
        '401': {description: Unauthenticated}
        '403': {description: Permission denied}
        '409': {description: Revision or idempotency conflict}
        '500': {description: Unexpected internal failure}
        '503': {description: Settings storage or policy is unavailable}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[0-9]+"$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    RequestID: {name: X-Request-ID, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
  schemas:
    Document:
      type: object
      required: [schema, revision, value]
      properties:
        schema: {const: cdnca.platform-system-cleanup-settings/v1}
        revision: {type: integer, minimum: 0}
        updated_at: {type: string, format: date-time}
        value: {$ref: '#/components/schemas/Settings'}
    WriteRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties: {value: {$ref: '#/components/schemas/Settings'}}
    Settings:
      type: object
      additionalProperties: false
      required: [cleanup_cache_days, audit_retention_days, access_logs_days, node_metrics_days, bandwidth_history_days, blacklist_history_days, node_traffic_history_days]
      properties:
        cleanup_cache_days: {type: integer, minimum: 0, maximum: 3650}
        audit_retention_days:
          type: object
          description: Operation-log retention days per event category (GET /v1/audit-logs/categories); 0 keeps forever. Missing categories use the catalog default.
          propertyNames: {enum: [admin, user, auth, site, security, rule, finance, package, plugin, node, dns, cert, system, other]}
          additionalProperties: {type: integer, minimum: 0, maximum: 3650}
        access_logs_days: {type: integer, minimum: 0, maximum: 3650}
        node_metrics_days: {type: integer, minimum: 0, maximum: 3650}
        bandwidth_history_days: {type: integer, minimum: 0, maximum: 3650}
        blacklist_history_days: {type: integer, minimum: 0, maximum: 3650}
        node_traffic_history_days: {type: integer, minimum: 0, maximum: 3650}
