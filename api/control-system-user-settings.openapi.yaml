openapi: 3.1.0
info:
  title: CDNCA Platform System User Settings API
  version: 0.1.0
  description: Platform administrator policies for login, registration, verification, identity and recharge. These settings do not enter the edge request path.
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - {url: /}
security:
  - bearerAuth: []
paths:
  /v1/admin/system-user-settings:
    get:
      summary: Read platform user-related settings
      operationId: getPlatformSystemUserSettings
      x-summary-zh: "读取平台用户相关设置"
      x-required-permissions: [system_configuration.read]
      responses:
        '200': {description: Current user policy, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {description: Unexpected internal failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Settings storage or policy is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      summary: Update platform user-related settings
      operationId: updatePlatformSystemUserSettings
      x-summary-zh: "修改平台用户相关设置"
      x-required-permissions: [system_configuration.manage]
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WriteRequest'}}}
      responses:
        '200': {description: Saved policy, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '400': {description: 'Validation error. system_user_settings_verification_sender_unavailable (details.field value.email_verification_required or value.phone_verification_required) refuses turning a verification on while its notification channel is on and no sender of that channel is configured; a verification already on is kept.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Revision or idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {description: Unexpected internal failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Settings storage or policy is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[0-9]+"$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$', minLength: 1, maxLength: 128}}
    RequestID: {name: X-Request-ID, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            details:
              description: On a 400 system_user_settings_validation_error that names the refused field of the save body (value.<field>, or a write-only secret such as captcha_secret_key) and a machine reason.
              x-description-zh: 能定位字段的 400 system_user_settings_validation_error 附带 field（保存请求体路径 value.<字段>，或只写密钥字段如 captcha_secret_key）与 reason 机器码。
              type: object
              additionalProperties: false
              required: [field, reason]
              properties:
                field: {type: string}
                reason: {type: string}
              example: {field: value.session_ttl_seconds, reason: out_of_range}
    Document:
      type: object
      additionalProperties: false
      required: [schema, revision, value]
      properties:
        schema: {const: cdnca.platform-system-user-settings/v1}
        revision: {type: integer, minimum: 0, maximum: 9223372036854775806}
        updated_at: {type: string, format: date-time}
        value: {$ref: '#/components/schemas/Settings'}
        captcha_secret_id_configured: {type: boolean, description: The CAPTCHA SecretId entered on the settings page is stored encrypted (never returned).}
        captcha_secret_id_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        captcha_secret_key_configured: {type: boolean, description: The CAPTCHA SecretKey entered on the settings page is stored encrypted (never returned).}
        captcha_secret_key_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        captcha_app_secret_configured: {type: boolean, description: The CAPTCHA AppSecretKey entered on the settings page is stored encrypted (never returned).}
        captcha_app_secret_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        captcha_turnstile_secret_configured: {type: boolean, description: Whether a Turnstile secret is saved on this page. The secret itself is never returned.}
        captcha_turnstile_secret_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$', description: Short fingerprint of the saved Turnstile secret, to tell secrets apart.}
        kyc_api_key_configured: {type: boolean, description: The KYC provider API key entered on the settings page is stored encrypted (never returned).}
        kyc_api_key_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        kyc_callback_hmac_key_configured: {type: boolean, description: The KYC provider callback signing key entered on the settings page is stored encrypted (never returned).}
        kyc_callback_hmac_key_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        kyc_object_access_key_id_configured: {type: boolean, description: The KYC private object store access key ID entered on the settings page is stored encrypted (never returned).}
        kyc_object_access_key_id_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        kyc_object_secret_access_key_configured: {type: boolean, description: The KYC private object store secret access key entered on the settings page is stored encrypted (never returned).}
        kyc_object_secret_access_key_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        kyc_object_session_token_configured: {type: boolean, description: The KYC private object store session token entered on the settings page is stored encrypted (never returned).}
        kyc_object_session_token_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
    WriteRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {$ref: '#/components/schemas/Settings'}
        captcha_secret_id: {$ref: '#/components/schemas/WriteOnlySecret'}
        captcha_secret_key: {$ref: '#/components/schemas/WriteOnlySecret'}
        captcha_app_secret: {$ref: '#/components/schemas/WriteOnlySecret'}
        captcha_turnstile_secret:
          allOf:
            - {$ref: '#/components/schemas/WriteOnlySecret'}
          minLength: 16
          description: Cloudflare Turnstile secret of the registration flow, 16 to 1024 characters without whitespace. A non-empty ACCOUNT_REGISTRATION_TURNSTILE_SECRET wins over it.
          x-description-zh: 注册流程的 Cloudflare Turnstile Secret，16–1024 个字符、不含空白；环境变量 ACCOUNT_REGISTRATION_TURNSTILE_SECRET 非空时优先。
        kyc_api_key:
          allOf:
            - {$ref: '#/components/schemas/WriteOnlySecret'}
          minLength: 16
          maxLength: 512
          description: API key of the KYC provider shared by personal and enterprise verification; replaces IDENTITY_VERIFICATION_KYC_API_KEY, which stays the fallback when this is not saved; a change applies to the next KYC request without restarting the control plane.
          x-description-zh: 个人实名与企业认证共用的实名认证服务（KYC）API Key；替换 IDENTITY_VERIFICATION_KYC_API_KEY，未保存时沿用该环境变量；修改后下一次实名认证请求即生效，无需重启控制面。
        kyc_callback_hmac_key:
          allOf:
            - {$ref: '#/components/schemas/WriteOnlySecret'}
          description: Callback signing key of the KYC provider, canonical padded base64 of 32-128 bytes; replaces IDENTITY_VERIFICATION_KYC_CALLBACK_HMAC_BASE64, which stays the fallback; a change applies without restarting the control plane.
          x-description-zh: 实名认证服务回调验签密钥，32–128 字节的标准带填充 Base64；替换 IDENTITY_VERIFICATION_KYC_CALLBACK_HMAC_BASE64，未保存时沿用该环境变量；修改后无需重启控制面即生效。
        kyc_object_access_key_id:
          allOf:
            - {$ref: '#/components/schemas/WriteOnlySecret'}
          minLength: 3
          maxLength: 256
          description: Access key ID of the KYC private object store (identity documents and liveness material); replaces IDENTITY_VERIFICATION_OBJECT_ACCESS_KEY_ID, which stays the fallback; a change applies without restarting the control plane.
          x-description-zh: 实名材料私有对象存储的 Access Key ID；替换 IDENTITY_VERIFICATION_OBJECT_ACCESS_KEY_ID，未保存时沿用该环境变量；修改后无需重启控制面即生效。
        kyc_object_secret_access_key:
          allOf:
            - {$ref: '#/components/schemas/WriteOnlySecret'}
          minLength: 8
          maxLength: 512
          description: Secret access key of the KYC private object store; replaces IDENTITY_VERIFICATION_OBJECT_SECRET_ACCESS_KEY, which stays the fallback.
          x-description-zh: 实名材料私有对象存储的 Secret Access Key；替换 IDENTITY_VERIFICATION_OBJECT_SECRET_ACCESS_KEY，未保存时沿用该环境变量。
        kyc_object_session_token:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Optional session token of temporary object store credentials, otherwise like WriteOnlySecret; replaces IDENTITY_VERIFICATION_OBJECT_SESSION_TOKEN, which stays the fallback.
          x-description-zh: 选填，对象存储临时凭据的 Session Token，其余同 WriteOnlySecret；替换 IDENTITY_VERIFICATION_OBJECT_SESSION_TOKEN，未保存时沿用该环境变量。
    WriteOnlySecret:
      type: string
      maxLength: 1024
      writeOnly: true
      description: A secret in plaintext (no line breaks, no surrounding spaces), stored encrypted under the control-api credential keyring and never returned; the document shows only <name>_configured and <name>_fingerprint. Omitted keeps the stored one, an empty string clears it. For the CAPTCHA secrets a stored secret cannot coexist with its value.<name>_reference; sending both is refused (<name> invalid), and a reference while the secret stays stored is refused (value.<name>_reference invalid). The CAPTCHA verifier uses the stored secret before the reference.
      x-description-zh: 明文密钥（不含换行、首尾无空格），用 control-api 凭据钥匙串加密保存，从不回显；文档只返回 <名称>_configured 与 <名称>_fingerprint。省略保留原值，空串清除。人机验证密钥的已存值与对应的 value.<名称>_reference 不能同时存在：两者同时填写被拒（<名称> invalid），保留已存密钥时填写引用被拒（value.<名称>_reference invalid）。人机验证优先使用已存密钥，其次才用引用。
    SecretReference:
      type: string
      maxLength: 1024
      pattern: '^(|vault://.+|kms-envelope://.+)$'
      description: Advanced. Empty or an opaque Vault/KMS envelope reference resolved by the runtime (ACCOUNT_LOGIN_CAPTCHA_SECRETS_JSON for CAPTCHA). Plaintext secrets go in the matching write-only field of the save body instead.
    Settings:
      type: object
      additionalProperties: false
      required: [session_ttl_seconds, user_login_domains, admin_login_domains, email_code_login_enabled, sms_code_login_enabled, registration_enabled, registration_success_subject, registration_success_body, password_reset_subject, password_reset_body, verification_template_channel, verification_subject, verification_body, verification_sms_body, verification_sms_template_id, terms_title, terms_body, username_required, email_required, email_verification_required, phone_required, phone_verification_required, qq_required, login_failure_limit_per_hour, login_captcha_threshold_per_hour, session_region_check, email_anti_abuse_mode, sms_anti_abuse_mode, captcha_provider, captcha_secret_id_reference, captcha_secret_key_reference, captcha_app_id, captcha_app_secret_reference, identity_verification_method, enterprise_verification_enabled, identity_policy_saved, wechat_payment_enabled, alipay_payment_enabled, bank_transfer_enabled, usdt_payment_enabled, default_recharge_method, recharge_restriction, default_phone_country_code]
      properties:
        session_ttl_seconds: {type: integer, minimum: 300, maximum: 31536000, default: 86400}
        user_login_domains: {type: string, maxLength: 4096}
        admin_login_domains: {type: string, maxLength: 4096}
        email_code_login_enabled: {type: boolean}
        sms_code_login_enabled: {type: boolean}
        registration_enabled: {type: boolean}
        registration_success_subject: {type: string, minLength: 1, maxLength: 256}
        registration_success_body: {type: string, minLength: 1, maxLength: 65536, description: '{{password}} is prohibited; registration passwords are never sent or stored in a template.'}
        password_reset_subject: {type: string, minLength: 1, maxLength: 256}
        password_reset_body: {type: string, minLength: 1, maxLength: 65536, description: '{{password}} is prohibited; reset links or completed-reset notices are used instead.'}
        verification_template_channel: {type: string, enum: [email, sms]}
        verification_subject: {type: string, minLength: 1, maxLength: 256}
        verification_body: {type: string, minLength: 1, maxLength: 65536}
        verification_sms_body: {type: string, minLength: 1, maxLength: 1024}
        verification_sms_template_id: {type: string, maxLength: 256}
        terms_title: {type: string, minLength: 1, maxLength: 256}
        terms_body: {type: string, minLength: 1, maxLength: 65536}
        username_required: {type: boolean}
        email_required: {type: boolean}
        email_verification_required: {type: boolean, description: 'Requires email_required=true. In effect only while the email notification channel is on too (then an email sender is needed to turn it on); otherwise sign-up and sign-in need no email code.'}
        phone_required: {type: boolean}
        phone_verification_required: {type: boolean, description: 'Requires phone_required=true. In effect only while the SMS notification channel is on too (then an SMS sender is needed to turn it on); otherwise sign-up and sign-in need no SMS code.'}
        qq_required: {type: boolean}
        login_failure_limit_per_hour: {type: integer, minimum: 1, maximum: 1000, default: 30}
        login_captcha_threshold_per_hour: {type: integer, minimum: 1, maximum: 1000, default: 3, description: Must not exceed login_failure_limit_per_hour.}
        session_region_check: {type: boolean, default: true, description: 'A signed-in session whose IP moves to another country or province (IP intelligence library) gets 401 session_region_changed until POST /v1/auth/session-region-verifications. Unplaceable addresses are not checked.'}
        email_anti_abuse_mode: {type: string, enum: [none, native, tencent, geetest_v4]}
        sms_anti_abuse_mode: {type: string, enum: [none, native, tencent, geetest_v4]}
        captcha_provider: {type: string, enum: [tencent, geetest_v4]}
        captcha_secret_id_reference: {$ref: '#/components/schemas/SecretReference'}
        captcha_secret_key_reference: {$ref: '#/components/schemas/SecretReference'}
        captcha_app_id: {type: string, maxLength: 256}
        captcha_app_secret_reference: {$ref: '#/components/schemas/SecretReference'}
        captcha_turnstile_site_key: {type: string, pattern: '^([A-Za-z0-9_-]{1,256})?$', default: '', description: Cloudflare Turnstile site key of the registration flow (public). A non-empty ACCOUNT_REGISTRATION_TURNSTILE_SITE_KEY wins over it.}
        identity_verification_method:
          type: string
          enum: [none, alipay, wechat_face, phone_three_factor]
          description: Personal verification is offered unless none; applies once identity_policy_saved is true.
        enterprise_verification_enabled: {type: boolean, description: Enterprise verification is offered; applies once identity_policy_saved is true.}
        identity_policy_saved:
          type: boolean
          description: True once the identity tab was saved. Until then a new KYC session of any kind may start whenever the KYC provider is configured (the behaviour before these settings applied); afterwards identity_verification_method and enterprise_verification_enabled decide, and a turned-off kind is refused with identity_verification_kind_disabled.
          x-description-zh: 认证页保存过即为 true。此前只要实名认证服务已配置，任何类型都可发起；此后由 identity_verification_method 与 enterprise_verification_enabled 决定，关闭的类型以 identity_verification_kind_disabled 拒绝。
        kyc_provider_name:
          type: string
          pattern: '^([a-z][a-z0-9._-]{0,63})?$'
          default: ''
          description: Name of the KYC service (the provider of provider sessions and callbacks). Empty uses IDENTITY_VERIFICATION_KYC_PROVIDER_NAME. Each KYC value saved here applies to the next KYC request without restarting the control plane; until the service name, URL, API key, callback key ID, callback signing key, object store URL, region, bucket, access key ID, secret access key and KMS key ID are all set (here or in the environment) the provider routes answer 503 identity_verification_not_configured.
          x-description-zh: 实名认证服务名称（服务商会话与回调使用的提供商名）；留空使用 IDENTITY_VERIFICATION_KYC_PROVIDER_NAME。这里保存的各项 KYC 配置下一次实名请求即生效，无需重启控制面；服务名称、服务地址、API Key、回调密钥 ID、回调签名密钥、存储地址、区域、存储桶、Access Key ID、Secret Access Key 与 KMS 密钥 ID 在本页或环境中齐全前，服务商相关接口返回 503 identity_verification_not_configured。
        kyc_endpoint:
          type: string
          maxLength: 512
          default: ''
          description: https origin of the KYC service (scheme and DNS host only, port 443; no path, IP literal or localhost), refused as value.kyc_endpoint invalid_format otherwise. Empty uses IDENTITY_VERIFICATION_KYC_ENDPOINT.
          x-description-zh: 实名认证服务的 https 源地址（只含协议与域名、端口仅 443，不带路径、IP 或 localhost），不符合时以 value.kyc_endpoint invalid_format 拒绝；留空使用 IDENTITY_VERIFICATION_KYC_ENDPOINT。
        kyc_callback_key_id:
          type: string
          pattern: '^([A-Za-z0-9][A-Za-z0-9._:-]{0,127})?$'
          default: ''
          description: Expected X-KYC-Key-ID of KYC responses and callbacks. Empty uses IDENTITY_VERIFICATION_KYC_CALLBACK_KEY_ID.
          x-description-zh: KYC 响应与回调请求头 X-KYC-Key-ID 的值；留空使用 IDENTITY_VERIFICATION_KYC_CALLBACK_KEY_ID。
        kyc_object_endpoint:
          type: string
          maxLength: 512
          default: ''
          description: https origin of the S3-compatible private object store for identity material (same form as kyc_endpoint). Empty uses IDENTITY_VERIFICATION_OBJECT_ENDPOINT.
          x-description-zh: 存放实名材料的 S3 兼容私有对象存储 https 源地址（格式同 kyc_endpoint）；留空使用 IDENTITY_VERIFICATION_OBJECT_ENDPOINT。
        kyc_object_region:
          type: string
          pattern: '^([A-Za-z0-9][A-Za-z0-9-]{0,62})?$'
          default: ''
          description: Object store region. Empty uses IDENTITY_VERIFICATION_OBJECT_REGION.
          x-description-zh: 对象存储区域；留空使用 IDENTITY_VERIFICATION_OBJECT_REGION。
        kyc_object_bucket:
          type: string
          pattern: '^([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])?$'
          default: ''
          description: Object store bucket (DNS-style, not an IP address). Empty uses IDENTITY_VERIFICATION_OBJECT_BUCKET.
          x-description-zh: 对象存储桶（DNS 风格名称，不能是 IP）；留空使用 IDENTITY_VERIFICATION_OBJECT_BUCKET。
        kyc_object_prefix:
          type: string
          maxLength: 490
          pattern: '^[^/\\%?#]*$'
          default: ''
          description: Optional single path segment before the object keys (not . or ..). Empty uses IDENTITY_VERIFICATION_OBJECT_PREFIX.
          x-description-zh: 选填，对象键前的单段路径（不能是 . 或 ..）；留空使用 IDENTITY_VERIFICATION_OBJECT_PREFIX。
        kyc_object_kms_key_id:
          type: string
          pattern: '^([A-Za-z0-9][A-Za-z0-9._:/-]{0,255})?$'
          default: ''
          description: KMS key ID or ARN for server-side encryption (SSE-KMS) of new uploads. Empty uses IDENTITY_VERIFICATION_OBJECT_KMS_KEY_ID.
          x-description-zh: 新上传材料服务端加密（SSE-KMS）使用的 KMS 密钥 ID 或 ARN；留空使用 IDENTITY_VERIFICATION_OBJECT_KMS_KEY_ID。
        wechat_payment_enabled: {type: boolean}
        alipay_payment_enabled: {type: boolean}
        bank_transfer_enabled: {type: boolean}
        usdt_payment_enabled: {type: boolean, default: false, description: Offer USDT recharge; users see it only with an enabled crypto payment channel and the module.payment.crypto licence too.}
        default_recharge_method: {type: string, enum: [none, wechat, alipay, bank_transfer, usdt], description: A non-none default method must be enabled.}
        recharge_restriction: {type: string, enum: [none, individual_verified, enterprise_verified]}
        default_phone_country_code: {type: string, pattern: '^[1-9][0-9]{0,3}$', default: '86', description: Country/region calling code (digits only) used to complete phone numbers entered without one.}
