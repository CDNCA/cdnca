openapi: 3.1.0
info:
  title: cdnca control-api SSH remote node install
  version: 1.0.35
  description: >-
    The controller logs in to servers over SSH and runs the console's one-line install command
    (install-node.sh with the scope's registration key). A job first reads the host key; no login
    is sent until the operator confirms that fingerprint. The SSH password or private key is stored
    encrypted (AES-GCM envelope bound to the job), deleted when the job ends and never returned.
    Requires a platform session with nodes.manage. Responses are Cache-Control no-store.
paths:
  /v1/admin/nodes/ssh-installs:
    get:
      operationId: listNodeSSHInstalls
      parameters:
        - {name: batch_id, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200': {description: Newest jobs first., content: {application/json: {schema: {$ref: '#/components/schemas/JobList'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createNodeSSHInstalls
      description: >-
        One job per host (same batch). The node downloads install-node.sh from the request Origin
        (must be https); 400 control_plane_origin_required otherwise. A host that cannot be reached
        gets a failed job (ssh_unreachable); 409 ssh_install_in_progress when a host:port already has a live job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hosts, username]
              properties:
                hosts: {type: array, minItems: 1, maxItems: 100, items: {type: string, maxLength: 253}}
                port: {type: integer, minimum: 1, maximum: 65535, default: 22}
                names: {type: array, maxItems: 100, items: {type: string, maxLength: 128}, description: Node names, one per host.}
                username: {type: string, pattern: '^[a-z_][a-z0-9_.-]{0,31}$'}
                password: {type: string, maxLength: 1024, description: Exactly one of password or private_key.}
                private_key: {type: string, maxLength: 16384, description: Unencrypted OpenSSH private key.}
      responses:
        '201': {description: Created jobs., content: {application/json: {schema: {$ref: '#/components/schemas/JobList'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/admin/nodes/ssh-installs/{id}:
    get:
      operationId: getNodeSSHInstall
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: The job., content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /v1/admin/nodes/ssh-installs/{id}/confirm-host-key:
    post:
      operationId: confirmNodeSSHInstallHostKey
      description: The fingerprint must equal the one read; the job then queues (state pending).
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [host_key_sha256]
              properties:
                host_key_sha256: {type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$'}
      responses:
        '200': {description: The job., content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/admin/nodes/ssh-installs/{id}/cancel:
    post:
      operationId: cancelNodeSSHInstall
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: The job., content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Error:
      description: >-
        error.code is one of unauthorized, permission_denied, invalid_request, control_plane_origin_required,
        not_found, state_conflict, ssh_install_in_progress, unavailable.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: object, required: [code], properties: {code: {type: string}}}
  schemas:
    JobList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Job'}}
    Job:
      type: object
      required: [id, batch_id, host, port, username, auth_kind, node_name, host_key_sha256,
        host_key_confirmed, state, failure_code, progress, node_id, attempts, created_at, started_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        batch_id: {type: string, format: uuid}
        host: {type: string}
        port: {type: integer}
        username: {type: string}
        auth_kind: {type: string, enum: [password, private_key]}
        node_name: {type: string}
        host_key_sha256: {type: string, description: OpenSSH SHA256 fingerprint; empty when the host was not reached.}
        host_key_confirmed: {type: boolean}
        state: {type: string, enum: [awaiting_host_key, pending, running, succeeded, failed, cancelled]}
        failure_code:
          type: string
          enum: ['', host_key_mismatch, ssh_unreachable, ssh_auth_failed, install_failed, install_timeout,
            credential_unavailable, registration_unavailable, installed_pending_initialization,
            installed_pending_ticket, installed_banned, installed_ticket_expired, installed_resume_failed]
          description: >-
            Failure cause of a failed job. A succeeded job carries installed_pending_initialization,
            installed_pending_ticket, installed_banned, installed_ticket_expired or installed_resume_failed
            when the node is installed and connected but does not serve yet (not initialized yet, no first
            license ticket, installation banned, ticket expired, ticket valid but resuming the servers failed).
        progress: {type: array, maxItems: 200, items: {type: string}, description: 'Only the installer''s "[cdnca-edge] " lines.'}
        node_id: {type: [string, 'null'], format: uuid, description: The node the install registered (matched by IP).}
        attempts: {type: integer}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
