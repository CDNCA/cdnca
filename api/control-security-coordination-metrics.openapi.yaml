openapi: 3.1.0
info:
  title: CDNCA Security Coordination Metrics API
  version: 1.0.0
paths:
  /v1/admin/security/coordination/metrics:
    get:
      operationId: getSecurityCoordinationMetrics
      summary: Read bounded cross-node CC and global firewall coordination counters
      description: Returns fixed-cardinality process counters. Node, tenant, policy, subject, address, and message labels are never exposed.
      security: [{bearerSession: []}]
      x-required-permissions: [platform.admin, security_policies.read]
      responses:
        '200': {$ref: '#/components/responses/Metrics'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '405': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerSession: {type: http, scheme: bearer, bearerFormat: opaque-session}
  headers:
    NoStore: {required: true, schema: {type: string, const: no-store}}
    PragmaNoCache: {required: true, schema: {type: string, const: no-cache}}
    RequestID: {required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}}
    NoSniff: {required: true, schema: {type: string, const: nosniff}}
  schemas:
    Counter: {type: integer, format: int64, minimum: 0}
    CCMetrics:
      type: object
      additionalProperties: false
      required: [observe_runs, accepted, duplicates, rejected, queued, capacity_rejected, scope_rejected, dependency_unavailable, invalid, conflict, coordination_runs, coordination_claimed, coordination_published, coordination_retryable, activation_active, activation_failed, false_positive_releases, release_replays, release_rejected]
      properties:
        observe_runs: {$ref: '#/components/schemas/Counter'}
        accepted: {$ref: '#/components/schemas/Counter'}
        duplicates: {$ref: '#/components/schemas/Counter'}
        rejected: {$ref: '#/components/schemas/Counter'}
        queued: {$ref: '#/components/schemas/Counter'}
        capacity_rejected: {$ref: '#/components/schemas/Counter'}
        scope_rejected: {$ref: '#/components/schemas/Counter'}
        dependency_unavailable: {$ref: '#/components/schemas/Counter'}
        invalid: {$ref: '#/components/schemas/Counter'}
        conflict: {$ref: '#/components/schemas/Counter'}
        coordination_runs: {$ref: '#/components/schemas/Counter'}
        coordination_claimed: {$ref: '#/components/schemas/Counter'}
        coordination_published: {$ref: '#/components/schemas/Counter'}
        coordination_retryable: {$ref: '#/components/schemas/Counter'}
        activation_active: {$ref: '#/components/schemas/Counter'}
        activation_failed: {$ref: '#/components/schemas/Counter'}
        false_positive_releases: {$ref: '#/components/schemas/Counter'}
        release_replays: {$ref: '#/components/schemas/Counter'}
        release_rejected: {$ref: '#/components/schemas/Counter'}
    FirewallMetrics:
      type: object
      additionalProperties: false
      required: [dispatch_runs, claimed, published, puback_duplicates, retryable, exhausted, publish_timeout, publish_unknown, puback_missing, puback_rejected, integrity_rejected, dependency_unavailable, ack_settled, ack_replayed, ack_rescued, ack_rejected, applied, failed, rolled_back, recoveries, global_active, global_partial, global_failed, global_rolled_back]
      properties:
        dispatch_runs: {$ref: '#/components/schemas/Counter'}
        claimed: {$ref: '#/components/schemas/Counter'}
        published: {$ref: '#/components/schemas/Counter'}
        puback_duplicates: {$ref: '#/components/schemas/Counter'}
        retryable: {$ref: '#/components/schemas/Counter'}
        exhausted: {$ref: '#/components/schemas/Counter'}
        publish_timeout: {$ref: '#/components/schemas/Counter'}
        publish_unknown: {$ref: '#/components/schemas/Counter'}
        puback_missing: {$ref: '#/components/schemas/Counter'}
        puback_rejected: {$ref: '#/components/schemas/Counter'}
        integrity_rejected: {$ref: '#/components/schemas/Counter'}
        dependency_unavailable: {$ref: '#/components/schemas/Counter'}
        ack_settled: {$ref: '#/components/schemas/Counter'}
        ack_replayed: {$ref: '#/components/schemas/Counter'}
        ack_rescued: {$ref: '#/components/schemas/Counter'}
        ack_rejected: {$ref: '#/components/schemas/Counter'}
        applied: {$ref: '#/components/schemas/Counter'}
        failed: {$ref: '#/components/schemas/Counter'}
        rolled_back: {$ref: '#/components/schemas/Counter'}
        recoveries: {$ref: '#/components/schemas/Counter'}
        global_active: {$ref: '#/components/schemas/Counter'}
        global_partial: {$ref: '#/components/schemas/Counter'}
        global_failed: {$ref: '#/components/schemas/Counter'}
        global_rolled_back: {$ref: '#/components/schemas/Counter'}
    MetricsResponse:
      type: object
      additionalProperties: false
      required: [schema, cc, firewall]
      properties:
        schema: {type: string, const: security_coordination_metrics.v1}
        cc: {$ref: '#/components/schemas/CCMetrics'}
        firewall: {$ref: '#/components/schemas/FirewallMetrics'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code:
              type: string
              enum: [security_coordination_metrics_invalid_request, security_coordination_metrics_authentication_required, security_coordination_metrics_permission_denied, security_coordination_metrics_method_not_allowed, security_coordination_metrics_not_found, security_coordination_metrics_unavailable]
            request_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
  responses:
    Metrics:
      description: Fixed-cardinality in-process security coordination counters.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Pragma: {$ref: '#/components/headers/PragmaNoCache'}
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content: {application/json: {schema: {$ref: '#/components/schemas/MetricsResponse'}}}
    Error:
      description: Stable error code without identity or dependency detail.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Pragma: {$ref: '#/components/headers/PragmaNoCache'}
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
