openapi: 3.1.0
info:
  title: CDNCA Control Node Scheduling API Fragment
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security:
  - tenantBearer: []
  - tenantAPIKey: []
paths:
  /v1/nodes/{id}/metrics/latest:
    get:
      operationId: getLatestNodeMetrics
      summary: 查询节点最新探测、负载与恢复证据
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200':
          description: Latest durable metric record with its separately persisted latest recovery notification.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeMetricsLatest'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node-line-groups:
    get:
      operationId: listNodeLineGroups
      summary: "List the current revisions of line groups"
      x-summary-zh: 查询线路组当前修订列表
      parameters:
        - $ref: '#/components/parameters/TargetScopeID'
      responses:
        '200':
          description: Current immutable revision of every visible line group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineGroupList'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createNodeLineGroup
      summary: "Create the first immutable revision of a line group"
      x-summary-zh: 创建线路组首个不可变修订
      description: "A tenant session manages its own scope; a platform session without target_scope_id manages this control plane's platform scope, and writes naming a tenant scope are refused."
      x-description-zh: 租户会话管理自身作用域；平台会话未指定 target_scope_id 时管理本主控平台作用域，显式指定租户作用域时拒绝写入。
      parameters:
        - $ref: '#/components/parameters/TargetScopeID'
        - $ref: '#/components/parameters/IfMatchCreate'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LineGroupWrite'}
      responses:
        '201':
          description: Revision 1 created. ETag is a quoted decimal revision.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineGroupWriteResult'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node-line-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/LineGroupID'
    get:
      operationId: getNodeLineGroup
      summary: "Read the current revision of a line group"
      x-summary-zh: 查询线路组当前修订
      parameters:
        - $ref: '#/components/parameters/TargetScopeID'
      responses:
        '200':
          description: Current immutable revision.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineGroupRevision'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateNodeLineGroup
      summary: "Create the next immutable revision of a line group"
      x-summary-zh: 创建线路组下一不可变修订
      description: "A tenant session manages its own scope; a platform session without target_scope_id manages this control plane's platform scope, and writes naming a tenant scope are refused."
      x-description-zh: 租户会话管理自身作用域；平台会话未指定 target_scope_id 时管理本主控平台作用域，显式指定租户作用域时拒绝写入。
      parameters:
        - $ref: '#/components/parameters/TargetScopeID'
        - $ref: '#/components/parameters/IfMatchUpdate'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LineGroupWrite'}
      responses:
        '200':
          description: New immutable current revision.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineGroupWriteResult'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteNodeLineGroup
      summary: "Soft-delete a line group and keep its immutable revision history"
      x-summary-zh: 软删除线路组并保留不可变修订历史
      description: "A tenant session deletes line groups of its own scope; a platform session without target_scope_id deletes line groups of this control plane's platform scope, and naming a tenant scope returns 403. After deletion the line group is hidden from the list, current detail, history detail, probes and new topology snapshots; the same idempotency key can be replayed. While an undeleted package (spec node_group_id / backup_node_group_id), subscription snapshot, site, stream, escalation policy or route, or the fallback chain's last resort still uses the line group, it returns 409 node_scheduling_reference_conflict with what holds it in error.details (LineGroupReferences) and deletes nothing."
      x-description-zh: 租户会话删除自身作用域线路组；平台会话未指定 target_scope_id 时删除本主控平台作用域线路组，显式指定租户作用域时返回 403。删除后列表、当前详情、历史详情、探测与新拓扑快照入口均不可见；同一幂等键可重放。仍被未删除的套餐（spec 的 node_group_id / backup_node_group_id）、订阅快照、网站、四层转发、攻击升级策略或路由、兜底链最后一级使用时返回 409 node_scheduling_reference_conflict，error.details（LineGroupReferences）列出引用方，不删除。
      parameters:
        - $ref: '#/components/parameters/TargetScopeID'
        - $ref: '#/components/parameters/IfMatchUpdate'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '204':
          description: Soft deletion completed or the stored result was replayed.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node-line-groups/{id}/revisions/{revision}:
    get:
      operationId: getNodeLineGroupRevision
      summary: "Read a historical revision of a line group"
      x-summary-zh: 查询线路组历史修订
      parameters:
        - $ref: '#/components/parameters/LineGroupID'
        - $ref: '#/components/parameters/Revision'
        - $ref: '#/components/parameters/TargetScopeID'
      responses:
        '200':
          description: Historical immutable revision.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineGroupRevision'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node-line-groups/{id}/decisions:
    post:
      operationId: decideNodeLineGroupEndpoint
      summary: "Compute an auditable region health scheduling decision"
      x-summary-zh: 计算可审计的区域健康调度决策
      parameters:
        - $ref: '#/components/parameters/LineGroupID'
        - $ref: '#/components/parameters/TargetScopeID'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionRequest'}
      responses:
        '200':
          description: Deterministic selection with auditable reason and fallback state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Decision'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node-line-groups/{id}/target-snapshots:
    get:
      operationId: getNodeLineGroupTargetSnapshot
      summary: "Read the L1/L2 topology snapshot by source revision"
      x-summary-zh: 按来源修订查询 L1/L2 拓扑快照
      parameters:
        - $ref: '#/components/parameters/LineGroupID'
        - $ref: '#/components/parameters/SourceRevision'
        - $ref: '#/components/parameters/TargetScopeID'
      responses:
        '200':
          description: Immutable L1 target set bound to the requested L2 source revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetSnapshot'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createNodeLineGroupTargetSnapshot
      summary: "Create an L1 target and L2 candidate topology snapshot"
      x-summary-zh: 创建 L1 目标与 L2 候选拓扑快照
      parameters:
        - $ref: '#/components/parameters/LineGroupID'
        - $ref: '#/components/parameters/TargetScopeID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TargetSnapshotRequest'}
      responses:
        '201':
          description: Immutable L1 target set bound to an immutable L2 source revision.
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetSnapshot'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node-line-groups/{id}/rollback:
    post:
      operationId: rollbackNodeLineGroup
      summary: "Copy a historical configuration as the new current revision"
      x-summary-zh: 将历史配置复制为新的当前修订
      parameters:
        - $ref: '#/components/parameters/LineGroupID'
        - $ref: '#/components/parameters/TargetScopeID'
        - $ref: '#/components/parameters/IfMatchUpdate'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
      responses:
        '200':
          description: Historical configuration copied into current revision plus one.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineGroupWriteResult'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node-line-groups/{id}/platform-default:
    post:
      operationId: setNodeLineGroupPlatformDefault
      summary: "Set or clear the platform default line group"
      x-summary-zh: 设为或取消平台默认线路组
      description: "Normal line groups of the platform scope only; setting a default clears the previous one. Does not advance the line group revision. Websites without a package use it to freeze their CNAME target IPs."
      x-description-zh: 只限平台作用域普通线路组；设为默认会取消原默认。不推进线路组修订。没选套餐的网站用它冻结 CNAME 目标 IP。
      parameters:
        - $ref: '#/components/parameters/LineGroupID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [is_platform_default]
              properties:
                is_platform_default: {type: boolean}
      responses:
        '200':
          description: Current line group with the new platform default flag.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [group]
                properties:
                  group: {$ref: '#/components/schemas/LineGroupRevision'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node-line-groups/{id}/smart-schedule:
    parameters:
      - $ref: '#/components/parameters/LineGroupID'
      - $ref: '#/components/parameters/TargetScopeID'
    get:
      operationId: getNodeLineGroupSmartSchedule
      summary: "Read the smart scheduling configuration and current line selections"
      x-summary-zh: 查询线路组智能调度配置与各线路当前选中节点
      description: "Defaults (disabled) when never configured. Each line lists the selected endpoints with p50 latency, health and load; fallback_from names the level a line fell back from. probe_source says whether dnspup checkpoints and peer node probes produced latency in the last hour; with neither, every line keeps its static endpoints."
      x-description-zh: 从未配置时返回默认值（关闭）。每条线路列出选中端点及 p50 延迟、健康、负载；fallback_from 表示该线路从哪一级回退。probe_source 表示最近一小时 dnspup 检查点与对端节点探测是否产生了延迟数据；两者都没有时各线路沿用静态端点。
      security: [{tenantBearer: []}, {tenantAPIKey: []}]
      x-required-permissions: [node_scheduling.read]
      responses:
        '200':
          description: Smart schedule view.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmartSchedule'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: putNodeLineGroupSmartSchedule
      summary: "Configure smart scheduling of a line group"
      x-summary-zh: 配置线路组智能调度
      description: "Replaces the configuration (audited as node_scheduling.group.smart_schedule). Disabling drops the selections at once; the DNS lines return to the static endpoint sets on the next publication tick, identical to a line group that never enabled it. fallback is always carrier_then_default."
      x-description-zh: 整体替换配置（审计动作 node_scheduling.group.smart_schedule）。关闭时立即清除选中结果，DNS 线路在下一轮发布时恢复静态端点集合，与从未开启一致。fallback 固定为 carrier_then_default。
      security: [{tenantBearer: []}, {tenantAPIKey: []}]
      x-required-permissions: [node_scheduling.manage]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmartScheduleWrite'}
      responses:
        '200':
          description: Smart schedule view after the change.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmartSchedule'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/node-line-groups/{id}/latency-matrix:
    parameters:
      - $ref: '#/components/parameters/LineGroupID'
      - $ref: '#/components/parameters/TargetScopeID'
    get:
      operationId: getNodeLineGroupLatencyMatrix
      summary: "Read the latency matrix of a line group"
      x-summary-zh: 查询线路组延迟矩阵
      description: "p50 latency of every endpoint per province and carrier over the window (minutes, 1-60, default 15). province is empty for checkpoints of unknown province."
      x-description-zh: 窗口内（分钟，1-60，默认 15）各端点按省份与运营商的 p50 延迟。检查点省份未知时 province 为空。
      security: [{tenantBearer: []}, {tenantAPIKey: []}]
      x-required-permissions: [node_scheduling.read]
      parameters:
        - name: window
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 60, default: 15}
      responses:
        '200':
          description: Latency matrix; rows is an empty array without samples.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LatencyMatrix'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/l2-configs:
    parameters:
      - $ref: '#/components/parameters/TargetScopeID'
    get:
      operationId: listL2Configs
      summary: "List L2 configurations"
      x-summary-zh: 查询 L2 配置列表
      description: "Returns every undeleted configuration of the current scope, ordered by display_id, without paging."
      x-description-zh: 返回当前作用域未删除的全部配置，按 display_id 排序，不分页。
      security: [{tenantBearer: []}, {tenantAPIKey: []}]
      x-required-permissions: [node_scheduling.read]
      responses:
        '200':
          description: "L2 configurations; items is an empty array when there are none."
          x-description-zh: L2 配置列表；无数据时 items 为空数组。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/L2ConfigList'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    post:
      operationId: createL2Config
      summary: "Create an L2 configuration"
      x-summary-zh: 创建 L2 配置
      description: "Writes to the caller's own scope; a platform session cannot write to another tenant's scope. The same idempotency key with the same normalised request replays the original result. The body is limited to 128 KiB and must be a single UTF-8 JSON object; unknown fields are rejected."
      x-description-zh: 写入自身作用域，平台会话不能写入其他租户作用域；相同幂等键与规范化请求重放原结果。请求体限 128 KiB，须为单个 UTF-8 JSON 对象，拒绝未知字段。
      security: [{tenantBearer: []}, {tenantAPIKey: []}]
      x-required-permissions: [node_scheduling.manage]
      parameters:
        - $ref: '#/components/parameters/IfMatchCreate'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/L2ConfigWrite'}
      responses:
        '201':
          description: "Returns the configuration at revision 1; a name or idempotency key conflict returns 409."
          x-description-zh: 返回修订 1 的配置对象；名称或幂等键冲突返回 409。
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Location:
              description: /v1/l2-configs/{id}
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/L2Config'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/l2-configs/{id}:
    parameters:
      - $ref: '#/components/parameters/L2ConfigID'
      - $ref: '#/components/parameters/TargetScopeID'
    get:
      operationId: getL2Config
      summary: "Read an L2 configuration"
      x-summary-zh: 查询 L2 配置
      security: [{tenantBearer: []}, {tenantAPIKey: []}]
      x-required-permissions: [node_scheduling.read]
      responses:
        '200':
          description: "Returns the current configuration and its revision."
          x-description-zh: 返回当前配置对象及其修订。
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/L2Config'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: updateL2Config
      summary: "Replace an L2 configuration"
      x-summary-zh: 替换 L2 配置
      description: "Replaces every editable field and increments the revision; omitting remark clears it. Writes are bound by the caller's own scope, live manage permission, revision and idempotency key. Known limitation: a missing resource and a stale revision both return 404/node_scheduling_not_found and cannot be told apart, unlike the 412 revision conflict of the node update and delete endpoints."
      x-description-zh: 完整替换可编辑字段并递增修订；省略 remark 将清空备注。写入受自身作用域、实时管理权限、修订和幂等键约束。当前实现的已知限制：资源不存在与陈旧修订均返回 404/node_scheduling_not_found，不能区分；不同于节点更新及删除接口的 412 修订冲突。
      security: [{tenantBearer: []}, {tenantAPIKey: []}]
      x-required-permissions: [node_scheduling.manage]
      parameters:
        - $ref: '#/components/parameters/IfMatchUpdate'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/L2ConfigWrite'}
      responses:
        '200':
          description: "Returns the updated configuration or the original result of a completed request."
          x-description-zh: 返回更新后的配置对象或已完成请求的原结果。
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/L2Config'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteL2Config
      summary: "Delete an L2 configuration"
      x-summary-zh: 删除 L2 配置
      description: "Returns 409 while undeleted L2 node members reference it; nothing is deleted in cascade. Success or an idempotent replay returns 204 with no body; ETag keeps the revision at deletion. A missing resource returns 404, a revision conflict 412."
      x-description-zh: 存在未删除的 L2 节点成员引用时返回 409，不级联删除。成功或幂等重放返回 204，无响应体；ETag 保留删除时修订。不存在返回 404，修订冲突返回 412。
