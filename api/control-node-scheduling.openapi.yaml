      required: [group, replayed]
      properties:
        group: {$ref: '#/components/schemas/LineGroupRevision'}
        replayed: {type: boolean}
    Selector:
      type: object
      additionalProperties: false
      required: [region, carrier]
      properties:
        region: {type: string, maxLength: 64, pattern: '^[^\u0000-\u001F\u007F-\u009F]*$'}
        carrier: {type: string, maxLength: 64, pattern: '^[^\u0000-\u001F\u007F-\u009F]*$'}
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [selector, requested_mode, stable_key]
      properties:
        selector: {$ref: '#/components/schemas/Selector'}
        requested_mode: {type: string, enum: [weighted_baseline, weighted_rendezvous, p2c_least_loaded]}
        stable_key: {type: string, minLength: 1, maxLength: 1024, pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'}
    Decision:
      type: object
      additionalProperties: false
      required: [endpoint, requested_mode, effective_mode, reason, fallback, priority, candidates, standby, snapshot]
      properties:
        endpoint: {$ref: '#/components/schemas/Endpoint'}
        requested_mode: {type: string, enum: [weighted_baseline, weighted_rendezvous, p2c_least_loaded]}
        effective_mode: {type: string, enum: [weighted_baseline, weighted_rendezvous, p2c_least_loaded]}
        reason: {type: string, enum: [baseline_weighted_selected, weighted_rendezvous_selected, p2c_least_loaded_selected, telemetry_insufficient, telemetry_stale_fallback, telemetry_unavailable_fallback, single_candidate_fallback, no_healthy_endpoint]}
        fallback: {type: boolean}
        priority: {type: integer, minimum: 0}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/Endpoint'}
        standby:
          type: array
          items: {$ref: '#/components/schemas/Endpoint'}
        snapshot: {$ref: '#/components/schemas/DecisionSnapshot'}
    DecisionSnapshot:
      type: object
      additionalProperties: false
      required: [tenant_scope_id, group_id, revision, configuration_digest, plan_digest, selector, evaluated_at, selected_priority, tier_reason, endpoint_evaluations]
      properties:
        tenant_scope_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        configuration_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        plan_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        selector: {$ref: '#/components/schemas/Selector'}
        evaluated_at: {type: string, format: date-time}
        selected_priority: {type: [integer, 'null'], minimum: 0, maximum: 65535}
        tier_reason: {type: string, enum: [primary_priority_selected, backup_priority_selected, no_healthy_endpoint]}
        endpoint_evaluations:
          type: array
          maxItems: 512
          items: {$ref: '#/components/schemas/EndpointEvaluation'}
    EndpointEvaluation:
      type: object
      additionalProperties: false
      required: [endpoint, disposition, health_status, health_row_revision, last_observed_at, last_received_at]
      properties:
        endpoint: {$ref: '#/components/schemas/Endpoint'}
        disposition:
          type: string
          enum: [candidate, standby, disabled, selector_mismatch, less_specific, health_unknown, health_unhealthy, health_stale]
        health_status: {type: string, enum: [unknown, healthy, unhealthy]}
        health_row_revision: {type: integer, format: int64, minimum: 1}
        last_observed_at: {type: [string, 'null'], format: date-time}
        last_received_at: {type: [string, 'null'], format: date-time}
    TargetSnapshotRequest:
      type: object
      additionalProperties: false
      required: [source_revision, node_ids]
      properties:
        source_revision: {type: integer, format: int64, minimum: 1}
        node_ids:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          description: L1 target nodes. Every target has an edge to every L2 endpoint node in the source revision.
          items: {type: string, format: uuid}
    TargetSnapshot:
      type: object
      additionalProperties: false
      required: [id, revision, tenant_scope_id, source_line_group_id, source_revision, source_configuration_digest, node_set_digest, node_ids]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        tenant_scope_id: {type: string, format: uuid}
        source_line_group_id: {type: string, format: uuid}
        source_revision: {type: integer, format: int64, minimum: 1}
        source_configuration_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        node_set_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        node_ids:
          type: array
          items: {type: string, format: uuid}
    RollbackRequest:
      type: object
      additionalProperties: false
      required: [source_revision]
      properties:
        source_revision: {type: integer, format: int64, minimum: 1}
