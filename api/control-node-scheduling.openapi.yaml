components:
  securitySchemes:
    tenantBearer:
      type: http
      scheme: bearer
      bearerFormat: access-token
      description: Tenant session manages its own scope. A platform session without target_scope_id manages the platform scope; an explicit tenant target is read-only.
    tenantAPIKey:
      type: apiKey
      in: header
      name: Authorization
      description: "Authorization: CdncaKey <credential>. Tenant only; platform API keys fail closed."
  parameters:
    L2ConfigID:
      name: id
      in: path
      required: true
      description: "Non-zero L2 configuration UUID."
      x-description-zh: 非零 L2 配置 UUID。
      schema: {$ref: '#/components/schemas/L2UUID'}
    L2ConditionID:
      name: id
      in: path
      required: true
      description: "Non-zero L2 match condition UUID."
      x-description-zh: 非零 L2 匹配条件 UUID。
      schema: {$ref: '#/components/schemas/L2UUID'}
    L2MembershipID:
      name: id
      in: path
      required: true
      description: "Non-zero L2 node member UUID; not the node's node_id."
      x-description-zh: 非零 L2 节点成员 UUID；不同于节点 node_id。
      schema: {$ref: '#/components/schemas/L2UUID'}
    NodeID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LineGroupID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Revision:
      name: revision
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    SourceRevision:
      name: source_revision
      in: query
      required: true
      description: Single positive decimal source line-group revision.
      schema: {type: integer, format: int64, minimum: 1}
    TargetScopeID:
      name: target_scope_id
      in: query
      required: false
      description: Tenant credentials may omit this value or repeat their own scope. Platform Bearer credentials omit it to target the platform scope; an explicit tenant scope is allowed only on read or decision operations.
      schema: {type: string, format: uuid}
    IfMatchCreate:
      name: If-Match
      in: header
      required: true
      description: Must be the single exact quoted value "0".
      schema: {type: string, const: '"0"'}
    IfMatchUpdate:
      name: If-Match
      in: header
      required: true
      description: Single quoted positive decimal current revision, for example "3".
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
    RequestID:
      name: X-Request-ID
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
  headers:
    ETag:
      description: Quoted decimal immutable revision.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    IdempotencyReplayed:
      description: Present as true only when the stored response was replayed.
      schema: {type: string, enum: ['true']}
  responses:
    Error:
      description: Stable error envelope; messages are not localization keys.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    SmartScheduleWrite:
      type: object
      additionalProperties: false
      required: [enabled, top_n, granularity, latency_window_minutes, max_load_percent]
      properties:
        enabled: {type: boolean}
        top_n: {type: integer, minimum: 1, maximum: 20}
        granularity: {type: string, enum: [carrier, province_carrier]}
        latency_window_minutes: {type: integer, minimum: 5, maximum: 60}
        max_load_percent: {type: integer, minimum: 1, maximum: 100}
    SmartSchedulePick:
      type: object
      additionalProperties: false
      required: [address, endpoint_id, latency_ms, healthy, load_percent]
      properties:
        address: {type: string}
        endpoint_id: {type: string, format: uuid}
        latency_ms: {type: [integer, 'null'], minimum: 1}
        healthy: {type: boolean}
        load_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
    SmartScheduleLine:
      type: object
      additionalProperties: false
      required: [scope, dns_line, source, selected, updated_at]
      properties:
        scope: {type: string, description: "telecom / unicom / mobile, or <province>:<carrier> such as 广东:mobile."}
        dns_line: {type: string, description: "Unified DNS line written; empty when the province line has no provider line."}
        source: {type: string, enum: [latency, static, fallback]}
        selected: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/SmartSchedulePick'}}
        fallback_from: {type: string, enum: [province_carrier, carrier]}
        updated_at: {type: string, format: date-time}
    SmartSchedule:
      type: object
      additionalProperties: false
      required: [enabled, top_n, granularity, latency_window_minutes, max_load_percent, fallback, province_lines_supported, lines, probe_source, revision]
      properties:
        enabled: {type: boolean}
        top_n: {type: integer, minimum: 1, maximum: 20}
        granularity: {type: string, enum: [carrier, province_carrier]}
        latency_window_minutes: {type: integer, minimum: 5, maximum: 60}
        max_load_percent: {type: integer, minimum: 1, maximum: 100}
        fallback: {type: string, enum: [carrier_then_default]}
        province_lines_supported: {type: boolean, description: "False when a DNS provider of the line group's sites cannot write province lines; only carrier lines are written then."}
        lines: {type: array, items: {$ref: '#/components/schemas/SmartScheduleLine'}}
        probe_source:
          type: object
          additionalProperties: false
          required: [dnspup, peer_nodes]
          properties:
            dnspup: {type: boolean}
            peer_nodes: {type: boolean}
        revision: {type: integer, minimum: 0}
    LatencyMatrix:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [province, carrier, endpoint_id, address, p50_ms, samples, last_at]
            properties:
              province: {type: string}
              carrier: {type: string, enum: [telecom, unicom, mobile]}
              endpoint_id: {type: string, format: uuid}
              address: {type: string}
              p50_ms: {type: integer, minimum: 1}
              samples: {type: integer, minimum: 1}
              last_at: {type: string, format: date-time}
    L2UUID:
      type: string
      format: uuid
      not: {const: '00000000-0000-0000-0000-000000000000'}
    L2ConditionReference:
      description: "An undeleted match condition in the same scope; omitted or null means no condition, a zero UUID is invalid."
      x-description-zh: 同一作用域内未删除的匹配条件；省略或 null 表示不关联条件，零 UUID 不合法。
      anyOf:
        - $ref: '#/components/schemas/L2UUID'
        - type: 'null'
    L2Name:
      type: string
      minLength: 1
      maxLength: 128
      description: "Name; trimmed on write, then checked by Unicode character count; control characters are rejected."
      x-description-zh: 名称；写入时去除首尾空白后按 Unicode 字符数校验，禁止控制字符。
    L2Region:
      type: string
      minLength: 0
      maxLength: 64
      description: "Required region name; an explicit empty string is the default region, the same as a line group's default region, not a region UUID. A non-empty string of only whitespace is invalid; other names are trimmed on write, then checked by Unicode character count; control characters are rejected. An existing non-empty name (including the built-in default region name) keeps its value and is not the same as the empty string."
