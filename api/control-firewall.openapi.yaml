openapi: 3.1.0
info:
  title: CDNCA Global Firewall Control API
  version: 1.0.0
  description: Tenant-isolated immutable firewall policy, recovery, deployment state, and hit-log query.
servers: [{url: /}]
security: [{bearerAuth: []}]
paths:
  /v1/firewall/policy:
    get:
      operationId: getGlobalFirewallPolicy
      x-required-permissions: [firewall.read]
      parameters: [{$ref: '#/components/parameters/TargetScopeID'}]
      responses:
        '200':
          description: Current desired and active firewall state
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: putGlobalFirewallPolicy
      x-required-permissions: [firewall.manage]
      parameters:
        - {$ref: '#/components/parameters/TargetScopeID'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PolicyInput'}}}
      responses:
        '200':
          description: Durable desired revision and pending deployment
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/firewall/policy/recover:
    post:
      operationId: recoverGlobalFirewallPolicy
      description: Creates a new monotonic revision from a known-good historical document; it never rewinds version counters.
      x-required-permissions: [firewall.manage]
      parameters:
        - {$ref: '#/components/parameters/TargetScopeID'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryRequest'}}}
      responses:
        '200':
          description: Recovery revision accepted for signed publication
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/firewall/hits:
    get:
      operationId: listGlobalFirewallHits
      x-required-permissions: [firewall.read]
      parameters:
        - {$ref: '#/components/parameters/TargetScopeID'}
        - {name: site_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
      responses:
        '200':
          description: Stable snapshot-bound page from the ClickHouse hit-log authority
          content: {application/json: {schema: {$ref: '#/components/schemas/HitPage'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    TargetScopeID: {name: target_scope_id, in: query, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[0-9]+"$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$'}}
    RequestID: {name: X-Request-ID, in: header, required: true, schema: {$ref: '#/components/schemas/UUID'}}
  headers:
    ETag: {description: Quoted desired revision, schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
  responses:
    BadRequest: {description: Invalid policy or request metadata, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Policy absent or outside the actor tenant, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: 'Revision or idempotency conflict, or shared_node_host_firewall_unsupported - the scope owns no active node; shared platform nodes never take tenant host rules (use site access control)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    UUID: {type: string, format: uuid}
    Error:
      type: object
      additionalProperties: false
      required: [code]
      properties: {code: {type: string}, request_id: {$ref: '#/components/schemas/UUID'}}
    Rule:
      type: object
      additionalProperties: false
      required: [priority, action, cidrs, protocol, site_ids]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        priority: {type: integer, minimum: 1, maximum: 1000000}
        action: {type: string, enum: [allow, deny]}
        cidrs: {type: array, minItems: 1, maxItems: 256, uniqueItems: true, items: {type: string}}
        protocol: {type: string, enum: [any, tcp, udp, icmp]}
        port_start: {type: integer, minimum: 1, maximum: 65535}
        port_end: {type: integer, minimum: 1, maximum: 65535}
        site_ids: {type: array, maxItems: 128, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
        expires_at: {type: string, format: date-time}
    PolicyInput:
      type: object
      additionalProperties: false
      required: [enabled, default_action, rules]
      properties:
        enabled: {type: boolean}
        default_action: {type: string, enum: [allow, deny]}
        rules: {type: array, maxItems: 10000, items: {$ref: '#/components/schemas/Rule'}}
    Policy:
      allOf:
        - {$ref: '#/components/schemas/PolicyInput'}
        - type: object
          required: [id, tenant_scope_id, revision, active_revision, deployment_state, updated_at]
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            tenant_scope_id: {$ref: '#/components/schemas/UUID'}
            revision: {type: integer, minimum: 1}
            active_revision: {type: integer, minimum: 0}
            deployment_state:
              type: string
              enum: [pending, canary, active, partial, failed, rolled_back]
              description: >-
                failed without node commands when the scope owns no active node or has no enabled site (host rules are
                addressed per site and owned node; P0-a: no longer retried every 30 seconds); the next save publishes again.
            active_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [recover_revision, reason]
      properties:
        recover_revision: {type: integer, minimum: 1}
        reason: {type: string, enum: [false_positive, health_failure, operator_request]}
    Hit:
      type: object
      required: [id, occurred_at, tenant_scope_id, node_id, client_ip, protocol, action, reason_code]
      properties:
        id: {type: string}
        occurred_at: {type: string, format: date-time}
        tenant_scope_id: {$ref: '#/components/schemas/UUID'}
        site_id: {$ref: '#/components/schemas/UUID'}
        node_id: {$ref: '#/components/schemas/UUID'}
        rule_id: {$ref: '#/components/schemas/UUID'}
        client_ip: {type: string}
        protocol: {type: string, enum: [any, tcp, udp, icmp]}
        destination_port: {type: integer, minimum: 1, maximum: 65535}
        action: {type: string, enum: [allow, deny]}
        reason_code: {type: string}
    HitPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Hit'}}
        next_cursor: {type: string}
