openapi: 3.1.0
info:
  title: CDNCA Rebuild Control Analytics Query API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Read-only ClickHouse-backed summary, UTC hourly trend, high-cardinality
    ranking, and finalized connections retention contracts. Platform and tenant
    identities use separate route namespaces.
servers:
  - url: /
paths:
  /v1/admin/analytics/summary:
    get:
      operationId: getPlatformAnalyticsSummary
      summary: Read a platform or explicitly selected tenant summary
      description: >-
        Requires a platform-scoped identity with sites.read or platform.admin.
        Omitting tenant_id queries all tenants; providing tenant_id narrows the
        query to that tenant. The time window is left-closed and right-open.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/SummaryOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/admin/analytics/blocked-ip-count:
    get:
      operationId: getPlatformAnalyticsBlockedIPCount
      summary: Count distinct client IPs blocked by the global firewall or CC auto-bans
      description: >-
        Requires a platform-scoped identity with sites.read or platform.admin.
        Counts distinct client_ip values from global_firewall block events and CC
        temporary_ban events in the
        left-closed, right-open window and is bounded by one ingestion snapshot.
        It is not the current ACL cardinality.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/BlockedIPCountOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/admin/analytics/peak-bandwidth:
    get:
      operationId: getPlatformAnalyticsPeakBandwidth
      summary: Busiest 5-minute bandwidth in the window
      description: >-
        Requires a platform-scoped identity with sites.read or platform.admin. Returns the response bandwidth of the busiest 5-minute bucket
        (bucket bytes * 8 / 300) in the left-closed, right-open window, bounded
        by one ingestion snapshot. The hourly trend average flattens bursts.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/PeakBandwidthOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/admin/analytics/blocked-ip-trend:
    get:
      operationId: getPlatformAnalyticsBlockedIPTrend
      summary: Read the hourly distinct client IPs blocked by the global firewall
      description: >-
        Requires a platform-scoped identity with sites.read or platform.admin.
        Each returned UTC bucket contains the distinct client_ip count from
        global_firewall block events, bounded by one ingestion snapshot.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/BlockedIPTrendOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/admin/analytics/waf-overview:
    get:
      operationId: getPlatformWAFOverview
      summary: Read WAF-only attack counters and hourly trend
      description: Counts event_type=waf security facts only; global firewall and CC events are excluded.
      security: [{bearerAuth: []}]
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Domain'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/WAFOverviewOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/admin/analytics/hourly-trend:
    get:
      operationId: getPlatformAnalyticsHourlyTrend
      summary: Read a platform or explicitly selected tenant hourly trend
      description: >-
        Requires a platform-scoped identity with sites.read or platform.admin.
        Buckets are UTC hours and only buckets containing events are returned.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/TrendOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/admin/analytics/site-realtime:
    get:
      operationId: getPlatformSiteRealtime
      summary: Read platform-wide or one tenant's finalized site realtime facts
      description: >-
        Requires a platform identity with sites.read or platform.admin. Omitting
        tenant_id queries all tenants; providing it narrows the query to one tenant.
        With query_version=2 the exact minute-aligned [from,to) interval is projected without rounding.
        Without query_version, legacy hour alignment and the original response keys are preserved.
        Its enclosing complete UTC hours must first have independent PostgreSQL
        source coverage; their expected counts are reconciled with a single
        ClickHouse access scan shared by all exact-range projections.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/RealtimeFrom'
        - $ref: '#/components/parameters/RealtimeTo'
        - $ref: '#/components/parameters/RealtimeTenantID'
        - $ref: '#/components/parameters/RealtimeQueryVersion'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/ListenPort'
      responses:
        '200': {$ref: '#/components/responses/RealtimeOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/admin/analytics/top/{dimension}:
    get:
      operationId: getPlatformAnalyticsTop
      summary: Page through a platform or selected tenant ranking
      description: >-
        Requires a platform-scoped identity with sites.read or platform.admin.
        The cursor is bound to scope, filters, dimension, and an ingestion
        snapshot. Reusing it with changed inputs returns 400. Empty JA4,
        region, carrier, or Referer values are returned as __unknown__.
        Referer is read case-insensitively from captured request headers;
        capture-disabled and over-limit values are also grouped as __unknown__.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/Dimension'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/RankDomains'
        - $ref: '#/components/parameters/NodeID'
        - $ref: '#/components/parameters/ListenPort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/RankOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '422': {$ref: '#/components/responses/UnsupportedDimension'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/analytics/summary:
    get:
      operationId: getTenantAnalyticsSummary
      summary: Read the authenticated tenant summary
      description: >-
        Requires a tenant-scoped identity with sites.read. Scope is always
        derived from the authenticated identity. tenant_id is not accepted and
        an attempted override returns 403.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/SummaryOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/analytics/blocked-ip-count:
    get:
      operationId: getTenantAnalyticsBlockedIPCount
      summary: Count distinct client IPs blocked by the global firewall or CC auto-bans
      description: >-
        Requires a tenant-scoped identity with sites.read. Counts distinct
        client_ip values from global_firewall block events and CC temporary_ban
        events in the left-closed,
        right-open window and is bounded by one ingestion snapshot. It is not
        the current ACL cardinality.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/BlockedIPCountOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/analytics/peak-bandwidth:
    get:
      operationId: getTenantAnalyticsPeakBandwidth
      summary: Busiest 5-minute bandwidth in the window
      description: >-
        Requires a tenant-scoped identity with sites.read. Returns the response bandwidth of the busiest 5-minute bucket
        (bucket bytes * 8 / 300) in the left-closed, right-open window, bounded
        by one ingestion snapshot. The hourly trend average flattens bursts.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/PeakBandwidthOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/analytics/blocked-ip-trend:
    get:
      operationId: getTenantAnalyticsBlockedIPTrend
      summary: Read the hourly distinct client IPs blocked by the global firewall
      description: >-
        Requires a tenant-scoped identity with sites.read. Each returned UTC
        bucket contains the distinct client_ip count from global_firewall block
        events, bounded by one ingestion snapshot.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/BlockedIPTrendOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/analytics/waf-overview:
    get:
      operationId: getTenantWAFOverview
      summary: Read WAF-only attack counters and hourly trend
      description: Counts event_type=waf security facts only; global firewall and CC events are excluded.
      security: [{bearerAuth: []}, {cdncaApiKey: []}]
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Domain'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/WAFOverviewOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/analytics/hourly-trend:
    get:
      operationId: getTenantAnalyticsHourlyTrend
      summary: Read the authenticated tenant hourly trend
      description: >-
        Requires a tenant-scoped identity with sites.read. Buckets are UTC
        hours and only buckets containing events are returned.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200': {$ref: '#/components/responses/TrendOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/analytics/site-realtime:
    get:
      operationId: getTenantSiteRealtime
      summary: Read finalized realtime facts for the authenticated tenant
      description: >-
        Tenant scope is derived exclusively from the authenticated identity.
        tenant_id is rejected. With query_version=2 the exact minute-aligned [from,to) interval is not
        rounded; without it, legacy hour alignment and original response keys apply.
        Missing or unfinalized evidence for any enclosing full UTC hour
        fails closed; zero traffic is returned only with complete source coverage.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/RealtimeFrom'
        - $ref: '#/components/parameters/RealtimeTo'
        - $ref: '#/components/parameters/RealtimeQueryVersion'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/ListenPort'
      responses:
        '200': {$ref: '#/components/responses/RealtimeOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/analytics/top/{dimension}:
    get:
      operationId: getTenantAnalyticsTop
      summary: Page through an authenticated tenant ranking
      description: >-
        Requires a tenant-scoped identity with sites.read. Scope comes only
        from the authenticated identity. The cursor is bound to scope, filters,
        dimension, and an ingestion snapshot. Empty JA4, region, carrier, or
        Referer values are returned as __unknown__. Referer is read
        case-insensitively from captured request headers; capture-disabled and
        over-limit values are also grouped as __unknown__.
      security:
        - bearerAuth: []
        - cdncaApiKey: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/Dimension'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/RankDomains'
        - $ref: '#/components/parameters/NodeID'
        - $ref: '#/components/parameters/ListenPort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/RankOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestCancelled'}
        '422': {$ref: '#/components/responses/UnsupportedDimension'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /v1/admin/analytics/connections/retention:
    get:
      operationId: getPlatformAnalyticsConnectionsRetention
      summary: Read finalized connections retention facts for a tenant subscription
      description: >-
        Requires a revocable platform Bearer session with sites.read and
        platform.admin. Tenant and subscription scope are mandatory and every
        returned fact is finalized, evidence-bound, and ordered by UTC period.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read, platform.admin]
      parameters:
        - $ref: '#/components/parameters/RetentionTenantID'
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/RetentionFrom'
        - $ref: '#/components/parameters/RetentionTo'
        - $ref: '#/components/parameters/RetentionLimit'
      responses:
        '200': {$ref: '#/components/responses/ConnectionsRetentionOK'}
        '400': {$ref: '#/components/responses/RetentionBadRequest'}
        '401': {$ref: '#/components/responses/RetentionUnauthorized'}
        '403': {$ref: '#/components/responses/RetentionForbidden'}
        '408': {$ref: '#/components/responses/RetentionRequestTimeout'}
        '502': {$ref: '#/components/responses/RetentionBadGateway'}
        '503': {$ref: '#/components/responses/RetentionServiceUnavailable'}
  /v1/analytics/connections/retention:
    get:
      operationId: getTenantAnalyticsConnectionsRetention
      summary: Read finalized connections retention facts for the authenticated tenant
      description: >-
        Requires a revocable tenant Bearer session with sites.read. Tenant scope
        is derived exclusively from that session; tenant_id is rejected.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/RetentionFrom'
        - $ref: '#/components/parameters/RetentionTo'
        - $ref: '#/components/parameters/RetentionLimit'
      responses:
        '200': {$ref: '#/components/responses/ConnectionsRetentionOK'}
        '400': {$ref: '#/components/responses/RetentionBadRequest'}
        '401': {$ref: '#/components/responses/RetentionUnauthorized'}
        '403': {$ref: '#/components/responses/RetentionForbidden'}
        '408': {$ref: '#/components/responses/RetentionRequestTimeout'}
        '502': {$ref: '#/components/responses/RetentionBadGateway'}
        '503': {$ref: '#/components/responses/RetentionServiceUnavailable'}
  /v1/admin/analytics/connections/dead-letters:
    get:
      operationId: listPlatformAnalyticsConnectionsDeadLetters
      summary: List durable analytics connections dead-letter receipts
      description: >-
        Requires a revocable platform Bearer session with sites.read and
        platform.admin. An optional tenant_id narrows the digest-only durable
        receipt projection to one tenant. Raw payloads are never returned.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read, platform.admin]
      parameters:
        - $ref: '#/components/parameters/DeadLetterTenantID'
        - $ref: '#/components/parameters/DeadLetterLimit'
        - $ref: '#/components/parameters/DeadLetterAfterSequence'
      responses:
        '200': {$ref: '#/components/responses/ConnectionsDeadLetterOK'}
        '400': {$ref: '#/components/responses/DeadLetterBadRequest'}
        '401': {$ref: '#/components/responses/DeadLetterUnauthorized'}
        '403': {$ref: '#/components/responses/DeadLetterForbidden'}
        '404': {$ref: '#/components/responses/DeadLetterNotFound'}
        '408': {$ref: '#/components/responses/DeadLetterRequestTimeout'}
        '502': {$ref: '#/components/responses/DeadLetterBadGateway'}
        '503': {$ref: '#/components/responses/DeadLetterServiceUnavailable'}
  /v1/admin/analytics/connections/dead-letters/{dead_letter_id}:
    get:
      operationId: getPlatformAnalyticsConnectionsDeadLetter
      summary: Read one durable analytics connections dead-letter receipt
      description: >-
        Requires a revocable platform Bearer session with sites.read and
        platform.admin. The response is a digest-only durable receipt and never
        includes raw payload or secret fields.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read, platform.admin]
      parameters:
        - $ref: '#/components/parameters/DeadLetterID'
      responses:
        '200': {$ref: '#/components/responses/ConnectionsDeadLetterDetailOK'}
        '400': {$ref: '#/components/responses/DeadLetterBadRequest'}
        '401': {$ref: '#/components/responses/DeadLetterUnauthorized'}
        '403': {$ref: '#/components/responses/DeadLetterForbidden'}
        '404': {$ref: '#/components/responses/DeadLetterNotFound'}
        '408': {$ref: '#/components/responses/DeadLetterRequestTimeout'}
        '502': {$ref: '#/components/responses/DeadLetterBadGateway'}
        '503': {$ref: '#/components/responses/DeadLetterServiceUnavailable'}
  /v1/analytics/connections/dead-letters:
    get:
      operationId: listTenantAnalyticsConnectionsDeadLetters
      summary: List durable analytics connections dead-letter receipts
      description: >-
        Requires a revocable tenant Bearer session with sites.read. Tenant
        scope is derived exclusively from that session; the response is a
        digest-only durable receipt projection with no raw payload.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/DeadLetterLimit'
        - $ref: '#/components/parameters/DeadLetterAfterSequence'
      responses:
        '200': {$ref: '#/components/responses/ConnectionsDeadLetterOK'}
        '400': {$ref: '#/components/responses/DeadLetterBadRequest'}
        '401': {$ref: '#/components/responses/DeadLetterUnauthorized'}
        '403': {$ref: '#/components/responses/DeadLetterForbidden'}
        '404': {$ref: '#/components/responses/DeadLetterNotFound'}
        '408': {$ref: '#/components/responses/DeadLetterRequestTimeout'}
        '502': {$ref: '#/components/responses/DeadLetterBadGateway'}
        '503': {$ref: '#/components/responses/DeadLetterServiceUnavailable'}
  /v1/analytics/connections/dead-letters/{dead_letter_id}:
    get:
      operationId: getTenantAnalyticsConnectionsDeadLetter
      summary: Read one durable analytics connections dead-letter receipt
      description: >-
        Requires a revocable tenant Bearer session with sites.read. The tenant
        scope is derived exclusively from the session and raw payload is never
        returned.
      security:
        - bearerAuth: []
      x-required-permissions: [sites.read]
      parameters:
        - $ref: '#/components/parameters/DeadLetterID'
      responses:
        '200': {$ref: '#/components/responses/ConnectionsDeadLetterDetailOK'}
        '400': {$ref: '#/components/responses/DeadLetterBadRequest'}
        '401': {$ref: '#/components/responses/DeadLetterUnauthorized'}
        '403': {$ref: '#/components/responses/DeadLetterForbidden'}
        '404': {$ref: '#/components/responses/DeadLetterNotFound'}
        '408': {$ref: '#/components/responses/DeadLetterRequestTimeout'}
        '502': {$ref: '#/components/responses/DeadLetterBadGateway'}
        '503': {$ref: '#/components/responses/DeadLetterServiceUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cdncaApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Send `CdncaKey <key_id>.<secret>`.
  parameters:
    From:
      name: from
      in: query
      required: true
      description: >-
        RFC3339 instant. After UTC normalization it must be exactly hour
        aligned and earlier than to.
      schema: {type: string, format: date-time}
      example: '2026-07-23T00:00:00Z'
    To:
      name: to
      in: query
      required: true
      description: >-
        Exclusive RFC3339 instant. After UTC normalization it must be exactly
        hour aligned. The window may not exceed 31 days.
      schema: {type: string, format: date-time}
      example: '2026-07-23T06:00:00Z'
    TenantID:
      name: tenant_id
      in: query
      required: false
      description: Platform route only. Omit for all tenants.
      schema: {type: string, format: uuid}
    RealtimeFrom:
      name: from
      in: query
      required: true
      description: Inclusive RFC3339 instant, exactly minute aligned after UTC normalization with query_version=2, otherwise hour aligned; never silently rounded.
      schema: {type: string, format: date-time}
    RealtimeTo:
      name: to
      in: query
      required: true
      description: Exclusive RFC3339 instant, exactly minute aligned after UTC normalization with query_version=2, otherwise hour aligned; later than from and no more than 31 days apart.
      schema: {type: string, format: date-time}
    RealtimeQueryVersion:
      name: query_version
      in: query
      required: false
      description: >-
        Explicit opt-in to minute queries and extended series/evidence. 3 adds coverage fields and returns
        settled hours when other enclosing hours are not finalized yet (coverage_complete=false, missing_windows
        lists the excluded hour starts) instead of 503. 4 is the realtime monitor: it reads every fact ingested
        so far, the unsettled current hour included, with no settlement reconciliation (coverage_complete=true,
        expected_events=0, finalized_through and source_watermark at the Unix epoch); it is a display read and
        never feeds billing. Omit for the legacy hour-aligned response; other values, empty or repeated values
        are rejected.
      schema: {type: integer, enum: [2, 3, 4]}
    RealtimeTenantID:
      name: tenant_id
      in: query
      required: false
      description: Platform route only. Omit for all tenants or provide one exact tenant scope.
      schema: {type: string, format: uuid}
    RetentionTenantID:
      name: tenant_id
      in: query
      required: true
      description: Exact tenant scope for the platform retention route.
      schema: {type: string, format: uuid}
    SubscriptionID:
      name: subscription_id
      in: query
      required: true
      description: Package subscription authority captured at event time.
      schema: {type: string, format: uuid}
    RetentionFrom:
      name: from
      in: query
      required: true
      description: Inclusive canonical UTC RFC3339 instant.
      schema: {type: string, format: date-time}
      example: '2026-08-07T00:00:00Z'
    RetentionTo:
      name: to
      in: query
      required: true
      description: Exclusive canonical UTC RFC3339 instant; the window may not exceed 31 days.
      schema: {type: string, format: date-time}
      example: '2026-08-08T00:00:00Z'
    RetentionLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
    DeadLetterID:
      name: dead_letter_id
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    DeadLetterTenantID:
      name: tenant_id
      in: query
      required: false
      description: Optional platform scope narrowing to one canonical tenant UUID.
      schema: {type: string, format: uuid}
    DeadLetterLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    DeadLetterAfterSequence:
      name: after_sequence
      in: query
      required: false
      description: Exclusive decimal JetStream dead-letter stream sequence cursor.
      schema: {type: integer, format: uint64, minimum: 1}
    SiteID:
      name: site_id
      in: query
      required: false
      schema: {type: string, format: uuid}
    Domain:
      name: domain
      in: query
      required: false
      description: >-
        Up to 64 exact case-insensitive request Host filters for WAF overview
        routes, separated by one space. Duplicate and non-canonical values are
        rejected.
      schema:
        type: string
        maxLength: 4096
        pattern: '^(?=.{1,4096}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+(?: [a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+){0,63}$'
    RankDomains:
      name: domain
      in: query
      required: false
      description: >-
        Up to 64 exact request Host filters. Values are lowercased, trailing
        dots are removed, duplicates are removed, and canonical values are
        separated by one space before the cursor fingerprint is computed.
      schema:
        type: string
        maxLength: 16255
        pattern: '^(?=.{1,16255}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+(?: [a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+){0,63}$'
    NodeID:
      name: node_id
      in: query
      required: false
      schema: {type: string, format: uuid}
    Host:
      name: host
      in: query
      required: false
      description: One or more canonical lowercase hosts without trailing dots, separated by single spaces.
      schema: {type: string, maxLength: 16255, pattern: '^[a-z0-9.-]+(?: [a-z0-9.-]+){0,63}$'}
    ListenPort:
      name: listen_port
      in: query
      required: false
      description: Exact production listen port. Omit to include legacy port-zero facts.
      schema: {type: integer, minimum: 1, maximum: 65535}
    Dimension:
      name: dimension
      in: path
      required: true
      description: >-
        region is the stored ISO country code. Empty JA4, region, or carrier
        values are returned as __unknown__. referer is derived from captured
        request headers and does not imply that request-header capture is enabled.
      schema:
        type: string
        enum: [url, ip, domain, region, carrier, ja4, referer]
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the preceding response; maximum 8192 bytes.
      schema: {type: string, maxLength: 8192}
  headers:
    RequestID:
      description: Stable request correlation ID, also present in error bodies.
      schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$'}
  schemas:
    QueryMetadata:
      type: object
      additionalProperties: false
      required: [from, to, timezone, metric_version]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        timezone: {type: string, const: UTC}
        metric_version: {type: integer, const: 1}
    SummaryMetrics:
      allOf:
        - $ref: '#/components/schemas/MetricValues'
      unevaluatedProperties: false
    MetricValues:
      type: object
      required:
        - metric_version
        - request_count
        - request_bytes
        - response_bytes
        - total_bytes
        - average_bandwidth_bps
        - status_2xx
        - status_3xx
        - status_4xx
        - status_5xx
        - security_events
      properties:
        metric_version: {type: integer, const: 1}
        request_count: {type: integer, format: uint64, minimum: 0}
        request_bytes: {type: integer, format: uint64, minimum: 0}
        response_bytes: {type: integer, format: uint64, minimum: 0}
        total_bytes: {type: integer, format: uint64, minimum: 0}
        average_bandwidth_bps: {type: number, format: double, minimum: 0}
        status_2xx: {type: integer, format: uint64, minimum: 0}
        status_3xx: {type: integer, format: uint64, minimum: 0}
        status_4xx: {type: integer, format: uint64, minimum: 0}
        status_5xx: {type: integer, format: uint64, minimum: 0}
        security_events: {type: integer, format: uint64, minimum: 0, description: Security events in requests (aggregated events count their requests).}
        security_event_rows: {type: integer, format: uint64, minimum: 0, description: Security event records.}
    SummaryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/SummaryMetrics'}
        meta: {$ref: '#/components/schemas/QueryMetadata'}
    PeakBandwidthResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [peak_bandwidth_bps, bucket_seconds]
          properties:
            peak_bandwidth_bps: {type: integer, format: uint64, minimum: 0}
            bucket_seconds: {type: integer, enum: [300]}
        meta: {$ref: '#/components/schemas/QueryMetadata'}
    BlockedIPCountResponse:
      type: object
      additionalProperties: false
      required: [blocked_ip_count, meta]
      properties:
        blocked_ip_count: {type: integer, format: uint64, minimum: 0}
        meta: {$ref: '#/components/schemas/QueryMetadata'}
    BlockedIPTrendResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 744
          items: {$ref: '#/components/schemas/BlockedIPTrendPoint'}
        meta: {$ref: '#/components/schemas/QueryMetadata'}
    BlockedIPTrendPoint:
      type: object
      additionalProperties: false
      required: [hour, blocked_ip_count]
      properties:
        hour: {type: string, format: date-time}
        blocked_ip_count: {type: integer, format: uint64, minimum: 0}
    WAFTrendPoint:
      type: object
      additionalProperties: false
      required: [hour, attacks, blocked, intercepted, observed, auto_blocked, clients]
      properties:
        hour: {type: string, format: date-time}
        attacks: {type: integer, format: uint64, minimum: 0}
        blocked: {type: integer, format: uint64, minimum: 0}
        intercepted: {type: integer, format: uint64, minimum: 0}
        observed: {type: integer, format: uint64, minimum: 0}
        auto_blocked: {type: integer, format: uint64, minimum: 0}
        clients: {type: integer, format: uint64, minimum: 0}
    WAFRankItem:
      type: object
      additionalProperties: false
      required: [key, count]
      properties:
        key: {type: string, minLength: 1, maxLength: 4096}
        count: {type: integer, format: uint64, minimum: 1}
        name:
          type: string
          maxLength: 256
          description: attack_types only. The rule name when key is a policy rule ID or an OWASP CRS rule ID; omitted when unknown.
    WAFOverview:
      type: object
      additionalProperties: false
      required: [attacks, blocked, intercepted, observed, auto_blocked, clients, trend, attack_types, top_domains, top_clients, top_countries, top_provinces, top_carriers, top_uris]
      properties:
        attacks: {type: integer, format: uint64, minimum: 0}
        blocked: {type: integer, format: uint64, minimum: 0}
        intercepted: {type: integer, format: uint64, minimum: 0}
        observed: {type: integer, format: uint64, minimum: 0}
        auto_blocked: {type: integer, format: uint64, minimum: 0}
        clients: {type: integer, format: uint64, minimum: 0}
        trend:
          type: array
          maxItems: 744
          items: {$ref: '#/components/schemas/WAFTrendPoint'}
        attack_types:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/WAFRankItem'}
        top_domains:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/WAFRankItem'}
        top_clients:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/WAFRankItem'}
        top_countries:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/WAFRankItem'}
        top_provinces:
          type: array
          maxItems: 10
          description: Empty until the security-event schema records a province dimension.
          items: {$ref: '#/components/schemas/WAFRankItem'}
        top_carriers:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/WAFRankItem'}
        top_uris:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/WAFRankItem'}
    WAFOverviewResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/WAFOverview'}
        meta: {$ref: '#/components/schemas/QueryMetadata'}
    TrendPoint:
      allOf:
        - $ref: '#/components/schemas/MetricValues'
        - type: object
          required: [hour]
          properties:
            hour: {type: string, format: date-time}
      unevaluatedProperties: false
    TrendResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 744
          items: {$ref: '#/components/schemas/TrendPoint'}
        meta: {$ref: '#/components/schemas/QueryMetadata'}
    RealtimeMetrics:
      type: object
      additionalProperties: false
      required: [requests, traffic_bytes, bandwidth_bps, connections, status_2xx, status_3xx, status_4xx, status_5xx, cache_hits, cache_misses, errors, average_duration_us, origin_connect_us, origin_first_byte_us, origin_total_us]
      properties:
        requests: {type: integer, format: uint64, minimum: 0}
        traffic_bytes: {type: integer, format: uint64, minimum: 0}
        bandwidth_bps: {type: number, minimum: 0}
        connections: {type: integer, format: uint64, minimum: 0}
        status_2xx: {type: integer, format: uint64, minimum: 0}
        status_3xx: {type: integer, format: uint64, minimum: 0}
        status_4xx: {type: integer, format: uint64, minimum: 0}
        status_5xx: {type: integer, format: uint64, minimum: 0}
        cache_hits: {type: integer, format: uint64, minimum: 0}
        cache_misses: {type: integer, format: uint64, minimum: 0}
        errors: {type: integer, format: uint64, minimum: 0}
        average_duration_us: {type: number, minimum: 0}
        origin_connect_us: {type: number, minimum: 0}
        origin_first_byte_us: {type: number, minimum: 0}
        origin_total_us: {type: number, minimum: 0}
    RealtimePoint:
      type: object
      additionalProperties: false
      required: [bucket, requests, traffic_bytes, bandwidth_bps, connections, cache_hits, cache_misses, cache_hit_bytes, status_4xx, status_5xx, origin_total_us, origin_traffic_bytes, origin_bandwidth_bps]
      properties:
        bucket: {type: string, format: date-time}
        requests: {type: integer, format: uint64, minimum: 0}
        traffic_bytes: {type: integer, format: uint64, minimum: 0}
        bandwidth_bps: {type: number, minimum: 0}
        connections: {type: integer, format: uint64, minimum: 0}
        cache_hits: {type: integer, format: uint64, minimum: 0}
        cache_misses: {type: integer, format: uint64, minimum: 0}
        cache_hit_bytes:
          type: integer
          format: uint64
          minimum: 0
          description: Sum of request_bytes plus response_bytes for cache HIT requests; denominator traffic_bytes uses the same bidirectional traffic definition.
        status_4xx: {type: integer, format: uint64, minimum: 0}
        status_5xx: {type: integer, format: uint64, minimum: 0}
        origin_total_us:
          type: [number, 'null']
          minimum: 0
          description: Mean of non-null measured upstream total durations in this bucket; null when no upstream duration was measured.
        origin_traffic_bytes:
          type: ['null']
          description: Unavailable until upstream byte counters are collected. Never inferred from client traffic or cache misses.
        origin_bandwidth_bps:
          type: ['null']
          description: Unavailable until upstream byte counters are collected; not zero traffic.
    RealtimeTopItem:
      type: object
      additionalProperties: false
      required: [host, listen_port, requests, traffic_bytes]
      properties:
        host: {type: string, maxLength: 253}
        listen_port: {type: integer, minimum: 0, maximum: 65535}
        requests: {type: integer, format: uint64, minimum: 1}
        traffic_bytes: {type: integer, format: uint64, minimum: 0}
    RealtimeEvidence:
      type: object
      additionalProperties: false
      required: [access_source_count, connection_source_count, expected_events, observed_events, error_ppm, finalized_through, source_watermark, coverage_from, coverage_to, snapshot_at]
      properties:
        access_source_count: {type: integer, format: uint64, minimum: 0}
        connection_source_count: {type: integer, format: uint64, minimum: 0}
        expected_events:
          type: integer
          format: uint64
          minimum: 0
          description: Independent PostgreSQL expected access count over [coverage_from,coverage_to), not the exact query subrange.
        observed_events:
          type: integer
          format: uint64
          minimum: 0
          description: Observed access count over the same full coverage hours from the same scan as the exact query projections.
        error_ppm: {type: integer, format: uint64, minimum: 0, maximum: 10000}
        finalized_through: {type: string, format: date-time}
        source_watermark: {type: string, format: date-time}
        coverage_from: {type: string, format: date-time, description: Inclusive enclosing UTC hour.}
        coverage_to: {type: string, format: date-time, description: Exclusive enclosing UTC hour; a 31-day minute-offset query can require 745 full hours.}
        snapshot_at: {type: string, format: date-time, description: Shared ingestion cutoff for access ingested_at and connection updated_at.}
    RealtimeResult:
      type: object
      additionalProperties: false
      required: [metric_version, series_bucket_seconds, summary, series, top, evidence]
      properties:
        metric_version: {type: integer, const: 1}
        series_bucket_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          multipleOf: 60
          description: Explicit downsampling width, 60 times ceil(query minutes / 744). Buckets start at from; the last bucket uses its actual shorter duration for bandwidth. Empty access buckets are omitted.
        summary: {$ref: '#/components/schemas/RealtimeMetrics'}
        series:
          type: array
          maxItems: 744
          items: {$ref: '#/components/schemas/RealtimePoint'}
        top:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/RealtimeTopItem'}
        evidence: {$ref: '#/components/schemas/RealtimeEvidence'}
    RealtimeCoverageEvidence:
      allOf:
        - $ref: '#/components/schemas/RealtimeEvidence'
        - type: object
          required: [coverage_complete, requested_windows, covered_windows, missing_windows]
          properties:
            coverage_complete: {type: boolean, description: True when every enclosing hour is settled.}
            requested_windows: {type: integer, minimum: 1, maximum: 745}
            covered_windows: {type: integer, minimum: 0, maximum: 745}
            missing_windows:
              type: array
              maxItems: 745
              description: Unsettled enclosing hour starts, ascending. Their facts are excluded from summary, series, top and reconciliation.
              items: {type: string, format: date-time}
    RealtimeCoverageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/RealtimeResult'
            - type: object
              properties:
                evidence: {$ref: '#/components/schemas/RealtimeCoverageEvidence'}
        meta:
          type: object
          additionalProperties: false
          required: [from, to, timezone, metric_version, query_version]
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            timezone: {type: string, const: UTC}
            metric_version: {type: integer, const: 1}
            query_version: {type: integer, enum: [3, 4]}
    RealtimeResponse:
      oneOf:
        - $ref: '#/components/schemas/RealtimeCoverageResponse'
        - $ref: '#/components/schemas/RealtimeMinuteResponse'
        - $ref: '#/components/schemas/RealtimeLegacyResponse'
    RealtimeMinuteResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/RealtimeResult'}
        meta:
          type: object
          additionalProperties: false
          required: [from, to, timezone, metric_version, query_version]
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            timezone: {type: string, const: UTC}
            metric_version: {type: integer, const: 1}
            query_version: {type: integer, const: 2}
    RealtimeLegacyResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [metric_version, summary, series, top, evidence]
          properties:
            metric_version: {type: integer, const: 1}
            summary: {$ref: '#/components/schemas/RealtimeMetrics'}
            series:
              type: array
              maxItems: 744
              items:
                type: object
                additionalProperties: false
                required: [bucket, requests, traffic_bytes, bandwidth_bps, connections]
                properties:
                  bucket: {type: string, format: date-time}
                  requests: {type: integer, format: uint64, minimum: 0}
                  traffic_bytes: {type: integer, format: uint64, minimum: 0}
                  bandwidth_bps: {type: number, minimum: 0}
                  connections: {type: integer, format: uint64, minimum: 0}
            top:
              type: array
              maxItems: 10
              items: {$ref: '#/components/schemas/RealtimeTopItem'}
            evidence:
              type: object
              additionalProperties: false
              required: [access_source_count, connection_source_count, expected_events, observed_events, error_ppm, finalized_through, source_watermark]
              properties:
                access_source_count: {type: integer, format: uint64, minimum: 0}
                connection_source_count: {type: integer, format: uint64, minimum: 0}
                expected_events: {type: integer, format: uint64, minimum: 0}
                observed_events: {type: integer, format: uint64, minimum: 0}
                error_ppm: {type: integer, format: uint64, minimum: 0, maximum: 10000}
                finalized_through: {type: string, format: date-time}
                source_watermark: {type: string, format: date-time}
        meta: {$ref: '#/components/schemas/QueryMetadata'}
    RankItem:
      type: object
      additionalProperties: false
      required: [key, request_count, response_bytes]
      properties:
        key: {type: string, maxLength: 4355}
        request_count: {type: integer, format: uint64, minimum: 0}
        response_bytes: {type: integer, format: uint64, minimum: 0}
        host: {type: string, maxLength: 253, description: 'domain and url rankings: the host of the key.'}
        port: {type: integer, minimum: 0, maximum: 65535, description: 'domain and url rankings: the listen port; omitted when unknown (events before listen_port was recorded).'}
        path: {type: string, maxLength: 4096, description: 'url ranking: the request path. The url ranking groups by host, port and path.'}
        scheme: {type: string, enum: [http, https], description: 'url ranking: https when the site serves HTTPS on port, http otherwise; omitted when unknown.'}
    RankPage:
      type: object
      additionalProperties: false
      required: [snapshot_at]
      properties:
        next_cursor: {type: string, maxLength: 8192}
        snapshot_at: {type: string, format: date-time}
    RankResponse:
      type: object
      additionalProperties: false
      required: [data, dimension, page, meta]
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/RankItem'}
        dimension:
          type: string
          enum: [url, ip, domain, region, carrier, ja4, referer]
        page: {$ref: '#/components/schemas/RankPage'}
        meta: {$ref: '#/components/schemas/QueryMetadata'}
    ConnectionsRetentionItem:
      type: object
      additionalProperties: false
      required:
        - metric
        - tenant_id
        - subscription_id
        - period_start
        - period_end
        - value
        - finalized_through
        - source_watermark
        - evidence_digest
        - retention_until
      properties:
        metric: {type: string, const: connections}
        tenant_id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        value: {type: integer, format: uint64, minimum: 1}
        finalized_through: {type: string, format: date-time}
        source_watermark: {type: integer, format: uint64, minimum: 1}
        evidence_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        retention_until: {type: string, format: date-time}
    ConnectionsRetentionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
          items:
            type: array
            maxItems: 1000
            items: {$ref: '#/components/schemas/ConnectionsRetentionItem'}
    ConnectionsDeadLetterItem:
      type: object
      additionalProperties: false
      required:
        - dead_letter_id
        - batch_id
        - receipt_id
        - event_id
        - tenant_id
        - reason
        - attempt
        - max_deliver
        - source_stream
        - source_sequence
        - consumer_sequence
        - dead_letter_stream
        - dead_letter_sequence
        - created_at
        - settled_at
        - payload_digest
      properties:
        dead_letter_id: {type: string, pattern: '^[0-9a-f]{64}$'}
        batch_id: {type: string, maxLength: 256}
        receipt_id: {type: string, maxLength: 256}
        event_id: {type: string, maxLength: 256}
        tenant_id: {type: string, format: uuid}
        reason: {type: string, enum: [invalid_delivery, receipt_conflict, clickhouse_unavailable, clickhouse_outcome_unknown, max_deliver_exhausted]}
        attempt: {type: integer, format: uint64, minimum: 1}
        max_deliver: {type: integer, format: uint64, minimum: 1}
        source_stream: {type: string, maxLength: 256}
        source_sequence: {type: integer, format: uint64, minimum: 1}
        consumer_sequence: {type: integer, format: uint64, minimum: 1}
        dead_letter_stream: {type: string, maxLength: 256}
        dead_letter_sequence: {type: integer, format: uint64, minimum: 1}
        created_at: {type: string, format: date-time}
        settled_at: {type: string, format: date-time}
        payload_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
    ConnectionsDeadLetterPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/ConnectionsDeadLetterItem'}
        next_after_sequence: {type: integer, format: uint64, minimum: 1}
    ConnectionsDeadLetterDetail:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item: {$ref: '#/components/schemas/ConnectionsDeadLetterItem'}
    RetentionErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string, pattern: '^retention_[a-z_]+$'}
        message: {type: string}
        request_id: {type: string}
    RetentionErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/RetentionErrorDetail'}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string, pattern: '^analytics_[a-z_]+$'}
        message: {type: string}
        request_id: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    DeadLetterErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string, pattern: '^connections_dead_letter_[a-z_]+$'}
        message: {type: string}
        request_id: {type: string}
    DeadLetterErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/DeadLetterErrorDetail'}
  responses:
    BlockedIPTrendOK:
      description: Hourly distinct client IPs blocked by global firewall events.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/BlockedIPTrendResponse'}}}
    PeakBandwidthOK:
      description: Busiest 5-minute bandwidth in the normalized UTC window.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/PeakBandwidthResponse'}}}
    BlockedIPCountOK:
      description: Distinct client IPs blocked by global firewall events or auto-banned by CC rules in the normalized UTC window.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/BlockedIPCountResponse'}}}
    WAFOverviewOK:
      description: WAF-only attack counters and hourly trend, excluding CC and global-firewall events.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/WAFOverviewResponse'}}}
    SummaryOK:
      description: Aggregated metrics for the normalized UTC window.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/SummaryResponse'}}}
    TrendOK:
      description: UTC hourly metrics ordered by hour ascending.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/TrendResponse'}}}
    RealtimeOK:
      description: Finalized atomic site realtime facts and source reconciliation evidence.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/RealtimeResponse'}}}
    RankOK:
      description: Deterministically ordered ranking page from one ingestion snapshot.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/RankResponse'}}}
    ConnectionsRetentionOK:
      description: Finalized connections facts in ascending period order.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionsRetentionPage'}}}
    RetentionBadRequest:
      description: retention_invalid_request
      content: {application/json: {schema: {$ref: '#/components/schemas/RetentionErrorResponse'}}}
    RetentionUnauthorized:
      description: retention_authentication_required
      content: {application/json: {schema: {$ref: '#/components/schemas/RetentionErrorResponse'}}}
    RetentionForbidden:
      description: retention_permission_denied
      content: {application/json: {schema: {$ref: '#/components/schemas/RetentionErrorResponse'}}}
    RetentionRequestTimeout:
      description: retention_request_timeout
      content: {application/json: {schema: {$ref: '#/components/schemas/RetentionErrorResponse'}}}
    RetentionBadGateway:
      description: retention_invalid_response or retention_response_too_large
      content: {application/json: {schema: {$ref: '#/components/schemas/RetentionErrorResponse'}}}
    RetentionServiceUnavailable:
      description: retention_unavailable; no zero-value fact is substituted.
      content: {application/json: {schema: {$ref: '#/components/schemas/RetentionErrorResponse'}}}
    ConnectionsDeadLetterOK:
      description: Digest-only durable DLQ receipts ordered by dead-letter stream sequence.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionsDeadLetterPage'}}}
    ConnectionsDeadLetterDetailOK:
      description: One digest-only durable DLQ receipt.
      headers: {X-Request-ID: {$ref: '#/components/headers/RequestID'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionsDeadLetterDetail'}}}
    DeadLetterBadRequest:
      description: connections_dead_letter_invalid_request
      content: {application/json: {schema: {$ref: '#/components/schemas/DeadLetterErrorResponse'}}}
    DeadLetterUnauthorized:
      description: connections_dead_letter_authentication_required
      content: {application/json: {schema: {$ref: '#/components/schemas/DeadLetterErrorResponse'}}}
    DeadLetterForbidden:
      description: connections_dead_letter_permission_denied
      content: {application/json: {schema: {$ref: '#/components/schemas/DeadLetterErrorResponse'}}}
    DeadLetterNotFound:
      description: connections_dead_letter_not_found
      content: {application/json: {schema: {$ref: '#/components/schemas/DeadLetterErrorResponse'}}}
    DeadLetterRequestTimeout:
      description: connections_dead_letter_request_timeout
      content: {application/json: {schema: {$ref: '#/components/schemas/DeadLetterErrorResponse'}}}
    DeadLetterBadGateway:
      description: connections_dead_letter_invalid_response or connections_dead_letter_response_too_large
      content: {application/json: {schema: {$ref: '#/components/schemas/DeadLetterErrorResponse'}}}
    DeadLetterServiceUnavailable:
      description: connections_dead_letter_unavailable; no zero-value receipt is substituted.
      content: {application/json: {schema: {$ref: '#/components/schemas/DeadLetterErrorResponse'}}}
    BadRequest:
      description: analytics_invalid_request
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unauthorized:
      description: analytics_authentication_required
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Forbidden:
      description: analytics_permission_denied or analytics_scope_forbidden
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RequestCancelled:
      description: analytics_request_cancelled
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    UnsupportedDimension:
      description: analytics_dimension_unsupported
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    BadGateway:
      description: >-
        analytics_storage_rejected, analytics_storage_invalid_response, or
        analytics_response_too_large
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ServiceUnavailable:
      description: >-
        analytics_storage_unavailable or analytics_realtime_evidence_unavailable; no zero-value data is substituted.
        site-realtime with query_version=3 returns partial coverage instead of analytics_realtime_evidence_unavailable
        for unsettled hours; dependency failures remain 503.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    GatewayTimeout:
      description: analytics_query_timeout
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
