openapi: 3.1.0
info:
  title: CDNCA Platform System Other Settings API
  version: 0.1.0
  description: Platform administrator operational settings for source IP handling, DNS protection, synchronization, resource rankings, HTTP proxy and traffic coefficient.
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - {url: /}
security:
  - bearerAuth: []
paths:
  /v1/admin/system-other-settings:
    get:
      summary: Read platform other settings
      operationId: getPlatformSystemOtherSettings
      x-summary-zh: "读取平台其他设置"
      x-required-permissions: [system_configuration.read]
      responses:
        '200': {description: Current operational settings, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {description: Unexpected internal failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Settings storage or policy is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      summary: Update platform other settings
      operationId: updatePlatformSystemOtherSettings
      x-summary-zh: "修改平台其他设置"
      x-required-permissions: [system_configuration.manage]
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WriteRequest'}}}
      responses:
        '200': {description: Saved operational settings, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Revision or idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {description: Unexpected internal failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Settings storage or policy is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[0-9]+"$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$', minLength: 1, maxLength: 128}}
    RequestID: {name: X-Request-ID, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            details:
              description: On a 400 system_other_settings_validation_error that names the refused field of the save body (value.<field>) and a machine reason.
              x-description-zh: 能定位字段的 400 system_other_settings_validation_error 附带 field（保存请求体路径 value.<字段>）与 reason 机器码。
              type: object
              additionalProperties: false
              required: [field, reason]
              properties:
                field: {type: string}
                reason: {type: string}
              example: {field: value.sync_batch, reason: out_of_range}
    Document:
      type: object
      additionalProperties: false
      required: [schema, revision, value]
      properties:
        schema: {const: cdnca.platform-system-other-settings/v1}
        revision: {type: integer, minimum: 0, maximum: 9223372036854775806}
        updated_at: {type: string, format: date-time}
        value: {$ref: '#/components/schemas/Settings'}
    WriteRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties: {value: {$ref: '#/components/schemas/Settings'}}
    Settings:
      type: object
      additionalProperties: false
      required: [source_ip_header, api_key_enabled, dns_protection, record_repair_mode, sync_batch, sync_scope, disable_failed_sync_nodes, resource_rank, http_proxy, tcp_factor]
      properties:
        source_ip_header:
          type: string
          enum: ['', CF-Connecting-IP, True-Client-IP, X-Forwarded-For, X-Real-IP]
          description: >-
            源IP请求头: the header the console takes the visitor address from behind a CDN; '' takes the direct
            connection's. X-Forwarded-For takes its leftmost address. A value that is not one valid IP address (or a
            missing header) keeps the connection's address. A request the console nginx confirmed with the origin key
            (install-control.sh origin-auth) keeps the address origin authentication gave. Applies from the save on,
            without a restart.
        api_key_enabled: {type: boolean, description: Globally enables tenant API key authentication and issuance}
        dns_protection: {type: string, maxLength: 2048, deprecated: true, description: "Comma-separated hostname prefixes. Stored and returned unchanged for compatibility; nothing reads it (not shown in the console)."}
        record_repair_mode: {type: string, enum: [off, repair, repair_delete_extra], deprecated: true, description: "Stored and returned unchanged for compatibility; nothing reads it (not shown in the console)."}
        sync_batch: {type: integer, minimum: 1, maximum: 10000, deprecated: true, description: "Stored and returned unchanged for compatibility; nothing reads it (not shown in the console)."}
        sync_scope: {type: string, enum: [region, line_group], deprecated: true, description: "Stored and returned unchanged for compatibility; nothing reads it (not shown in the console)."}
        disable_failed_sync_nodes: {type: boolean}
        resource_rank: {type: integer, minimum: 1, maximum: 1000, deprecated: true, description: "Stored and returned unchanged for compatibility; nothing reads it (not shown in the console)."}
        http_proxy: {type: string, maxLength: 2048, description: "HTTP(S) proxy the control plane's DNS provider API requests (record management, ACME DNS-01, credential checks) go through: http(s)://[user[:password]@]host[:port]; empty for direct. Environment proxies are never used for these requests and provider TLS is still verified. Reads show the password as ********; a save that sends the read value back keeps the stored password, a ******** password with another scheme, host, port or user is refused (value.http_proxy invalid). Applies on save in this instance and within 5 seconds in others. A request that cannot use the proxy fails with provider_proxy_unavailable (credential checks) or dns_provider_remote_proxy_unavailable (DNS jobs)."}
        tcp_factor: {type: number, minimum: 0.01, maximum: 100, deprecated: true, description: "Stored and returned unchanged for compatibility; nothing reads it (not shown in the console)."}
        l4_drain_max_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400
          description: >-
            How long existing L4 connections keep running on the worker generation a configuration change retires
            (e.g. after adding a port); 0 is unlimited. Responses always carry it; a request that omits it keeps the
            stored value. A value other than 86400 is published as drain_max_ms and requires node agents with tcp/udp v5.
