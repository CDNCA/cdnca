openapi: 3.1.0
info:
  title: CDNCA Site Access API
  version: 1.0.0
  description: >-
    A site's request handling: host
    redirects, HSTS, compression, per-client concurrency and per-request rate
    limits, basic authentication, a maintenance page, and the forced HTTPS
    status and excluded domains. Published to nodes in the site runtime v2
    document as site.access (site_runtime v5).
paths:
  /v1/sites/{site_id}/access:
    parameters:
      - {$ref: '#/components/parameters/SiteID'}
    get:
      operationId: getSiteAccess
      summary: Get a site's request handling settings
      description: >-
        Basic auth users are returned by name only; passwords are never stored
        or returned. Tenant principals only reach sites of their scope. ETag
        is the site version.
      x-required-permissions: [sites.read]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The site's settings
          headers:
            ETag: {$ref: '#/components/headers/SiteETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteAccessState'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: replaceSiteAccess
      summary: Replace a site's request handling settings
      description: >-
        Replaces every setting; an absent or null setting is off, and all off
        removes the site's row. A basic auth user without password keeps its
        stored secret (SHA-256 of site_id:username:password). HSTS and a
        forced HTTPS status other than 301 or excluded domains need the
        site's HTTPS. The write advances the site version: a manual scope
        shows it pending, an automatic scope publishes it. The write and its
        site.access.update audit event (changes, no secrets) commit together;
        a refused write is audited as denied with its reason code.
      x-required-permissions: [sites.manage]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/SiteIfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteAccessSettings'}
      responses:
        '200':
          description: The site's settings after the write
          headers:
            ETag: {$ref: '#/components/headers/SiteETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteAccessState'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: site_locked, version_conflict or idempotency_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: validation_error or site_access_https_required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    SiteID: {name: site_id, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$'}
    SiteIfMatch:
      name: If-Match
      in: header
      required: true
      description: The quoted site version (GET ETag)
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  headers:
    SiteETag:
      description: The quoted site version
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    HostRedirect:
      type: object
      additionalProperties: false
      required: [source_host, target_host, target_scheme, status, preserve_uri]
      properties:
        source_host: {type: string, description: One of the site's non-wildcard domains}
        target_host: {type: string, description: Lower-case FQDN}
        target_scheme: {type: string, enum: [http, https, follow]}
        target_port: {type: integer, minimum: 1, maximum: 65535}
        status: {type: integer, enum: [301, 302, 307, 308]}
        preserve_uri: {type: boolean, description: Keep the request path and query}
    HSTS:
      type: object
      additionalProperties: false
      required: [max_age_seconds, include_subdomains, preload]
      properties:
        max_age_seconds: {type: integer, minimum: 0, maximum: 63072000}
        include_subdomains: {type: boolean}
        preload: {type: boolean, description: Needs include_subdomains and max_age_seconds >= 31536000}
    Compression:
      type: object
      additionalProperties: false
      required: [enabled, types, min_length_bytes]
      properties:
        enabled: {type: boolean, description: false turns compression off for the site}
        types:
          type: array
          maxItems: 64
          items: {type: string, pattern: '^[^/\s]+/[^/\s]+$'}
          description: MIME types (text/html is always compressed); empty when disabled
        min_length_bytes: {type: integer, minimum: 0, maximum: 1073741824}
        encodings:
          type: array
          minItems: 1
          maxItems: 2
          items: {type: string, enum: [br, gzip]}
          description: >-
            Encodings the site sends (absent = gzip only; a client accepting
            both gets Brotli). Brotli needs nodes declaring EDGE_BROTLI.
        gzip_level: {type: integer, minimum: 0, maximum: 9, description: '0 = the node default (system gzip level); non-zero needs EDGE_BROTLI'}
        brotli_level: {type: integer, minimum: 0, maximum: 11, description: '0 = Brotli 6; only with br'}
    WebP:
      type: object
      additionalProperties: false
      required: [enabled]
      description: >-
        Convert JPEG/PNG to WebP for clients accepting image/webp (EDGE_WEBP).
        The first request for an image gets the original while the node
        converts it; images over 5 MiB or 8 megapixels, animated PNG and
        responses without ETag/Last-Modified stay the original.
      properties:
        enabled: {type: boolean, const: true}
        quality: {type: integer, minimum: 0, maximum: 100, description: 0 = 80}
    Limits:
      type: object
      additionalProperties: false
      properties:
        connections_per_ip: {type: integer, minimum: 0, maximum: 65535, description: Concurrent requests per client (429 above)}
        rate_bytes_per_second: {type: integer, minimum: 0, maximum: 10737418240, description: Response rate per request}
        rate_after_bytes: {type: integer, minimum: 0, description: Unthrottled bytes before the rate applies}
    BasicAuth:
      type: object
      additionalProperties: false
      required: [realm, users]
      properties:
        realm: {type: string, pattern: '^[A-Za-z0-9 ._@+-]{1,64}$'}
        users:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [username]
            properties:
              username: {type: string, pattern: '^[A-Za-z0-9._@+-]{1,64}$'}
              password: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
        exclude_path_prefixes:
          type: array
          maxItems: 32
          items: {type: string, pattern: '^/'}
    Maintenance:
      type: object
      additionalProperties: false
      required: [status, content_type, body]
      properties:
        status: {type: integer, minimum: 200, maximum: 599, description: Not 3xx}
        content_type: {type: string, enum: [text/html, text/plain, application/json]}
        body: {type: string, maxLength: 65536}
        retry_after_seconds: {type: integer, minimum: 0, maximum: 604800}
        allowed_cidrs:
          type: array
          maxItems: 64
          items: {type: string, description: Canonical CIDR served normally}
    ForceHTTPS:
      type: object
      additionalProperties: false
      properties:
        status: {type: integer, enum: [301, 302, 307, 308], default: 301}
        exclude_hosts:
          type: array
          items: {type: string}
          description: Site domains left on plain HTTP (not every domain)
    ResponseRule:
      type: object
      additionalProperties: false
      required: [id, action]
      description: >-
        Matches when the status is in one of statuses (absent = any) and every
        header condition holds. headers: apply header_actions and go on
        (also on cached responses); log: a security log line (type
        response) and go on; error_page: the site's error page of status
        (origin_response, then edge_route, else the built-in text page);
        block: status with the built-in text page and a security log line.
        log, error_page and block run on the origin's response only; a
        replaced response is not cached. The edge's own responses are never
        evaluated.
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', description: Unique within the site; the security log rule_id}
        statuses:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from: {type: integer, minimum: 100, maximum: 599}
              to: {type: integer, minimum: 100, maximum: 599}
        headers:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [name, op]
            properties:
              name: {type: string, maxLength: 128, description: Header name (stored lower case)}
              op: {type: string, enum: [exists, absent, equals, regex]}
              value: {type: string, maxLength: 1024, description: 'equals: exact value; regex: PCRE (RE2 syntax subset), at most 256 bytes; absent for exists/absent'}
        action: {type: string, enum: [headers, log, error_page, block]}
        header_actions:
          type: array
          minItems: 1
          maxItems: 16
          description: >-
            Only with action headers. Framing headers, Alt-Svc,
            Strict-Transport-Security, X-CDN-Cache, X-CDN-Cache-Reason and
            x-cdnca-* are refused (validation_error).
          items:
            type: object
            additionalProperties: false
            required: [kind, name]
            properties:
              kind: {type: string, enum: [set, add, delete]}
              name: {type: string, maxLength: 128}
              value: {type: string, minLength: 1, maxLength: 1024, description: Printable ASCII; absent for delete}
        status: {type: integer, minimum: 400, maximum: 599, description: Only with error_page / block}
    SiteAccessSettings:
      type: object
      additionalProperties: false
      properties:
        host_redirects:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/HostRedirect'}
        hsts: {oneOf: [{$ref: '#/components/schemas/HSTS'}, {type: 'null'}]}
        compression: {oneOf: [{$ref: '#/components/schemas/Compression'}, {type: 'null'}]}
        limits: {oneOf: [{$ref: '#/components/schemas/Limits'}, {type: 'null'}]}
        basic_auth: {oneOf: [{$ref: '#/components/schemas/BasicAuth'}, {type: 'null'}]}
        maintenance: {oneOf: [{$ref: '#/components/schemas/Maintenance'}, {type: 'null'}]}
        webp: {oneOf: [{$ref: '#/components/schemas/WebP'}, {type: 'null'}]}
        response_rules:
          type: array
          maxItems: 32
          description: >-
            Response phase rules, evaluated in order when the origin's
            response headers arrive (the body is never read). Absent or [] =
            none; a read always returns the list. Needs nodes declaring
            EDGE_RESPONSE_RULES (a release to others is refused and names them).
          items: {$ref: '#/components/schemas/ResponseRule'}
        force_https: {$ref: '#/components/schemas/ForceHTTPS'}
    SiteAccessState:
      type: object
      required: [site_id, version, settings, https_enabled, force_https, domains, updated_at]
      properties:
        site_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        settings: {$ref: '#/components/schemas/SiteAccessSettings'}
        https_enabled: {type: boolean}
        force_https: {type: boolean}
        domains: {type: array, items: {type: string}}
        updated_at: {type: [string, 'null'], format: date-time}
