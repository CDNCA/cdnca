openapi: 3.1.0
info:
  title: CDNCA Rebuild Package Commerce API
  version: 0.1.3
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Production-mounted BILL-02/03/11/12 HTTP contract over migration 051,
    migration 059, and packagecommerce.Service. Tenant commands and reads always derive tenant
    and owner scope from the current authenticated principal. Platform reads,
    refunds, and voids require an explicit target tenant and existing
    billing.adjustments.manage permission. Provider callbacks are accepted only
    when the default-off callback runtime is enabled with a valid versioned
    provider keyring. The production authenticator verifies the bounded raw
    request before returning a normalized callback; signature_verified is not a
    client field. The fragment is aggregated by the unified control API and
    mounted by control-api main behind a default-off runtime gate.

    This slice does not expose order retry/cancel, approval creation or approval,
    hold capture/release/expire, provider configuration, outbox delivery, or any
    raw provider payload endpoint. Those actions remain unsupported rather than
    being represented by placeholder operations.
servers:
  - url: /
tags:
  - name: Tenant package commerce
    description: Tenant-user package purchases, subscriptions, orders, and traffic results.
  - name: Platform package commerce
    description: Explicit-tenant operational reads and approved billing adjustments.
  - name: Payment provider callbacks
    description: Strict JSON callbacks authenticated with a configured provider HMAC key.
paths:
  /v1/package-commerce/catalog:
    get:
      tags: [Tenant package commerce]
      operationId: listPurchasablePackageCatalog
      summary: List package products purchasable by the authenticated tenant user
      description: >-
        Requires package_subscriptions.read. Only enabled products linked to a
        currently visible package group are returned. The first page freezes the
        authenticated tenant/user scope, business-time snapshot, catalog publish
        watermark, and package-group visibility watermark; later pages reuse the
        endpoint- and principal-bound signed cursor so catalog changes cannot
        produce mixed pages. The response contains display and purchase input
        fields only, including the immutable CC and DDoS protection description.
        ADR 0018 RS-03 (Q3): a reseller's customer sees only its reseller's
        packages, a direct customer only the platform's; traffic packages are
        always the platform's.
      security: [{bearerAuth: []}]
      x-required-permissions: [package_subscriptions.read]
      parameters:
        - $ref: '#/components/parameters/CatalogKind'
        - $ref: '#/components/parameters/CatalogGroupID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/CatalogPageOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/QueryCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /v1/package-commerce/purchases:
    post:
      tags: [Tenant package commerce]
      operationId: purchasePackageSubscription
      summary: Purchase a package subscription for the authenticated tenant user
      description: >-
        Requires a tenant principal with package_subscriptions.manage. Tenant and
        buyer IDs are derived from the live principal and cannot be supplied in
        the request body. Unknown results may be retried only with the original
        Idempotency-Key, If-Match value where applicable, and identical payload.
      security: [{bearerAuth: []}]
      x-required-permissions: [package_subscriptions.manage]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteRequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseRequest'}
      responses:
        '201': {$ref: '#/components/responses/CommandCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/UnknownResult'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/UnknownResult'}
        '504': {$ref: '#/components/responses/UnknownResult'}
  /v1/package-commerce/orders:
    get:
      tags: [Tenant package commerce]
      operationId: listMyPackageOrders
      summary: List the authenticated tenant user's package orders
      description: >-
        Requires package_subscriptions.read. Results are constrained by both
        principal scope and principal user ID. tenant_id is rejected.
      security: [{bearerAuth: []}]
      x-required-permissions: [package_subscriptions.read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/OrderProductKind'
        - $ref: '#/components/parameters/OrderState'
        - $ref: '#/components/parameters/OrderRequestID'
      responses:
        '200': {$ref: '#/components/responses/OrderPageOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/QueryCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /v1/package-commerce/orders/{order_id}:
    get:
      tags: [Tenant package commerce]
      operationId: getMyPackageOrder
      summary: Get one visible package order
      description: >-
        A foreign-tenant or different-owner order returns the same 404 as an
        unknown order and does not disclose existence.
      security: [{bearerAuth: []}]
      x-required-permissions: [package_subscriptions.read]
      parameters:
        - $ref: '#/components/parameters/OrderID'
      responses:
        '200': {$ref: '#/components/responses/OrderOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '408': {$ref: '#/components/responses/QueryCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /v1/package-commerce/orders/{order_id}/events:
    get:
      tags: [Tenant package commerce]
      operationId: listMyPackageOrderEvents
      summary: List sanitized order state events in revision order
      description: >-
        Event payload, actor, request/trace IDs, approval IDs, ledger IDs, holds,
        provider data, and digests are deliberately omitted.
      security: [{bearerAuth: []}]
      x-required-permissions: [package_subscriptions.read]
      parameters:
        - $ref: '#/components/parameters/OrderID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/EventPageOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '408': {$ref: '#/components/responses/QueryCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /v1/package-commerce/subscriptions:
    get:
      tags: [Tenant package commerce]
      operationId: listMySoldPackageSubscriptions
      summary: List effective sold-subscription projections owned by the current user
      description: >-
        Uses a fixed-time effective entitlement projection. Future scheduled
        entitlements do not hide the currently effective revision. The first page
        freezes an exact UTC microsecond business-time snapshot, migration 059's
        entitlement committed-fact high-water mark, and migration 062's immutable
        subscription-state high-water mark. Each subsequent page reuses all three
        values from the endpoint-, tenant-, and owner-bound signed cursor, so later
        entitlement backfills, renewals, or cancellations cannot create mixed facts.
      security: [{bearerAuth: []}]
      x-required-permissions: [package_subscriptions.read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SubscriptionStatus'
        - $ref: '#/components/parameters/SubscriptionEndAtFrom'
        - $ref: '#/components/parameters/SubscriptionEndAtTo'
        - $ref: '#/components/parameters/IncludeSubscriptionProductName'
        - name: page
          in: query
          description: Page-jump mode (1-based, max 10000, mutually exclusive with cursor). Uses OFFSET within the same frozen snapshot and returns total.
          schema: {type: integer, minimum: 1, maximum: 10000}
      responses:
        '200': {$ref: '#/components/responses/SubscriptionPageOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/QueryCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /v1/package-commerce/subscriptions/{subscription_id}/renew:
    post:
      tags: [Tenant package commerce]
      operationId: renewPackageSubscription
      summary: Renew an active package subscription
      description: >-
        If-Match is the quoted current package_subscriptions revision and is
        passed to the core transaction as expected_revision.
      security: [{bearerAuth: []}]
      x-required-permissions: [package_subscriptions.manage]
      parameters:
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteRequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenewRequest'}
      responses:
        '201': {$ref: '#/components/responses/CommandCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/UnknownResult'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/UnknownResult'}
        '504': {$ref: '#/components/responses/UnknownResult'}
  /v1/package-commerce/reseller/customers/{customer_scope_id}/orders:
    get:
      tags: [Tenant package commerce]
      operationId: resellerListCustomerOrders
      summary: A reseller lists one of its customers' package orders
      description: >-
        ADR 0018 RS-05. Reseller tenant session with reseller.customers.read or reseller.customers.manage; the customer
        must be under the caller's active reseller scope (otherwise 403). Lists the whole customer scope (every owner);
        wholesale_minor is the reseller's own cost and is returned. tenant_id and operation are rejected.
      security: [{bearerAuth: []}]
      x-required-permissions: [reseller.customers.read]
      parameters:
        - {name: customer_scope_id, in: path, required: true, schema: {$ref: '#/components/schemas/CanonicalUUID'}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/OrderProductKind'
        - $ref: '#/components/parameters/OrderState'
        - $ref: '#/components/parameters/OrderRequestID'
      responses:
        '200': {$ref: '#/components/responses/OrderPageOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/QueryCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /v1/package-commerce/reseller/customers/{customer_scope_id}/subscriptions:
    get:
      tags: [Tenant package commerce]
      operationId: resellerListCustomerSubscriptions
      summary: A reseller lists one of its customers' package subscriptions
      description: >-
        ADR 0018 RS-05. Same snapshot and paging rules as /v1/package-commerce/subscriptions, over the whole customer
        scope; reseller.customers.read or reseller.customers.manage, customer under the caller (otherwise 403).
      security: [{bearerAuth: []}]
      x-required-permissions: [reseller.customers.read]
      parameters:
        - {name: customer_scope_id, in: path, required: true, schema: {$ref: '#/components/schemas/CanonicalUUID'}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SubscriptionStatus'
        - $ref: '#/components/parameters/SubscriptionEndAtFrom'
        - $ref: '#/components/parameters/SubscriptionEndAtTo'
        - $ref: '#/components/parameters/IncludeSubscriptionProductName'
        - name: page
          in: query
          description: Page-jump mode (1-based, max 10000, mutually exclusive with cursor).
          schema: {type: integer, minimum: 1, maximum: 10000}
      responses:
        '200': {$ref: '#/components/responses/SubscriptionPageOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/QueryCancelled'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /v1/package-commerce/reseller/customers/{customer_scope_id}/purchases:
    post:
      tags: [Tenant package commerce]
      operationId: resellerPurchaseForCustomer
      summary: A reseller buys one of its packages for its own customer
      description: >-
        ADR 0018 RS-03. The caller is a reseller tenant session with reseller.customers.manage; the customer must be
        under it and the package must be the reseller's. Only the reseller's prepaid wholesale cost (W, from its price
        list) is charged; the customer's balance is untouched (funding_source reseller). The subscription belongs to
        owner_user_id in the customer scope. 422 reseller_prepaid_insufficient when the prepaid balance is short of W
        (nothing is written); 422 reseller_wholesale_unpriced when the main line group has no wholesale price for the period.
      security: [{bearerAuth: []}]
      x-required-permissions: [reseller.customers.manage]
      parameters:
        - {name: customer_scope_id, in: path, required: true, schema: {$ref: '#/components/schemas/CanonicalUUID'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteRequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [owner_user_id, product_id, product_revision, period]
              properties:
                owner_user_id: {$ref: '#/components/schemas/CanonicalUUID'}
                product_id: {$ref: '#/components/schemas/CanonicalUUID'}
                product_revision: {type: integer, format: int64, minimum: 1}
                period: {$ref: '#/components/schemas/PackagePeriod'}
      responses:
        '201': {$ref: '#/components/responses/CommandCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/UnknownResult'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/UnknownResult'}
        '504': {$ref: '#/components/responses/UnknownResult'}
  /v1/package-commerce/reseller/customers/{customer_scope_id}/subscriptions/{subscription_id}/renew:
    post:
      tags: [Tenant package commerce]
      operationId: resellerRenewForCustomer
      summary: A reseller renews its customer's subscription to one of its packages
      description: >-
        ADR 0018 RS-03. Same rules as the reseller purchase: only W is charged. If-Match is the quoted current
        subscription revision. A renewal carrying a platform add-on cannot be reseller-placed (409).
      security: [{bearerAuth: []}]
      x-required-permissions: [reseller.customers.manage]
      parameters:
        - {name: customer_scope_id, in: path, required: true, schema: {$ref: '#/components/schemas/CanonicalUUID'}}
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteRequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [period]
              properties:
                period: {$ref: '#/components/schemas/PackagePeriod'}
      responses:
        '201': {$ref: '#/components/responses/CommandCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/UnknownResult'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/UnknownResult'}
        '504': {$ref: '#/components/responses/UnknownResult'}
  /v1/package-commerce/reseller/customers/{customer_scope_id}/subscriptions/{subscription_id}/upgrade:
    post:
      tags: [Tenant package commerce]
      operationId: resellerUpgradeForCustomer
      summary: A reseller upgrades its customer's subscription to another of its packages
      description: >-
        ADR 0019 §5 / Q2 a (bb03). Only between the reseller's own packages, immediately. The customer pays
        nothing; the reseller's prepaid balance moves by the wholesale difference prorated over the remaining
        part of the current cycle (old price rounded down, new price rounded up, as proration-utc-v1). An
        upgrade charges it (422 reseller_prepaid_insufficient when short: nothing is written); a downgrade
        returns it. The order's seller is the reseller and wholesale_minor is the difference. If-Match is the
        quoted current subscription revision.
      security: [{bearerAuth: []}]
      x-required-permissions: [reseller.customers.manage]
      parameters:
        - {name: customer_scope_id, in: path, required: true, schema: {$ref: '#/components/schemas/CanonicalUUID'}}
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteRequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, product_revision, period]
              properties:
                product_id: {$ref: '#/components/schemas/CanonicalUUID'}
                product_revision: {type: integer, minimum: 1}
                period: {$ref: '#/components/schemas/PackagePeriod'}
      responses:
        '201': {$ref: '#/components/responses/CommandCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/UnknownResult'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/UnknownResult'}
        '504': {$ref: '#/components/responses/UnknownResult'}
  /v1/package-commerce/reseller/customers/{customer_scope_id}/subscriptions/{subscription_id}/downgrade:
    post:
      tags: [Tenant package commerce]
      operationId: resellerDowngradeForCustomer
      summary: A reseller downgrades its customer's subscription to another of its packages
      description: >-
        ADR 0019 §5 / Q2 a (bb03). Only between the reseller's own packages, immediately. The customer pays
        nothing; the reseller's prepaid balance moves by the wholesale difference prorated over the remaining
        part of the current cycle (old price rounded down, new price rounded up, as proration-utc-v1). An
        upgrade charges it (422 reseller_prepaid_insufficient when short: nothing is written); a downgrade
        returns it. The order's seller is the reseller and wholesale_minor is the difference. If-Match is the
        quoted current subscription revision.
      security: [{bearerAuth: []}]
      x-required-permissions: [reseller.customers.manage]
      parameters:
        - {name: customer_scope_id, in: path, required: true, schema: {$ref: '#/components/schemas/CanonicalUUID'}}
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteRequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, product_revision, period]
              properties:
                product_id: {$ref: '#/components/schemas/CanonicalUUID'}
                product_revision: {type: integer, minimum: 1}
                period: {$ref: '#/components/schemas/PackagePeriod'}
      responses:
        '201': {$ref: '#/components/responses/CommandCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/UnknownResult'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/UnknownResult'}
        '504': {$ref: '#/components/responses/UnknownResult'}
  /v1/package-commerce/reseller/customers/{customer_scope_id}/subscriptions/{subscription_id}/cancel:
    post:
      tags: [Tenant package commerce]
      operationId: resellerCancelCustomerSubscription
      summary: A reseller cancels its customer's subscription
      description: >-
        ADR 0019 §5 (bb03). Same behavior as the platform's cancel (the sites stop, no refund or ledger entry).
        The customer must be under the caller's active reseller scope.
      security: [{bearerAuth: []}]
      x-required-permissions: [reseller.customers.manage]
      parameters:
        - {name: customer_scope_id, in: path, required: true, schema: {$ref: '#/components/schemas/CanonicalUUID'}}
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteRequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '201': {$ref: '#/components/responses/AdminCancelCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /v1/package-commerce/reseller/customers/{customer_scope_id}/subscriptions/{subscription_id}/suspend:
    post:
      operationId: resellerSuspendCustomerSubscription
      summary: Suspend one package subscription as the customer's reseller
      description: >-
        ADR 0019 §5 (bb03, migration 551). Stops publishing the subscription's sites and forwards (configuration kept) and republishes the scope at once. The term keeps running. Only this subscription is affected. Suspending an already suspended subscription succeeds without a change. reason is required.
      security: [{bearerAuth: []}]
      x-required-permissions: [reseller.customers.manage]
      parameters:
        - {name: customer_scope_id, in: path, required: true, schema: {$ref: '#/components/schemas/CanonicalUUID'}}
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteRequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResellerSuspendSubscriptionRequest'}
      responses:
