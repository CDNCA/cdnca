  /v1/package-commerce/provider-callbacks/{provider}:
    post:
      tags: [Payment provider callbacks]
      operationId: applyVerifiedPaymentProviderCallback
      summary: Authenticate and apply one raw payment-provider callback
      description: >-
        No bearer identity is accepted as proof. All four callback headers must
        each have exactly one non-empty value without surrounding whitespace.
        The timestamp is canonical Unix seconds within the configured freshness
        window. The HMAC-SHA256 input is eleven newline-separated values in this
        order: cdnca.package-commerce.provider-callback.v1, the provider path
        value, provider_account_id, key ID, timestamp, external_event_id,
        external_payment_id, event_kind, canonical decimal amount_minor,
        currency, and the lowercase hexadecimal SHA-256 of the exact raw body.
        X-CDNCA-Callback-Signature is v1= followed by the canonical
        base64url-no-padding encoding of the 32-byte HMAC. Verification binds the
        provider, account, and key before the normalized callback reaches the
        commerce core. Exact and concurrent signed retries pass authentication;
        durable external_event_id plus raw payload SHA-256 idempotency returns the
        committed replay, while a changed payload returns provider_event_conflict.
        Raw payloads, credentials, keyring contents, and secrets are never
        returned by this endpoint.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: X-CDNCA-Callback-Version
          in: header
          required: true
          x-cdnca-single-value: true
          description: Exactly one value selecting callback signature version 1.
          schema: {type: string, const: '1'}
        - name: X-CDNCA-Callback-Key-ID
          in: header
          required: true
          x-cdnca-single-value: true
          description: Exactly one configured key identifier bound to the provider and provider account.
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        - name: X-CDNCA-Callback-Timestamp
          in: header
          required: true
          x-cdnca-single-value: true
          description: Exactly one canonical base-10 Unix-seconds value that fits signed int64.
          schema: {type: string, maxLength: 19, pattern: '^(0|[1-9][0-9]{0,18})$'}
        - name: X-CDNCA-Callback-Signature
          in: header
          required: true
          x-cdnca-single-value: true
          description: Exactly one v1= prefixed canonical base64url-no-padding encoding of the 32-byte HMAC-SHA256.
          schema: {type: string, pattern: '^v1=[A-Za-z0-9_-]{43}$'}
        - $ref: '#/components/parameters/OptionalRequestID'
        - $ref: '#/components/parameters/OptionalTraceparent'
      requestBody:
        required: true
        x-maxBodyBytes: 262144
        description: >-
          One non-empty UTF-8 JSON object, at most 256 KiB. Content-Type must be
          application/json with no parameter or only charset=utf-8. Duplicate
          fields, unknown fields, invalid UTF-8, and trailing JSON are rejected.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - version
                - provider_account_id
                - external_event_id
                - external_payment_id
                - event_kind
                - amount_minor
                - currency
                - occurred_at
              properties:
                version: {type: integer, const: 1}
                provider_account_id: {$ref: '#/components/schemas/ProviderIdentifier'}
                external_event_id: {$ref: '#/components/schemas/ProviderIdentifier'}
                external_payment_id: {$ref: '#/components/schemas/ProviderIdentifier'}
                event_kind:
                  type: string
                  enum: [payment_succeeded, payment_failed, refund_succeeded, void_succeeded]
                amount_minor: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
                currency: {type: string, const: CNY}
                occurred_at: {type: string, format: date-time}
      responses:
        '200':
          description: Normalized provider event processed or replayed.
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallbackResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CallbackUnauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '408': {$ref: '#/components/responses/UnknownResult'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/CallbackUnavailable'}
        '504': {$ref: '#/components/responses/UnknownResult'}
