openapi: 3.1.0
info:
  title: CDNCA L4 Line Switch API
  version: 1.0.0
  description: Versioned two-phase line-group switching with health gating, old-node drain, and compensating rollback.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/tenant-scopes/{scope_id}/l4-line-switches:
    post:
      operationId: createL4LineSwitch
      summary: Create an idempotent line-group switch
      parameters:
        - $ref: '#/components/parameters/ScopeID'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/CorrelationID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSwitch'
      responses:
        '201':
          description: Switch created or replayed
          headers:
            ETag:
              schema: { type: string }
            Location:
              schema: { type: string }
            X-Idempotent-Replay:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switch'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/tenant-scopes/{scope_id}/l4-line-switches/current:
    get:
      operationId: getCurrentL4LineSwitch
      summary: Read the latest durable switch for operator recovery
      parameters:
        - $ref: '#/components/parameters/ScopeID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Latest durable switch state
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switch'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/tenant-scopes/{scope_id}/l4-line-switches/{switch_id}:
    get:
      operationId: getL4LineSwitch
      summary: Read durable switch state
      parameters:
        - $ref: '#/components/parameters/ScopeID'
        - $ref: '#/components/parameters/SwitchID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Current state
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switch'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/tenant-scopes/{scope_id}/l4-line-switches/{switch_id}/reconcile:
    post:
      operationId: reconcileL4LineSwitch
      summary: Advance one idempotent state-machine step from durable facts
      description: The request has no body and cannot nominate a desired state. Production workers call the same service method.
      parameters:
        - $ref: '#/components/parameters/ScopeID'
        - $ref: '#/components/parameters/SwitchID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Current state after reconciliation
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switch'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ScopeID:
      name: scope_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UUID' }
    SwitchID:
      name: switch_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UUID' }
    RequestID:
      name: X-Request-ID
      in: header
      required: true
      schema: { $ref: '#/components/schemas/UUID' }
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { $ref: '#/components/schemas/UUID' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    Traceparent:
      name: Traceparent
      in: header
      required: true
      schema:
        type: string
        pattern: '^00-(?!0{32}-)[0-9a-f]{32}-(?!0{16}-)[0-9a-f]{16}-[0-9a-f]{2}$'
  responses:
    Error:
      description: Stable error code; clients map it through locale resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f-]{36}$'
    SHA256:
      type: string
      pattern: '^(?!0{64}$)[0-9a-f]{64}$'
    Snapshot:
      type: object
      additionalProperties: false
      required: [id, revision, sha256]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        revision: { type: integer, format: int64, minimum: 1 }
        sha256: { $ref: '#/components/schemas/SHA256' }
    HealthPolicy:
      type: object
      additionalProperties: false
      required: [activation_timeout_ms, observation_window_ms, required_consecutive_successes]
      properties:
        activation_timeout_ms: { type: integer, format: int64, minimum: 1, maximum: 86400000 }
        observation_window_ms: { type: integer, format: int64, minimum: 1, maximum: 86400000 }
        required_consecutive_successes: { type: integer, minimum: 1, maximum: 100 }
    DrainPolicy:
      type: object
      additionalProperties: false
      required: [health_timeout_ms, max_drain_ms]
      properties:
        health_timeout_ms: { type: integer, format: int64, minimum: 1, maximum: 300000 }
        max_drain_ms: { type: integer, format: int64, minimum: 1, maximum: 86400000 }
    CreateSwitch:
      type: object
      additionalProperties: false
      required: [expected_source_revision, from, to, health, drain, max_attempts, deadline]
      properties:
        expected_source_revision: { type: integer, format: int64, minimum: 1 }
        from: { $ref: '#/components/schemas/Snapshot' }
        to: { $ref: '#/components/schemas/Snapshot' }
        health: { $ref: '#/components/schemas/HealthPolicy' }
        drain: { $ref: '#/components/schemas/DrainPolicy' }
        max_attempts: { type: integer, minimum: 1, maximum: 10 }
        deadline: { type: string, format: date-time }
    Publication:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        rollout_id: { $ref: '#/components/schemas/UUID' }
        config_version_id: { $ref: '#/components/schemas/UUID' }
    Switch:
      type: object
      additionalProperties: false
      required:
        - id
        - configuration_scope_id
        - expected_source_revision
        - from
        - to
        - prepare_node_count
        - retiring_node_count
        - state
        - state_revision
        - prepare_publication
        - compensation_publication
        - drain_command_count
        - deadline
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        configuration_scope_id: { $ref: '#/components/schemas/UUID' }
        expected_source_revision: { type: integer, format: int64, minimum: 1 }
        from: { $ref: '#/components/schemas/Snapshot' }
        to: { $ref: '#/components/schemas/Snapshot' }
        prepare_node_count: { type: integer, minimum: 1, maximum: 10000 }
        retiring_node_count: { type: integer, minimum: 0, maximum: 10000 }
        state:
          type: string
          enum: [preparing, health_gate, draining_old, compensating_old, completed, rolled_back, needs_attention]
        state_revision: { type: integer, format: int64, minimum: 1 }
        prepare_publication: { $ref: '#/components/schemas/Publication' }
        compensation_publication: { $ref: '#/components/schemas/Publication' }
        drain_command_count: { type: integer, minimum: 0, maximum: 10000 }
        error_code: { type: string, pattern: '^[A-Z0-9_]{1,128}$' }
        dns_gate: { $ref: '#/components/schemas/DNSGate' }
        deadline: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        replayed: { type: boolean }
    DNSGate:
      type: object
      additionalProperties: false
      description: >-
        Present while a healthy switch waits in health_gate for the CNAME owners of
        the scope's L4 sites to stop resolving to the retiring nodes and for 2×TTL
        (at least five minutes) to pass. Not persisted; a reconcile returns it.
      required: [state, owners, pending_owners]
      properties:
        state: { type: string, enum: [ready, retarget_pending, propagation_wait] }
        owners: { type: integer, minimum: 0 }
        pending_owners: { type: integer, minimum: 0 }
        ready_at: { type: string, format: date-time }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code: { type: string }
            request_id: { type: string }
