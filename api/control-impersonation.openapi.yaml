openapi: 3.1.0
info:
  title: CDNCA Customer Control Admin Impersonation API
  version: 1.0.0
  description: Short-lived, one-time customer-control impersonation started from the admin user list "switch" action (no ticket, reason or MFA step-up; the grant reason is recorded as user_list_switch). Callers are platform administrators holding identity.impersonation.manage (any tenant) or, per ADR 0018 RS-07, members of an active reseller holding reseller.customers.manage, who may switch only to the reseller's own customers (tenants.parent_scope_id) and end only switches they started; anything else answers 403 impersonation_permission_denied and is audited in both scopes. Platform license operators are outside this identity domain.
servers:
  - url: /
paths:
  /v1/admin/impersonation/grants:
    post:
      operationId: createAdminImpersonationGrant
      summary: Create a two-minute one-time impersonation grant
      x-permission: identity.impersonation.manage | reseller.customers.manage
      security:
        - primaryBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantRequest'
      responses:
        '201':
          description: Grant created. The authorization_code is returned once per exact, unconsumed idempotent attempt and must be exchanged immediately.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateGrantResponse' }
        '200':
          description: Exact idempotent replay while the grant remains unconsumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateGrantResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/admin/impersonation/exchanges:
    post:
      operationId: exchangeAdminImpersonationGrant
      summary: Consume a grant and set a non-refreshable fifteen-minute session cookie
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '201':
          description: Authorization code consumed and session created. The opaque credential is returned only as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: cdnca_impersonation opaque credential with Path=/; Secure; HttpOnly; SameSite=Strict.
              schema: { type: string }
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeResponse' }
        '200':
          description: Exact exchange idempotency replay; the same session is reissued.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/InvalidCode' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/admin/impersonation/grants/{grant_id}/revocations:
    post:
      operationId: revokeAdminImpersonationGrant
      summary: Revoke a grant and every session derived from it
      x-permission: identity.impersonation.manage | reseller.customers.manage
      security:
        - primaryBearer: []
      parameters:
        - name: grant_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Revoked or exact idempotent replay. The impersonation cookie is expired.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revocation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    primaryBearer:
      type: http
      scheme: bearer
      bearerFormat: customer-control-primary-session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' }
    RequestID:
      name: X-Request-ID
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    Traceparent:
      name: Traceparent
      in: header
      required: true
      schema: { type: string, pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-(00|01)$' }
  schemas:
    UUID:
      type: string
      format: uuid
    CreateGrantRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_scope_id, subject_user_id]
      properties:
        tenant_id: { $ref: '#/components/schemas/UUID' }
        tenant_scope_id: { $ref: '#/components/schemas/UUID' }
        subject_user_id: { $ref: '#/components/schemas/UUID' }
    Grant:
      type: object
      additionalProperties: false
      required: [id, tenant_id, tenant_scope_id, actor_user_id, actor_scope_id, subject_user_id, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        tenant_id: { $ref: '#/components/schemas/UUID' }
        tenant_scope_id: { $ref: '#/components/schemas/UUID' }
        actor_user_id: { $ref: '#/components/schemas/UUID' }
        actor_scope_id: { $ref: '#/components/schemas/UUID' }
        subject_user_id: { $ref: '#/components/schemas/UUID' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    CreateGrantResponse:
      type: object
      additionalProperties: false
      required: [grant, authorization_code, replayed]
      properties:
        grant: { $ref: '#/components/schemas/Grant' }
        authorization_code: { type: string, writeOnly: true }
        replayed: { type: boolean }
    ExchangeRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_scope_id, authorization_code]
      properties:
        tenant_id: { $ref: '#/components/schemas/UUID' }
        tenant_scope_id: { $ref: '#/components/schemas/UUID' }
        authorization_code: { type: string, writeOnly: true, maxLength: 256 }
    Principal:
      type: object
      additionalProperties: false
      required: [user_id, scope_id, tenant_id, scope_kind, username, display_name, roles, permissions]
      properties:
        user_id: { $ref: '#/components/schemas/UUID' }
        display_id: { type: string, pattern: '^[1-9][0-9]{0,18}$', description: 被代登录用户的数字账号 ID（用户概览「账号 ID」） }
        scope_id: { $ref: '#/components/schemas/UUID' }
        tenant_id: { $ref: '#/components/schemas/UUID' }
        scope_kind: { const: tenant }
        username: { type: string }
        display_name: { type: string }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    Banner:
      type: object
      additionalProperties: false
      required: [grant_id, actor_user_id, actor_display_name, subject_user_id, subject_display_name, tenant_id, expires_at]
      properties:
        grant_id: { $ref: '#/components/schemas/UUID' }
        actor_user_id: { $ref: '#/components/schemas/UUID' }
        actor_display_name: { type: string }
        subject_user_id: { $ref: '#/components/schemas/UUID' }
        subject_display_name: { type: string }
        tenant_id: { $ref: '#/components/schemas/UUID' }
        expires_at: { type: string, format: date-time }
    ExchangeResponse:
      type: object
      additionalProperties: false
      required: [principal, banner, expires_at, refreshable, replayed]
      properties:
        principal: { $ref: '#/components/schemas/Principal' }
        banner: { $ref: '#/components/schemas/Banner' }
        expires_at: { type: string, format: date-time }
        refreshable: { const: false }
        replayed: { type: boolean }
    RevokeRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_scope_id, reason]
      properties:
        tenant_id: { $ref: '#/components/schemas/UUID' }
        tenant_scope_id: { $ref: '#/components/schemas/UUID' }
        reason: { type: string, minLength: 1, maxLength: 512 }
    Revocation:
      type: object
      additionalProperties: false
      required: [id, grant_id, revoked_by, reason, revoked_at, replayed]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        grant_id: { $ref: '#/components/schemas/UUID' }
        revoked_by: { $ref: '#/components/schemas/UUID' }
        reason: { type: string }
        revoked_at: { type: string, format: date-time }
        replayed: { type: boolean }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code: { type: string }
            request_id: { type: string }
  responses:
    InvalidRequest:
      description: impersonation_invalid_request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: impersonation_unauthenticated
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: impersonation_permission_denied (including targeting yourself), impersonation_nested_denied, impersonation_principal_changed, or impersonation_sensitive_action_denied
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: impersonation_idempotency_conflict or impersonation_code_replay
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Gone:
      description: impersonation_grant_expired, impersonation_grant_revoked, impersonation_session_expired, or impersonation_session_revoked
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InvalidCode:
      description: impersonation_invalid_code
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: impersonation_unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
