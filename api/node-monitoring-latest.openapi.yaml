                type: array
                maxItems: 100
                items:
                  type: object
                  additionalProperties: false
                  required: [id, group, ok]
                  properties:
                    id: {type: string, minLength: 1, maxLength: 128}
                    group: {type: string, enum: [domestic, telecom, unicom, mobile, overseas]}
                    carrier: {type: string, maxLength: 16}
                    region: {type: string, maxLength: 16}
                    location: {type: string, maxLength: 128}
                    ok: {type: boolean}
                    latency_ms: {type: integer, minimum: 0}
    NodePeerHistoryPage:
      type: object
      additionalProperties: false
      required: [schema_version, source, node_id, from, to, page, limit, total, items]
      properties:
        schema_version: {type: integer, const: 1}
        source: {type: string, const: peer}
        node_id: {$ref: '#/components/schemas/NodeMonitoringCanonicalUUID'}
        from: {$ref: '#/components/schemas/NodeMonitoringUTCTime'}
        to: {$ref: '#/components/schemas/NodeMonitoringUTCTime'}
        page: {type: integer, minimum: 1, maximum: 1000}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [observed_at, address, port, failed, controller_ok, failed_checks, total_checks, checkpoints]
            properties:
              observed_at: {$ref: '#/components/schemas/NodeMonitoringUTCTime'}
              address: {type: string, minLength: 2, maxLength: 45}
              port: {type: integer, minimum: 1, maximum: 65535}
              failed: {type: boolean}
              controller_ok: {type: [boolean, 'null'], description: 主控探测结果，null 表示主控未探测}
              failed_checks: {type: integer, minimum: 0, maximum: 100}
              total_checks: {type: integer, minimum: 1, maximum: 100}
