                type: array
                maxItems: 100
                items:
                  type: object
                  additionalProperties: false
                  required: [id, ok]
                  properties:
                    id: {type: string, minLength: 1, maxLength: 128, description: controller 或互拨节点 ID}
                    name: {type: string, maxLength: 128}
                    address: {type: string, maxLength: 45}
                    groups:
                      type: array
                      items: {type: string, enum: [domestic, telecom, unicom, mobile, overseas]}
                    ok: {type: boolean}
                    latency_ms: {type: integer, minimum: 0}
    DNSPupNodeMonitoringSettings:
      type: object
      additionalProperties: false
      required: [interval_seconds, groups, points_per_group, failure_percent, failure_rounds, recovery_rounds, low_balance]
      properties:
        interval_seconds: {type: integer, enum: [0, 60, 300, 900], description: 0 关闭；默认 300}
        groups:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: {type: string, enum: [domestic, telecom, unicom, mobile, overseas]}
        points_per_group: {type: integer, minimum: 1, maximum: 20}
        failure_percent: {type: integer, minimum: 1, maximum: 99, description: 失败检测点超过该比例才算本轮失败}
        failure_rounds: {type: integer, minimum: 1, maximum: 10}
        recovery_rounds: {type: integer, minimum: 1, maximum: 10}
        low_balance: {type: integer, minimum: 0, maximum: 1000000000, description: 剩余月额度低于此值降频（×3）并通知}
    DNSPupNodeMonitoringStatus:
      allOf:
        - {$ref: '#/components/schemas/DNSPupNodeMonitoringSettings'}
        - type: object
          required: [revision, plugin_active, licensed, budget_state, effective_interval_seconds, monthly_limit,
            monthly_used, account_checked_at, paused_until, balance_unit, estimate, max_addresses_per_round]
          properties:
            revision: {type: integer, minimum: 0}
            plugin_active: {type: boolean}
            licensed: {type: boolean}
            budget_state: {type: string, enum: [normal, low, exhausted]}
            effective_interval_seconds: {type: integer, minimum: 0}
            monthly_limit: {type: integer, minimum: 0, description: 0 表示 dnspup 未限额}
            monthly_used: {type: integer, minimum: 0}
            account_checked_at:
              oneOf:
                - {$ref: '#/components/schemas/NodeMonitoringUTCTime'}
                - {type: 'null'}
            paused_until:
              oneOf:
                - {$ref: '#/components/schemas/NodeMonitoringUTCTime'}
                - {type: 'null'}
            balance_unit: {type: string, const: request}
            max_addresses_per_round: {type: integer, minimum: 1}
            estimate:
              type: object
              additionalProperties: false
              required: [addresses, checkpoints_per_round, rounds_per_day, requests_per_day, requests_per_month]
              properties:
                addresses: {type: integer, minimum: 0}
                checkpoints_per_round: {type: integer, minimum: 0}
                rounds_per_day: {type: integer, minimum: 0}
                requests_per_day: {type: integer, minimum: 0}
                requests_per_month: {type: integer, minimum: 0}
