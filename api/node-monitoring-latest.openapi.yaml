      properties:
        schema_version: {type: integer, const: 1}
        source: {type: string, const: dnspup}
        node_id: {$ref: '#/components/schemas/NodeMonitoringCanonicalUUID'}
        group: {type: string, enum: ['', domestic, telecom, unicom, mobile, overseas]}
        from: {$ref: '#/components/schemas/NodeMonitoringUTCTime'}
        to: {$ref: '#/components/schemas/NodeMonitoringUTCTime'}
        page: {type: integer, minimum: 1, maximum: 1000}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [observed_at, address, port, failed, failed_checks, total_checks, checkpoints]
            properties:
              observed_at: {$ref: '#/components/schemas/NodeMonitoringUTCTime'}
              address: {type: string, minLength: 2, maxLength: 45}
              port: {type: integer, minimum: 1, maximum: 65535}
              failed: {type: boolean}
              failed_checks: {type: integer, minimum: 0, maximum: 100}
              total_checks: {type: integer, minimum: 0, maximum: 100}
