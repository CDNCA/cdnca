openapi: 3.1.0
info:
  title: CDNCA Platform System Mail Settings API
  version: 0.1.0
  description: Platform administrator SMTP and SMS provider settings. Secrets are references only and never returned in plaintext.
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - {url: /}
security:
  - bearerAuth: []
paths:
  /v1/admin/system-mail-settings:
    get:
      summary: Read platform mail settings
      operationId: getPlatformSystemMailSettings
      x-summary-zh: "读取平台邮件设置"
      x-required-permissions: [system_configuration.read]
      responses:
        '200': {description: Current mail settings, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {description: Unexpected internal failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Settings storage or policy is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      summary: Update platform mail settings
      description: Persists configuration only. Runtime settings are applied at process startup when the notification runtime is enabled; saving does not enable or reload a provider.
      operationId: updatePlatformSystemMailSettings
      x-summary-zh: "修改平台邮件设置"
      x-required-permissions: [system_configuration.manage]
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WriteRequest'}}}
      responses:
        '200': {description: Saved mail settings, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Permission denied, or the chosen official mail service's module (module.mail.<provider>) is not licensed (system_mail_settings_module_not_licensed), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'Revision or idempotency conflict; or system_mail_settings_email_verification_sender / system_mail_settings_sms_verification_sender: email (phone) verification is in effect (required, with its notification channel on) and the save would leave that channel without a sender.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {description: Unexpected internal failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Settings storage or policy is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/admin/system-mail-settings/tests:
    post:
      summary: Send a test mail with the provider on the page
      description: Sends one test mail through value.mail_provider without saving anything, so a provider can be checked before switching. An official provider uses mail_secret or, only for the same provider, the stored credential; SMTP uses the page's SMTP fields with the stored SMTP password (smtp_password_configured), filling gaps from NOTIFICATION_SMTP_* only under smtp_tls/smtp_starttls; what is still missing comes back as code config_incomplete with missing. The attempt is audited without the credential.
      operationId: testPlatformSystemMailSettings
      x-required-permissions: [system_configuration.manage]
      parameters:
        - {$ref: '#/components/parameters/RequestID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value, to]
              properties:
                value: {$ref: '#/components/schemas/Settings'}
                mail_secret: {type: string, maxLength: 512, writeOnly: true}
                to: {type: string, format: email, maxLength: 254}
      responses:
        '200':
          description: The send was attempted; ok tells whether the provider accepted it.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, provider]
                properties:
                  ok: {type: boolean}
                  provider: {type: string}
                  message_id: {type: string}
                  missing:
                    type: array
                    items: {type: string}
                    description: 'With code config_incomplete: the save body fields the SMTP sender still lacks (value.smtp_address, value.smtp_user, smtp_password, value.smtp_from).'
                    x-description-zh: code 为 config_incomplete 时，SMTP 发信还缺的保存字段（value.smtp_address、value.smtp_user、smtp_password、value.smtp_from）。
                  code: {type: string, description: 'Stable failure code (libs/mail): config_incomplete (see missing), config_invalid, credential_rejected, sender_rejected, recipient_rejected, provider_rate_limited, provider_unavailable, provider_rejected, provider_response_unknown, tls_required, or a plugin error code.'}
        '400': {description: Validation error}
        '401': {description: Unauthenticated}
        '403': {description: Permission denied, or the chosen official mail service's module (module.mail.<provider>) is not licensed (system_mail_settings_module_not_licensed)}
        '503': {description: 'The notification runtime is forced off (NOTIFICATION_RUNTIME_ENABLED=off). Unset, auto or false turn it on at start when this page holds a complete sender.'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[0-9]+"$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$', minLength: 1, maxLength: 128}}
    RequestID: {name: X-Request-ID, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            details:
              description: On a 400 system_mail_settings_validation_error that names the refused field of the save body (value.<field>, sms_access_key_secret, mail_secret, smtp_password or sms_auth_token) and a machine reason.
              x-description-zh: 能定位字段的 400 system_mail_settings_validation_error 附带 field（保存请求体路径 value.<字段>、sms_access_key_secret、mail_secret、smtp_password、sms_auth_token）与 reason 机器码。
              type: object
              additionalProperties: false
              required: [field, reason]
              properties:
                field: {type: string}
                reason: {type: string}
              example: {field: value.smtp_port, reason: out_of_range}
    SecretReference:
      type: string
      maxLength: 1024
      pattern: '^(|vault://.+|kms-envelope://.+)$'
      description: Empty or an opaque Vault/KMS envelope reference. Plaintext secrets are rejected.
    Document:
      type: object
      additionalProperties: false
      required: [schema, revision, value]
      properties:
        schema: {const: cdnca.platform-system-mail-settings/v1}
        revision: {type: integer, minimum: 0, maximum: 9223372036854775806}
        updated_at: {type: string, format: date-time}
        value: {$ref: '#/components/schemas/Settings'}
        mail_secret_configured: {type: boolean, description: An official mail service credential is stored (never returned).}
        mail_secret_provider: {type: string, enum: [aliyun, sendgrid], description: The provider the stored credential belongs to; it is reused only for that provider.}
        mail_secret_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        smtp_password_configured: {type: boolean, description: An SMTP password entered on the settings page is stored encrypted (never returned).}
        smtp_password_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        sms_auth_token_configured: {type: boolean, description: An HTTPS SMS gateway token entered on the settings page is stored encrypted (never returned).}
        sms_auth_token_fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
    WriteRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        mail_secret:
          type: string
          maxLength: 512
          writeOnly: true
          description: Official mail service credential (DirectMail AccessKeySecret or SendGrid API key) for value.mail_provider. Omitted keeps the stored one; required when choosing an official provider whose credential is not stored.
        smtp_password:
          type: string
          maxLength: 1024
          writeOnly: true
          description: SMTP password in plaintext, stored encrypted under the control-api credential keyring and never returned. Omitted keeps the stored one, an empty string clears it. A stored password cannot coexist with value.smtp_password_reference; sending both is refused (smtp_password invalid), and a reference while a password stays stored is refused (value.smtp_password_reference invalid).
          x-description-zh: SMTP 明文密码，用 control-api 凭据钥匙串加密保存，从不回显。省略保留原值，空串清除。已存密码与 value.smtp_password_reference 不能同时存在：两者同时填写被拒（smtp_password invalid），保留已存密码时填写引用被拒（value.smtp_password_reference invalid）。
        sms_auth_token:
          type: string
          maxLength: 4096
          writeOnly: true
          description: HTTPS SMS gateway token (sms_provider https_json) in plaintext, stored encrypted under the control-api credential keyring and never returned; at runtime it replaces NOTIFICATION_SMS_AUTH_TOKEN. Omitted keeps the stored one, an empty string clears it. Refused for aliyun/submail (they use sms_access_key_secret). A stored token cannot coexist with value.sms_access_key_reference; sending both is refused (sms_auth_token invalid), and a reference while a token stays stored is refused (value.sms_access_key_reference invalid).
          x-description-zh: HTTPS 短信网关（sms_provider 为 https_json）的明文令牌，用 control-api 凭据钥匙串加密保存，从不回显；运行时替换 NOTIFICATION_SMS_AUTH_TOKEN。省略保留原值，空串清除。阿里云/SUBMAIL 不接受（它们用 sms_access_key_secret）。已存令牌与 value.sms_access_key_reference 不能同时存在：两者同时填写被拒（sms_auth_token invalid），保留已存令牌时填写引用被拒（value.sms_access_key_reference invalid）。
        value:
          allOf:
            - {$ref: '#/components/schemas/Settings'}
            - type: object
              properties:
                sms_provider:
                  type: string
                  enum: ['', https_json]
                  description: Empty inherits the runtime environment configuration and does not disable SMS. https_json is the currently supported adapter. Other values are rejected on writes; legacy values remain readable.
    Settings:
      type: object
      additionalProperties: false
      required: [smtp_address, smtp_ssl, smtp_port, smtp_user, smtp_password_reference, sms_provider, sms_access_key_id, sms_access_key_reference, sms_signature_name]
      properties:
        smtp_address: {type: string, maxLength: 512}
        smtp_ssl: {type: boolean}
        smtp_port: {type: integer, minimum: 1, maximum: 65535}
        smtp_user: {type: string, maxLength: 256}
        smtp_password_reference:
          allOf:
            - {$ref: '#/components/schemas/SecretReference'}
          description: Advanced. A Vault/KMS reference that must match the runtime NOTIFICATION_SMTP_PASSWORD_REFERENCE; the plaintext password goes in the write-only smtp_password instead.
        smtp_from:
          type: string
          maxLength: 254
          description: SMTP sender address. Empty falls back to smtp_user when it is an email address, then to NOTIFICATION_SMTP_FROM.
          x-description-zh: SMTP 发件地址。留空时使用 smtp_user（为邮箱地址时），再回退到 NOTIFICATION_SMTP_FROM。
        smtp_from_name: {type: string, maxLength: 64, description: SMTP sender display name.}
        sms_provider: {type: string, maxLength: 64}
        sms_access_key_id: {type: string, maxLength: 256}
        sms_access_key_reference:
          allOf:
            - {$ref: '#/components/schemas/SecretReference'}
          description: Advanced. A Vault/KMS reference that must match the runtime NOTIFICATION_SMS_AUTH_TOKEN_REFERENCE; the plaintext gateway token goes in the write-only sms_auth_token instead.
        sms_signature_name: {type: string, maxLength: 256}
        mail_provider:
          type: string
          maxLength: 136
          pattern: '^(|smtp|aliyun|sendgrid|plugin:[a-z0-9]+([.-][a-z0-9]+)+)$'
          description: The one system mail sender. Empty or smtp is the built-in SMTP above (unchanged); aliyun (DirectMail) or sendgrid is an official mail service; plugin:<plugin id> is a usable third-party mail plugin. The SMTP and official fields are kept whatever is chosen. The control plane applies the saved choice at start; a failing provider is never replaced by another one.
        mail_region: {type: string, enum: ['', cn-hangzhou, ap-southeast-1, ap-southeast-2, global, eu]}
        mail_access_key_id: {type: string, maxLength: 256, description: DirectMail AccessKeyId (aliyun only).}
        mail_from: {type: string, maxLength: 254, format: email, description: Sender address verified at the official provider.}
        mail_from_name: {type: string, maxLength: 64}
