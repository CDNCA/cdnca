# www.cdnca.com 官网（apps/www）nginx 片段，交给 68 门户机安装器（topo-1035）include 到 http {} 内。
#
# 交付物：
#   - 本文件
#   - www-dist.tar：pnpm -C apps/www build && pnpm -C apps/www package（= tar -C dist -cf www-dist.tar .）
#     解包到下面的 root 目录（每个路由都是预渲染好的 index.html，另有 404.html、sitemap.xml、robots.txt、assets/）。
#
# 安装器需要替换的占位：
#   __WWW_ROOT__       静态文件目录，例如 /usr/share/cdnca/www
#   __WWW_CERT__       覆盖 www.cdnca.com 与 cdnca.com 的证书链
#   __WWW_CERT_KEY__   证书私钥
#   __AUTH_HOST__      授权端域名（官网内容公开接口，例如 auth.cdnca.com），反代时校验证书名
#   __AUTH_CA__        校验授权端证书的 CA（公网证书用系统 CA，例如 /etc/ssl/certs/ca-certificates.crt）
# HTTP→HTTPS 跳转、证书签发续期由门户机安装器负责（topo-1035），本片段只写 443。
#
# 安全头：nginx 的 add_header 在 location 里一旦出现就不继承 server 级设置，所以每个 location
# 都写全同一组头；CSP 放在变量 $cdnca_www_csp 里保证各处一致。
# 市场公开接口（apps/www/src/site.ts MARKET_PUBLIC_API）是同源 /public/v1/，反代到市场机的段只在
# scripts/install-site.sh 生成的配置里（check-dist 核对），CSP 不为它放宽。官网内容（运营后台「官网内容」）走同源
# /public/v1/site-content 反代到授权端，CSP 不为它放宽（check-dist 核对路径同源且这里有反代段）。
# 不放 'unsafe-inline'：预渲染页面没有内联脚本和 style 属性，样式全在 /assets/*.css
# （check-dist 断言产物里没有 <script> 内联代码与 style= 属性）。

map $sent_http_content_type $cdnca_www_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cdnca.com;

    ssl_certificate     __WWW_CERT__;
    ssl_certificate_key __WWW_CERT_KEY__;

    root __WWW_ROOT__;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    # 纯静态站：只允许 GET/HEAD
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # 官网内容：授权端 license-service 已发布的更新日志/文档/联系我们/品牌（迁移 110）。只读，
    # 不带 Cookie/Authorization 到授权端，校验授权端证书；缓存头由授权端决定（内容 60 秒，图片按哈希永久）。
    # 只读由 server 级 GET/HEAD 限制保证。实际部署以 scripts/install-site.sh 生成的配置为准（含限流与 upstream）。
    location ^~ /public/v1/site-content {
        add_header Content-Security-Policy $cdnca_www_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host __AUTH_HOST__;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass https://__AUTH_HOST__;
        proxy_ssl_server_name on;
        proxy_ssl_name __AUTH_HOST__;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate __AUTH_CA__;
        proxy_read_timeout 15s;
    }

    location /assets/ {
        add_header Content-Security-Policy $cdnca_www_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 构建产出的 <文件>.gz（apps/www/vite.config.ts precompress）直接发，不逐请求压缩。
        gzip_static on;
        gzip_vary on;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy $cdnca_www_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        # /docs 与 /docs/ 都落到 docs/index.html；末尾斜杠不强制
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Content-Security-Policy $cdnca_www_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }
}

# 裸域 301 到 www（保留路径与查询）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdnca.com;

    ssl_certificate     __WWW_CERT__;
    ssl_certificate_key __WWW_CERT_KEY__;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://www.cdnca.com$request_uri;
}
