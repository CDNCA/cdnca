pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    log_format cdnca '$remote_addr $request_id "$request_method $uri" '
                       '$status $body_bytes_sent $request_time';
    access_log /dev/stdout cdnca;

    map $uri $cache_control {
        default "no-store";
        "~^/(?:dashboard/)?assets/[^/]+-[-_A-Za-z0-9]{8,}\.[^/]+$" "public, max-age=31536000, immutable";
        # PA-17 rendered theme files and images are content-addressed.
        "~^/v1/theme/(?:theme\.[0-9a-f]{64}\.(?:css|json)|assets/[0-9a-f]{64})$" "public, max-age=31536000, immutable";
    }

    # Script trust is a per-request nonce ($request_id, 128 random bits) that
    # sub_filter also stamps on index.html's <script> tags; 'strict-dynamic'
    # extends it to scripts those create (login CAPTCHA SDKs, the 全站JS代码).
    # The SPA copies the nonce onto every script element it inserts, so inline
    # global JS runs without 'unsafe-inline'. Host sources are the CAPTCHA
    # providers' documented hosts (CSP2 fallback and non-script directives):
    #   Cloudflare Turnstile: challenges.cloudflare.com
    #   Tencent CAPTCHA: turing.captcha.qcloud.com (SDK, iframe, API), captcha.gtimg.com (images)
    #   GeeTest v4: static.geetest.com, gcaptcha4.geetest.com and the fallback
    #   hosts static.geevisit.com, gcaptcha4.geevisit.com, gcaptcha4.gsensebot.com
    map $host $csp_hosts_script {
        default "https://challenges.cloudflare.com https://turing.captcha.qcloud.com https://captcha.gtimg.com https://static.geetest.com https://static.geevisit.com https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com";
    }
    map $host $csp_hosts_frame {
        default "https://challenges.cloudflare.com https://turing.captcha.qcloud.com";
    }
    map $host $csp_hosts_connect {
        default "https://challenges.cloudflare.com https://turing.captcha.qcloud.com https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com";
    }
    map $host $csp_hosts_img {
        default "https://turing.captcha.qcloud.com https://captcha.gtimg.com https://static.geetest.com https://static.geevisit.com";
    }
    # 全站JS代码 report/image hosts from system settings, read by auth_request
    # only when index.html is served. Anything but "https://host ..." (control-
    # api validated plain hostnames) is dropped, so the default stays strict.
    map $global_js_hosts_raw $global_js_hosts {
        default "";
        "~^(?<hosts>(?:https://[a-z0-9.-]{1,253})(?: https://[a-z0-9.-]{1,253}){0,19})$" $hosts;
    }
    # PA-19 ui_page plugin page origins: only the plugins enabled on this
    # installation (control-api plugin_ui_pages, read by the same
    # auth_request). They enter frame-src only; the iframe is sandboxed
    # without allow-same-origin. Anything else is dropped.
    map $plugin_ui_origins_raw $plugin_ui_origins {
        default "";
        "~^(?<origins>(?:https://[a-z0-9.-]{1,253})(?: https://[a-z0-9.-]{1,253}){0,63})$" $origins;
    }

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /usr/share/nginx/html;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: $csp_hosts_img $global_js_hosts; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'nonce-$request_id' 'strict-dynamic' $csp_hosts_script; frame-src $csp_hosts_frame $plugin_ui_origins; connect-src 'self' $csp_hosts_connect $global_js_hosts" always;
        # sub_filter only rewrites text/html (its default type set).
        sub_filter_once off;
        sub_filter '<script ' '<script nonce="$request_id" ';
        sub_filter '<script>' '<script nonce="$request_id">';
        sub_filter '<link rel="modulepreload" ' '<link rel="modulepreload" nonce="$request_id" ';

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /downloads/ {
            # Downloads are a separate trust boundary.  Resolve them from a
            # fixed root and fail with 404; never let a missing artifact fall
            # through to the customer SPA.
            root /usr/share/cdnca;
            try_files $uri =404;
            default_type application/octet-stream;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /downloads/gateway-ca.pem {
            alias /run/cdnca-gateway/root-ca-cert.pem;
            default_type application/x-pem-file;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Only nginx itself asks control-api for the report hosts.
        location = /v1/system-settings/csp-hosts {
            return 404;
        }

        location = /_cdnca/global-js-hosts {
            internal;
            proxy_pass http://control-api:8080/v1/system-settings/csp-hosts;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        # The SPA document: add the configured report hosts to its CSP. If the
        # lookup fails the page is served with the strict default policy.
        location = /index.html {
            auth_request /_cdnca/global-js-hosts;
            auth_request_set $global_js_hosts_raw $upstream_http_x_cdnca_global_js_hosts;
            auth_request_set $plugin_ui_origins_raw $upstream_http_x_cdnca_plugin_ui_origins;
            error_page 500 502 503 504 = @spa_strict;
        }

        location @spa_strict {
            rewrite ^ /index.html break;
        }

        location ^~ /v1/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://control-api:8080;
        }

        location ~* ^/(?:dashboard/)?(?:assets/.*|.*\.(?:css|js|mjs|map|json|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf))$ {
            rewrite ^/dashboard/(.*)$ /$1 break;
            try_files $uri =404;
        }

        location /dashboard/ {
            rewrite ^/dashboard/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
