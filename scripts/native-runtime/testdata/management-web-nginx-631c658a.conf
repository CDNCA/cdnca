pid /var/lib/cdnca-control/nginx-runtime/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    large_client_header_buffers 4 16k;
    include /etc/nginx/mime.types;
    include /etc/cdnca-upgrade/plan-source-nginx.conf;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /var/lib/cdnca-control/nginx-runtime/client_temp;
    proxy_temp_path /var/lib/cdnca-control/nginx-runtime/proxy_temp;
    fastcgi_temp_path /var/lib/cdnca-control/nginx-runtime/fastcgi_temp;
    uwsgi_temp_path /var/lib/cdnca-control/nginx-runtime/uwsgi_temp;
    scgi_temp_path /var/lib/cdnca-control/nginx-runtime/scgi_temp;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 443 ssl;
        server_name _;
        root /data/cdnca-native-root/cdnca/current/static/web;
        ssl_certificate /etc/cdnca-control/keys/pki/public-cert.pem;
        ssl_certificate_key /etc/cdnca-control/keys/pki/public-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /downloads/gateway-ca.pem {
            alias /var/lib/cdnca-control/downloads/gateway-ca.pem;
            default_type application/x-pem-file;
        }
        location = /runtime-config.js {
            alias /var/lib/cdnca-control/runtime-config.js;
            default_type application/javascript;
        }
        location = /dashboard/runtime-config.js {
            alias /var/lib/cdnca-control/runtime-config.js;
            default_type application/javascript;
        }
        location = /v1/brand-assets/favicon {
            proxy_intercept_errors on;
            error_page 404 = @brand_logo_fallback;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://127.0.0.1:8080;
        }
        location = /v1/brand-assets/logo {
            proxy_intercept_errors on;
            error_page 404 = @brand_logo_fallback;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://127.0.0.1:8080;
        }
        location = /v1/brand-assets/login_ad {
            proxy_intercept_errors on;
            error_page 404 = @brand_login_ad_fallback;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://127.0.0.1:8080;
        }
        location @brand_logo_fallback {
            if ($request_method !~ "^(GET|HEAD)$") { return 404; }
            rewrite ^ /dashboard/logo.png last;
        }
        location @brand_login_ad_fallback {
            if ($request_method !~ "^(GET|HEAD)$") { return 404; }
            rewrite ^ /dashboard/ad.jpeg last;
        }
        location ^~ /downloads/ {
            root /var/lib/cdnca-control;
            try_files $uri =404;
            default_type application/octet-stream;
        }
        location = /health/live { proxy_pass http://127.0.0.1:8080/health/live; }
        location = /health/ready { proxy_pass http://127.0.0.1:8080/health/ready; }
        location = /v1/internal { return 404; }
        location ^~ /v1/internal/ { return 404; }
        location ^~ /v1/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~* ^/(?:dashboard/)?(?:assets/.*|.*\.(?:css|js|mjs|map|json|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf))$ {
            rewrite ^/dashboard/(.*)$ /$1 break;
            try_files $uri =404;
        }
        location /dashboard/ {
            rewrite ^/dashboard/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
