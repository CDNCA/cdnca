port: 4222
http_port: 8222
max_payload: 2162688

# HAProxy terminates external TLS. Advertising optional TLS keeps NATS INFO
# consistent for TLS-first proxy clients while internal preprovision stays plain.
tls {}
allow_non_tls: true

jetstream {
  store_dir: $NATS_STORE_DIR
}

accounts {
  OBS {
    jetstream: enabled
    users: [
      {
        user: $NATS_PREPROVISION_USERNAME
        password: $NATS_PREPROVISION_PASSWORD
        permissions: {
          publish: [
            "$JS.API.STREAM.INFO.ANALYTICS_INGEST_V1",
            "$JS.API.STREAM.CREATE.ANALYTICS_INGEST_V1",
            "$JS.API.STREAM.INFO.ANALYTICS_ISOLATION_V1",
            "$JS.API.STREAM.CREATE.ANALYTICS_ISOLATION_V1",
            "$JS.API.STREAM.INFO.SECURITY_CC_COORDINATION_V1",
            "$JS.API.STREAM.CREATE.SECURITY_CC_COORDINATION_V1",
            "$JS.API.STREAM.INFO.CONNECTIONS_INGEST_V1",
            "$JS.API.STREAM.CREATE.CONNECTIONS_INGEST_V1",
            "$JS.API.STREAM.INFO.CONNECTIONS_DEAD_V1",
            "$JS.API.STREAM.CREATE.CONNECTIONS_DEAD_V1",
            "$JS.API.STREAM.INFO.L4_SESSIONS_INGEST_V1",
            "$JS.API.STREAM.CREATE.L4_SESSIONS_INGEST_V1",
            "$JS.API.STREAM.INFO.KV_AISTATE_2dcd3c381ead92f3",
            "$JS.API.STREAM.CREATE.KV_AISTATE_2dcd3c381ead92f3",
            "$JS.API.STREAM.INFO.KV_AILEASE_2dcd3c381ead92f3",
            "$JS.API.STREAM.CREATE.KV_AILEASE_2dcd3c381ead92f3",
            # Deployment-only identity: exact stream update is required solely for the guarded 12s-to-40s migration.
            "$JS.API.STREAM.UPDATE.KV_AILEASE_2dcd3c381ead92f3",
            "$JS.API.STREAM.INFO.KV_AIEVIDENCE_2dcd3c381ead92f3",
            "$JS.API.STREAM.CREATE.KV_AIEVIDENCE_2dcd3c381ead92f3",
            "$JS.API.CONSUMER.INFO.ANALYTICS_INGEST_V1.control_api_analytics_ingest_v1",
            "$JS.API.CONSUMER.CREATE.ANALYTICS_INGEST_V1.control_api_analytics_ingest_v1",
            "$JS.API.CONSUMER.INFO.SECURITY_CC_COORDINATION_V1.control_api_cc_coordination_v1",
            "$JS.API.CONSUMER.CREATE.SECURITY_CC_COORDINATION_V1.control_api_cc_coordination_v1",
            "$JS.API.CONSUMER.INFO.CONNECTIONS_INGEST_V1.control_api_connections",
            "$JS.API.CONSUMER.CREATE.CONNECTIONS_INGEST_V1.control_api_connections",
            "$JS.API.CONSUMER.INFO.L4_SESSIONS_INGEST_V1.control_api_l4_sessions_v1",
            "$JS.API.CONSUMER.CREATE.L4_SESSIONS_INGEST_V1.control_api_l4_sessions_v1"
          ]
          subscribe: ["_INBOX.>"]
        }
      },
      {
        user: $NATS_CONTROL_CONSUMER_USERNAME
        password: $NATS_CONTROL_CONSUMER_PASSWORD
        permissions: {
          publish: [
            "$JS.API.STREAM.INFO.ANALYTICS_INGEST_V1",
            "$JS.API.STREAM.INFO.ANALYTICS_ISOLATION_V1",
            "$JS.API.STREAM.INFO.SECURITY_CC_COORDINATION_V1",
            "$JS.API.STREAM.INFO.CONNECTIONS_INGEST_V1",
            "$JS.API.STREAM.INFO.CONNECTIONS_DEAD_V1",
            "$JS.API.STREAM.INFO.L4_SESSIONS_INGEST_V1",
            "$JS.API.STREAM.INFO.KV_AISTATE_2dcd3c381ead92f3",
            "$JS.API.STREAM.INFO.KV_AILEASE_2dcd3c381ead92f3",
            "$JS.API.STREAM.INFO.KV_AIEVIDENCE_2dcd3c381ead92f3",
            "$JS.API.CONSUMER.INFO.ANALYTICS_INGEST_V1.control_api_analytics_ingest_v1",
            "$JS.API.CONSUMER.MSG.NEXT.ANALYTICS_INGEST_V1.control_api_analytics_ingest_v1",
            "$JS.API.CONSUMER.INFO.SECURITY_CC_COORDINATION_V1.control_api_cc_coordination_v1",
            "$JS.API.CONSUMER.MSG.NEXT.SECURITY_CC_COORDINATION_V1.control_api_cc_coordination_v1",
            "$JS.API.CONSUMER.INFO.CONNECTIONS_INGEST_V1.control_api_connections",
            "$JS.API.CONSUMER.MSG.NEXT.CONNECTIONS_INGEST_V1.control_api_connections",
            "$JS.API.CONSUMER.INFO.L4_SESSIONS_INGEST_V1.control_api_l4_sessions_v1",
            "$JS.API.CONSUMER.MSG.NEXT.L4_SESSIONS_INGEST_V1.control_api_l4_sessions_v1",
            "$JS.API.STREAM.MSG.GET.ANALYTICS_INGEST_V1",
            "$JS.API.STREAM.MSG.GET.L4_SESSIONS_INGEST_V1",
            "$JS.API.STREAM.MSG.GET.ANALYTICS_ISOLATION_V1",
            "$JS.API.STREAM.MSG.GET.CONNECTIONS_DEAD_V1",
            "$JS.API.DIRECT.GET.KV_AISTATE_2dcd3c381ead92f3.>",
            "$JS.API.DIRECT.GET.KV_AILEASE_2dcd3c381ead92f3.>",
            "$JS.API.DIRECT.GET.KV_AIEVIDENCE_2dcd3c381ead92f3.>",
            "$JS.API.CONSUMER.CREATE.KV_AISTATE_2dcd3c381ead92f3.>",
            "$JS.API.CONSUMER.DELETE.KV_AISTATE_2dcd3c381ead92f3.>",
            "$JS.API.CONSUMER.CREATE.KV_AILEASE_2dcd3c381ead92f3.>",
            "$JS.API.CONSUMER.DELETE.KV_AILEASE_2dcd3c381ead92f3.>",
            "$JS.API.CONSUMER.CREATE.KV_AIEVIDENCE_2dcd3c381ead92f3.>",
            "$JS.API.CONSUMER.DELETE.KV_AIEVIDENCE_2dcd3c381ead92f3.>",
            "$KV.AISTATE_2dcd3c381ead92f3.>",
            "$KV.AILEASE_2dcd3c381ead92f3.>",
            "$KV.AIEVIDENCE_2dcd3c381ead92f3.>",
            "$JS.ACK.ANALYTICS_INGEST_V1.control_api_analytics_ingest_v1.>",
            "$JS.ACK.SECURITY_CC_COORDINATION_V1.control_api_cc_coordination_v1.>",
            "$JS.ACK.CONNECTIONS_INGEST_V1.control_api_connections.>",
            "$JS.ACK.L4_SESSIONS_INGEST_V1.control_api_l4_sessions_v1.>",
            "cdnca.analytics.isolation.v1",
            "cdnca.connections.dead.v1"
          ]
          subscribe: ["_INBOX.>"]
        }
      },
      {
        user: $NATS_GATEWAY_PUBLISHER_USERNAME
        password: $NATS_GATEWAY_PUBLISHER_PASSWORD
        permissions: {
          publish: [
            "$JS.API.STREAM.INFO.ANALYTICS_INGEST_V1",
            "$JS.API.STREAM.INFO.SECURITY_CC_COORDINATION_V1",
            "$JS.API.STREAM.INFO.CONNECTIONS_INGEST_V1",
            "$JS.API.STREAM.INFO.L4_SESSIONS_INGEST_V1",
            "cdnca.analytics.ingest.v1.*",
            "cdnca.security.cccoord.v1.*.*",
            "cdnca.connections.v1.*.*",
            "cdnca.l4.sessions.v1.*.*.*"
          ]
          subscribe: ["_INBOX.>"]
        }
      }
    ]
  }
}
