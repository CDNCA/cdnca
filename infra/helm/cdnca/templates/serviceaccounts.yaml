{{- $root := . -}}
{{- $components := list
  (dict "name" "control-api" "enabled" .Values.controlApi.enabled)
  (dict "name" "agent-gateway" "enabled" .Values.agentGateway.enabled)
  (dict "name" "web" "enabled" .Values.web.enabled)
-}}
{{- range $component := $components }}
{{- if $component.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cdnca.componentFullname" (dict "root" $root "component" $component.name) }}
  labels:
    {{- include "cdnca.labels" (dict "root" $root "component" $component.name) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- if and .Values.controlApi.enabled .Values.controlUpgradeRunner.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cdnca.componentFullname" (dict "root" . "component" "control-api") }}-upgrade-plan-writer
  labels:
    {{- include "cdnca.labels" (dict "root" . "component" "control-api") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.controlUpgradeRunner.planSecret.existingSecret | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cdnca.componentFullname" (dict "root" . "component" "control-api") }}-upgrade-plan-writer
  labels:
    {{- include "cdnca.labels" (dict "root" . "component" "control-api") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cdnca.componentFullname" (dict "root" . "component" "control-api") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cdnca.componentFullname" (dict "root" . "component" "control-api") }}-upgrade-plan-writer
{{- end }}
