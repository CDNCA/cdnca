            - name: CC_COORDINATION_STREAM
              value: {{ .Values.controlApi.analyticsIngest.ccCoordinationStream | quote }}
            - name: CC_COORDINATION_DURABLE
              value: {{ .Values.controlApi.analyticsIngest.ccCoordinationDurable | quote }}
            - name: ANALYTICS_INGEST_REPLICAS
              value: {{ printf "%d" (int .Values.controlApi.analyticsIngest.replicas) | quote }}
          resources:
            {{- toYaml .Values.analyticsNATSPreprovision.resources | nindent 12 }}
{{- end }}
