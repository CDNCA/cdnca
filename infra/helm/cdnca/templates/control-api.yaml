            - name: IDENTITY_VERIFICATION_SETTLEMENT_MAX_ATTEMPTS
              value: {{ printf "%d" (int .Values.controlApi.identityVerification.settlement.maxAttempts) | quote }}
            - name: IDENTITY_VERIFICATION_SETTLEMENT_WORKER_IDLE_POLL
              value: {{ .Values.controlApi.identityVerification.settlement.idlePoll | quote }}
            - name: IDENTITY_VERIFICATION_SETTLEMENT_WORKER_ERROR_BACKOFF
