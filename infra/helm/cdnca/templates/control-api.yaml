                  name: {{ .Values.controlApi.identityVerification.provider.apiKeySecret.existingSecret | quote }}
                  key: {{ .Values.controlApi.identityVerification.provider.apiKeySecret.key | quote }}
            - name: IDENTITY_VERIFICATION_KYC_CALLBACK_KEY_ID
              value: {{ .Values.controlApi.identityVerification.provider.callbackKeyId | quote }}
            - name: IDENTITY_VERIFICATION_KYC_CALLBACK_HMAC_BASE64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.identityVerification.provider.callbackHMACSecret.existingSecret | quote }}
                  key: {{ .Values.controlApi.identityVerification.provider.callbackHMACSecret.key | quote }}
            - name: IDENTITY_VERIFICATION_OBJECT_ENDPOINT
              value: {{ .Values.controlApi.identityVerification.provider.objectStore.endpoint | quote }}
            - name: IDENTITY_VERIFICATION_OBJECT_REGION
              value: {{ .Values.controlApi.identityVerification.provider.objectStore.region | quote }}
            - name: IDENTITY_VERIFICATION_OBJECT_BUCKET
              value: {{ .Values.controlApi.identityVerification.provider.objectStore.bucket | quote }}
            - name: IDENTITY_VERIFICATION_OBJECT_PREFIX
              value: {{ .Values.controlApi.identityVerification.provider.objectStore.prefix | quote }}
            - name: IDENTITY_VERIFICATION_OBJECT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.identityVerification.provider.objectStore.credentialsSecret.existingSecret | quote }}
                  key: {{ .Values.controlApi.identityVerification.provider.objectStore.credentialsSecret.keys.accessKeyId | quote }}
            - name: IDENTITY_VERIFICATION_OBJECT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.identityVerification.provider.objectStore.credentialsSecret.existingSecret | quote }}
                  key: {{ .Values.controlApi.identityVerification.provider.objectStore.credentialsSecret.keys.secretAccessKey | quote }}
            - name: IDENTITY_VERIFICATION_OBJECT_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.identityVerification.provider.objectStore.credentialsSecret.existingSecret | quote }}
                  key: {{ .Values.controlApi.identityVerification.provider.objectStore.credentialsSecret.keys.sessionToken | quote }}
            - name: IDENTITY_VERIFICATION_OBJECT_KMS_KEY_ID
              value: {{ .Values.controlApi.identityVerification.provider.objectStore.kmsKeyId | quote }}
            {{- end }}
            - name: IDENTITY_VERIFICATION_ISSUER_ENABLED
              value: {{ .Values.controlApi.identityVerification.issuer.enabled | quote }}
            {{- if .Values.controlApi.identityVerification.issuer.enabled }}
            - name: IDENTITY_VERIFICATION_ISSUER_MTLS_LISTEN_ADDR
              value: {{ .Values.controlApi.identityVerification.issuer.listenAddress | quote }}
            - name: IDENTITY_VERIFICATION_ISSUER_MTLS_SERVER_CERT_FILE
              value: /var/run/secrets/cdnca/identity-verification-issuer/server.crt
            - name: IDENTITY_VERIFICATION_ISSUER_MTLS_SERVER_PRIVATE_KEY_FILE
              value: /var/run/secrets/cdnca/identity-verification-issuer/server.key
            - name: IDENTITY_VERIFICATION_ISSUER_MTLS_CLIENT_CA_FILE
              value: /var/run/secrets/cdnca/identity-verification-issuer/client-ca.crt
            - name: IDENTITY_VERIFICATION_ISSUER_WORKLOAD_IDENTITIES
              value: {{ .Values.controlApi.identityVerification.issuer.workloadIdentities | quote }}
            - name: IDENTITY_VERIFICATION_ISSUER_KMS_ENDPOINT
              value: {{ .Values.controlApi.identityVerification.issuer.kmsEndpoint | quote }}
            {{- end }}
            {{- end }}
            - name: PACKAGE_COMMERCE_WORKER_ENABLED
              value: {{ .Values.controlApi.packageCommerce.worker.enabled | quote }}
            {{- if .Values.controlApi.packageCommerce.worker.enabled }}
            - name: PACKAGE_COMMERCE_WORKER_NATS_URL
              value: {{ .Values.controlApi.packageCommerce.worker.nats.url | quote }}
            - name: PACKAGE_COMMERCE_WORKER_NATS_NAME
              value: cdnca-package-commerce-worker-$(POD_UID)
            - name: PACKAGE_COMMERCE_WORKER_NATS_CREDS_FILE
              value: /var/run/secrets/cdnca/package-commerce-worker-nats/runtime.creds
            - name: PACKAGE_COMMERCE_WORKER_NATS_CA_FILE
              value: /var/run/secrets/cdnca/package-commerce-worker-nats/ca.crt
            - name: PACKAGE_COMMERCE_WORKER_NATS_STREAM
              value: {{ .Values.controlApi.packageCommerce.worker.nats.stream | quote }}
            - name: PACKAGE_COMMERCE_WORKER_OWNER
              value: package-commerce-worker-$(POD_UID)
            - name: PACKAGE_COMMERCE_WORKER_NATS_CONNECT_TIMEOUT
              value: {{ .Values.controlApi.packageCommerce.worker.nats.connectTimeout | quote }}
            - name: PACKAGE_COMMERCE_WORKER_NATS_OPERATION_TIMEOUT
              value: {{ .Values.controlApi.packageCommerce.worker.nats.operationTimeout | quote }}
            - name: PACKAGE_COMMERCE_WORKER_NATS_RECONNECT_WAIT
              value: {{ .Values.controlApi.packageCommerce.worker.nats.reconnectWait | quote }}
            - name: PACKAGE_COMMERCE_WORKER_NATS_DRAIN_TIMEOUT
              value: {{ .Values.controlApi.packageCommerce.worker.nats.drainTimeout | quote }}
            - name: PACKAGE_COMMERCE_WORKER_BATCH_SIZE
              value: {{ printf "%d" (int .Values.controlApi.packageCommerce.worker.batchSize) | quote }}
            - name: PACKAGE_COMMERCE_WORKER_LEASE_DURATION
              value: {{ .Values.controlApi.packageCommerce.worker.leaseDuration | quote }}
            - name: PACKAGE_COMMERCE_WORKER_PUBLISH_TIMEOUT
              value: {{ .Values.controlApi.packageCommerce.worker.publishTimeout | quote }}
            - name: PACKAGE_COMMERCE_WORKER_SETTLE_TIMEOUT
              value: {{ .Values.controlApi.packageCommerce.worker.settleTimeout | quote }}
            - name: PACKAGE_COMMERCE_WORKER_RETRY_MAX_ATTEMPTS
              value: {{ printf "%d" (int .Values.controlApi.packageCommerce.worker.retryMaxAttempts) | quote }}
            - name: PACKAGE_COMMERCE_WORKER_RETRY_BASE_DELAY
              value: {{ .Values.controlApi.packageCommerce.worker.retryBaseDelay | quote }}
            - name: PACKAGE_COMMERCE_WORKER_RETRY_MAX_DELAY
              value: {{ .Values.controlApi.packageCommerce.worker.retryMaxDelay | quote }}
            - name: PACKAGE_COMMERCE_WORKER_IDLE_POLL
              value: {{ .Values.controlApi.packageCommerce.worker.idlePoll | quote }}
            - name: PACKAGE_COMMERCE_WORKER_ERROR_BACKOFF
              value: {{ .Values.controlApi.packageCommerce.worker.errorBackoff | quote }}
            - name: PACKAGE_COMMERCE_WORKER_SHUTDOWN_TIMEOUT
              value: {{ .Values.controlApi.packageCommerce.worker.shutdownTimeout | quote }}
            {{- end }}
            {{- if .Values.pluginWebhook.enabled }}
            - name: PLUGIN_WEBHOOK_RUNTIME_ENABLED
              value: "true"
            - name: PLUGIN_WEBHOOK_NATS_URL
              value: {{ .Values.pluginWebhook.nats.url | quote }}
            - name: PLUGIN_WEBHOOK_REPLICAS
              value: {{ .Values.pluginWebhook.nats.jetStreamReplicas | quote }}
            - name: PLUGIN_WEBHOOK_NATS_CREDS_FILE
              value: /var/run/secrets/cdnca/plugin-webhook-nats/runtime.creds
            - name: PLUGIN_WEBHOOK_NATS_CA_FILE
              value: /var/run/secrets/cdnca/plugin-webhook-nats/ca.crt
            - name: PLUGIN_WEBHOOK_NATS_NAME
              value: cdnca-plugin-webhook-runtime-$(POD_UID)
            - name: PLUGIN_WEBHOOK_NATS_RECONNECT_MIN
              value: {{ .Values.pluginWebhook.nats.reconnect.min | quote }}
            - name: PLUGIN_WEBHOOK_NATS_RECONNECT_MAX
              value: {{ .Values.pluginWebhook.nats.reconnect.max | quote }}
            - name: PLUGIN_WEBHOOK_SECRET_KEY_ID
              value: {{ .Values.pluginWebhook.wrappingKey.id | quote }}
            - name: PLUGIN_WEBHOOK_SECRET_KEY_FILE
              value: /var/run/secrets/cdnca/plugin-webhook/wrapping.key
            - name: PLUGIN_WEBHOOK_ATTESTATION_KEY_ID
              value: {{ required "pluginWebhook.attestationKey.id is required" .Values.pluginWebhook.attestationKey.id | quote }}
            - name: PLUGIN_WEBHOOK_ATTESTATION_PRIVATE_KEY_FILE
              value: /var/run/secrets/cdnca/plugin-webhook-attestation/attestation.pem
            {{- if .Values.pluginWebhook.attestationKey.next.id }}
            - name: PLUGIN_WEBHOOK_ATTESTATION_NEXT_KEY_ID
              value: {{ .Values.pluginWebhook.attestationKey.next.id | quote }}
            - name: PLUGIN_WEBHOOK_ATTESTATION_NEXT_PRIVATE_KEY_FILE
              value: /var/run/secrets/cdnca/plugin-webhook-attestation-next/attestation.pem
            {{- end }}
            {{- end }}
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.dataStoresSecret.existingSecret }}
                  key: {{ .Values.controlApi.dataStoresSecret.keys.clickhouseURL }}
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.runtimeSecret.existingSecret }}
                  key: {{ .Values.controlApi.runtimeSecret.keys.accessTokenSecret }}
            - name: API_KEY_PEPPER_BASE64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.runtimeSecret.existingSecret }}
                  key: {{ .Values.controlApi.runtimeSecret.keys.apiKeyPepper }}
            - name: DNS_CREDENTIAL_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.runtimeSecret.existingSecret }}
                  key: {{ .Values.controlApi.runtimeSecret.keys.dnsCredentialKeyID }}
            - name: DNS_CREDENTIAL_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.runtimeSecret.existingSecret }}
                  key: {{ .Values.controlApi.runtimeSecret.keys.dnsCredentialKey }}
            - name: CONTROL_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlApi.runtimeSecret.existingSecret }}
                  key: {{ .Values.controlApi.runtimeSecret.keys.installationID }}
            - name: ENTITLEMENT_TRUSTED_KEYS_FILE
              value: /var/run/secrets/cdnca/control/entitlement-trusted-keys.json
            - name: CONTROL_INSTALLATION_PRIVATE_KEY_FILE
              value: /var/run/secrets/cdnca/control/installation-private-key.pem
            - name: CONTROL_ACTIVATION_CREDENTIAL_FILE
              value: /var/run/secrets/cdnca/control/activation-credential
            - name: CONTROL_INTERNAL_SERVER_CERT_FILE
              value: /var/run/secrets/cdnca/control/control-server.crt
            - name: CONTROL_INTERNAL_SERVER_PRIVATE_KEY_FILE
              value: /var/run/secrets/cdnca/control/control-server.key
            - name: CONTROL_INTERNAL_GATEWAY_CLIENT_CA_FILE
              value: /var/run/secrets/cdnca/control/gateway-client-ca.crt
            - name: NODE_CA_CERTIFICATE_CHAIN_FILE
              value: /var/run/secrets/cdnca/control/node-ca-chain.crt
            - name: NODE_CA_PRIVATE_KEY_FILE
              value: /var/run/secrets/cdnca/control/node-ca.key
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlApi.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /var/run/secrets/cdnca/control
              readOnly: true
            {{- if .Values.controlUpgradeRunner.enabled }}
            - name: control-upgrade-plan-source
              mountPath: /var/run/secrets/cdnca/control-upgrade-plan-source
              readOnly: true
            - name: control-upgrade-kubernetes
              mountPath: /var/run/secrets/cdnca/control-upgrade-kubernetes
              readOnly: true
            {{- end }}
            {{- if .Values.controlApi.trafficPackage.workload.enabled }}
            - name: traffic-package-workload
              mountPath: /var/run/secrets/cdnca/traffic-package-workload
              readOnly: true
            {{- end }}
            {{- if .Values.controlApi.dnsReconcile.enabled }}
            - name: dns-reconcile-workload
              mountPath: /var/run/secrets/cdnca/dns-reconcile-workload
              readOnly: true
            {{- end }}
            {{- if .Values.pluginWebhook.enabled }}
            - name: plugin-webhook-nats
              mountPath: /var/run/secrets/cdnca/plugin-webhook-nats
              readOnly: true
            - name: plugin-webhook-wrapping-key
              mountPath: /var/run/secrets/cdnca/plugin-webhook
              readOnly: true
            - name: plugin-webhook-attestation-key
              mountPath: /var/run/secrets/cdnca/plugin-webhook-attestation
              readOnly: true
            {{- if .Values.pluginWebhook.attestationKey.next.id }}
            - name: plugin-webhook-attestation-next-key
              mountPath: /var/run/secrets/cdnca/plugin-webhook-attestation-next
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.controlApi.packageCommerce.worker.enabled }}
            - name: package-commerce-worker-nats
              mountPath: /var/run/secrets/cdnca/package-commerce-worker-nats
              readOnly: true
            {{- end }}
            {{- if .Values.controlApi.identityVerification.issuer.enabled }}
            - name: identity-verification-issuer
              mountPath: /var/run/secrets/cdnca/identity-verification-issuer
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          secret:
            secretName: {{ .Values.controlApi.runtimeSecret.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.controlApi.runtimeSecret.keys.entitlementTrustedKeys }}
                path: entitlement-trusted-keys.json
              - key: {{ .Values.controlApi.runtimeSecret.keys.installationPrivateKey }}
                path: installation-private-key.pem
              - key: {{ .Values.controlApi.runtimeSecret.keys.activationCredential }}
                path: activation-credential
              - key: {{ .Values.controlApi.runtimeSecret.keys.controlServerCertificate }}
                path: control-server.crt
              - key: {{ .Values.controlApi.runtimeSecret.keys.controlServerPrivateKey }}
                path: control-server.key
              - key: {{ .Values.controlApi.runtimeSecret.keys.gatewayClientCA }}
                path: gateway-client-ca.crt
              - key: {{ .Values.controlApi.runtimeSecret.keys.nodeCACertificateChain }}
                path: node-ca-chain.crt
              - key: {{ .Values.controlApi.runtimeSecret.keys.nodeCAPrivateKey }}
                path: node-ca.key
              {{- if and .Values.controlApi.securityActivation.enabled (eq .Values.controlApi.securityActivation.signer.provider "file") }}
              - key: {{ .Values.controlApi.runtimeSecret.keys.edgePublishSigningPrivateKey }}
                path: edge-publish-signing-private-key
              {{- end }}
        {{- if and .Values.controlApi.securityActivation.enabled (eq .Values.controlApi.securityActivation.signer.provider "remote") }}
        - name: edge-publish-remote-signer
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.controlApi.securityActivation.signer.publicKeySecret.existingSecret | quote }}
                  items:
                    - key: {{ .Values.controlApi.securityActivation.signer.publicKeySecret.key | quote }}
                      path: public-key.pem
                      mode: 0440
              - secret:
                  name: {{ .Values.controlApi.securityActivation.signer.remote.caSecret.existingSecret | quote }}
                  items:
                    - key: {{ .Values.controlApi.securityActivation.signer.remote.caSecret.key | quote }}
                      path: ca.pem
                      mode: 0440
              - secret:
                  name: {{ .Values.controlApi.securityActivation.signer.remote.bearerTokenSecret.existingSecret | quote }}
                  items:
                    - key: {{ .Values.controlApi.securityActivation.signer.remote.bearerTokenSecret.key | quote }}
                      path: bearer-token
                      mode: 0600
        {{- end }}
        {{- if .Values.controlUpgradeRunner.enabled }}
        - name: control-upgrade-plan-source
          secret:
            secretName: {{ .Values.controlUpgradeRunner.planSource.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.controlUpgradeRunner.planSource.keys.internalToken | quote }}
                path: internal-token
        - name: control-upgrade-kubernetes
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
        {{- end }}
        {{- if .Values.controlApi.trafficPackage.workload.enabled }}
        - name: traffic-package-workload
          secret:
            secretName: {{ .Values.controlApi.trafficPackage.workload.mtlsSecret.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.controlApi.trafficPackage.workload.mtlsSecret.keys.serverCertificate | quote }}
                path: server.crt
              - key: {{ .Values.controlApi.trafficPackage.workload.mtlsSecret.keys.serverPrivateKey | quote }}
                path: server.key
              - key: {{ .Values.controlApi.trafficPackage.workload.mtlsSecret.keys.clientCA | quote }}
                path: client-ca.crt
        {{- end }}
        {{- if .Values.controlApi.dnsReconcile.enabled }}
        - name: dns-reconcile-workload
          secret:
            secretName: {{ .Values.controlApi.dnsReconcile.workloadMTLSSecret.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.controlApi.dnsReconcile.workloadMTLSSecret.keys.serverCertificate | quote }}
                path: server.crt
              - key: {{ .Values.controlApi.dnsReconcile.workloadMTLSSecret.keys.serverPrivateKey | quote }}
                path: server.key
              - key: {{ .Values.controlApi.dnsReconcile.workloadMTLSSecret.keys.clientCA | quote }}
                path: client-ca.crt
        {{- end }}
        {{- if .Values.pluginWebhook.enabled }}
        - name: plugin-webhook-nats
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.pluginWebhook.nats.credentialsSecret.name | quote }}
                  items:
                    - key: {{ .Values.pluginWebhook.nats.credentialsSecret.key | quote }}
                      path: runtime.creds
              - secret:
                  name: {{ .Values.pluginWebhook.nats.caSecret.name | quote }}
                  items:
                    - key: {{ .Values.pluginWebhook.nats.caSecret.key | quote }}
                      path: ca.crt
        - name: plugin-webhook-wrapping-key
          secret:
            secretName: {{ .Values.pluginWebhook.wrappingKey.secret.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.pluginWebhook.wrappingKey.secret.key | quote }}
                path: wrapping.key
        - name: plugin-webhook-attestation-key
          secret:
            secretName: {{ required "pluginWebhook.attestationKey.secret.name is required" .Values.pluginWebhook.attestationKey.secret.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.pluginWebhook.attestationKey.secret.key | quote }}
                path: attestation.pem
        {{- if .Values.pluginWebhook.attestationKey.next.id }}
        - name: plugin-webhook-attestation-next-key
          secret:
            secretName: {{ .Values.pluginWebhook.attestationKey.next.secret.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.pluginWebhook.attestationKey.next.secret.key | quote }}
                path: attestation.pem
        {{- end }}
        {{- end }}
        {{- if .Values.controlApi.packageCommerce.worker.enabled }}
        - name: package-commerce-worker-nats
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.controlApi.packageCommerce.worker.nats.credentialsSecret.existingSecret | quote }}
                  items:
                    - key: {{ .Values.controlApi.packageCommerce.worker.nats.credentialsSecret.key | quote }}
                      path: runtime.creds
              - secret:
                  name: {{ .Values.controlApi.packageCommerce.worker.nats.caSecret.existingSecret | quote }}
                  items:
                    - key: {{ .Values.controlApi.packageCommerce.worker.nats.caSecret.key | quote }}
                      path: ca.crt
        {{- end }}
        {{- if .Values.controlApi.identityVerification.issuer.enabled }}
        - name: identity-verification-issuer
          secret:
            secretName: {{ .Values.controlApi.identityVerification.issuer.mtlsSecret.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.controlApi.identityVerification.issuer.mtlsSecret.keys.serverCertificate | quote }}
                path: server.crt
              - key: {{ .Values.controlApi.identityVerification.issuer.mtlsSecret.keys.serverPrivateKey | quote }}
                path: server.key
              - key: {{ .Values.controlApi.identityVerification.issuer.mtlsSecret.keys.clientCA | quote }}
                path: client-ca.crt
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdnca.componentFullname" (dict "root" . "component" $component) }}
  labels:
    {{- include "cdnca.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.controlApi.service.type }}
  selector:
    {{- include "cdnca.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.controlApi.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: internal-grpc
      port: {{ .Values.controlApi.service.internalGRPCPort }}
      targetPort: internal-grpc
      protocol: TCP
{{- if .Values.controlApi.dnsReconcile.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdnca.componentFullname" (dict "root" . "component" $component) }}-dns-reconcile-workload
  labels:
    {{- include "cdnca.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdnca.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: dns-reconcile
      port: {{ .Values.controlApi.dnsReconcile.workloadPort }}
      targetPort: dns-reconcile
      protocol: TCP
{{- end }}
{{- if .Values.controlApi.trafficPackage.workload.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdnca.componentFullname" (dict "root" . "component" $component) }}-traffic-package-workload
  labels:
    {{- include "cdnca.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdnca.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: traffic-package
      port: {{ .Values.controlApi.trafficPackage.workload.port }}
      targetPort: traffic-package
      protocol: TCP
{{- end }}
{{- if .Values.controlApi.identityVerification.issuer.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdnca.componentFullname" (dict "root" . "component" $component) }}-identity-verification-issuer
  labels:
    {{- include "cdnca.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdnca.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
