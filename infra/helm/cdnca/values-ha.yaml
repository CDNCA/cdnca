topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

networkPolicy:
  gatewaySourceCIDRs:
    - 203.0.113.0/24
  controlExternalEgress:
    cidrs: [10.20.0.0/16]
    ports: [443, 5432, 6379, 4222, 8123, 9440]
  gatewayExternalEgress:
    cidrs: [10.20.0.0/16]
    ports: [6379, 4222]

customerIngress:
  enabled: true
  host: customer.example.invalid
  tls:
    enabled: true
    existingSecret: cdnca-customer-ingress-tls

controlApi:
  replicaCount: 3
  cacheControl:
    streamReplicas: 3
  licenseServiceURL: https://license.example.invalid
  pdb: {enabled: true, minAvailable: 2}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75

agentGateway:
  replicaCount: 3
  service:
    type: LoadBalancer
    enrollmentPort: 19443
    agentPort: 19444
    healthPort: 8082
    annotations: {}
    externalTrafficPolicy: Local
    loadBalancerSourceRanges:
      - 203.0.113.0/24
  pdb: {enabled: true, minAvailable: 2}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75

web:
  replicaCount: 2
  pdb: {enabled: true, minAvailable: 1}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
